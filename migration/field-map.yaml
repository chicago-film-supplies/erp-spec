# Every current Firestore path -> a new field, an explicit drop, or a quarantine.
#
# m6 work. Seeded only with the paths the verification pass touched. The rule that matters:
# **defective paths are mapped as defective**, not silently normalized. A migration that cleans
# data on the way through destroys the evidence that it was ever dirty.
#
# disposition: map | drop | quarantine | defective

mappings:
  - from: products.shipping.weight
    to: null
    disposition: drop
    reason: >-
      0 of 549 products have a non-zero value — verified 2026-08-08. Superseded by
      handling_bucket. Dropping a field that was never populated costs nothing; carrying it
      forward implies data that does not exist.

  - from: products.shipping.{height,width,length}
    to: null
    disposition: drop
    reason: "Same — 0 of 549 non-zero, verified 2026-08-08."

  - from: invoices.items[].tracking_category
    to: posting.product_line
    disposition: map
    reason: >-
      **Repaired at source 2026-08-10** (api-cloudrun#473): the native invoice writer never derived
      this field from the product, leaving 227 lines null whose product master WAS categorised.
      `tracking_missing` 227 → 0, and a dry re-run of the repair touches 0 invoices. What remains
      null is 15.00% of line revenue and is not a defect — 128 custom lines with no product master
      ($233,667.63) and 170 lines on genuinely uncategorised products ($19,638.96). Those carry
      `product_line: null`, which ADR-0025 makes a legal determination rather than an absence.
      ⚠️ **The migration does NOT read original values, and that is a restatement fact ADR-0020
      owns.** The repair back-filled historical lines, including inside the 2025-12-31 lock, so a
      line's category today may not be what the document carried when it was issued. It moves no
      money — a dimension is a reporting attribute — but "the restatement must not alter any amount"
      has to be asserted against the repaired corpus, not the original one.
      ⚠️ **`Transport` has no target while OQ-034 is open.** 23 lines / $39,665.00 now carry a value
      `ledger/dimensions.yaml` does not declare.
      This entry read `disposition: defective`, "Null on 28.7% of line revenue. Two separable
      classes — 254 lines recoverable from xero_tracking_option_id, 129 lines not recoverable at
      all", until 2026-08-10. Both the share and the two-class split were artifacts of counting the
      denorm rather than joining to the master.
    blocked_by: [OQ-012, OQ-034]

  - from: invoices.items[].xero_tracking_option_id
    to: null
    disposition: drop
    reason: >-
      Foreign identifier — ADR-0009 forbids it entering the domain model. Used at migration time
      to recover the 254 lines above, then discarded.

  - from: invoices.query_by_orders
    to: invoice.order_refs
    disposition: map
    reason: >-
      **OQ-013 answered: the count is ZERO, not 55.** Measured 2026-08-09 against prod across all
      five order↔invoice reference paths; every reference resolves
      (`inbox/2026-08-09-hard-deleted-order-uids-do-not-reproduce.md`). This entry read
      `disposition: defective` on the strength of "55 referenced order uids reportedly do not
      exist", which was never verified and measures 0.
      **The handling rule is retained on its own merits** — an unresolvable ref quarantines and is
      never nulled (ADR-0009) — by the same reasoning `charter.md` applies to the no-hard-deletes
      fence, whose cited evidence is this same non-reproducing 55. A migration needs a defined
      behaviour for a broken ref whether or not the corpus currently contains one; what is retracted
      is the claim that it does.

  - from: invoices.status == "void"
    to: invoice.status
    disposition: map
    reason: "41 of 999. Maps directly, but REQ-BIL-001 changes the DEFAULT — void excluded unless opted in."

  - from: destinations[].customer_collecting
    to: leg.direction
    disposition: defective
    reason: >-
      Per-destination today, not per-leg (verified 2026-08-08). Legs cannot be backfilled from it
      with an actor or a shift. Migration produces destination-level facts only; leg history
      starts at cutover.
    blocked_by: [HOT-002, HOT-007]

  - from: products (duplicate active charge products)
    to: product
    disposition: quarantine
    reason: >-
      HOT-008 — duplicate ACTIVE products book identical events to different accounts. Cannot map
      until OQ-014 names the canonical member of each pair.

  - from: "*.{_cents fields}"
    to: "*.{_minor fields}"
    disposition: map
    reason: "Already integer cents in the current system. Direct map — the hard part was already done."

  - from: "*.{rate fields}"
    to: "*.rate"
    disposition: map
    reason: >-
      Rates stay 4dp decimals and do NOT get a _minor suffix. They sit adjacent to amounts in four
      schemas and a sweep that converts every money field is how the beta.117 regression happened.
