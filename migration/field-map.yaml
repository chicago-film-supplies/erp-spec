# Every current Firestore path -> a new field, an explicit drop, or a quarantine.
#
# m6 work. Seeded only with the paths the verification pass touched. The rule that matters:
# **defective paths are mapped as defective**, not silently normalized. A migration that cleans
# data on the way through destroys the evidence that it was ever dirty.
#
# disposition: map | drop | quarantine | defective

mappings:
  - from: products.shipping.weight
    to: null
    disposition: drop
    reason: >-
      0 of 549 products have a non-zero value — verified 2026-08-08. Superseded by
      handling_bucket. Dropping a field that was never populated costs nothing; carrying it
      forward implies data that does not exist.

  - from: products.shipping.{height,width,length}
    to: null
    disposition: drop
    reason: "Same — 0 of 549 non-zero, verified 2026-08-08."

  - from: invoices.items[].tracking_category
    to: posting.product_line
    disposition: map
    reason: >-
      **Repaired at source 2026-08-10** (api-cloudrun#473): the native invoice writer never derived
      this field from the product, leaving 227 lines null whose product master WAS categorised.
      `tracking_missing` 227 → 0, and a dry re-run of the repair touches 0 invoices. What remains
      null is 15.00% of line revenue and is not a defect — 128 custom lines with no product master
      ($233,667.63) and 170 lines on genuinely uncategorised products ($19,638.96). Those carry
      `product_line: null`, which ADR-0025 makes a legal determination rather than an absence.
      ⚠️ **The migration does NOT read original values, and that is a restatement fact ADR-0020
      owns.** The repair back-filled historical lines, including inside the 2025-12-31 lock, so a
      line's category today may not be what the document carried when it was issued. It moves no
      money — a dimension is a reporting attribute — but "the restatement must not alter any amount"
      has to be asserted against the repaired corpus, not the original one.
      ⚠️ **`Transport` has no target while OQ-034 is open.** 23 lines / $39,665.00 now carry a value
      `ledger/dimensions.yaml` does not declare.
      This entry read `disposition: defective`, "Null on 28.7% of line revenue. Two separable
      classes — 254 lines recoverable from xero_tracking_option_id, 129 lines not recoverable at
      all", until 2026-08-10. Both the share and the two-class split were artifacts of counting the
      denorm rather than joining to the master.
    blocked_by: [OQ-012, OQ-034]

  - from: invoices.items[].xero_tracking_option_id
    to: null
    disposition: drop
    reason: >-
      Foreign identifier — ADR-0009 forbids it entering the domain model. Used at migration time
      to recover the 254 lines above, then discarded.

  - from: invoices.query_by_orders
    to: invoice.order_refs
    disposition: map
    reason: >-
      **OQ-013 answered: the count is ZERO, not 55.** Measured 2026-08-09 against prod across all
      five order↔invoice reference paths; every reference resolves
      (`inbox/2026-08-09-hard-deleted-order-uids-do-not-reproduce.md`). This entry read
      `disposition: defective` on the strength of "55 referenced order uids reportedly do not
      exist", which was never verified and measures 0.
      **The handling rule is retained on its own merits** — an unresolvable ref quarantines and is
      never nulled (ADR-0009) — by the same reasoning `charter.md` applies to the no-hard-deletes
      fence, whose cited evidence is this same non-reproducing 55. A migration needs a defined
      behaviour for a broken ref whether or not the corpus currently contains one; what is retracted
      is the claim that it does.

  - from: invoices.status == "void"
    to: invoice.status
    disposition: map
    reason: "41 of 999. Maps directly, but REQ-BIL-001 changes the DEFAULT — void excluded unless opted in."

  - from: destinations[].customer_collecting
    to: leg.direction
    disposition: defective
    reason: >-
      Per-destination today, not per-leg (verified 2026-08-08). Legs cannot be backfilled from it
      with an actor or a shift. Migration produces destination-level facts only; leg history
      starts at cutover.
    blocked_by: [HOT-002, HOT-007]

  - from: products (duplicate active charge products)
    to: product
    disposition: quarantine
    reason: >-
      HOT-008 — duplicate ACTIVE products book identical events to different accounts. Cannot map
      until OQ-014 names the canonical member of each pair.

  - from: "*.{_cents fields}"
    to: "*.{_minor fields}"
    disposition: map
    reason: "Already integer cents in the current system. Direct map — the hard part was already done."

  - from: "*.{rate fields}"
    to: "*.rate"
    disposition: map
    reason: >-
      Rates stay 4dp decimals and do NOT get a _minor suffix. They sit adjacent to amounts in four
      schemas and a sweep that converts every money field is how the beta.117 regression happened.

  # ── organizations → the customer tree (ADR-0032) ─────────────────────────────
  # The largest delta found so far, and a different KIND from the rest of this file: a re-keying
  # rather than a re-dimensioning. ADR-0020 restates dimensions on lines; this changes identity.

  - from: organizations (the record)
    to: customer | project | settlement_point
    disposition: defective
    reason: >-
      One flat record carries all three levels of ADR-0032's tree. Measured 2026-08-10
      (`api:2026-08-10:db_organizations_query`, all 286): 31 are department clones across 11 parent
      companies, and `Netflix Productions, LLC` is **10 records with no un-suffixed parent** — the
      customer as an entity does not exist, so total exposure to it needs a string match.
      ⚠️ **The defect is FLATNESS, not duplication.** The clones are not copies; each is a genuinely
      distinct settling unit with its own receivable and coordinator, and they are close to the
      correct LEAVES already. The migration adds a root and a middle — record count barely falls, so
      "10 become 1" is the wrong target and a migration measured by record reduction is measuring the
      wrong thing.
    blocked_by: [OQ-036, OQ-037]

  - from: organizations.name
    to: customer.name + project.name + settlement_point.name
    disposition: defective
    reason: >-
      Three concepts in one string, with **four delimiter conventions** in use — space-hyphen-space,
      colon-space, space-slash-space, space-double-slash-space — all four inside `Netflix
      Productions, LLC` alone. `20th Television - Deli Boys - S2: Locations` is company + production
      + department at once.
      **The split must be AUTHORED and committed, not parsed.** A parse is unreliable on four
      delimiters, and it cannot fix `Transportation` / `Transpo` (one department spelled two ways) or
      `20th Television` / `Twentieth Television` (one legal entity spelled two ways).
      ⚠️ **Match-on-name is not a viable migration key** independently of the split: 5 exact-duplicate
      name pairs exist (`Enlace Chicago`, `Free Spirit Media`, `Full Spectrum Features`, `Omnicom`,
      `Sound Off Films`) plus 3 records suffixed with a literal `(copy)`, so `Sound Off Films` occurs
      three times.

  - from: organizations.contacts[]
    to: settlement_point.contacts[]
    disposition: map
    reason: >-
      ⚠️ **Maps DOWN to the leaf, never up to the customer — and the current system already has this
      right.** Because each department clone IS an organization and `contacts[]` is embedded, today's
      contacts already sit on the settling unit. Owner, 2026-08-10: "every project and/or dept will
      have its own set of contacts."
      A migration that pools them onto the customer **destroys a working property to fix a broken
      one**, and reproduces exactly the failure Xero users report of the contact-group workaround —
      reminders going to every address on the record rather than the one the invoice went to. A
      statement for `Saturn Return: Locations` would dun the Big Red office coordinator.
      `query_by_contacts` follows the same rule.

  - from: organizations.{xero_id,crms_id}
    to: null
    disposition: drop
    reason: >-
      Foreign identifiers — ADR-0009 forbids them entering the domain model. Usable at migration time
      to correlate records, then discarded. ⚠️ They are NOT a shortcut around the authored mapping
      above: a shared `xero_id` proves two CFS records point at one Xero contact, which is the
      duplicate-contact workaround Xero itself warns double-counts the receivable — it does not
      establish which of ADR-0032's three levels either record belongs to.

  - from: organizations.tax_profile
    to: customer.tax_profile
    disposition: map
    reason: >-
      Maps UP to the legal entity, opposite to `contacts[]`. Tax status is a property of the party
      that owes, not of the department being invoiced. ⚠️ Requires asserting the value is identical
      across every clone of one customer before collapsing; a disagreement is a finding, not a
      merge conflict to resolve arbitrarily.

  - from: "invoices.organization / orders.organization_ref"
    to: "*.settlement_point_ref"
    disposition: defective
    reason: >-
      A single flat reference to the pre-tree `organizations` record. Under ADR-0032 a document is
      addressed to a **settlement point**, and its customer is derived by walking up — so this
      reference changes meaning as well as target.
      ⚠️ **AR balances must not move.** The consolidated customer balance must be proven equal to the
      sum of its settlement points, per invoice and per settlement — ADR-0020's amount assertion on a
      different axis. Xero's own warning about the duplicate-contact route is that it double-counts,
      so this is a measured hazard rather than a theoretical one.
    blocked_by: [OQ-036]
