# Hotspots — statements in the spec that contradict each other or the observed world.
#
# A hotspot is a CONFLICT, not a task and not a question. When two spec statements disagree,
# open one here rather than silently picking a side. Resolution is by ADR.
#
# status: open | resolved | superseded

hotspots:
  - id: HOT-001
    statement: >-
      Does `Trucking` mean third-party freight (no wage labour) or an own long-haul run
      (labour-bearing)? The costing model treats these oppositely — one is a passthrough with no
      person-day, the other absorbs a full crew-day.
    contexts: [fulfillment, ledger, ordering]
    why_it_matters: >-
      Decides whether a trucked fulfillment absorbs labour cost at all, and therefore whether
      `trucked` is a fulfillment mode that generates a shift.
    evidence: >-
      Verified 2026-08-08: `Trucking` and `Shipping` are both active service products in the
      `Transport` product line. `Trucking` books to COA 4100 — the same revenue account as Crew
      labour services and Delivery/Setup/Removal — while `Shipping` books to its own COA 4150.
      Suggestive of own-run vs freight, but not decisive.
    blocks: [OQ-010, ADR-0011]
    status: resolved
    resolved_by: ADR-0011

  - id: HOT-002
    statement: >-
      Are the collecting/returning flags really per-leg? Only ~2% of revenue sits on asymmetric
      combinations, which contradicts a confirmed deliver-out/customer-returns pattern.
    contexts: [fulfillment, ordering]
    why_it_matters: >-
      If the flags are genuinely per-destination rather than per-leg, then a leg record cannot be
      reconstructed from history, and the migration cannot backfill leg-level actor or shift.
    evidence: >-
      Verified 2026-08-08: in the current system the flags are stored per DESTINATION
      (`destinations[].customer_collecting` / `.customer_returning`), not per leg. The structural
      half of this hotspot is settled — they are not per-leg today. The ~2% asymmetry figure is
      NOT yet reproduced and remains unverified.
    blocks: [OQ-007, ADR-0011]
    status: resolved
    measured: >-
      2026-08-09, prod, all 977 orders: asymmetric combinations are 2.77% of revenue (2.74% CFS-
      delivers/customer-returns + 0.03% the reverse), 26 orders. The ~2% figure is CONFIRMED. The
      pattern it supposedly contradicted is not real — 97.2% of revenue is SYMMETRIC (55.92%
      customer both ways, 41.29% CFS both ways), so deliver-out/customer-returns was never the
      norm. See inbox/2026-08-09-asymmetric-collecting-returning-share.md.
    resolved_by: ADR-0011

  - id: HOT-003
    statement: Does the `Crew` product line already carry labour today?
    contexts: [ledger, fulfillment]
    why_it_matters: >-
      If Crew already carries labour, the new cost-type dimension partly duplicates it and the
      migration has to decide which one survives.
    evidence: >-
      Verified 2026-08-08, and the answer splits. The `Crew` product line contains exactly three
      products — Surface Protection Install/Tear Out, Truck Pack/Load Out, Layout Install/Tear Out
      — all `type: service`, all booking to COA 4100. So Crew carries billable labour REVENUE.
      Whether any labour COST is recorded anywhere today is a separate question and is not
      answered by this evidence.
    blocks: [OQ-011]
    status: resolved
    resolved_by: ADR-0019

  - id: HOT-004
    statement: >-
      Should long-haul absorb a byproduct-loss premium on top of the person-day, mirroring what
      the customer is charged?
    contexts: [ledger, fulfillment]
    why_it_matters: >-
      A long-haul run consumes a crew-day that cannot pick up byproducts, so its true opportunity
      cost exceeds its wage cost. Charging only the person-day understates long-haul COGS and
      makes long-haul look more profitable than it is.
    blocks: [OQ-006]
    status: resolved
    resolved_by: ADR-0019

  - id: HOT-005
    statement: >-
      Is TigerBeetle or DuckDB the reporting source of truth, given TB timestamps are posting time
      and reporting needs accounting date?
    contexts: [ledger, banking]
    why_it_matters: >-
      Every report — trial balance, P&L, close — is periodised by accounting date. If TB cannot
      express that, TB balances cannot answer a period question directly and DuckDB becomes
      authoritative for reporting while TB stays authoritative for balance integrity. That split
      has to be deliberate, named, and reconciled.
    blocks: [OQ-009, ADR-0008, ADR-0010]
    status: resolved
    resolved_by: ADR-0017

  - id: HOT-006
    statement: >-
      Xero history migration: import known-defective lines, or restate? Roughly 90% of historical
      Xero lines are behind the 2025-12-31 lock and unrepairable.
    contexts: [ledger, billing]
    why_it_matters: >-
      Importing defective lines makes the new ledger's history agree with the filed tax position
      but carries the tracking defect forward permanently. Restating makes the new ledger correct
      but disagrees with what was filed.
    evidence: >-
      Related and verified 2026-08-08: 28.7% of CFS line revenue carries no product-line
      dimension, concentrated in `service` lines (71.9% of service revenue untracked) and worst in
      2024 (48.3%). Whatever is imported inherits that.
      ⚠️ **Re-measured 2026-08-10 and largely repaired at source.** That figure counted the
      invoice-line denorm; joined to the product master, 227 lines were a derivation that never ran
      (api-cloudrun#473, fixed) and untracked line revenue is now **15.00%**. The hotspot's tension —
      import-as-filed versus restate — is unchanged, but **the population to restate has collapsed**
      and ADR-0020 carries the re-scoping.
      (`inbox/2026-08-10-the-untracked-revenue-denorm-is-repaired-and-28-7-percent-is-now-15-percent.md`)
    blocks: [OQ-012]
    status: resolved
    resolved_by: ADR-0020

  - id: HOT-007
    statement: >-
      Are fulfillment legs first-class recorded events, or derived from orders? The current system
      derives them, which is why actor and shift are unrecoverable.
    contexts: [fulfillment]
    why_it_matters: >-
      This is the single decision the whole labour-costing design rests on. Derived legs cannot
      carry an actor, a clock-in, or a shift id, so COGS labour allocation is impossible without
      first-class legs.
    blocks: [OQ-001, ADR-0011]
    status: resolved
    resolved_by: ADR-0011

  - id: HOT-008
    statement: >-
      Duplicate ACTIVE charge products book the same economic event to different revenue accounts,
      so the source data does not determine the posting.
    contexts: [ledger, billing]
    why_it_matters: >-
      The new posting rules must map a billed line to exactly one account. Today the account
      depends on which of two identically-named active products the operator happened to pick, so
      historical revenue is split across accounts for no economic reason — and any posting rule
      derived from history inherits the ambiguity.
    evidence: >-
      Verified 2026-08-08 in the `Delivery` product line, all `active: true`: "Distance Charge"
      exists twice (one `service` @ COA 4100, one `surcharge` @ COA 4110); "Rush Charge" exists
      twice (both `surcharge` @ COA 4100); "Off Hours Surcharge" (`service` @ 4100) coexists with
      "Off Hours Charge" (`surcharge` @ 4110); "Weekend Surcharge" (`service` @ 4100) coexists with
      "Weekend Charge" (`surcharge` @ 4110). The `- Old` variants are correctly inactive; these
      are not.
    blocks: [OQ-014]
    status: resolved
    resolved_by: ADR-0021

  - id: HOT-009
    statement: >-
      `invoice.status` carries two different semantics in one field — an assigned lifecycle fact
      (draft / issued / voided) and a derived balance fact (part_paid / paid) — so no invariant can
      be stated about either half.
    contexts: [billing, ledger]
    why_it_matters: >-
      ADR-0014 makes derived state a rebuildable projection and assigned state a recorded fact. A
      field that is both cannot be either, and the two live defect populations are one of each: the
      derived half going stale, and the lifecycle half disagreeing with the balance. Decomposing
      the field is a precondition for applying ADR-0014 to invoices at all.
    evidence: >-
      Two open populations in the v1 corpus, both measured: 86 orders hold a stale denormalized
      invoice status (api-cloudrun#453) — the derived half drifting from the facts that determine
      it; and voided invoices still carry a balance the external ledger closed (api-cloudrun#436),
      a population recorded as GROWING rather than historical — the lifecycle half asserting a
      state the balance contradicts.
    blocks: [ADR-0014]
    status: resolved
    resolved_by: ADR-0022

  - id: HOT-010
    statement: >-
      The charter and `posting-rules.yaml` specify standard-cost absorption with a
      `labour_variance` posting rule, but CFS does not use standard labour rates — costing is
      actual, from a per-contact wage and a deterministic overtime rule.
    contexts: [ledger, fulfillment]
    why_it_matters: >-
      A rate variance cannot exist where there is no standard rate, so `labour_variance` as
      specified has no input and would be a posting rule that can never fire. Absorption itself
      survives and must not be discarded with it: a guaranteed 8 hours means paid-but-unworked
      time is a real cost attributable to no job, so `COGS-Labour Absorbed` and
      `COGS-Unabsorbed Labour` both stand. What they measure is UTILISATION, not rate deviation,
      and the posting rules must say which.
    evidence: >-
      Repo owner, 2026-08-09 (OQ-008): default wage $30/hr with a guaranteed 8 hours, 1.5x after 8
      in a day, 1.5x all day on a 6th and/or 7th consecutive day; one person at $36/hr. The wage
      is carried per contact and overridable, and cost flows from the purchase order / bill that
      labour scheduling generates. Against `charter.md` ("standard-cost absorption into COGS") and
      `ledger/posting-rules.yaml` (`labour_variance <- period : Dr/Cr COGS-Labour Variance`).
    blocks: [OQ-018, OQ-019]
    status: resolved
    resolved_by: ADR-0019

  - id: HOT-011
    statement: >-
      REQ-LED-001 and ADR-0018 require BOTH dimensions on every revenue and COGS posting;
      `ledger/dimensions.yaml` requires only `product_line` on revenue; and the chart of accounts
      contains revenue and COGS accounts for which neither dimension has a defensible value.
    contexts: [ledger]
    why_it_matters: >-
      REQ-LED-001 is the repo's only ledger requirement and the golden vectors' rejection cases are
      its entire enforcement, so which reading is authoritative decides what those vectors assert.
      Written as REQ-LED-001 states it, the rule refuses legitimate postings — interest income has
      no product line and no "kind of work". Written as `dimensions.yaml` states it, the
      requirement's own text is wrong. `ledger/chart-of-accounts.yaml`'s `dimensioned:` column
      cannot be set correctly until one of them wins, and 8 accounts currently carry
      `dimensioned: undecided` waiting on it.
    evidence: >-
      `cost_type`'s own description in `ledger/dimensions.yaml` is "What kind of work a LABOUR
      posting represents", with values `[delivery, counter, warehouse]` and `required_on: [cogs]` —
      there is no member of that set for a rental revenue posting or for `5000 Cost of Goods Sold:
      Retail Inventory`. Against REQ-LED-001, "Every revenue and COGS posting shall carry both a
      product line and a cost type", and ADR-0018, "both mandatory dimensions are not nullable on
      revenue and COGS postings". Separately, the live chart holds 5 non-operating revenue accounts
      (4800 Other Income, 4810 Cashback, 4820 Interest, 4830 Vendor Refunds, 4840 Sales Tax Discount
      — all `type: Other Income`) and 4600 Cash Discrepancies, none of which arises from a sale
      (`api:2026-08-09:db_chart_of_accounts_query`, 134 accounts). Forcing a product line onto them
      makes `Other` the new null, which `dimensions.yaml`'s own note already warns against.
    blocks: [OQ-021]
    status: resolved
    resolved_by: ADR-0025

  - id: HOT-012
    statement: >-
      `ADR-0001` is `accepted` and therefore immutable, and its Context states a number that has
      been retracted and an attribution that has been reversed — "the dimension on a Xero line is
      optional by construction: an unresolvable tracking option id is dropped and the push still
      succeeds. 28.7% of line revenue has no product line as a result." Re-measured 2026-08-10, the
      dominant cause of that 28.7% was a CFS-side derivation that never ran, not Xero dropping
      anything.
    contexts: [ledger, billing]
    why_it_matters: >-
      Not because the decision is in doubt — replacing Xero stands on the costing model Xero cannot
      express, on ADR-0026's dual-basis requirement, and on three other Context bullets that are
      unaffected. It matters because **the repo has no mechanism for an accepted ADR whose evidence
      was later corrected**, and this is the first instance. Every other artifact citing the 28.7%
      was amended in place on 2026-08-10; `adr/` is the one lifecycle where that is forbidden
      ("immutable once accepted — superseded by a new ADR, never edited"). So the correction has
      nowhere to live, and a reader of `ADR-0001` today gets a number that is wrong by a factor of
      ~700 and a causal claim that points at the wrong system.
      The general question is the one to settle: **is an ADR a historical record of a decision as
      taken, or a statement of current fact?** If the former, this hotspot resolves by convention —
      the correction lives in `inbox/` and the traceability matrix, and ADR-0001 is left alone as
      the honest record of what was believed on 2026-08-08. If the latter, an accepted ADR needs a
      lightweight errata mechanism, because superseding ADR-0001 to fix a Context bullet would mean
      re-deciding "replace Xero", which nobody is asking to reopen.
    evidence: >-
      `adr/ADR-0001-replace-xero-with-in-house-ledger.md:23` (status `accepted`, dated 2026-08-08).
      Against `inbox/2026-08-10-the-untracked-revenue-denorm-is-repaired-and-28-7-percent-is-now-15-percent.md`
      (`api-cloudrun:2026-08-10:scripts/audit-invoice-line-denorms.ts`, all 9,194 revenue lines
      joined to the product master): of the $486,516.99 untracked, 227 lines / $252,161.36 were a
      derivation that never ran, 128 lines / $233,667.63 were custom lines with no product master,
      and 35 lines / $688.00 — **0.041% of all line revenue** — were genuinely undecided.
      api-cloudrun#473 repaired the writer on 2026-08-10; `tracking_missing` is 227 → 0.
      Six other artifacts carried the same figure and were amended on 2026-08-10: ADR-0009,
      ADR-0020, ADR-0025, `charter.md`, `glossary.yaml`, `contexts/ledger/requirements.yaml`. All
      six are either `proposed` or in a freely-refactored directory. ADR-0001 is neither.
    blocks: []
    status: resolved
    resolved_by: ADR-0034
    resolution: >-
      **An accepted ADR is a historical record of the decision as taken, not a statement of current
      fact.** Owner, 2026-08-16, choosing the general answer this hotspot said would resolve it by
      convention. `ADR-0001` is left exactly as written.
      The correction lives where this hotspot said it would: in `inbox/` (append-only, dated) and in
      this entry, which stays in `hotspots.yaml` permanently because nothing here is ever deleted.
      ADR-0034 also names the pattern the repo had been using unwritten — a question an accepted ADR
      left open is answered by a NEW NARROW ADR that `relates_to` it and supersedes nothing
      (ADR-0025 is the precedent) — and reserves superseding for an actual change of decision.
      ⚠️ **The accepted cost**: a reader of ADR-0001 cannot tell from ADR-0001 that its 28.7% is
      retracted. ADR-0034 records the cheap reversal if that bites — render each ADR's `relates_to`
      hotspots beneath it in `in-force.generated.md`, a generator change touching no frozen body.
      ⚠️ **Not machine-enforced.** Nothing in `deno task validate` can fail when a frozen body is
      edited. ADR-0034 names the enforceable version (a body hash in frontmatter, recomputed at
      validate time) and does not build it.

  - id: HOT-013
    statement: >-
      `ADR-0018` says dimensions are "carried on the posting, in `user_data` and in the
      Mongo/Parquet projection". A TigerBeetle transfer has exactly three `user_data` fields, and
      erp-spec#3 plus `research-drop/reference/tigerbeetle.md` assign all three to
      `journal_entry_id`, `source_document` and `accounting_date` — with a fourth claimant
      (`posting_rule`) already evicted. Both cannot be true: there is no slot for `product_line` or
      `cost_type`.
    contexts: [ledger]
    why_it_matters: >-
      It decides whether the ledger is self-describing. If TigerBeetle carries the dimensions, a
      dimensional P&L can be rebuilt from the ledger alone after a Mongo loss; if it does not,
      TigerBeetle holds balance integrity and the dimensional view exists only in the projection —
      which is defensible under ADR-0017, but is a different system from the one ADR-0018's sentence
      describes.
      The ambiguity is load-bearing rather than cosmetic, because REQ-LED-001's whole enforcement
      story rests on it. `ledger/dimensions.yaml` states that with dimensions off account identity
      "nothing structural catches a missing one — the rejection vectors are the entire enforcement".
      That reasoning assumed the dimension is on the posting the vectors check. If dimensions live
      only in the projection, the vectors are checking a different artifact from the one the ledger
      stores, and REQ-LED-001 is being enforced somewhere other than where it is stated.
    evidence: >-
      `adr/ADR-0018-plain-coa-dimensions-on-the-posting.md` (status `accepted`, 2026-08-09):
      "**Dimensions are carried on the posting**, in `user_data` and in the Mongo/Parquet
      projection, never in account identity."
      Against `research-drop/reference/tigerbeetle.md`: "`user_data_128/64/32` are the only
      per-transfer reference fields. The working assignment is `128 → journal_entry_id`,
      `64 → source_document`, `32 → accounting_date` (packed `YYYYMMDD`), with `posting_rule`
      evicted to the Mongo projection — three fields, four claimants, tracked as erp-spec#3".
      **Surfaced 2026-08-16 by counting claimants for OQ-040**
      (`inbox/2026-08-16-survey-the-party-is-a-subledger-key-and-the-dimension-is-a-gl-slice-and-they-ride-different-legs.md`).
      In TigerBeetle one transfer is one debit account plus one credit account, so a single
      `invoice_issued` transfer (Dr 1200 / Cr 4100) carries both an AR-side and a revenue-side
      obligation. **Three slots, six live claimants** before `settlement_point` is considered.
      **erp-spec#3 undercounts.** Its title is "three fields, four claimants" and it enumerates
      `journal_entry_id`, `source_document`, `posting_rule`, `accounting_date` — it never counts the
      two dimensions ADR-0018 placed there. ADR-0008 reserved all three fields when dimensions lived
      in ACCOUNT IDENTITY and `user_data` was therefore free; ADR-0018 superseded ADR-0008 and moved
      dimensions onto the posting without re-doing the budget that assumption had made safe.
      ⚠️ Two of the three reservations may be eliminable — erp-spec#3 argues `journal_entry_id` may
      be derivable as `(source_document, posting event)` under ADR-0014, and `posting_rule` may be a
      projection concern. If both go, the shortfall narrows. That is analysis, not a decision, and
      it is why this is a hotspot rather than a repair.
      ⚠️ **ADR-0018 is `accepted` and therefore immutable**, so the correction has the same nowhere
      to live that HOT-012 describes. This is the second instance of that meta-problem.
      ⚠️ **A SECOND accepted ADR carries the undercount, found 2026-08-16 while checking what the
      requirements-mining pass rested on.** `ADR-0026`'s Context argues against a parallel ledger
      partly on the grounds that "a `book` tag carried on the transfer instead would be a **fifth**
      claimant on the three `user_data` fields erp-spec#3 already has four claimants for". By this
      hotspot's count a `book` tag would be the **seventh**, not the fifth — which strengthens
      ADR-0026's conclusion rather than weakening it, since the budget is tighter than it argued.
      Recorded here rather than in ADR-0026, per ADR-0034: the decision stands, a cited fact was
      wrong, so the correction lives in the hotspot and the ADR is left alone.
    blocks: [OQ-040, ADR-0033, SPIKE-003]
    status: open
    resolution_shape: >-
      **Settled 2026-08-16 by ADR-0034, which decides the FORM this resolution takes and not its
      content.** `ADR-0018` stays exactly as written — its decision (plain COA, dimensions off
      account identity) is not in doubt, and it did not decide wrongly so much as under-specify.
      So the answer is a **new narrow ADR** deciding where a dimension physically lives on a
      transfer, carrying `relates_to: [ADR-0018]` and superseding nothing — the ADR-0025 pattern,
      now named. **Superseding ADR-0018 is explicitly the wrong instrument**: it would re-open
      plain-COA-versus-exploded-accounts to fix a prepositional clause.
      **What that ADR still needs before it can be written:**
      · **SPIKE-003** — `research-drop/reference/tigerbeetle.md` says flatly "no queries" while
        recent releases are believed to expose a limited `query_transfers`. Neither gives a range
        filter on `user_data`, so the conclusion is unchanged, but the spike decides whether
        TigerBeetle can serve any period question at all.
      · **The two candidate evictions in erp-spec#3**, which may make the shortfall disappear
        rather than force a choice: `journal_entry_id` may be derivable as
        `(source_document, posting event)` under ADR-0014's derived-state doctrine, and
        `posting_rule` may be a projection concern rather than a ledger fact. If both go, only
        `source_document` stays reserved and two slots open up.
      · The OQ-040 survey's recommendation **removes** a claimant rather than adding one — a
        settlement point is a subledger key on the receivable leg, not a third dimension
        (`inbox/2026-08-16-survey-the-party-is-a-subledger-key-and-the-dimension-is-a-gl-slice-and-they-ride-different-legs.md`).
