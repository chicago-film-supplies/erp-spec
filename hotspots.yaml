# Hotspots — statements in the spec that contradict each other or the observed world.
#
# A hotspot is a CONFLICT, not a task and not a question. When two spec statements disagree,
# open one here rather than silently picking a side. Resolution is by ADR.
#
# status: open | resolved | superseded

# ⚠️ **Every entry carries a `headline:`** — at most 12 words, ideally under 5 (ADR-0037, gate 20).
# It is what the hotspot is CALLED where it is cited; `statement:` stays the full contradiction.
# Quote it if it contains a colon, or the file stops parsing.
hotspots:
  - id: HOT-001
    headline: "Trucking means two different things"
    statement: >-
      Does `Trucking` mean third-party freight (no wage labor) or an own long-haul run
      (labor-bearing)? The costing model treats these oppositely — one is a passthrough with no
      person-day, the other absorbs a full crew-day.
    contexts: [fulfillment, ledger, ordering]
    why_it_matters: >-
      Decides whether a trucked fulfillment absorbs labor cost at all, and therefore whether
      `trucked` is a fulfillment mode that generates a shift.
    evidence: >-
      Verified 2026-08-08: `Trucking` and `Shipping` are both active service products in the
      `Transport` product line. `Trucking` books to COA 4100 — the same revenue account as Crew
      labor services and Delivery/Setup/Removal — while `Shipping` books to its own COA 4150.
      Suggestive of own-run vs freight, but not decisive.
    blocks: [OQ-010, ADR-0011]
    status: resolved
    resolved_by: ADR-0011

  - id: HOT-002
    headline: "collecting flags: per leg or per destination"
    statement: >-
      Are the collecting/returning flags really per-leg? Only ~2% of revenue sits on asymmetric
      combinations, which contradicts a confirmed deliver-out/customer-returns pattern.
    contexts: [fulfillment, ordering]
    why_it_matters: >-
      If the flags are genuinely per-destination rather than per-leg, then a leg record cannot be
      reconstructed from history, and the migration cannot backfill leg-level actor or shift.
    evidence: >-
      Verified 2026-08-08: in the current system the flags are stored per DESTINATION
      (`destinations[].customer_collecting` / `.customer_returning`), not per leg. The structural
      half of this hotspot is settled — they are not per-leg today. The ~2% asymmetry figure is
      NOT yet reproduced and remains unverified.
    blocks: [OQ-007, ADR-0011]
    status: resolved
    measured: >-
      2026-08-09, prod, all 977 orders: asymmetric combinations are 2.77% of revenue (2.74% CFS-
      delivers/customer-returns + 0.03% the reverse), 26 orders. The ~2% figure is CONFIRMED. The
      pattern it supposedly contradicted is not real — 97.2% of revenue is SYMMETRIC (55.92%
      customer both ways, 41.29% CFS both ways), so deliver-out/customer-returns was never the
      norm. See inbox/2026-08-09-asymmetric-collecting-returning-share.md.
    resolved_by: ADR-0011

  - id: HOT-003
    headline: "labor cost has no home in the chart"
    statement: Does the `Crew` product line already carry labor today?
    contexts: [ledger, fulfillment]
    why_it_matters: >-
      If Crew already carries labor, the new cost-type dimension partly duplicates it and the
      migration has to decide which one survives.
    evidence: >-
      Verified 2026-08-08, and the answer splits. The `Crew` product line contains exactly three
      products — Surface Protection Install/Tear Out, Truck Pack/Load Out, Layout Install/Tear Out
      — all `type: service`, all booking to COA 4100. So Crew carries billable labor REVENUE.
      Whether any labor COST is recorded anywhere today is a separate question and is not
      answered by this evidence.
    blocks: [OQ-011]
    status: resolved
    resolved_by: ADR-0019

  - id: HOT-004
    headline: "the byproduct premium may double-count"
    statement: >-
      Should long-haul absorb a byproduct-loss premium on top of the person-day, mirroring what
      the customer is charged?
    contexts: [ledger, fulfillment]
    why_it_matters: >-
      A long-haul run consumes a crew-day that cannot pick up byproducts, so its true opportunity
      cost exceeds its wage cost. Charging only the person-day understates long-haul COGS and
      makes long-haul look more profitable than it is.
    blocks: [OQ-006]
    status: resolved
    resolved_by: ADR-0019

  - id: HOT-005
    headline: "two candidates for reporting truth"
    statement: >-
      Is TigerBeetle or DuckDB the reporting source of truth, given TB timestamps are posting time
      and reporting needs accounting date?
    contexts: [ledger, banking]
    why_it_matters: >-
      Every report — trial balance, P&L, close — is periodised by accounting date. If TB cannot
      express that, TB balances cannot answer a period question directly and DuckDB becomes
      authoritative for reporting while TB stays authoritative for balance integrity. That split
      has to be deliberate, named, and reconciled.
    blocks: [OQ-009, ADR-0008, ADR-0010]
    status: resolved
    resolved_by: ADR-0017

  - id: HOT-006
    headline: "Xero history is behind the lock"
    statement: >-
      Xero history migration: import known-defective lines, or restate? Roughly 90% of historical
      Xero lines are behind the 2025-12-31 lock and unrepairable.
    contexts: [ledger, billing]
    why_it_matters: >-
      Importing defective lines makes the new ledger's history agree with the filed tax position
      but carries the tracking defect forward permanently. Restating makes the new ledger correct
      but disagrees with what was filed.
    evidence: >-
      Related and verified 2026-08-08: 28.7% of CFS line revenue carries no product-line
      dimension, concentrated in `service` lines (71.9% of service revenue untracked) and worst in
      2024 (48.3%). Whatever is imported inherits that.
      ⚠️ **Re-measured 2026-08-10 and largely repaired at source.** That figure counted the
      invoice-line denorm; joined to the product master, 227 lines were a derivation that never ran
      (api-cloudrun#473, fixed) and untracked line revenue is now **15.00%**. The hotspot's tension —
      import-as-filed versus restate — is unchanged, but **the population to restate has collapsed**
      and ADR-0020 carries the re-scoping.
      (`inbox/2026-08-10-the-untracked-revenue-denorm-is-repaired-and-28-7-percent-is-now-15-percent.md`)
    blocks: [OQ-012]
    status: resolved
    resolved_by: ADR-0020

  - id: HOT-007
    headline: "legs derived where the spec says recorded"
    statement: >-
      Are fulfillment legs first-class recorded events, or derived from orders? The current system
      derives them, which is why actor and shift are unrecoverable.
    contexts: [fulfillment]
    why_it_matters: >-
      This is the single decision the whole labor-costing design rests on. Derived legs cannot
      carry an actor, a clock-in, or a shift id, so COGS labor allocation is impossible without
      first-class legs.
    blocks: [OQ-001, ADR-0011]
    status: resolved
    resolved_by: ADR-0011

  - id: HOT-008
    headline: "duplicate products split one revenue stream"
    statement: >-
      Duplicate ACTIVE charge products book the same economic event to different revenue accounts,
      so the source data does not determine the posting.
    contexts: [ledger, billing]
    why_it_matters: >-
      The new posting rules must map a billed line to exactly one account. Today the account
      depends on which of two identically-named active products the operator happened to pick, so
      historical revenue is split across accounts for no economic reason — and any posting rule
      derived from history inherits the ambiguity.
    evidence: >-
      Verified 2026-08-08 in the `Delivery` product line, all `active: true`: "Distance Charge"
      exists twice (one `service` @ COA 4100, one `surcharge` @ COA 4110); "Rush Charge" exists
      twice (both `surcharge` @ COA 4100); "Off Hours Surcharge" (`service` @ 4100) coexists with
      "Off Hours Charge" (`surcharge` @ 4110); "Weekend Surcharge" (`service` @ 4100) coexists with
      "Weekend Charge" (`surcharge` @ 4110). The `- Old` variants are correctly inactive; these
      are not.
    blocks: [OQ-014]
    status: resolved
    resolved_by: ADR-0021

  - id: HOT-009
    headline: "invoice status carries two semantics"
    statement: >-
      `invoice.status` carries two different semantics in one field — an assigned lifecycle fact
      (draft / issued / voided) and a derived balance fact (part_paid / paid) — so no invariant can
      be stated about either half.
    contexts: [billing, ledger]
    why_it_matters: >-
      ADR-0014 makes derived state a rebuildable projection and assigned state a recorded fact. A
      field that is both cannot be either, and the two live defect populations are one of each: the
      derived half going stale, and the lifecycle half disagreeing with the balance. Decomposing
      the field is a precondition for applying ADR-0014 to invoices at all.
    evidence: >-
      Two open populations in the v1 corpus, both measured: 86 orders hold a stale denormalized
      invoice status (api-cloudrun#453) — the derived half drifting from the facts that determine
      it; and voided invoices still carry a balance the external ledger closed (api-cloudrun#436),
      a population recorded as GROWING rather than historical — the lifecycle half asserting a
      state the balance contradicts.
    blocks: [ADR-0014]
    status: resolved
    resolved_by: ADR-0022

  - id: HOT-010
    headline: "a variance rule with no standard rate"
    statement: >-
      The charter and `posting-rules.yaml` specify standard-cost absorption with a
      `labor_variance` posting rule, but CFS does not use standard labor rates — costing is
      actual, from a per-contact wage and a deterministic overtime rule.
    contexts: [ledger, fulfillment]
    why_it_matters: >-
      A rate variance cannot exist where there is no standard rate, so `labor_variance` as
      specified has no input and would be a posting rule that can never fire. Absorption itself
      survives and must not be discarded with it: a guaranteed 8 hours means paid-but-unworked
      time is a real cost attributable to no job, so `COGS-Labor Absorbed` and
      `COGS-Unabsorbed Labor` both stand. What they measure is UTILISATION, not rate deviation,
      and the posting rules must say which.
    evidence: >-
      Repo owner, 2026-08-09 (OQ-008): default wage $30/hr with a guaranteed 8 hours, 1.5x after 8
      in a day, 1.5x all day on a 6th and/or 7th consecutive day; one person at $36/hr. The wage
      is carried per contact and overridable, and cost flows from the purchase order / bill that
      labor scheduling generates. Against `charter.md` ("standard-cost absorption into COGS") and
      `ledger/posting-rules.yaml` (`labor_variance <- period : Dr/Cr COGS-Labor Variance`).
    blocks: [OQ-018, OQ-019]
    status: resolved
    resolved_by: ADR-0019

  - id: HOT-011
    headline: "three artifacts disagree on dimensions"
    statement: >-
      REQ-LED-001 and ADR-0018 require BOTH dimensions on every revenue and COGS posting;
      `ledger/dimensions.yaml` requires only `product_line` on revenue; and the chart of accounts
      contains revenue and COGS accounts for which neither dimension has a defensible value.
    contexts: [ledger]
    why_it_matters: >-
      REQ-LED-001 is the repo's only ledger requirement and the golden vectors' rejection cases are
      its entire enforcement, so which reading is authoritative decides what those vectors assert.
      Written as REQ-LED-001 states it, the rule refuses legitimate postings — interest income has
      no product line and no "kind of work". Written as `dimensions.yaml` states it, the
      requirement's own text is wrong. `ledger/chart-of-accounts.yaml`'s `dimensioned:` column
      cannot be set correctly until one of them wins, and 8 accounts currently carry
      `dimensioned: undecided` waiting on it.
    evidence: >-
      `cost_type`'s own description in `ledger/dimensions.yaml` is "What kind of work a LABOR
      posting represents", with values `[delivery, counter, warehouse]` and `required_on: [cogs]` —
      there is no member of that set for a rental revenue posting or for `5000 Cost of Goods Sold:
      Retail Inventory`. Against REQ-LED-001, "Every revenue and COGS posting shall carry both a
      product line and a cost type", and ADR-0018, "both mandatory dimensions are not nullable on
      revenue and COGS postings". Separately, the live chart holds 5 non-operating revenue accounts
      (4800 Other Income, 4810 Cashback, 4820 Interest, 4830 Vendor Refunds, 4840 Sales Tax Discount
      — all `type: Other Income`) and 4600 Cash Discrepancies, none of which arises from a sale
      (`api:2026-08-09:db_chart_of_accounts_query`, 134 accounts). Forcing a product line onto them
      makes `Other` the new null, which `dimensions.yaml`'s own note already warns against.
    blocks: [OQ-021]
    status: resolved
    resolved_by: ADR-0025

  - id: HOT-012
    headline: "a frozen ADR cites a retracted number"
    statement: >-
      `ADR-0001` is `accepted` and therefore immutable, and its Context states a number that has
      been retracted and an attribution that has been reversed — "the dimension on a Xero line is
      optional by construction: an unresolvable tracking option id is dropped and the push still
      succeeds. 28.7% of line revenue has no product line as a result." Re-measured 2026-08-10, the
      dominant cause of that 28.7% was a CFS-side derivation that never ran, not Xero dropping
      anything.
    contexts: [ledger, billing]
    why_it_matters: >-
      Not because the decision is in doubt — replacing Xero stands on the costing model Xero cannot
      express, on ADR-0026's dual-basis requirement, and on three other Context bullets that are
      unaffected. It matters because **the repo has no mechanism for an accepted ADR whose evidence
      was later corrected**, and this is the first instance. Every other artifact citing the 28.7%
      was amended in place on 2026-08-10; `adr/` is the one lifecycle where that is forbidden
      ("immutable once accepted — superseded by a new ADR, never edited"). So the correction has
      nowhere to live, and a reader of `ADR-0001` today gets a number that is wrong by a factor of
      ~700 and a causal claim that points at the wrong system.
      The general question is the one to settle: **is an ADR a historical record of a decision as
      taken, or a statement of current fact?** If the former, this hotspot resolves by convention —
      the correction lives in `inbox/` and the traceability matrix, and ADR-0001 is left alone as
      the honest record of what was believed on 2026-08-08. If the latter, an accepted ADR needs a
      lightweight errata mechanism, because superseding ADR-0001 to fix a Context bullet would mean
      re-deciding "replace Xero", which nobody is asking to reopen.
    evidence: >-
      `adr/ADR-0001-replace-xero-with-in-house-ledger.md:23` (status `accepted`, dated 2026-08-08).
      Against `inbox/2026-08-10-the-untracked-revenue-denorm-is-repaired-and-28-7-percent-is-now-15-percent.md`
      (`api-cloudrun:2026-08-10:scripts/audit-invoice-line-denorms.ts`, all 9,194 revenue lines
      joined to the product master): of the $486,516.99 untracked, 227 lines / $252,161.36 were a
      derivation that never ran, 128 lines / $233,667.63 were custom lines with no product master,
      and 35 lines / $688.00 — **0.041% of all line revenue** — were genuinely undecided.
      api-cloudrun#473 repaired the writer on 2026-08-10; `tracking_missing` is 227 → 0.
      Six other artifacts carried the same figure and were amended on 2026-08-10: ADR-0009,
      ADR-0020, ADR-0025, `charter.md`, `glossary.yaml`, `contexts/ledger/requirements.yaml`. All
      six are either `proposed` or in a freely-refactored directory. ADR-0001 is neither.
    blocks: []
    status: resolved
    resolved_by: ADR-0034
    resolution: >-
      **An accepted ADR is a historical record of the decision as taken, not a statement of current
      fact.** Owner, 2026-08-16, choosing the general answer this hotspot said would resolve it by
      convention. `ADR-0001` is left exactly as written.
      The correction lives where this hotspot said it would: in `inbox/` (append-only, dated) and in
      this entry, which stays in `hotspots.yaml` permanently because nothing here is ever deleted.
      ADR-0034 also names the pattern the repo had been using unwritten — a question an accepted ADR
      left open is answered by a NEW NARROW ADR that `relates_to` it and supersedes nothing
      (ADR-0025 is the precedent) — and reserves superseding for an actual change of decision.
      ⚠️ **The accepted cost**: a reader of ADR-0001 cannot tell from ADR-0001 that its 28.7% is
      retracted. ADR-0034 records the cheap reversal if that bites — render each ADR's `relates_to`
      hotspots beneath it in `in-force.generated.md`, a generator change touching no frozen body.
      ⚠️ **Not machine-enforced.** Nothing in `deno task validate` can fail when a frozen body is
      edited. ADR-0034 names the enforceable version (a body hash in frontmatter, recomputed at
      validate time) and does not build it.

  - id: HOT-013
    headline: "more dimension claimants than transfer fields"
    statement: >-
      `ADR-0018` says dimensions are "carried on the posting, in `user_data` and in the
      Mongo/Parquet projection". A TigerBeetle transfer has exactly three `user_data` fields, and
      erp-spec#3 plus `research-drop/reference/tigerbeetle.md` assign all three to
      `journal_entry_id`, `source_document` and `accounting_date` — with a fourth claimant
      (`posting_rule`) already evicted. Both cannot be true: there is no slot for `product_line` or
      `cost_type`.
    contexts: [ledger]
    why_it_matters: >-
      It decides whether the ledger is self-describing. If TigerBeetle carries the dimensions, a
      dimensional P&L can be rebuilt from the ledger alone after a Mongo loss; if it does not,
      TigerBeetle holds balance integrity and the dimensional view exists only in the projection —
      which is defensible under ADR-0017, but is a different system from the one ADR-0018's sentence
      describes.
      The ambiguity is load-bearing rather than cosmetic, because REQ-LED-001's whole enforcement
      story rests on it. `ledger/dimensions.yaml` states that with dimensions off account identity
      "nothing structural catches a missing one — the rejection vectors are the entire enforcement".
      That reasoning assumed the dimension is on the posting the vectors check. If dimensions live
      only in the projection, the vectors are checking a different artifact from the one the ledger
      stores, and REQ-LED-001 is being enforced somewhere other than where it is stated.
    evidence: >-
      `adr/ADR-0018-plain-coa-dimensions-on-the-posting.md` (status `accepted`, 2026-08-09):
      "**Dimensions are carried on the posting**, in `user_data` and in the Mongo/Parquet
      projection, never in account identity."
      Against `research-drop/reference/tigerbeetle.md`: "`user_data_128/64/32` are the only
      per-transfer reference fields. The working assignment is `128 → journal_entry_id`,
      `64 → source_document`, `32 → accounting_date` (packed `YYYYMMDD`), with `posting_rule`
      evicted to the Mongo projection — three fields, four claimants, tracked as erp-spec#3".
      **Surfaced 2026-08-16 by counting claimants for OQ-040**
      (`inbox/2026-08-16-survey-the-party-is-a-subledger-key-and-the-dimension-is-a-gl-slice-and-they-ride-different-legs.md`).
      In TigerBeetle one transfer is one debit account plus one credit account, so a single
      `invoice_issued` transfer (Dr 1200 / Cr 4100) carries both an AR-side and a revenue-side
      obligation. **Three slots, six live claimants** before `settlement_point` is considered.
      **erp-spec#3 undercounts.** Its title is "three fields, four claimants" and it enumerates
      `journal_entry_id`, `source_document`, `posting_rule`, `accounting_date` — it never counts the
      two dimensions ADR-0018 placed there. ADR-0008 reserved all three fields when dimensions lived
      in ACCOUNT IDENTITY and `user_data` was therefore free; ADR-0018 superseded ADR-0008 and moved
      dimensions onto the posting without re-doing the budget that assumption had made safe.
      ⚠️ Two of the three reservations may be eliminable — erp-spec#3 argues `journal_entry_id` may
      be derivable as `(source_document, posting event)` under ADR-0014, and `posting_rule` may be a
      projection concern. If both go, the shortfall narrows. That is analysis, not a decision, and
      it is why this is a hotspot rather than a repair.
      ⚠️ **BOTH escape hatches are closed, and were already closed when this hotspot was written —
      2026-08-16, `ledger/tigerbeetle-accounts.yaml`.** `journal_entry_id_is_not_derivable:`
      records that EVT-BIL-006 and EVT-BIL-003 both allocate one instrument across several invoices,
      so the grouping is not a function of `source_document_ref`; the field stays reserved. And
      `posting_rule` is not merely evictable — it is already **evicted**, and the slot it freed was
      already spent letting `accounting_date` take `user_data_32`. **The shortfall within `user_data`
      is real and has no dissolution path.**
      ✅ **But the field count itself is wrong, in this hotspot's favour.** `Transfer.code` is a
      **fourth** discretionary reference field — u16, "the reason for (or category of) the transfer",
      and a first-class `QueryFilter` filter — and **nothing in `ledger/` claims it**.
      `ledger/tigerbeetle-accounts.yaml`'s `account_code_rule` assigns the **Account's** `code` to
      the GL code; the **Transfer's** `code` is a different field on a different record. The miscount
      originates in `research-drop/reference/tigerbeetle.md` ("the only per-transfer reference
      fields", corrected 2026-08-16) and propagated into erp-spec#3, into this entry, and into
      ADR-0026's Context.
      ✅ **And the unhoused payload fits it with room to spare.** Measured 2026-08-16 across all 13
      `specified` posting rules: **no posting dimensions both legs** — every dimensioned posting pairs
      one dimensioned account with an undimensioned counterparty, and 5800 alone owes both dimensions.
      So the maximum is one pair: 21 `product_line` values × 4 `cost_type` values = **84 combinations,
      7 bits of 16**. Even a hypothetical both-legs case is 7,056, still inside u16.
      ⚠️ **Fitting is not deciding.** That the representation exists removes the "unrepresentable"
      framing from this hotspot; it does not answer whether the ledger should carry dimensions at
      all, which is the actual conflict.
      (`inbox/2026-08-16-the-transfer-field-budget-is-four-fields-not-three-and-both-candidate-evictions-are-already-refused.md`)
      ⚠️ **ADR-0018 is `accepted` and therefore immutable**, so the correction has the same nowhere
      to live that HOT-012 describes. This is the second instance of that meta-problem.
      ⚠️ **A SECOND accepted ADR carries the undercount, found 2026-08-16 while checking what the
      requirements-mining pass rested on.** `ADR-0026`'s Context argues against a parallel ledger
      partly on the grounds that "a `book` tag carried on the transfer instead would be a **fifth**
      claimant on the three `user_data` fields erp-spec#3 already has four claimants for". By this
      hotspot's count a `book` tag would be the **seventh**, not the fifth — which strengthens
      ADR-0026's conclusion rather than weakening it, since the budget is tighter than it argued.
      Recorded here rather than in ADR-0026, per ADR-0034: the decision stands, a cited fact was
      wrong, so the correction lives in the hotspot and the ADR is left alone.
    blocks: [OQ-040, ADR-0033, SPIKE-003]
    status: resolved
    resolved_by: ADR-0036
    resolution_note: >-
      ✅ **ADR-0036 accepted 2026-08-16.** ⚠️ It DISSOLVES this conflict rather than answering it in
      its own terms, and the difference is worth keeping: the question was "where on a transfer does
      a product line fit", and the answer is that it does not go on a transfer at all. The claimants
      were removed, not accommodated. ADR-0018 is superseded.
      ⚠️ **Not because there was nowhere to put them.** `Transfer.code` is a fourth discretionary
      field and the payload measures 84 combinations — 7 bits of 16. The slot exists and is
      declined, on ADR-0036's own criterion: a product line is a mutable field on a mutable master,
      and freezing it into an immutable transfer is the defect regardless of which field holds it.
      **`Transfer.code` remains unclaimed, with three contenders** — the actor ref, the causal order
      where `path[0]` cannot supply it, and nothing else. That is erp-spec#3's live half, not this
      hotspot's.
    resolution_shape: >-
      **Settled 2026-08-16 by ADR-0034, which decides the FORM this resolution takes and not its
      content.** `ADR-0018` stays exactly as written — its decision (plain COA, dimensions off
      account identity) is not in doubt, and it did not decide wrongly so much as under-specify.
      So the answer is a **new narrow ADR** deciding where a dimension physically lives on a
      transfer, carrying `relates_to: [ADR-0018]` and superseding nothing — the ADR-0025 pattern,
      now named. **Superseding ADR-0018 is explicitly the wrong instrument**: it would re-open
      plain-COA-versus-exploded-accounts to fix a prepositional clause.
      **What that ADR still needs before it can be written:**
      ✅ **Both technical blockers below are DISCHARGED as of 2026-08-16. What remains is a
      judgement, not a measurement.**
      · ~~**SPIKE-003**~~ — `research-drop/reference/tigerbeetle.md` says flatly "no queries" while
        recent releases are believed to expose a limited `query_transfers`. Neither gives a range
        filter on `user_data`, so the conclusion is unchanged, but the spike decides whether
        TigerBeetle can serve any period question at all.
        ✅ **Settled from the cached 0.17.9 reference, without the spike.** `query_transfers` and
        `query_accounts` exist, taking a `QueryFilter`: equality only on `user_data_128/64/32`,
        `ledger` and `code`; range only on TigerBeetle's own `timestamp`, which is posting time.
        **No range filter on `user_data`**, so periodisation still comes from the projection
        (ADR-0017) exactly as `ledger/tigerbeetle-accounts.yaml` already assumed.
        ⚠️ **And this was never load-bearing for the hotspot.** The case for dimensions in
        TigerBeetle is reconstruction after a Mongo loss, which needs the value **present**, not
        filterable — a walk of ~15k transfers rebuilds a dimensional P&L whatever `QueryFilter`
        can express. SPIKE-003's other two exit criteria (the `imported` flag's timestamp and
        monotonicity semantics, and live posting resuming after an import batch) are untouched and
        **this hotspot does not depend on either**.
      · ~~**The two candidate evictions in erp-spec#3**~~, which may make the shortfall disappear
        rather than force a choice: `journal_entry_id` may be derivable as
        `(source_document, posting event)` under ADR-0014's derived-state doctrine, and
        `posting_rule` may be a projection concern rather than a ledger fact. If both go, only
        `source_document` stays reserved and two slots open up.
        ❌ **Both refused, per the evidence above — and refused before this hotspot was opened.**
        No slots open up. What opens instead is `Transfer.code`, which was never counted.
      ⚠️ **This was briefly written up as a choice between carrying dimensions and a
      projection-only design. That framing is WRONG and is retracted 2026-08-16.** ADR-0018 is
      accepted and says dimensions ride ON THE POSTING; ADR-0034 says in terms that it "did not
      decide wrongly — it under-specified". So projection-only is not a live option here — choosing
      it would be RE-DECIDING ADR-0018, which is the instrument ADR-0034 reserves for an actual
      change of decision. **The only open question was ever WHICH FIELD**, and it stopped being a
      judgement the moment `Transfer.code` was counted.
      ✅ **Drafted as ADR-0035** (`proposed`, 2026-08-16) — the dimension pair packed into
      `Transfer.code` as `1 + product_line_idx*4 + cost_type_idx`, `relates_to: [ADR-0018, …]`,
      superseding nothing, per the ADR-0025 pattern ADR-0034 named.
      Surveyed against all six references first
      (`inbox/2026-08-16-survey-all-six-references-keep-the-dimension-in-the-same-store-as-the-balance-and-only-odoo-splits-the-record.md`):
      five of six carry the dimension on the posting line, six of six keep it in the same durable
      store as the balance, and **no reference faces CFS's two-store split** — so the property they
      unanimously hold is the one ADR-0003's architecture can fail, which is why the survey
      corroborates ADR-0018 rather than reopening it.
      ❌ **ADR-0035 WAS REJECTED THE SAME DAY, and everything above it is superseded reasoning.**
      Owner, 2026-08-16: "product lines themselves are a reporting concern, not a ledger concern.
      causal order(s) matter. invoice linking matters. item uids or skus matter."
      **The whole hotspot rested on a premise nobody held.** It asked WHERE ON A TRANSFER a product
      line fits; the answer is that it does not go on a transfer at all. A product line is
      `products.uid_tracking_category` — a mutable field on a mutable master — and freezing it onto
      an immutable transfer makes every re-categorisation a ledger restatement. It has moved twice in
      one month (`Other` retired across 12 products; `Transport` dropped and restored), both times
      correctly.
      ✅ **Superseded in substance by ADR-0036** (`proposed`, 2026-08-16), which supersedes ADR-0018:
      the posting carries the GL account and its keys — causal order(s), invoice link, `item.path` —
      and every classification is a Mongo concern. **This hotspot DISSOLVES rather than resolves:
      there was never a dimension to fit into a `user_data` field.**
      **Stays `open` until ADR-0036 is accepted, which is not Claude's to do.**
      (`inbox/2026-08-16-owner-rulings-line-identity-is-item-path-ephemeral-reports-are-never-sealed-and-cost-type-becomes-labour-line.md`)
      · The OQ-040 survey's recommendation **removes** a claimant rather than adding one — a
        settlement point is a subledger key on the receivable leg, not a third dimension
        (`inbox/2026-08-16-survey-the-party-is-a-subledger-key-and-the-dimension-is-a-gl-slice-and-they-ride-different-legs.md`).

  - id: HOT-014
    headline: "a causal order does not identify a row"
    statement: >-
      ADR-0029 requires that "every posting must carry its causal order, or allocation is impossible
      and this decision quietly becomes never allocate" — and no posting carries one. The
      TigerBeetle transfer has no field for it, and the golden vectors' expected transfer shape has
      none either.
    contexts: [ledger, fulfillment, billing]
    why_it_matters: >-
      ADR-0029 splits the ledger from the report on the promise that the un-allocated posting keeps
      enough to allocate downstream — "an un-allocated posting that carries its causal order can be
      allocated downstream by any basis a question needs". The causal order is the half of that
      promise the ledger does not keep. ADR-0031's official product-line P&L allocates
      `goods_revenue_on_causal_order` with `scope: causal_order`, so the ONE official allocation is
      keyed on a value the accounting record does not hold.
      **The consequence is asymmetric and it is the wrong way round.** After a MongoDB loss,
      TigerBeetle rebuilds balances (ADR-0003), periods (`user_data_32`) and — under ADR-0035 —
      dimensions. What it cannot rebuild is the allocation, because the causal order is gone. So the
      recoverable view is exactly the one ADR-0029 says "must never be read as a managed P&L", and
      the unrecoverable one is what it calls "the managed number".
      This is not the same gap as HOT-013. HOT-013 asked where a DIMENSION lives and is answered by
      ADR-0035. This asks where the ALLOCATION KEY lives, and ADR-0035 explicitly does not answer it.
    evidence: >-
      `adr/ADR-0029-the-ledger-records-unallocated-facts.md`, Consequences: "**Every posting must
      carry its causal order**, or allocation is impossible and this decision quietly becomes 'never
      allocate'. That is the load-bearing requirement this ADR places on every future posting rule."
      Against `ledger/posting-rules.yaml` and `ledger/vectors/`, measured 2026-08-16:
      · `shift_recorded` fans `per: shift.absorbed_allocations`, and each allocation carries
        `causal_job` in the SOURCE DOCUMENT — `ledger/vectors/shift_recorded/overtime-premium-pro-rata-across-the-days-jobs.yaml`
        shows ORD-VEC-0001 / -0002 / -0003 on one shift. The `expect.transfers[]` entries are
        `{debit_account, credit_account, amount_minor, accounting_date, product_line, cost_type}` —
        **no causal job**. Three transfers, three different causal orders, indistinguishable on the
        transfer.
      · `trigger.source_document` for `shift_recorded` is `shift`, so `user_data_64` resolves to the
        shift and NOT to any order. The causal order is per-transfer data below the source document,
        which is the one shape a document reference cannot recover.
      · `reporting/allocation-bases.yaml` → `goods_revenue_on_causal_order`, `scope: causal_order`.
      ⚠️ **Invoice-borne postings are luckier and it is luck, not design.** `invoice_issued`'s
      source document is the invoice, and 0 of 1,010 prod invoices bill more than one order
      (ADR-0031), so the causal order is currently one deterministic hop away. ADR-0031 chose order
      scope precisely because that coincidence will not hold, and when a multi-order invoice appears
      the revenue side acquires the same defect the labor side already has.
      ⚠️ **`Transfer.code` cannot absorb it.** ADR-0035 leaves 9 spare bits — 512 values against
      ~1,000 orders today and growing. This needs a field, not a corner of one, and there is no
      unclaimed field left.
      ⚠️ **WIDER THAN FIRST WRITTEN, 2026-08-16: it is not only TigerBeetle. NOTHING in the spec
      records a causal order on a posting.** `contexts/ledger/entities/posting.yaml` — the one place
      the posting shape is written — declares `posting_id`, `journal_entry_id`, `account_ref`,
      `amount_minor`, `direction`, `accounting_date`, `posting_timestamp`, `product_line`,
      `cost_type`, `source_document`, `posting_rule`. **No causal order.** So it is absent from the
      MongoDB record too, and therefore from the Parquet ADR-0017 exports from MongoDB and seals at
      close.
      ⚠️ **And the official report already reads it.** `reporting/queries/product-line-pl.sql` joins
      on `causal_order_id` throughout — `SELECT causal_order_id`, `JOIN base_total t USING
      (causal_order_id)`, `PARTITION BY causal_order_id, pool_id`. Three artifacts: ADR-0029 requires
      the field, the official query consumes it, and the entity that defines the record omits it.
      The only causal order anywhere in the spec is `shift.absorbed_allocations[].causal_job`, inside
      the source document.
    blocks: [ADR-0029, ADR-0031, ADR-0036]
    status: resolved
    resolved_by: ADR-0036
    resolution_note: >-
      ✅ **ADR-0036 accepted 2026-08-16, and it ABSORBS this rather than dissolving it.** The gap was
      real — ADR-0029 required every posting to carry its causal order and nothing was built to meet
      it. ADR-0036 makes that requirement its own decision: a posting records keys, and the causal
      order is one of them.
      ⚠️ **Two things the acceptance does NOT settle, both measured 2026-08-16 and both recorded in
      the ADR itself.** (1) `path[0]` is not reliably the causal order — 30 of 1,010 invoices carry
      no order divider, holding 87 lines worth $87,839.76, all legacy CRMS imports. The owner's
      ruling — an explicit null causal order is legal, absence is refused — is what closes that, and
      v1 will re-base order paths to match invoice paths (api-cloudrun#538). (2) The key does not
      fit any TigerBeetle field verbatim (178 bytes against 16), so it is stored as a hash or a
      surrogate; which one is a consequence to work out, not a re-decision.
    resolution_shape: >-
      **Not a re-decision of ADR-0029 — the same shape HOT-013 turned out to have.** ADR-0029's
      decision (the ledger does not allocate) is not in doubt; it stated a requirement and nothing
      was built to meet it. Candidate answers, none surveyed yet:
      · **Accept it and say so.** Allocation is a MongoDB/Parquet concern by construction, and the
        ledger's disaster-recovery guarantee stops at the un-allocated dimensional trial balance.
        Cheapest, and it makes ADR-0029's requirement an obligation on the PROJECTION rather than on
        the posting — which is a real narrowing of ADR-0029, so it should be written down as one.
      · **Give the causal order a field**, which means taking one back. `journal_entry_id` is the
        only candidate and `journal_entry_id_is_not_derivable` closed that door for a different
        reason. Splitting `user_data_128` into two u64 halves is representable and costs the
        equality filter on journal entry.
      · ~~**Seal the allocation instead of the key.**~~ ADR-0017 already seals a closed period's
        Parquet and hashes it into the close record. If the allocated P&L is sealed at close
        alongside it, history is recoverable without the ledger carrying the key.
        ❌ **INVERTED 2026-08-16 by the owner's stated requirement, and it is now the WORST of the
        three.** Owner: "i liked allocation being a reporting function, **that way i can reallocate,
        i can have multiple allocation methods**." Sealing the allocated OUTPUT is exactly what makes
        a closed period un-re-allocable — one frozen answer per period, and no way to ask a second
        question of it.
      ✅ **The correct form is the opposite one: SEAL THE INPUTS.** ADR-0017 already exports the
      sealed Parquet **from MongoDB**, "which holds the accounting date and is queryable" — postings,
      not report rows. Put the causal order on the POSTING and the sealed artifact carries it, so any
      basis whose inputs are in the artifact re-runs over a closed period reproducibly. That is one
      field on a record already being sealed, and it makes the TigerBeetle exposure bounded and
      nameable: a MongoDB loss **before close** costs that open period's allocability; after close
      the Parquet holds it.
      ⚠️ **Do not confuse this with what is honestly foreclosed.** The weight/cube basis (v2, OQ-033)
      can never be re-run over history because the driver was never captured — 0 of 567 products
      carry a non-zero shipping dimension, and `allocation-bases.yaml` says historical periods "must
      keep resolving the basis that produced them". That is a DATA-CAPTURE limit. Bases whose inputs
      are recorded — goods revenue, line count, quantity — are limited only by this hotspot, which is
      ARCHITECTURAL and fixable. Treating the two as one makes an avoidable limit look inevitable.
      ⚠️ **One tension to state rather than resolve.** ADR-0017 guarantees "a closed period cannot
      drift". Re-allocating a closed period under a new basis yields a different number for that
      period. The `(basis_id, version)` pin already makes each such report reproducible and
      self-identifying, so this is not drift — but the guarantee's wording is about the PERIOD and
      this makes it about the **(period, basis)** pair, and that should be written down wherever
      re-allocation is.
      ⚠️ **Survey obligation applies** (CLAUDE.md → _Accounting decisions_): "how two books relate"
      is exactly this. Six references before a recommendation.
      (`inbox/2026-08-16-the-owner-wants-allocation-re-runnable-and-nothing-in-the-spec-carries-the-key-it-would-re-run-on.md`)
      ✅ **ABSORBED BY ADR-0036 (`proposed`, 2026-08-16), and the survey obligation lapses with it.**
      ADR-0035 was rejected the same day it was drafted, so every reference to it above is stale
      reasoning kept for the record. ADR-0036 makes the causal order a **decision** rather than an
      unmet obligation: a posting carries causal order(s), invoice link and `item.path`.
      ⚠️ **Two of this entry's own conclusions are RETRACTED by the owner's rulings**, and both were
      me over-reaching rather than the hotspot being wrong:
      · **"the recoverable view is the one that must never be read as a managed P&L"** — the asymmetry
        does not matter, because the sealed artifact is the balance sheet and account-level P&L and
        **neither carries a product line**. Owner, 2026-08-16: "there's no reason an ephemeral report
        would ever need to be sealed or locked… a p&l by product line or customer type is driven by a
        need for business intelligence, not compliance."
      · **The "(period, basis) rather than period" tension** — dissolves for the same reason. Nothing
        drifts, because the BI report was never sealed.
      ✅ **And the fix is cheaper than any of the three candidates.** `INVOICE_ITEM_LEVELS` is
      `[order, destination, group]` against `ORDER_ITEM_LEVELS`'s `[destination, group]`, so an
      invoice item's path is the order item's path prefixed by an order divider — **`path[0]` IS the
      causal order.** One stored key carries line identity, invoice link and causal order together.
      ⚠️ Precondition: **api-cloudrun#485** (10 invoice lines at a different path than their order
      line) must close first, and it does not cover labor, whose postings key to a causal job with
      no invoice line.
      **Stays `open` until ADR-0036 is accepted.**

  - id: HOT-015
    headline: "the feature file kept a refuted reading"
    statement: >-
      `contexts/ledger/features/posting-keys.feature` — then named `dimensional-postings.feature` —
      still states the reading ADR-0025 REFUTED. Its Feature title is "Revenue and COGS postings carry both mandatory dimensions";
      scenario 1 has a *revenue* posting carry a `cost_type` and be recorded; scenario 3 asserts "A
      COGS posting missing the cost type is rejected" against a generic dimensioned COGS account.
      `ledger/dimensions.yaml` scopes `cost_type` to `required_on: [labor_cogs]`, and exactly one
      account in `ledger/chart-of-accounts.yaml` names it.
    contexts: [ledger]
    why_it_matters: >-
      This is **HOT-011 surviving in the one artifact its resolution did not sweep**. ADR-0025
      amended REQ-LED-001, re-scoped `cost_type` in `ledger/dimensions.yaml` and set the per-account
      `dimensions:` lists in `ledger/chart-of-accounts.yaml` — three artifacts. The `.feature` file
      was left stating the refuted reading, and it is not a fourth copy of the rule: gate 3 ties
      every requirement to a Gherkin scenario, so **these scenarios are REQ-LED-001's only
      executable statement**. A scenario that overstates the obligation is what an implementer
      builds to, and building it re-introduces exactly what OQ-021 removed — a "kind of work"
      demanded on `5000 Cost of Goods Sold: Retail Inventory`, where none of `delivery` / `counter`
      / `warehouse` is true.
      It survived because **nothing reads a `.feature` file's dimension claims**. Gate 10 checks
      every golden vector in `ledger/vectors/` against `ledger/dimensions.yaml` and stops there
      (erp-spec#16). The value-set gate added for that issue does not catch this one either: every
      value used here — `Transport`, `delivery`, `Crew` — is legally DECLARED. What is wrong is
      APPLICABILITY, not vocabulary.
    evidence: >-
      Measured 2026-08-16 against `main@5b1f8ae`.
      · `contexts/ledger/features/posting-keys.feature:1` (Feature title, then
        "Revenue and COGS postings carry both mandatory dimensions"), `:22-28`
        (scenario 1), `:40-47` (scenario 3).
      · `ledger/dimensions.yaml` `cost_type`: `required_on: [labor_cogs]`, values
        `[delivery, counter, warehouse]`, note "**Labor only** (OQ-021, resolving HOT-011)".
      · `ledger/chart-of-accounts.yaml:1231` — **1 of 134 accounts** names `cost_type`:
        `5800 Cost of Goods Sold: Wages (Absorbed)`, `dimensions: [product_line, cost_type]`.
        No revenue account names it; `5000` does not name it.
      · `contexts/ledger/requirements.yaml` REQ-LED-001 rationale retracts the old wording by name:
        "the previous wording — 'every revenue and COGS posting shall carry both a product line and
        a cost type' — named the two dimensions directly and was **wrong in both directions**".
      · `deno task validate` is green with the contradiction in place — 0 failures, 0 warnings.
      ⚠️ **The file contradicted ITSELF.** Its last scenario — `Scenario Outline: Unabsorbed labor
      is the one posting exempt from the cost-type rule` — already stated the post-ADR-0025 reading
      correctly, in its own prose: "the obligation is read off each account's own `dimensions` list
      in ledger/chart-of-accounts.yaml, and 5801's is empty. **5800 is the only account in the chart
      that names `cost_type` at all.**" So the correct rule and the refuted one sat 40 lines apart in
      one file, and the amendment that added the first did not revisit the second.
    blocks: [REQ-LED-001]
    status: resolved
    resolved_by: ADR-0025
    measured: >-
      Resolved 2026-08-16 by amending the artifact, not by a new decision — ADR-0025 had already
      decided this and three of the four artifacts already agreed. No open question was re-opened.
      What changed in `contexts/ledger/features/posting-keys.feature` (then
      `dimensional-postings.feature`; renamed 2026-08-16 by ADR-0036, which replaced every scenario
      in it — the dimensions this hotspot was about are gone and the file now asserts KEYS):
      · **Feature title** — "Revenue and COGS postings carry both mandatory dimensions" →
        "A posting declares every dimension its own account names".
      · **Scenario 1** no longer puts a `cost_type` on a revenue posting.
      · **Scenario 3 flips from `rejected` to `recorded`** and names its account: a posting to
        5000 Cost of Goods Sold: Retail Inventory carrying a product line and NO cost type is
        RECORDED, because 5000's `dimensions:` is `[product_line]`. That is the correction made
        executable rather than merely written down.
      · A scenario was ADDED for 5800, the one account naming both — so a declared `cost_type`
        value stays exercised by gate 10n after the revenue scenario stopped carrying one.
      · The stale ⚠️ paragraph claiming `dimensions.yaml` "currently does NOT declare" `Transport`
        was removed; it had been false since 2026-08-16 (OQ-034).
      ⚠️ **Nothing gates the applicability rule itself.** Gate 10n checks that a value is DECLARED,
      not that the dimension applies to the account a scenario posts to — and the scenarios did not
      name an account until this amendment. Three of the six now do, which is the precondition such
      a gate would need. Filed as erp-spec#20.

  - id: HOT-016
    headline: "a frozen premise the payroll data refuted"
    statement: >-
      `adr/ADR-0030` — ACCEPTED and FROZEN 2026-08-16 — asserts as a supporting contrast that
      "ADR-0019 could say 'absorption measures utilisation, not rate variance' because labor is
      costed at actual, from a real per-contact wage on a real bill". **Measured 2026-08-17 against
      the Wrapbook payroll exports (OQ-050), labor is NOT costed at actual**: wages are itemised per
      person but BURDEN is priced per RUN and must be apportioned, so labor costing is normal
      costing with a standard-rate component and `labor_variance` fires. ADR-0019's amended body now
      states the opposite of what ADR-0030's frozen body assumes about it.
    contexts: [ledger, fulfillment]
    why_it_matters: >-
      ⚠️ **The DECISION is unaffected and that is what makes this a hotspot rather than a
      supersession.** Vehicle absorption is still rate-based, 5901 still means utilisation plus rate
      deviation, and no account or basis in ADR-0030 changes. What is wrong is the CONTRAST it drew,
      not the conclusion it reached — ADR-0034's third row exactly: "stands, but a fact it cited was
      wrong ⇒ no new ADR; a dated note in inbox/, plus a hotspots.yaml entry when it contradicts
      something".
      ⚠️ **FIRST USE OF THAT PATH.** HOT-006 through HOT-015 are all `resolved` and all carry
      `resolved_by: ADR-XXXX` — every one is "two statements conflict and a DECISION settles it".
      None is "an accepted ADR cited a fact that later measured false". Under this repo's own rule
      that an unexercised branch is a claim rather than a capability, the machinery was assumed not
      to work until taken.
      ⚠️ **And FIVE MUTABLE artifacts repeated the refuted claim, two of them left behind by the
      very amendment that found the defect.** ⚠️ **This entry said THREE until the sweep ran** — the
      count came from a single grep pattern, and it was wrong TWICE. Two surfaced under different
      phrasing on the day: the
      golden vector `guaranteed-hours-unworked-land-in-5801.yaml` ("costing is actual at that
      person's own wage, so no standard rate exists to deviate from") and `glossary.yaml`'s
      `standard cost` term ("the target system does not implement this").
      ⚠️ **And a SIXTH was found on 2026-08-17 while proposing a charter edit: `charter.md`'s
      in-scope bullet said "**actual**-cost absorption into COGS, where the absorbed/unabsorbed split
      measures **utilisation** rather than rate variance" — both halves refuted, in the repo's
      TOP-LEVEL document.** The sweep missed it because the pattern was "costed at actual" and the
      charter says "actual-cost absorption".
      ⇒ **A count stated from one search is a count of that search** — recorded as a footgun in
      `CLAUDE.md` the same afternoon, and violated twice more before the day ended, including here. ADR-0019's body was corrected to the measurement while
      its TITLE and its SUMMARY BLOCKQUOTE were not — and ADR-0019 has **121 citations** across the
      spec, so a title is what most readers take away. `5800`'s chart reason repeated it too.
      ⚠️ **AND IT HAPPENED A FOURTH TIME, INSIDE THIS HOTSPOT.** The file was renamed
      `…-is-actual.md` → `…-is-normal-costing.md` as part of resolving this, and the evidence list
      above still cited the old path. **Gate 11 caught it** — which is the difference between this
      instance and the three before it: the earlier ones survived because nothing executed on them.
      **That is the HOT-011 / HOT-015 pattern for the third time** — HOT-015's own text calls itself
      "HOT-011 surviving in the one artifact its resolution did not sweep" — and the first time the
      incomplete sweep was made by the same session that opened the hotspot. **Amending a body is
      not amending a decision.**
    evidence: >-
      Measured 2026-08-17.
      · `adr/ADR-0030-vehicle-cost-moves-into-cogs.md:231` — the frozen contrast, `status: accepted`
        with `frozen_sha256` set, so gate 14 forbids editing it and ADR-0034 says it should not be
        edited: an accepted ADR is a historical record of the decision AS TAKEN.
      · Wrapbook payroll 759715 Invoice Fee Summary — burden priced on one applicable-wages base per
        RUN (FICA 6.20 / Medicare 1.45 / FUTA 0.60 / IL SUTA 7.05 / comp 3.06 / platform 1.49 =
        19.85% (ADR-0019/M2)), not per person. Payroll Register — wages itemised per person per day.
      · `inbox/2026-08-17-oq-050-answered-wrapbook-itemises-wages-per-person-per-day-but-prices-burden-per-RUN-so-the-cost-rate-is-an-estimate.md`
      · The three mutable repetitions: `adr/ADR-0019-labor-costing-is-normal-costing.md` title and summary
        blockquote, and `ledger/chart-of-accounts.yaml` 5800's `reason`.
      · `deno task ci` was GREEN with the contradiction in place — nothing executes on it.
    blocks: [ADR-0019]
    status: resolved
    resolved_by: OQ-050
    measured: >-
      Resolved 2026-08-17 by amending the three mutable artifacts to the measurement. **ADR-0030 is
      NOT touched** — its body stays as written, which is correct rather than a compromise: an
      accepted ADR is a historical record of the decision as taken (ADR-0034), and the record
      includes a premise that was true when taken.
      ⚠️ **THE MACHINERY GAP THE FIRST USE FOUND: `resolved_by` had no legal value.** Every prior
      hotspot names an ADR, because every prior hotspot was settled by a DECISION. This one is
      settled by a MEASUREMENT — the payroll exports — with no decision taken at all, and no ADR to
      point at. `resolved_by: OQ-050` is used because OQ-050 is where that measurement is recorded
      and answered, and it is the closest thing to an authority the schema can express.
      ⇒ **The field's implicit contract was "the DECISION that settled it" and it is really "the
      AUTHORITY that settled it"** — which can be an ADR, an answered OQ, or in principle a
      measurement with no home. Recorded rather than fixed, because widening the field is a schema
      change nobody has asked for and one instance is not yet a pattern.

  - id: HOT-017
    headline: "the charter's PSA mechanism is not what the books do"
    statement: >-
      `charter.md` states that a production service agreement's money moves through
      `2800 - PSA Liability Clearing` — _"moving a client's payroll through `2800 - PSA Liability
      Clearing` is the service being sold"_ — and names `4130 - PSA Income` as what CFS sells.
      **MEASURED 2026-08-17 against the live invoice corpus, the books do neither for 93% of it**
      (`code:2026-08-17:erp-spec:spikes/harness/psa-probe.ts`, 1,013 invoices / 14,425 lines):
      of **$101,720.00** of PSA-shaped invoice lines, **$69,650.00 is billed GROSS to
      `4100 - Service Income`**, **$25,070.00 gross to `4120 - Contract Labor Income`**, and only
      **$7,000.00 passes through `2800`**. `4130`, `2801`, `2802` and `2803` are named by **zero**
      invoice lines, while the Xero P&L shows **$13,202.34** on `4130` for FY2025 — income recorded
      in Xero with no CFS invoice behind it.
    contexts: [ledger, billing]
    why_it_matters: >-
      ⚠️ **The charter asserts a MECHANISM, not a preference, and the mechanism decides the revenue
      figure.** Billing through a liability is the agency treatment: the client's budget is money
      CFS holds. Billing to 4100 is the principal treatment: it is CFS revenue. Net income is the
      same either way and **the top line and every margin computed from it are not** — so the two
      readings produce different financial statements from the same events.
      ⚠️ **Both treatments are live for the SAME CUSTOMER.** DePaul's four labor-contract invoices
      total $38,150 on 4100; its September set-dec invoice bills $7,000 through 2800. Nothing in the
      data distinguishes them, so the discriminator is whoever wrote the invoice.
      ⚠️ **And the same line NAME is coded to two accounts** — `Contract Labor` is 4120 for N2ition
      LLC and 4100 for 637 Films.
      **This is a spec statement against a measurement, which is HOT-016's shape** rather than two
      spec statements against each other. The charter is not wrong about what SHOULD happen; it
      asserts as settled a thing that has never been decided, and erp-spec#35 records that PSA has
      no requirement, no event and no posting rule to make it true.
      ⚠️ **`4130`'s $13,202.34 must not be used to size PSA** until it reconciles to something. It is
      13% of the invoiced total and sits on an account no invoice line names, so whatever produced it
      is a path this repo has not seen.
    evidence: >-
      `inbox/2026-08-17-survey-psa-is-a-principal-or-agent-question-and-the-live-books-answer-it-four-different-ways.md`
      — the six-reference survey, and the measurement above.
    blocks: []
    status: open
    resolution_shape: >-
      **Not a hotspot the spec can close on its own.** ASC 606-10-55-37's control test decides it and
      it turns on facts only the owner has (OQ-053): who contracts the crew, whose insurance answers
      for them, and who bears the loss if the client's money does not arrive. Once answered, the
      charter sentence is either confirmed or amended in the same change as the PSA posting rules
      (erp-spec#35), and the resolution is an ADR because a classification is being chosen.
      ⚠️ **Whatever the answer, the history stays inconsistent** — 93% of it disagrees with the
      agency reading and 7% with the principal one, so the cutover carries a comparability break of
      a kind neither ADR-0020 nor ADR-0030 has: an inconsistent past rather than a consistent one
      presented differently.

  - id: HOT-018
    headline: "Social Security treated as capping mid-season"
    statement: >-
      `adr/ADR-0019` — ACCEPTED and FROZEN 2026-08-17 — states that the capped components of
      employer burden leave "a **6.00%** uncapped floor of Medicare, workers comp and the platform
      fee" against "**13.85 points that switch off** mid-season". **Both figures require Social
      Security (6.20%) to cap within a season, and it does not**: FUTA caps at ~$7,000 and Illinois
      SUTA at ~$13,600 — the ADR itself computes these as 233 and 453 hours at $30/hr — while Social
      Security caps at the federal taxable maximum — **$184,500 for 2026, or 6,150 hours at $30/hr**
      (IRS Topic 751). The only components
      that switch off in a season are FUTA and SUTA: **7.65 points, not 13.85**, leaving a
      **12.20%** floor rather than 6.00% (`ADR-0041/M1`). ⚠️ `open-questions.yaml`'s OQ-050 states a THIRD figure for
      the same quantity — "~4.51% uncapped floor of Medicare plus workers comp" — which omits both
      Social Security and the platform fee.
    contexts: [ledger, fulfillment]
    why_it_matters: >-
      ⚠️ **The DECISION is unaffected, which is what makes this a hotspot rather than a
      supersession** (ADR-0034 row 3, the same path HOT-016 took). Burden is still capped per person
      per year, a flat factor is still systematically wrong rather than imprecise, `labor_variance`
      still fires and the apportionment still owes a period-close true-up.
      ⚠️ **What is wrong is the SIZE, and it is wrong by about half.** The seasonal bias between
      early-year and late-year hours is 7.65 points of wage, not 13.85 — and sizing that bias is the
      number's entire job in ADR-0019. A true-up built to the stated figure would be scaled to
      roughly twice the real dispersion.
      ⚠️ **Every individual number in the sentence is correct and the sentence is internally
      consistent** — `1.45 + 3.06 + 1.49 = 6.00` and `19.85 − 6.00 = 13.85` both tie. That is why it
      survived acceptance, a six-reference survey, HOT-016's correction of the very same bullet, and
      twenty gates. **What it never states is which components the 13.85 is made of**, and the
      missing 6.20 is Social Security.
      ⇒ **It was found by attempting to TYPE the components** — writing them as a table with a
      cap-base column per row forces "caps at what" for every component, and Social Security is the
      row whose answer contradicts the prose.
      ⚠️ **AND THE OWNER'S RULING (2026-08-17) INVERTS THAT LESSON, which is the more useful half.**
      _"we dont run payroll direct, we dont track futa or suta or any of that we use eors, pay
      subcontractors and loanouts (1099) why would we track that stuff?"_ **CFS computes none of
      these components** — payroll processing for its own crew is a charter non-goal, and CFS's cost
      is the Wrapbook invoice. So the type that would have caught this is a type **the spec should
      not have**: carrying `BurdenComponent[]` would model a vendor's payroll engine as a side
      effect of wanting a rate.
      ⇒ **The root cause is not a missing column, it is reasoning two layers down into someone
      else's ledger.** What CFS can see, act on and verify is ONE number — the effective rate on a
      run, with its source document — plus the fact that it declines within a season. **A component
      breakdown of a number you do not compute is a claim you cannot check.**
    evidence: >-
      `inbox/2026-08-17-adr-0019s-burden-cap-arithmetic-treats-social-security-as-capping-mid-season-and-it-does-not.md`
      — the component table and the arithmetic both ways · **and
      `inbox/2026-08-17-owner-cfs-tracks-no-payroll-tax-components-so-the-burden-defect-is-about-someone-elses-ledger.md`,
      which narrows what this hotspot is ABOUT.** ✅ The federal figures are pinned: employer Social
      Security 6.2% and a **$184,500** taxable maximum for 2026, Medicare uncapped
      (`https://www.irs.gov/taxtopics/tc751`, read 2026-08-17) — **6,150 hours at $30/hr**, against
      233 for FUTA and 453 for Illinois SUTA. Those two bases are ADR-0019's own and stay unpinned.
    blocks: []
    status: resolved
    resolved_by: ADR-0041
    measured: >-
      **Resolved 2026-08-22 by ADR-0041** (the labor variance posts as a keyed fact), which carries
      the corrected sizing **from this hotspot rather than from ADR-0019's body** — 7.65 points of
      wage, floor 12.20% (`ADR-0041/M1`) — as `resolution_shape` requires. ADR-0019 is untouched and
      stays as written: an accepted ADR is a historical record of the decision as taken (ADR-0034),
      wrong premise included.
      **What landed, closing erp-spec#38 end to end:** `5190 - Cost of Goods Sold: Labor Variance`
      restored to the chart on the premise OQ-050 refuted; two posting arms on
      `vendor_bill_received`; and three golden vectors — both directions plus the minimal-pair
      rejection.
      ⚠️ **The sizing figure is now TYPED, which is what stops this recurring.** The whole hotspot
      exists because one quantity had three different values in three live files (13.85/6.00 in
      ADR-0019, ~4.51 in OQ-050, 12.20 here) and **every one of them was internally consistent
      arithmetic**. `ADR-0041/M1` owns it under gate 22, and the gate immediately found the two live
      files quoting it without citation.
      ⭐ **TWO FINDINGS FROM ACTUALLY WRITING THE RULE, neither visible from the survey:**
      · **erp-spec#38's "there is no EVENT to trigger it" was false** — `vendor_bill_received`
        already fires on the EOR's invoice and already relieves 2010. The claim had been read off
        ADR-0019's "period-close true-up" phrasing rather than checked against the rule set. It is
        the reason this went to a GitHub issue instead of `unwritten:`, so a false premise routed
        two months of work to the wrong place.
      · ⚠️ **`control_total: bill.amount_minor` made CFS'S OWN MEASURED DIRECTION UNREPRESENTABLE.**
        Where the bill lands below the accrual the entry posts the ACCRUED amount, not the billed
        one, and the arithmetic does not close. Changed to `bill.entry_total_minor`, exactly as
        `vehicle_cost_absorbed` did — and its invariant had already written the reason down:
        _"Using `pool_minor` as the control total would have made the over-absorbed case
        unrepresentable."_ **The same defect, the same fix, two rules apart, and nothing connected
        them.** A control total keyed to the natural document total silently forbids every entry
        that is not the document total.
      ⚠️ **ONE HALF IS A PROCEDURE AND NOTHING EXECUTES ON IT.** ADR-0041's D4 — re-derive the plan
      burden rate from each observed run — is the half that actually removes the seasonal bias, and
      unlike D1–D3 it produces no account, rule or vector a gate can check. **A stated guarantee
      that nothing executes is not a guarantee.** Filed as deferred work.
    resolution_shape: >-
      **Not resolvable by editing ADR-0019** — it is frozen, and ADR-0034 makes it a historical
      record of the decision as taken, wrong premise included. The resolution is: correct OQ-050
      (mutable, done 2026-08-17), and carry the corrected figures wherever the true-up is
      eventually specified — erp-spec#38, which holds the `labor_variance` posting rule and the
      rule-8a survey it owes. ⚠️ **The true-up's SIZING must come from this hotspot, not from
      ADR-0019's body.**
      ⚠️ **And it is sized from ONE observed rate per run, not from a component model** (owner,
      2026-08-17). The spec records what the EOR charged and that the charge drifts within a season;
      it does not carry FUTA, SUTA or FICA, because CFS does not compute them. The component
      arithmetic is kept as append-only evidence in case the charter's payroll non-goal is ever
      revisited — which would be an ADR, not an amendment.

  - id: HOT-019
    headline: "ADR-0025's mechanism is refused by a gate"
    statement: >-
      `adr/ADR-0025` — `proposed` — decides that _"Each entry in `ledger/chart-of-accounts.yaml`
      carries an explicit `dimensions:` list — the dimensions a posting to it must carry"_, and
      amends REQ-LED-001 so that _"a posting to an account whose `dimensions` list names a dimension
      must DECLARE it"_. **`ADR-0036` — ACCEPTED 2026-08-16, superseding ADR-0018 — decides the
      opposite**: _"`product_line` and `cost_type` are **not** posting fields. The product-line view
      is derived at report time… `ledger/dimensions.yaml` describes a **reporting** taxonomy, not a
      ledger one."_ ⚠️ **And it executes.** `tools/validate.ts` FAILS on any account carrying a
      `dimensions` key, naming ADR-0036 in the message; measured 2026-08-20, **zero of 143 chart
      entries carry one**. Enacting ADR-0025 as written turns CI red.
    contexts: [ledger, billing]
    why_it_matters: >-
      ⚠️ **This is not a stale citation, it is a decision that cannot be enacted.** ADR-0025 is the
      instrument that was to resolve HOT-011 and answer OQ-021, OQ-022 and OQ-025 — all four of
      which are already resolved or answered — so the ADR is simultaneously the record of settled
      rulings and a mechanism the repo has since forbidden.
      ⚠️ **Of its four decision clauses, only one is both live and undecided.** The per-account
      `dimensions:` list is refused by the gate; `Other`'s deletion was enacted by OQ-022 rather
      than by this ADR; the REQ-LED-001 amendment is dead as stated because postings carry no
      dimension to declare; and the `product_line: null` vs `4800 - Other Income` distinction
      survives in substance while its phrasing ("a dimensioned account") does not.
      ⇒ **Nothing detected this.** `validate.ts` mentions supersession 36 times — gate 6 for
      symmetry, gate 14 to freeze bodies, and erp-spec#18 so the acceptance fields cannot be
      forgotten — and **never asks whether a `proposed` ADR rests on a `superseded` one**. ADR-0036
      was the FIRST supersession declared from a `proposed` ADR, so it exercised the declare-and-
      enact path and not the notify-the-dependents path, which still does not exist. Two other
      proposed ADRs name ADR-0018 the same way: ADR-0020, whose Y-statement premise ("a new ledger
      where that dimension is not nullable") no longer holds, and ADR-0029, which is REINFORCED
      because ADR-0036 preserved the half it relies on.
      ⚠️ **The 2026-08-20 rule 8a survey found the rule is defensible but pointed at the wrong
      field.** The criterion running through all five ERPs is not "was this classified" but "can the
      book still be tied out if this is missing" — which endorses ADR-0036's derive-at-report-time
      for `product_line`, and endorses the declare-or-be-rejected obligation sitting on
      **`causal_orders`**, a key that must tie out.
      ⚠️ **CORRECTED 2026-08-22 — this hotspot and the survey both named the wrong owner.** Both
      said ADR-0029 "already requires" `causal_orders` on every posting. **ADR-0029's body does not
      contain the string.** The owners are **ADR-0036** (accepted 2026-08-16, absorbing HOT-014 —
      "That requirement is now this ADR's decision") and **REQ-LED-001**, restated the same day. It
      executes: 24 `causal_orders` declarations in `ledger/posting-rules.yaml` with golden vectors
      on all three arms. ⇒ **There is nothing to "move" — the obligation is already in force, and
      what the survey delivers is CONFIRMATION of an existing rule rather than a proposal.** Full
      note:
      `inbox/2026-08-22-correction-the-causal-orders-obligation-is-adr-0036s-decision-not-adr-0029s-and-two-artifacts-carried-the-wrong-owner.md`.
    evidence: >-
      `inbox/2026-08-20-superseding-adr-0018-invalidated-the-foundations-of-three-proposed-adrs-and-nothing-detected-it.md`
      — the supersession chain and the population, measured. ·
      `inbox/2026-08-20-survey-every-system-puts-not-applicable-on-the-account-never-on-the-posting-and-the-criterion-is-tie-out-not-classification.md`
      — the six-reference survey, which also measured that **no surveyed system lets a POSTING
      declare "not applicable"**; every escape hatch sits on the account or the scope. ·
      `code:2026-08-20:erp-spec@91be529:tools/validate.ts` — the gate that refuses the key.
    blocks: [ADR-0025]
    status: resolved
    resolved_by: ADR-0025
    measured: >-
      **Resolved 2026-08-22 by narrowing ADR-0025 to its one surviving clause** (owner's choice of
      the three routes; `proposed`, so amendable freely under ADR-0034). The refused per-account
      `dimensions:` list is gone, so nothing in the ADR turns CI red.
      ⭐ **THE FINDING: with the misattribution corrected, three of ADR-0025's four decision clauses
      turned out to be dead or already-enacted, and the fourth had been invisible.** The per-account
      list is refused by a gate; `Other`'s deletion was enacted by OQ-022; the declare-or-be-rejected
      rule is ADR-0036's and already executes. **What remains is the `4800 - Other Income` vs
      operating-revenue account boundary — alive, undecided, decided in no other ADR, and already
      leaned on in five places in `ledger/chart-of-accounts.yaml`.** The route this hotspot
      originally recommended ("move the obligation to `causal_orders`") would have had a `proposed`
      ADR re-decide an `accepted` one and left the 4800 boundary unhoused.
      ⇒ **The ADR is retitled to what it actually decides** and `resolution_shape`'s third route —
      withdraw in favour of a new narrow ADR — was refused on measured cost: **five IMMUTABLE ADRs
      cite ADR-0025** (0029, 0031, 0034, 0035, 0038) and can never be updated, so withdrawal would
      leave five permanent citations pointing at a rejected decision. **Same shape as the refused
      `ledger/dimensions.yaml` move.**
      ⚠️ **The survey's finding survived the narrowing, as this hotspot required**: CFS is still the
      only surveyed system where a posting may declare "no value applies" — recorded as a
      Consequence, on `causal_orders` where it actually lives — and **$688.00 still measures the
      operators who DECLINED, never the ones who GUESSED.** That figure's own ownership is
      unassigned across seven live files and is filed as deferred work.
      ⚠️ **The gate this hotspot asked for is still owed** — a `proposed` ADR whose `relates_to`
      names a `superseded` ADR, as a WARNING not a failure. **erp-spec#40**, still open, and today's
      corrections do not remove the need: nothing detected any of this.
    resolution_shape: >-
      **ADR-0025 is `proposed`, so it may be amended freely** — immutability bites only at
      `accepted` (ADR-0034), and ADR-0032 is the precedent for substantial amendment while proposed.
      Three routes, and the choice is the owner's: redraft ADR-0025 onto the surviving question with
      the obligation moved to `causal_orders`; split it, keeping the `4800` / declared-null half and
      dropping the per-account list; or withdraw it in favour of a new narrow ADR, since the rulings
      it was to record (HOT-011, OQ-021, OQ-022, OQ-025) have all landed by other instruments
      already.
      ⚠️ **Whichever route is taken, the survey's finding must survive it**: CFS would be the only
      system in the survey where a posting can say "I considered this and no value applies", and
      **$688.00 measures the operators who DECLINED, never the ones who GUESSED.**
      ⚠️ **And a gate is owed** — a `proposed` ADR whose `relates_to` names a `superseded` ADR,
      reported as a WARNING rather than a failure, because ADR-0029 cites ADR-0018 correctly and a
      failing check would be wrong one time in three.

  - id: HOT-020
    headline: "ADR-0020 restates a field the migration drops"
    statement: >-
      `adr/ADR-0020` — `proposed` — faces _"a new ledger where that dimension **is not nullable**"_
      and decides _"**Restate all.** Apply the mapping to every undimensioned line before import."_
      **Both halves are void.** `ADR-0036` (ACCEPTED 2026-08-16, superseding ADR-0018) makes
      `product_line` **not a posting field at all** — nullable or otherwise — and
      `migration/field-map.yaml` already sets `items[].tracking_category` to
      **`disposition: drop`**. ⇒ **The Decision describes an operation on a field the migration does
      not carry, to satisfy a constraint that no longer exists.**
    contexts: [ledger, billing]
    why_it_matters: >-
      ⚠️ **Accepting it would freeze the contradiction permanently.** A body freezes at acceptance
      (ADR-0034, gate 14), and ADR-0020 now cites a 2026-08-20 survey that concludes its own premise
      is void. **Citing evidence against yourself and then freezing is worse than either alone.**
      ⚠️ **The restatement is RELOCATED, not removed.** If the product line is derived at report
      time by joining line identity to the product master, what must be categorised is the
      **master** — which `api-cloudrun#473` already repaired on 2026-08-10, collapsing the
      population from 383 lines / $485,821.72 to **$688.00** of genuine operator non-classification.
      **The $688.00 is not the decision. The 128 custom lines with no product master are** — they
      have nothing to derive from, and `OQ-025` plus `reporting/product-line-pl.yaml` already hold
      the house pattern: a declared null, shown on its own row.
      ⚠️ **Two figures in the ADR and its neighbours are wrong, and one is load-bearing.** The
      "~90% behind the 2025-12-31 lock" figure, which appears undated in four live places, measures
      **80.04% of invoices** and ~**73.6–76.6% of lines** (`ADR-0020/M3`). And `charter.md`'s "unrepairable" is a
      **policy claim wearing a mechanical one** — a period lock is a setting, not a physical
      impossibility. Neither changes the direction of the decision; both change how it reads.
      ✅ **What the survey ADDS rather than removes**: the migration delta, previously called
      unmeasurable, is **$231,796.26 — 106 lines, 15.66% of pre-lock revenue, untracked in BOTH (`ADR-0020/M1`)
      systems**. And ADR-0020's own 13.90% is gone: lines where CFS holds a category and Xero does
      not are **7 / $1,700.00** (`ADR-0020/M4`), none since 2024-10-07 — so **Xero's tracking-sliced P&L for closed
      periods is substantially complete**, and there IS a report to diverge from, which the ADR
      assumed away.
    evidence: >-
      `inbox/2026-08-20-survey-it-is-a-recast-not-a-restatement-and-the-migration-delta-is-231796-in-lines-untracked-by-both-systems.md`
      — the six-reference survey, the delta measured over all 814 pre-lock invoices at 100%
      coverage. ·
      `inbox/2026-08-20-superseding-adr-0018-invalidated-the-foundations-of-three-proposed-adrs-and-nothing-detected-it.md`
      — the supersession chain. · `migration/field-map.yaml`, `items[].tracking_category`.
    blocks: [ADR-0020]
    status: resolved
    resolved_by: ADR-0020
    measured: >-
      **Resolved 2026-08-22 by redrafting ADR-0020, which is `proposed` and so may be amended
      freely** (ADR-0034; ADR-0032 is the precedent). Both void halves are gone: the Y-statement no
      longer faces "a dimension that is not nullable", and the Decision no longer operates on a
      field the migration drops. **The new Decision is neither of the ADR's two options** — derive
      the product line from the product master, and record an explicit null where there is nothing
      to derive from.
      ✅ **The load-bearing premise is DISCHARGED, not assumed.** The owner ruled 2026-08-22 that a
      tracking category was on no externally filed document
      (`inbox/2026-08-22-owner-a-tracking-category-was-on-no-externally-filed-document-so-the-recast-is-owed-to-nobody.md`),
      which is what lets the six criteria collapse to two with CFS failing neither, and what makes
      the migration delta cost nothing. It is typed as `ADR-0020/P1` so that a future falsification
      has something to attach to.
      ⭐ **THE FINDING THIS ONE TURNED UP: the migration spec had already decided it.**
      `migration/field-map.yaml` sets `items[].tracking_category` to `disposition: drop` AND
      describes the products collection as "the authority the invoice line's tracking denorm is
      dropped in favour of". **Derive-from-the-master was encoded in three places while the ADR
      still said "restate all".** The ADR was not proposing something the repo had declined to do —
      **it had simply stopped tracking what the repo already did**, and nothing compares an ADR's
      Decision against the migration spec that implements it.
      ⚠️ **Two figures were corrected on the way, and both were quoted in more places than they were
      sourced.** The undated "~90% behind the lock" is **80.04% of invoices** (`ADR-0020/M3`), and
      the 13.90% CFS-ahead-of-Xero figure is replaced by **7 lines / $1,700.00** (`ADR-0020/M4`) —
      the divergence runs the OTHER way, 151 lines / $19,350.96 (`ADR-0020/M5`, api-cloudrun#597).
      ⚠️ **And the population figure in this hotspot's own text was stale**: `128 / $233,667.63` is
      the 2026-08-10 measurement; re-measured 2026-08-16 it is **130 / $233,610.63**
      (`ADR-0020/M2`). The money is flat and the denominator grew.
      ⇒ **All five figures are now typed as `measurements:` under gate 21, and gate 22 immediately
      found four live files quoting them without citing an owner.** That is the gate working: a
      figure this ADR owns can no longer drift in `hotspots.yaml`, `ledger/dimensions.yaml` or
      `reporting/product-line-pl.yaml` without CI going red.
    resolution_shape: >-
      **ADR-0020 is `proposed` and may be amended freely** (ADR-0034; ADR-0032 is the precedent for
      substantial amendment while proposed). The survey's recommendation is **neither of the ADR's
      two options**: derive the product line from the product master, and declare a null where there
      is nothing to derive from.
      ⭐ **And GAAP already supplies the vocabulary this ADR is missing.** ASU 2023-07 **BC83**
      records that FASB replaced "restatement" with **"recast"** throughout Topic 280 precisely
      because Topic 250 reserves "restatement" for correcting an **error**. What ADR-0020 describes
      is a recast; the disclosure owed is ASC 205-10-50-1, and ASC 280 binds public entities only.
      ⚠️ **One load-bearing premise is unmeasurable from documentation and needs the owner**: that a
      tracking category was on no externally filed document. The six references' criteria collapse
      to two — _was it published_, and _what would the write fail to reach_ — and CFS fails neither,
      **but only if that premise holds.**

  - id: HOT-021
    headline: "ADR-0029 opens on a claim its survey refutes"
    statement: >-
      `adr/ADR-0029` — `proposed` — opens its Context with _"**Allocation is destructive; grouping
      is not.** … An allocated posting cannot be un-allocated — the fact that the cost was
      _delivery_ is gone from the ledger."_ **The rule 8a survey it now cites refutes this as
      stated.** SAP `distribution` keeps the grain while posting; `overhead allocation` destroys it;
      SAP forces the choice per cycle. NetSuite's credit-account mode and Sage Intacct's segregated
      book each keep both grains while posting. ⇒ **Destructiveness is a property of one
      implementation choice, not of allocation.**
    contexts: [ledger, billing, fulfillment]
    why_it_matters: >-
      ⚠️ **Same grounds as HOT-019 and HOT-020, and opened for the same reason: accepting it would
      freeze the contradiction permanently.** A body freezes at acceptance (ADR-0034, gate 14), and
      ADR-0029 cites a survey whose opening finding is that ADR-0029's opening claim is false.
      **Citing evidence against yourself and then freezing is worse than either alone.**
      ⚠️ **The DECISION is not in doubt — the ARGUMENT for it is.** The survey found three of five
      systems post allocations, two have no engine, and **none derives at report time**, so ADR-0029
      departs from every reference that has the feature. It survives on a better argument the ADR
      does not currently make: **a number whose correctness depends on a basis ADR-0031 itself calls
      the weakest defensible tier should not be given a document number.** That is SAP's own second
      criterion. ✅ And it has a production precedent nobody had cited — **Deltek Vision**, whose
      overhead allocation "does not impact the general ledger… they are not posted to the database",
      with year-to-date recomputation giving it the same idempotence as `sealed_at_close: false`.
      ⭐ **The option ADR-0029 never considers is the one they all implement: nobody keeps
      allocations out of the LEDGER — they keep them out of the STATEMENTS.** SAP's `S Secondary
      Costs` account type, Intacct's mandatory allocation book, NetSuite's contra credit. Three
      implementations of one idea, and ADR-0029 has no Considered Options section at all.
      ⚠️ **And GAAP's hook is a BILL, not a free pass.** ASC 280-10-50-27 never mentions posting —
      the test is membership of the measure the CODM actually uses — but 50-29(b)/(d)/(e) demand the
      policy, quantified method changes and asymmetrical allocations, and **50-30 requires
      reconciliation to the consolidated totals.** ADR-0031's `basis_version` and
      `sealed_at_close: false` satisfy the first three by construction. **The reconciliation is
      stated nowhere in the reporting spec** — and it is the one that makes the un-allocated view
      load-bearing rather than merely available. ⚠️ ASC 280 exempts nonpublic entities, so this is a
      criterion for CFS rather than a requirement.
    evidence: >-
      `inbox/2026-08-20-survey-nobody-keeps-allocations-out-of-the-ledger-they-keep-them-out-of-the-statements.md`
      — the six-reference survey. ASC 280 extracted locally with `pdftotext` from RSM's reproduction
      of the Codification text rather than through a summarizing fetch; Xero measured against its
      own OpenAPI contract (**139 of 139** uses of `allocat*` are settlement, not cost allocation);
      Odoo read from source. ·
      `adr/ADR-0029-the-ledger-records-unallocated-facts.md:28` — the refuted claim.
    blocks: [ADR-0029]
    status: resolved
    resolved_by: ADR-0029
    measured: >-
      **Resolved 2026-08-22 by amending ADR-0029**, which is `proposed` and so may be amended freely
      (ADR-0034). Three changes, and the decision itself is untouched: the opening claim is restated
      as the true narrower one; a **Considered options** section is added carrying the
      keep-it-out-of-the-statements family the ADR had never considered; and the ASC 280-10-50-30
      reconciliation obligation is recorded as a Consequence.
      ⚠️ **OPENED AND RESOLVED IN THE SAME SESSION, deliberately.** The last session stopped at two
      hotspots because a third read as inflation. **The record is the point** — HOT-019 and HOT-020
      both show that a `proposed` ADR resting on a claim known false is invisible to every gate, and
      a third instance is what makes it a pattern rather than two anecdotes. All three trace to the
      same cause: **ADR-0036's supersession of ADR-0018 moved the ground under three proposed ADRs
      and nothing detected it** (erp-spec#40, still open).
      ⚠️ **ONE PART IS NOT RESOLVED HERE AND IS NOT PRETENDED TO BE.** The ASC 280-10-50-30
      reconciliation is recorded in ADR-0029 as an obligation, but **making the reporting spec
      actually express it is work in `reporting/`, not a line in an ADR** — and per the survey it is
      the requirement that makes the un-allocated view load-bearing. Filed as deferred work rather
      than left in this hotspot's prose.
    resolution_shape: >-
      **ADR-0029 is `proposed` and may be amended freely.** The decision stands; what changes is the
      argument. Restate the opening claim to the true narrower one — destructiveness is a property
      of the primitive chosen, not of allocation — and replace it as the load-bearing reason with
      the document-number argument (a number resting on ADR-0031's weakest defensible basis tier
      should not get a document number), citing Deltek Vision as production precedent. Add the
      Considered options the survey names. Record the ASC 280 reconciliation bill.

  - id: HOT-022
    headline: "ADR-0015 relies on the mechanism the model refutes"
    statement: >-
      `adr/ADR-0015:61` — `proposed` — says _"**The two-phase timeout is the compensation mechanism
      SPIKE-002 already needs.** An orphaned pending transfer expires on its own, which is the
      recovery path for a crash between the TigerBeetle pending and the MongoDB write."_
      **`formal/two-store-commit.qnt` proves that mechanism unsafe, and has since 2026-08-09.** Its
      `naive_sweeper` companion models a recovery process that voids a pending transfer on timeout
      **without reading Mongo**, and its invariant FAILS. ⚠️ **TigerBeetle's built-in expiry IS that
      process** — blind by construction, consulting nothing. ⇒ **ADR-0015 proposes to rely on
      precisely the thing the formal spec exists to refuse.**
    contexts: [availability, fulfillment, ledger]
    why_it_matters: >-
      ⭐ **PROVEN, not argued.** A third module — `expiring_timeout`, added 2026-08-22 — is the
      protocol AS SPECIFIED plus TigerBeetle's real `Transfer.timeout`. Its invariant fails under
      both randomised simulation and Apalache, and the counterexample is **three steps long with
      `dead: false` throughout**: `reserve → writeDoc → expire`. ⚠️ **NO CRASH IS REQUIRED.** This is
      not a crash-interleaving bug — it is a plain race between the writer and the clock. A writer
      merely slower than the timeout leaves a durable MongoDB document behind a transfer that
      TigerBeetle has already expired and that can never be posted.
      ⚠️ **The result code is real and pinned**: `pending_transfer_expired = 35` in
      `tigerbeetle-node@0.17.9`'s own `bindings.d.ts`, alongside `pending_transfer_already_posted`
      and `pending_transfer_already_voided`. Upstream is explicit: _"If the timeout interval passes
      before the transfer is either posted or voided, the transfer expires and the full amount is
      returned to the original account."_ **TigerBeetle does it itself and cannot be asked not to
      once `timeout > 0`.**
      ⇒ **The protocol module silently assumes `timeout = 0` and never says so.** Its `TbState` has
      no expired state, so the interleaving was not merely unchecked — **it was unrepresentable.**
      A model that cannot express a failure reports no violation, and that is indistinguishable from
      a model that ruled it out. **The spec was green for thirteen days on a case it could not see.**
      ⚠️ **And it makes exit criterion 3 load-bearing rather than tidy.** SPIKE-002 owes "orphan
      detection and resolution, **including its time bound**". The time bound is not documentation —
      it decides which of two mutually exclusive designs is in force, and ADR-0015 and the formal
      spec currently hold opposite ones.
    evidence: >-
      `code:2026-08-22:erp-spec@2ba3636:formal/two-store-commit.qnt` — module `expiring_timeout`,
      landed RED and reproduced two ways (simulation 20,000 traces × 20 steps; Apalache bounded
      verification, quint 0.32.0, both 2026-08-22). ·
      `code:2026-08-22:tigerbeetle-node@0.17.9:dist/bindings.d.ts` — `pending_transfer_expired = 35`,
      and `Transfer.timeout` is a real field. ·
      `code:2026-08-22:.claude/docs/tigerbeetle.txt` — "Expire Pending Transfer" and "a pending
      transfer can only be posted or voided once". · `adr/ADR-0015-reservations-as-pending-transfers.md:61`.
    blocks: [ADR-0015, SPIKE-002]
    status: resolved
    resolved_by: ADR-0042
    measured: >-
      **RULED BY THE OWNER 2026-08-22: `timeout = 0`, the sweeper is the sole resolver.** Recorded as
      ADR-0042 (`proposed`), and ADR-0015's compensation bullet is AMENDED rather than superseded —
      it is `proposed`, and only that one bullet was wrong; the two-phase mapping, the
      operational-window scoping and the interval-math argument all stand.
      ⭐ **THE RULING IMMEDIATELY EXPOSED A SECOND UNREPRESENTABLE CASE, and it is the bigger one.**
      With TigerBeetle's expiry refused, the sweeper is the only resolver — so the question
      `two_store_commit` never asks becomes the whole problem: **how does the sweeper FIND an
      orphan?** The model lets recovery fire out of nowhere, so nothing could show discovery
      failing.
      ⚠️ **It cannot come from TigerBeetle.** `QueryFilter` carries **no predicate for
      `flags.pending` and none for `pending_id`** — measured against the client's own
      `bindings.d.ts` — so "list unresolved pending transfers" is not a question the ledger can
      answer. `ledger/tigerbeetle-accounts.yaml` owns the query surface and already records what IS
      filterable; this is the consequence, not a restatement.
      ⚠️ **And MongoDB cannot help in the window that matters**, because the protocol writes the
      document AFTER the reserve. A fourth module, `undiscoverable_orphan`, fails in **two steps** —
      `reserve → crash` — leaving a pending transfer holding stock that neither store can find.
      ✅ **Fixed and verified**: a fifth module, `intent_first`, writes an intent record BEFORE the
      reserve and clears it only once the transfer settles. It holds under simulation and Apalache,
      and is a **minimal pair** against `undiscoverable_orphan` — same invariant, and the only
      difference is the write ordering.
      ⇒ **Both defects were UNREPRESENTABLE before they were refuted**, which is why all five
      modules stay in the file permanently: two must keep holding, three must keep failing. **A
      model that cannot express a failure reports no violation, and that is indistinguishable from
      one that ruled the case out.**
      ⚠️ **The trade is now explicit and is ours to meet.** TigerBeetle offered to bound the orphan
      and we refused because its offer is unsafe, so `T_resolve` and its orphan-age metric are not
      extras — they stand in for the mechanism we declined.
    resolution_shape: >-
      **ADR-0015 is `proposed`, so it may be amended freely** (ADR-0034). The contradiction is
      recorded rather than silently resolved because **the two readings are different designs, not
      different wordings**, and the choice is the owner's:
      · **`timeout = 0` — the application sweeper is the only resolver.** What the protocol module
        already specifies and verifies: recovery READS Mongo, then posts or voids. Safe, and it makes
        the time bound the SWEEPER's — which must then be a stated SLO with a monitored orphan-age
        metric, because TigerBeetle's own warning ("reserved funds are not held in limbo
        indefinitely") is real and nothing else answers it.
      · **`timeout > 0` — TigerBeetle is a backstop behind the sweeper.** Requires the timeout to
        exceed the sweeper's worst-case latency by a stated margin, AND an answer for what happens
        when the backstop does fire, because that state is the proven-unsafe one. ⚠️ **A backstop
        that is unsafe when it fires is not a backstop.**
      · **Make the document write compensatable**, so expiry is survivable: recovery that finds an
        expired transfer retracts the document instead of posting. ⚠️ Note what this costs — an
        order document a user has already seen can vanish, which is a product decision rather than a
        protocol one.
      ⚠️ **Whichever is chosen, the model must gain the expired state permanently.** The defect was
      not a wrong answer, it was an unrepresentable question, and re-representing it is what stops
      the next reader believing the green run means more than it does.

  - id: HOT-023
    headline: "the depreciation scope omits a mandatory convention"
    statement: >-
      Four artifacts enumerate the rules surface SPIKE-005 must cover, and they disagree.
      `adr/ADR-0007:43` (**accepted**), `spikes/SPIKE-005` exit criterion 1, and
      `contexts/fixed-assets/requirements.yaml:13` all name **two** conventions — mid-month and
      half-year. `contexts/fixed-assets/requirements.yaml:52` (REQ-FA-002) names **three**, adding
      **mid-quarter**. ⚠️ **The lone dissenter is right, and not as a preference**: IRS Publication
      946 (2025) L2326 says _"**Use** this convention if the mid-month convention does not apply
      and the total depreciable bases of MACRS property you placed in service during the last 3
      months of the tax year … are **more than 40%** of the total depreciable bases of all MACRS
      property you placed in service during the entire year."_ **There is no election.**
    contexts: [fixed-assets, ledger]
    why_it_matters: >-
      ⭐ **AN ASSET'S CONVENTION IS NOT A PROPERTY OF THE ASSET, and that reaches the schema.** The
      40% test is computed over everything placed in service in the ENTIRE tax year, so it cannot be
      resolved when an asset is acquired — only once the year closes. **A single late-December
      purchase retroactively changes the convention, and therefore the first-year deduction, of
      every personal-property asset placed in service earlier that same year.** Pub 946 works
      exactly that case with the dollars stated (L2628-2663): a machine placed in **January** takes
      the mid-quarter convention because of a computer bought in October.
      ⇒ **An engine that resolves convention at acquisition is wrong, and wrong SILENTLY** — every
      figure it produces is plausible. A per-asset schedule modelled as a pure function of the asset
      is structurally wrong whichever engine computes it.
      ⚠️ **The test's EXCLUSIONS are load-bearing too.** Real property is excluded from the
      numerator *and* the denominator, so a ratio computed over "everything placed in service" is
      wrong for any taxpayer holding buildings — and CFS holds `1600 Buildings` and
      `1603 Building Improvements`.
      ⚠️ **A SECOND gap, named by none of the four artifacts: listed property and §280F.** CFS holds
      `1700 Vehicles`; passenger automobiles carry §280F caps and a drop in business-use percentage
      triggers recapture (Pub 946 L3867 works it, at $4,018 of excess depreciation). Vehicles over
      6,000 lb GVWR are treated differently, which for a rental house's box trucks is the ordinary
      case. **ADR-0030 already moved vehicle cost into COGS**, so this is not a hypothetical corner.
      ⇒ **The pattern is the enumeration being SHORT, not wrong** — the same shape as erp-spec#41,
      where SPIKE-011 was scoped narrower than the decision depending on it. **A scope list is a
      coverage claim, and nothing was checking this one.** Now something does: the coverage arm of
      `deno task dep-corpus` asserts every named facet is exercised, and it is currently RED.
    evidence: >-
      `inbox/2026-08-22-spike-005s-convention-list-is-short-by-one-and-mid-quarter-is-mandatory-not-optional.md`
      — the full finding, with the verbatim rule and the worked example. · IRS Publication 946
      (2025), Cat. No. 13081F, dated 2026-03-13, **extracted locally with `pdftotext -layout`** on
      2026-08-22 rather than through a summarizing fetch. ·
      `code:2026-08-22:erp-spec@76bb601:spikes/harness/depreciation-corpus.yaml` — DEP-002 encodes
      the retroactive case and DEP-003 the four quarter tables. ·
      `contexts/fixed-assets/requirements.yaml:13` against `:52`, in one file.
    blocks: [SPIKE-005]
    status: resolved
    resolved_by: SPIKE-005
    measured: >-
      **Resolved 2026-08-22 by covering both omissions and correcting the two mutable
      enumerations.** `spikes/harness/depreciation-corpus.yaml` now covers mid-quarter (DEP-002,
      DEP-003, DEP-004) and §280F (DEP-011), and `deno task dep-corpus` runs **10 arms, all green,
      including the coverage arm that was RED when it was written**. It went green by adding data,
      which is the correct direction.
      **`contexts/fixed-assets/requirements.yaml` and SPIKE-005's exit criterion are corrected**;
      `ADR-0007` is left exactly as written — accepted, immutable, a historical record of the
      decision as taken (ADR-0034 row 4) — and the requirements banner now **quotes it accurately
      and flags the omission beneath**, rather than silently widening a frozen quotation.
      ⚠️ **THE §280F SCOPE CALL WAS MADE ON A PREMISE THE OWNER THEN CORRECTED, AND THE CORRECTION
      IS THE LESSON.** It was first scoped OUT on a measured population of two vehicles used
      exclusively for revenue work — "measure the population before minting a branch", applied
      correctly to a static fleet. **Owner, 2026-08-22: "we do expect to acquire more vehicles."**
      ⇒ **A population measured today is not a population, it is a snapshot.** The argument was
      sound and the premise was wrong, which is the harder failure to notice: nothing about the
      reasoning looked weak.
      ⭐ **And the primary source settled it independently of the fleet size anyway.** Pub 946: _"The
      depreciation deduction, **including the section 179 deduction and special depreciation
      allowance**, you can claim for a passenger automobile each year is limited."_ **§280F is a
      CEILING on the very figure this spike's engine computes**, so it could never have been a
      separate spike — a candidate either applies it to the combined number or returns one that is
      too large and entirely plausible.
      ⇒ **No spike was minted.** What survives as a question is a POLICY, not research — `OQ-054`,
      reframed from "what is the GVWR of the two vans" to "does the acquisition policy admit
      sub-6,000 lb vehicles, and will exclusivity hold" — and asked **per vehicle**, because two
      vans can straddle the threshold and one fleet-level answer hides it.
      ⚠️ **One second-order effect worth carrying to the next purchase:** a vehicle is a large-basis
      asset, so **a Q4 vehicle purchase is the single most likely trigger of the 40% test**, which
      retroactively re-computes every personal-property asset placed in service earlier that year.
      **The timing of a vehicle purchase is a tax decision, not only a fleet one.**
    resolution_shape: >-
      **The practical gap is already closed** — the corpus covers mid-quarter regardless of what the
      enumeration says. What is open is the recorded SCOPE, and it needs the owner because widening
      it touches an `accepted` ADR's scope statement.
      · **`contexts/fixed-assets/requirements.yaml:13` and `spikes/SPIKE-005`'s exit criterion are
        MUTABLE and can simply be corrected** to name mid-quarter and listed property.
      · **`ADR-0007` is accepted and immutable**, and this is ADR-0034 row 4 — "stands, but a fact
        it cited was wrong" — so it takes **no new ADR**: a dated inbox note (landed) plus this
        hotspot entry, and `relates_to` may gain ids because it is an index rather than a claim.
      ✅ **§280F RESOLVED 2026-08-22 BY MEASURING THE POPULATION FIRST — neither integrated nor
      spiked.** The owner was neutral on the scope question, so it was settled the repo's own way:
      *do not mint a branch before measuring its population.* **CFS owns exactly two vehicles**, both
      ruled 2026-08-16 to be used *exclusively* for delivery and trash removal.
      ⇒ **The recapture half — the expensive part, and the one that would have justified a spike —
      has a population of ZERO**, because recapture fires only when business use falls to 50% or
      less. Pub 946's worked recapture example describes a case CFS's own stated policy excludes.
      ⇒ **What survives is the §280F caps, and they reduce to ONE FACT**: is each van over 6,000 lb
      GVWR? Tracked as **`OQ-054`**, asked **per vehicle** rather than per fleet, because two vans
      can straddle the threshold and a single answer is the shape that hides it.
      ⚠️ **A spike was deliberately NOT minted.** A spike is for a question needing research; this
      one needs a door-jamb sticker. **And m4 requires every spike closed, so minting one for a
      lookup moves the milestone further away while gaining no evidence.**
      ⇒ **What is still open here is only the ENUMERATION** — the mutable artifacts should name
      mid-quarter, and ADR-0007 stays as written under ADR-0034 row 4.
