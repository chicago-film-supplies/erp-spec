# Allocation bases — the registry of ways a pooled amount may be spread over a base.
#
# A basis is VERSIONED, and a report pins `(id, version)`. That is not ceremony: a number must be
# traceable to the basis that produced it, and two bases must be runnable over the same period and
# compared. A basis that changed between runs would leave every individual run looking internally
# consistent while the series silently meant different things — the worst shape of wrong.
#
# ⚠️ **This paragraph justified versioning by ADR-0017's sealed-period guarantee — "a report over a
# sealed period must be reproducible". That premise is FALSE and is retracted 2026-08-16.** Owner:
# "there's no reason an ephemeral report would ever need to be sealed or locked… a p&l by product
# line or customer type is driven by a need for business intelligence, not compliance." ADR-0017
# seals the balance sheet and the account-level P&L; **neither carries a product line**, so nothing
# in this file is a sealed-period artifact and nothing here can make a closed period drift.
# **Re-running a closed period under a new basis is the POINT** — it is why allocation is a reporting
# act at all (ADR-0029, ADR-0036). Versioning is what makes the re-run legible, not what forbids it.
#
# ⚠️ **`criterion` is the field that keeps this honest.** Horngren's ranking is cause_and_effect >
# benefits_received > fairness > ability_to_bear, and a revenue basis is the LAST of those. Naming
# the tier in the data — rather than in prose nobody re-reads — is what stops "the basis we could
# compute" from quietly becoming "the basis that is right". Gate 13 refuses any basis below
# cause_and_effect that does not declare the driver it is standing in for.
#
# Adding a basis is cheap. REPLACING one is not: bump `version`, leave the old entry in place with
# `status: superseded`, and every historical report still resolves the basis that made it.

bases:
  - id: goods_revenue_on_causal_order
    version: 1
    status: active
    source: ADR-0031
    description: >-
      Spread the pool over the discounted revenue of the goods lines on the order that caused it,
      in proportion to `subtotal_discounted_minor`.
    criterion: ability_to_bear
    proxy_for: >-
      The physical movement the activity performed — weight, cubic volume or distance. Measured
      2026-08-09: `products.shipping.weight` is present on 531 of 549 products and **zero on all
      549**; height, width and length likewise; no order, destination or fulfillment record carries
      mileage or distance, and the only coordinates in the system live in an expiring geocode cache.
      The driver is not merely unchosen, it is uncaptured — so this basis is what remains, not what
      is best. See `inbox/2026-08-09-allocation-bases-measured-only-goods-revenue-survives.md`.
      ⚠️ **This basis has an expiry.** Owner 2026-08-09: the shipping specs will be populated this
      year. Because the allocation spreads ONE order's pool across THAT order's lines, only
      line-level facts can matter — distance, crew and drive time are order-level and cancel out
      entirely — so a populated weight-and-dimensions spec closes the cause-and-effect gap
      COMPLETELY rather than merely narrowing it. Which physical measure becomes v2, and the
      coverage precondition that must gate it, is OQ-033. Do not retire v1: historical periods have
      no physical data and must keep resolving the basis that produced them.
    scope: causal_order
    base: goods_line.subtotal_discounted_minor
    rounding: largest_remainder
    zero_base: unallocated_bucket
    note: >-
      **Scope is the ORDER, not the invoice** — ADR-0029's "the orders that caused them". Measured
      2026-08-09: 0 of 999 invoices bill more than one order and 969 carry exactly one, so the two
      scopes coincide on today's corpus and choosing the order costs nothing. It is the only scope
      that stays correct when a multi-order invoice first appears, and by then the reports it would
      change are already sealed.
      **`largest_remainder` is a decision, not a detail.** The shares must sum to the pool exactly;
      independent rounding of each share does not, and the residual cent has to land somewhere
      stated. Same discipline as OQ-018's pro-rata premium split, which put the rounding in the
      shift record rather than the posting rule.
      **A goods line with `product_line: null` is still part of the base.** It is goods that nobody
      categorised (ADR-0025 makes null a legal determination), and excluding it would concentrate
      the whole pool onto the tracked lines and overstate their absorbed cost. It reports in the
      null row.
