# Allocation bases — the registry of ways a pooled amount may be spread over a base.
#
# A basis is VERSIONED, and a report pins `(id, version)`. That is not ceremony: a number must be
# traceable to the basis that produced it, and two bases must be runnable over the same period and
# compared. A basis that changed between runs would leave every individual run looking internally
# consistent while the series silently meant different things — the worst shape of wrong.
#
# ⚠️ **This paragraph justified versioning by ADR-0017's sealed-period guarantee — "a report over a
# sealed period must be reproducible". That premise is FALSE and is retracted 2026-08-16.** Owner:
# "there's no reason an ephemeral report would ever need to be sealed or locked… a p&l by product
# line or customer type is driven by a need for business intelligence, not compliance." ADR-0017
# seals the balance sheet and the account-level P&L; **neither carries a product line**, so nothing
# in this file is a sealed-period artifact and nothing here can make a closed period drift.
# **Re-running a closed period under a new basis is the POINT** — it is why allocation is a reporting
# act at all (ADR-0029, ADR-0036). Versioning is what makes the re-run legible, not what forbids it.
#
# ⚠️ **`criterion` is the field that keeps this honest.** Horngren's ranking is cause_and_effect >
# benefits_received > fairness > ability_to_bear, and a revenue basis is the LAST of those. Naming
# the tier in the data — rather than in prose nobody re-reads — is what stops "the basis we could
# compute" from quietly becoming "the basis that is right". Gate 13 refuses any basis below
# cause_and_effect that does not declare the driver it is standing in for.
#
# Adding a basis is cheap. REPLACING one is not: bump `version`, leave the old entry in place with
# `status: superseded`, and every historical report still resolves the basis that made it.

bases:
  - id: goods_revenue_on_causal_order
    version: 1
    status: active
    source: ADR-0031
    description: >-
      Spread the pool over the discounted revenue of the goods lines on the order that caused it,
      in proportion to `subtotal_discounted_minor`.
    criterion: ability_to_bear
    proxy_for: >-
      The physical movement the activity performed — weight, cubic volume or distance. Measured
      2026-08-16 across all **567** products, identically on all four fields:
      **0 non-zero, 3 zero, 537 `null`, 27 with the block absent.** No order, destination or
      fulfillment record carries mileage or distance, and the only coordinates in the system live in an
      expiring geocode cache. The driver is not merely unchosen, it is uncaptured — so this basis is
      what remains, not what is best.
      ⚠️ **`null` versus `0` is load-bearing here and was not, before.** The 2026-08-09 reading
      (`inbox/2026-08-09-allocation-bases-measured-only-goods-revenue-survives.md`) recorded "present
      on 531 of 549 and zero on all 549 — the field is not missing, it is populated with zero". Today
      it is `null`: core#51 closed 2026-08-10 and the four dimensions are `z.number().nullable()`
      (`code:2026-08-16:core@3847366:src/schemas/product.ts`). So `0` now means "weighs nothing" and
      `null` means "nobody has weighed it", which is exactly what v2's coverage precondition has to be
      able to tell apart. The conclusion — no product carries a driver — is unchanged either way.
      ⚠️ **This basis has an expiry, and it is a trigger rather than a date.** Owner 2026-08-09: the
      shipping specs will be populated this year. Owner 2026-08-16: **weights will exist for MANY
      products by the time v2 is in dev** — so **partial population is the anticipated state**, which
      makes OQ-033's activation precondition v2's primary requirement rather than its hardening, and
      adds two things v2 must carry: the unallocated bucket read as a **coverage meter** with coverage
      reported beside it, and activation at a coverage **threshold** rather than at the first non-zero
      weight (`inbox/2026-08-16-owner-shipping-weight-will-exist-for-many-products-by-the-time-v2-is-in-dev.md`).
      Because the allocation spreads ONE order's pool across THAT order's lines, only line-level facts
      can matter — distance, crew and drive time are order-level and cancel out entirely — so a
      populated weight-and-dimensions spec closes the cause-and-effect gap COMPLETELY rather than
      merely narrowing it. Which physical measure becomes v2 is OQ-033. Do not retire v1: historical
      periods have no physical data and must keep resolving the basis that produced them.
      ✅ Re-measured on every `deno task allocation` run, which prints a ⚠️⚠️ the first time a non-zero
      value appears. A basis premise that flips unnoticed is how v1 outlives its own justification.
    scope: causal_order
    base: goods_line.subtotal_discounted_minor
    rounding: largest_remainder
    zero_base: unallocated_bucket
    note: >-
      **Scope is the ORDER, not the invoice** — ADR-0029's "the orders that caused them". Measured
      2026-08-16: **0 of 1,010 invoices bill more than one order** and 980 carry exactly one (0 of 999 /
      969 on 2026-08-09), so the two scopes coincide on today's corpus and choosing the order costs
      nothing. It is the only scope
      that stays correct when a multi-order invoice first appears.
      ⚠️ This clause continued "…and by then the reports it would change are already sealed", which is
      a residue of the sealed-period premise **this file's own header retracts as of 2026-08-16**. This
      report is never sealed; re-running it is the point. The scope argument does not need that crutch
      and stands on the sentence above.
      **`largest_remainder` is a decision, not a detail.** The shares must sum to the pool exactly;
      independent rounding of each share does not, and the residual cent has to land somewhere
      stated. Same discipline as OQ-018's pro-rata premium split, which put the rounding in the
      shift record rather than the posting rule.
      **A goods line with `product_line: null` is still part of the base.** It is goods that nobody
      categorised (ADR-0025 makes null a legal determination), and excluding it would concentrate
      the whole pool onto the tracked lines and overstate their absorbed cost. It reports in the
      null row. Re-measured 2026-08-16: **264 lines, $38,678.20, 2.25% of line revenue** sit on a goods
      account with no product line — 4200 $21,716.14 / 36 lines, 4000 $10,671.16 / 220, 4210 $6,290.90
      / 8. (2026-08-09: 143 lines / $67,156 / 4.0%. The lines nearly doubled while the money nearly
      halved — api-cloudrun#473's repair took the large categorised lines out and the `Other`
      retirement put ~135 small ones in.) Emphatically not a hypothetical population.
