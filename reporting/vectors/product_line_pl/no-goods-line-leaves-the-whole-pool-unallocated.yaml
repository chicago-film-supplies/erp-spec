# The degenerate case, and the one this whole bucket exists for.
#
# An order carrying delivery revenue and NO goods line has no denominator under any basis.
# Re-measured 2026-08-16, under the base this spec states (null-product-line goods included, voids
# excluded): **12 order-groups, $11,400.00 — 4.94% of ex-void delivery revenue.** Invoice 1856 is still
# the largest at $3,250.00.
#
# ✅ **This block predicted the population "may collapse". It did not — it GREW, and the specific case
# it named did not move.** The five Netflix Duradeck orders were said to carry `Surface Protection` at
# the product master and therefore to gain a denominator after api-cloudrun#473. Measured:
# `products/kqzVClx5uJrJ07bEjokX.tracking_category_name` is **`"Delivery"`** — it is the install /
# tear-out / relocate LABOUR, not the deck — and all 15 lines across the five invoices are `Delivery`
# at both the line and the master, with no goods line anywhere. They are still 85.5% of the bucket.
# (`inbox/2026-08-16-correction-the-duradeck-retraction-reasoned-from-a-product-name.md`)
# The VECTOR was retained regardless, and correctly: a zero base must produce a row rather than a NaN,
# a spread or a silent drop, and that is a rule about arithmetic rather than about frequency.
#
# The failure mode this pins is silent absorption: an implementation that divides by a zero base and
# gets NaN, or that "helpfully" spreads the pool evenly across all product lines, or that drops the
# pool and still balances because nothing was expecting it. All three look fine on a green run.
name: no-goods-line-leaves-the-whole-pool-unallocated
