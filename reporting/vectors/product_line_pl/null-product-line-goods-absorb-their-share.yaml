# A goods line carrying `product_line: null` is part of the BASE and absorbs its share.
#
# ADR-0025 makes null a legal determination rather than an absence: "no tracked value applies" is a
# decision, countable and reportable, and it is what REQ-LED-001 refuses to let degrade into a
# missing key. So a rental line whose product line nobody set is still goods that was still
# delivered.
#
# The failure mode: excluding null from the base concentrates the entire pool onto the tracked lines
# and overstates their absorbed cost. Re-measured 2026-08-16, **264 lines / $38,678.20 / 2.25% of line
# revenue** sit on rental, retail and replacement accounts with no product line set — 4200 $21,716.14,
# 4000 $10,671.16, 4210 $6,290.90 — so this is not a hypothetical population.
# ⚠️ It was 143 lines / $67,156 / 4.0% on 2026-08-09. The LINES nearly doubled while the MONEY nearly
# halved, and both moves are explained: api-cloudrun#473's repair took the large categorised lines out
# of this population, and the `Other` retirement put ~135 small ones in. The vector's argument is
# unaffected by either — it turns on null being a determination, not on the size.
#
# Note the share reports UNDER null. It is a row on the report, not a line to be redistributed:
# guessing which tracked line it "really" belongs to would be inventing the dimension the ledger
# deliberately refused to invent.
name: null-product-line-goods-absorb-their-share
report: product_line_pl
basis: goods_revenue_on_causal_order
basis_version: 1
kind: accept
source: "api:2026-08-16:firestore invoices via spikes/harness/product-line-matrix-probe.ts — 264 goods-account lines, $38,678.20, carrying no product line"

given:
  pool_minor: 40000 # $400.00 delivery
  goods:
    - { product_line: Wardrobe, revenue_minor: 60000 }
    - { product_line: null, revenue_minor: 20000 } # goods-account revenue, no tracked line

# base = 80000. Wardrobe takes 3/4, the null population takes 1/4.
expect:
  shares:
    - { product_line: Wardrobe, minor: 30000 }
    - { product_line: null, minor: 10000 }
  unallocated_minor: 0
