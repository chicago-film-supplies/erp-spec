# The official product-line P&L — the ONE allocation ADR-0029 promises.
#
# ADR-0029: the ledger records un-allocated facts and never allocates; allocation happens once, in
# a specified report, "stated once rather than chosen per report, or two reports will disagree
# about the margin on the same product line". ADR-0031 states the basis.
#
# ⚠️ **Two views exist and only one is the managed number.** The ledger's own grouping shows
# `Delivery` at a structural loss BY CONSTRUCTION — delivery revenue is a surcharge, delivery cost
# is crew plus vehicle, and the two were never meant to cover each other. Reading that as a managed
# P&L concludes delivery should be cut, which would cut product revenue. This report is the answer
# to that, and it is why the un-allocated view must never be published as the product-line margin.

report:
  id: product_line_pl
  title: Product-line P&L (official)
  authority: ADR-0029
  basis: goods_revenue_on_causal_order
  basis_version: 1

  period_source: >-
    ADR-0017. Open periods read MongoDB live; a closed period reads its sealed, hashed Parquet
    artifact, queried through DuckDB (ADR-0024). Periodised by ACCOUNTING DATE, never posting
    timestamp (ADR-0010) — reading it over posting timestamp misfiles every late entry and the
    result still balances, which is what makes the mistake survivable and therefore dangerous.

  sealed_at_close: false
  sealed_at_close_reason: >-
    The allocated view is RECOMPUTED on demand from sealed inputs, not sealed as its own artifact.
    Sealing it would create a second immutable object that can disagree with the first, and the
    reconciliation between them would have no authority to appeal to. Recomputation is safe only
    because the basis is versioned and the inputs are hashed: `(sealed period artifact, basis
    version)` determines the output, so reproducibility is a property of two recorded facts rather
    than of a stored copy.
    ⚠️ This is the load-bearing dependency on `basis_version`. If a basis is ever mutated in place
    instead of superseded, this decision silently becomes wrong for every historical period.

  excludes:
    - what: void documents
      reason: >-
        A voided invoice is not revenue and its delivery line is not a pool. Re-measured 2026-08-16:
        **43 of 1,010 invoices are void and carry $5,750.00 of delivery revenue — 2.43% of the
        $236,487.75 headline**, so the pool net of voids is **$230,737.75**. Corpus-wide the voids are
        481 lines / $70,127.26 / 4.09% of line revenue.
        (41 of 999 / $5,750.00 / 2.7% on 2026-08-09 — `inbox/2026-08-08-void-invoices-not-filtered.md`.
        The delivery void amount is **unchanged to the cent**; only its share moved, because the
        headline grew.)

  # ── which product lines are goods, and which are activity ────────────────────────────────────
  # The taxonomy mixes categories of GOODS with categories of ACTIVITY, and the mix is not stable:
  # of the FIVE activity lines TWO are material — `Delivery` 13.79% and `Trash & Cleanup` 8.45%,
  # together 22.2% of revenue — `Transport` (trucking) is 1.98%, and two are small (`Shipping` 0.33%,
  # `Crew` 0.21%). ⚠️ Re-measured 2026-08-16: every DOLLAR figure OQ-031 and OQ-034 recorded reproduces
  # exactly — $144,975.00, $39,665.00, $34,000.00, $5,665.00, $3,550.00 — and only the SHARES moved,
  # because the denominator grew from $1,688,980.87 to $1,715,472.79. `Delivery` alone moved in dollars,
  # gaining 3 lines and $1,500.00 since 2026-08-10 to 537 / $236,487.75.
  # `Transport` was restored and split from `Shipping` by OQ-034 on 2026-08-16, and
  # `Transaction Fees` LEFT the dimension on the same day: a card fee is caused by how the customer
  # paid, not by what was supplied, so no product line is true of it. 4700 and 5500 carry no
  # dimension, which ADR-0025 permits per account and 4800 Other Income already does.
  #
  # ⚠️ **`activity` no longer implies `spreads`, and that is the most misreadable thing in this
  # file.** Of the five, exactly ONE spreads: `Delivery`, because it is not severable — "we wouldn't
  # do a delivery with no products". The other four are severable and keep their own margin
  # (OQ-031, OQ-034). So `line_kinds` answers "is this a thing supplied or a thing performed", and
  # the pool's `status` answers "does its cost land on the goods" — two different questions that
  # were the same question when only `Delivery` had been decided.
  # ⚠️ This read "one carries 12.8% and two are rounding errors" until 2026-08-10, off a line denorm
  # that was null on 227 categorised lines (api-cloudrun#473). That is
  # tolerable only because the ledger does not allocate — this file is where the distinction is
  # made, and it is made HERE rather than in `ledger/dimensions.yaml` because ADR-0018 keeps the
  # chart plain expressly so it does not explode into reporting axes.
  #
  # Gate 13 requires every declared product line to appear exactly once. Adding a value to
  # `ledger/dimensions.yaml` without deciding its kind is a build break, not a silent default —
  # which matters because the default would be "goods", and a goods line silently starts absorbing
  # delivery cost.
  line_kinds:
    Carts & Ramps: goods
    Crafty: goods
    Expendables: goods
    Fans & Heaters: goods
    Hair & Makeup: goods
    Janitorial: goods
    Office Supplies: goods
    Power, Lights & Tools: goods
    Replacements: goods
    Surface Protection: goods
    Tables & Chairs: goods
    Tents: goods
    Traffic, Safety & Signage: goods
    Walkies & Hotspots: goods
    Wardrobe: goods
    Crew: activity
    Delivery: activity
    Trash & Cleanup: activity
    Transport: activity
    Shipping: activity

  # ── which LABOUR enters which pool ───────────────────────────────────────────────────────────
  # ⚠️ **`labor_line` is the pool's COST SELECTOR, and EVERY declared value is selected by exactly
  # one pool.** Owner, 2026-08-16: "the p&l by product line will distribute labor costs with
  # labor_line delivery across product lines, the same mechanism will allow other combos for future
  # reporting", and then: **"counter and warehouse can bill goods too (just like delivery does)."**
  #
  # A report in this family is three things — **(cost selector) → spread over (base) by (basis)** —
  # and the official product-line P&L is `labor_line: {delivery, counter, warehouse}` → goods revenue
  # on the causal order → largest remainder. "Other combos" are new rows of CONFIGURATION, not new
  # machinery.
  # ⚠️ That generality must not leak into the AUTHORITY. ADR-0029's "exactly ONE official
  # allocation" stands: a configurable mechanism makes a second number cheap to produce, and
  # ADR-0029 is what says only one of them is the managed one.
  #
  # ⚠️ **THIS IS WHAT THE 3 → 7 ENUM GROWTH WAS FOR, and it is not cosmetic.** With three values
  # (`delivery`, `counter`, `warehouse`) exactly one activity pool could name its own labour and the
  # rest had nowhere to point — so `transport` pointed at `labor_line: delivery` and would have
  # spread a long-haul crew-day across goods lines while reporting Transport at a ~100% margin. With
  # seven, every pool selects its own cost.
  #
  # ⚠️ **The mapping is NOT derivable from the names.** `trucking` ↔ `Transport` is the
  # counter-example: `Transport` is the incumbent Xero tracking category and `trucking` is what the
  # owner calls the work. A convention matching on the string would silently drop that pool, which
  # is why the link is declared on each pool's `cost_sources.labor_line` and never inferred.
  #
  # ⚠️ **There is NO "bills nobody" branch, and it was removed on the owner's ruling the day it was
  # written.** This file carried `labor_line_kinds` (`billable` / `bills_nobody`) with `counter` and
  # `warehouse` in the second bucket and an `unpooled_labor_lines` honest-bucket beside it. The
  # owner's ruling collapsed it: counter and warehouse hours are absorbed against a causal job like
  # any other, so they bill goods exactly as delivery does. **A branch with no members is a claim
  # rather than a capability** — this repo's own standard — so the branch went rather than being
  # kept empty against a hypothetical.
  # ✅ **And the collapse is structural, not a coincidence.** `labor_line` is read off the shift's
  # ABSORBED ALLOCATION row, and an absorbed allocation names a causal job by definition — hours
  # belonging to no job are UNABSORBED, post to 5801, and have no allocation row and therefore no
  # `labor_line` at all. So every value this taxonomy can hold is, by construction, attributable to
  # a job whose goods can bear it. **Total coverage is a property of the design, not an assumption.**
  #
  # Gate 13h requires every declared `labor_line` to be selected by exactly one pool, and every pool
  # to declare a selector. Adding a value to `ledger/dimensions.yaml` without deciding which pool
  # spreads it is a build break, not a silent default — and the silent default would be "vanishes",
  # which understates COGS on every line it should have reached.

  # ── the pools ────────────────────────────────────────────────────────────────────────────────
  # One entry per ACTIVITY line, and every one of them lands in exactly one bucket — the same
  # coverage discipline `ledger/posting-rules.yaml` applies to events. "Nobody decided" is not a
  # state this file can be in.
  pools:
    - id: delivery
      kind: activity_line
      product_line: Delivery
      status: allocated
      basis: goods_revenue_on_causal_order
      basis_version: 1
      accounts: [4100, 4110]
      cost_sources:
        labor_line: delivery
        labour_accounts: [5800]
        pending: >-
          Vehicle COGS. ADR-0030 moves vehicle running cost into COGS on the 5800/5801 pattern and
          explicitly does not choose the accounts, so there is nothing to name yet
          (`deferred_pools.vehicle_cogs`, erp-spec#12). **This pool currently carries almost no
          cost, which is exactly why the un-allocated view shows Delivery at a loss.**
      note: >-
        **Both accounts, and the delivery line's margin includes both.** 4100 Service Income is the
        delivery / setup / removal charge, a service a person performs and therefore labour-bearing;
        4110 Delivery Surcharges carries a premium priced for a CONDITION of that same delivery.
        They are two accounts because the two revenues have different COST CAUSATION, not because
        they are different product lines — so both are pooled and both spread.
        ⚠️ **OQ-032 answered 2026-08-16, and it retracts the framing this note used to carry.** It
        read "4110 is off-hours, rush or weekend, which nobody performs", then corrected itself to
        say the premise "holds for 62.3% and NOT for a third of it". Both readings asked the wrong
        question. Owner: **"the performance IS the delivery** — the distance surcharge is because it
        takes longer, the rush surcharge is because it was unplanned." Nothing on 4110 is a
        separately performed thing; every member is a premium on the one performance, priced for a
        condition of it.
        Composition measured 2026-08-09 across the account ($45,776.06): Off Hours 37.2%, Distance
        Charge 33.3%, Weekend 22.9%, Card Fee 4.3%, Rush 1.1%. ⚠️ 4110 is **$46,276.06** as of
        2026-08-16 and `Transaction Fees` on it is **$1,986.06 / 42 lines / 4.29%** — so the `Card Fee`
        member reproduces its 4.3% and IS the pending restatement below, now measured rather than
        asserted. The rest of the composition has not been re-split by member.
        ⚠️ **Two OQ-032 restatements change this pool and have not run yet.** `Card Fee` leaves 4110
        for **4700 Transaction Fee Income** — a payment fee is not a premium on a delivery, and it is
        the one member that fails the criterion; measured 2026-08-16 it is **$1,986.06 across 42
        lines**, and 4110 net of it would be **$44,290.00**. And the miscoded lines move onto 4110:
        `Rush Charge` sits on 4100 for 86% of its value against the stated rule, `Distance Charge`
        leaks onto 4100 on 3 lines. **Until both run, the split is that split plus an unmeasured coding
        error**, and anything reasoning from the ratio inherits it. The ratio itself is now
        **4100 81.38% ($192,447.75 / 407 lines) / 4110 18.52% ($43,790.00 / 129) / 4200 0.11%**,
        re-measured 2026-08-16 against 79.8 / 20.0 — a delivery line is still four times more likely to
        be Service Income than Delivery Surcharges.
        ✅ **The forecasting consequence is RESOLVED for distance, and it inverts ADR-0029's stated
        direction.** Owner, 2026-08-16: the extra cost of a distant delivery is "the opportunity cost
        of the team being gone longer (and thus unavailable for a second delivery), and additional
        gas." Three components, and only one of them is an entry: **wage** is unchanged (same
        crew-day near or far, so OQ-006 stands for labour), **fuel** is a real cost and lands in
        vehicle COGS (ADR-0030), and **opportunity cost** is deliberately not booked — it surfaces
        through ADR-0019's absorption model, as the long haul absorbing its person-day into 5800
        while no second job absorbs the rest of the day, leaving 5801 Unabsorbed Labour. That is
        HOT-010's "absorption measures UTILISATION", and it answers HOT-004 without loading a
        premium onto the job.
        ⇒ predicting delivery cost from 4100 volume alone **under-predicts** in a long-haul period.
        ⚠️ Out-of-hours and weekend remain unreconciled and are the narrower question: they cost more
        in WAGE (ADR-0019's 1.5x) where distance costs more in FUEL, and whether the premium exceeds
        the wage uplift is unmeasured.
        → **OQ-032**. None of this touches the basis: both accounts pool and spread as one, which is
        the whole point of
        `inbox/2026-08-09-correction-the-surcharge-split-is-not-an-allocation-rule.md`. It touches
        what the un-allocated view can be READ as.
        (OQ-006, and
        `inbox/2026-08-09-4110-is-a-third-distance-charges-and-distance-is-performed.md`.)
        **The cost side is now DECLARED rather than described** — see `cost_sources` above. Labour
        COGS whose shift allocation resolves to `labor_line: delivery` (ADR-0019, 5800/5801) is in
        the ledger now; vehicle COGS is ADR-0030 and its accounts are unchosen. ⚠️ This read "labour
        COGS carrying `cost_type: delivery`" until 2026-08-16 — under ADR-0036 the posting carries
        the causal job and its allocation row, and the classification is read off that row (OQ-042).
        **This is the pool the owner's ruling names**: "the p&l by product line will distribute labor
        costs with labor_line delivery across product lines" (2026-08-16).

    - id: shipping
      kind: activity_line
      product_line: Shipping
      status: not_allocated
      accounts: [4150, 5300]
      cost_sources:
        labor_line: shipping_&_handling
        labour_accounts: [5800]
        bought_in_accounts: [5300]
      reason: >-
        **Severable, and its cost is BOUGHT IN rather than performed.** Split out of `Transport` by
        OQ-034 on 2026-08-16 — owner: "shipping is a pass through, trucking is our own longer or
        bigger haul." Third-party freight, bought and re-billed: no CFS crew-day, no vehicle.
        Spreading it over goods would move a markup onto lines that did not cause it.
        **This is the only pool whose margin is fully expressible today** — `4150 Shipping & Handling
        Income` against `5300 Cost of Goods Sold: Shipping (Rentals & Sales Only)`, both on this
        line, so the margin IS the markup and nothing is pending. Every other pool waits on a cost
        that is not in the ledger yet.
        It is classified `activity` rather than given a `pass_through` kind of its own. Two reasons:
        the account is `Shipping & HANDLING` and CFS does handle it, so a performed component is
        real; and a third kind with one member that changes no behaviour is the shape `Other` was
        deleted for. What is distinctive about it — a bought-in cost — is already visible in the
        accounts (5300, not 5800).
        Measured 2026-08-16: 16 lines, **$5,665.00**, 0.33% of revenue — the amount reproduces OQ-034's
        figure exactly and only the share moved, because the denominator grew. Derived by account: the
        corpus still carries one `Transport` value and 4150 under it is entirely this pool.

    - id: transport
      kind: activity_line
      product_line: Transport
      status: not_allocated
      accounts: [4100]
      cost_sources:
        labor_line: trucking
        labour_accounts: [5800]
        pending: >-
          Vehicle COGS, as for `delivery` — a haul is the most vehicle-intensive work CFS does, so
          this pool's margin is the one most understated while ADR-0030's accounts are unchosen.
      reason: >-
        **Severable — carries its own margin.** OQ-034, owner 2026-08-16: "trucking is our own
        longer or bigger haul that doesn't fit into the standard delivery charge paradigm, it should
        carry its own margin." That is the severability test passing, on the same criterion as `crew`
        and `trash_cleanup`: `Delivery` spreads because it is a joint cost of the product revenue,
        and a haul sold on its own terms is not.
        **This line is TRUCKING ONLY since the 2026-08-16 split.** `Shipping` moved to its own pool —
        the two were one value only in the dimension, never in the chart, which has carried them on
        different revenue accounts (4100 vs 4150) throughout. Splitting removed the single place they
        were conflated rather than inventing a distinction, and it settles HOT-001's question — "does
        `Trucking` mean third-party freight or an own long-haul run?" — structurally instead of in
        prose. Trucking is CFS-performed and labour-bearing, per ADR-0011's ruling on OQ-010: a
        trucked leg generates a shift and absorbs a person-day.
        ⚠️ **THIS POOL SELECTED THE WRONG LABOUR UNTIL 2026-08-16, and the defect was invisible
        while the enum had three values.** It read "the cost is labour COGS resolving to
        `labor_line: delivery`" — written when `cost_type` was `[delivery, counter, warehouse]` and
        trucking labour had nowhere else to point. **`labor_line: trucking` is what this pool
        selects**, and the 3 → 7 growth exists precisely so it can. Built as written, a long-haul
        crew-day would have entered the `delivery` pool and **spread across goods lines**, while
        Transport reported revenue with no cost against it — the near-100%-margin failure `crew` and
        `trash_cleanup` already warn about, arrived at from the other side, with goods COGS
        overstated by the same amount.
        ⚠️ **This pool's margin is still NOT fully readable, and that is the trap the file header
        warns about for `Delivery`.** Revenue is on 4100, labour is now selected correctly, and
        **ADR-0030 has not chosen the vehicle COGS accounts**. Until it does, a Transport margin read
        off this pool overstates trucking — and a haul is the most vehicle-intensive work CFS does,
        so this is the pool that understatement bites hardest.
        Measured 2026-08-16: 7 lines, **$34,000.00**, 1.98% of revenue — the amount reproduces OQ-034's
        figure exactly and only the share moved. Derived by account: 4100 under the corpus's single
        `Transport` value. ⚠️ The corpus has NOT been restated into two values; that is an ADR-0020
        obligation, and `Shipping` therefore reads 0 lines when the dimension is read directly.
    - id: crew
      kind: activity_line
      product_line: Crew
      status: not_allocated
      accounts: [4100]
      cost_sources:
        labor_line: crew
        labour_accounts: [5800]
      reason: >-
        **Severable.** ADR-0029's argument for spreading `Delivery` is that delivery is NOT
        severable — "we wouldn't do a delivery with no products, we would rent far fewer products if
        we weren't delivering them" — so delivery cost is a joint cost of the product revenue. Crew
        hired out to a customer fails that test: it is work sold on its own terms. Spreading it would
        move a real profit or loss onto goods that did not cause it, which is ADR-0029's own error in
        the opposite direction. Owner, OQ-031, 2026-08-16.
      note: >-
        **SEVERABLE — keeps its own margin and does not spread.** OQ-031 answered by the owner
        2026-08-16. ADR-0029's severability argument for `Delivery` does not transfer: "we wouldn't
        do a delivery with no products", but crew hired out to a customer stands on its own.
        Spreading it would move a real profit or loss onto goods that did not cause it — the same
        error as leaving delivery alone, in the opposite direction.
        ⚠️ **Not allocated is NOT the same as not costed.** Owner, same ruling: "they still need
        labor cost allocated to them", via the **causal-job rule** — the shift lands on the line it
        performed. So this pool carries its own labour cost as well as its own revenue, and its
        margin is a real one. A severable line with revenue and no cost against it would report a
        margin near 100%, which is the failure this clause exists to prevent.
        Measured 2026-08-16: 9 lines, **$3,550.00**, 0.21% of revenue — unchanged on both figures.

    - id: trash_cleanup
      kind: activity_line
      product_line: Trash & Cleanup
      status: not_allocated
      accounts: [4100]
      cost_sources:
        labor_line: trash_&_cleanup
        labour_accounts: [5800]
      reason: >-
        **Severable**, on the same criterion as `crew`: a wrap cleanup is a service contracted on its
        own terms, not a joint cost of the rental. Spreading $144,975 onto goods that did not cause
        it would misstate both sides — goods margin down, and a real service margin erased. Owner,
        OQ-031, 2026-08-16.
      note: >-
        **SEVERABLE — keeps its own margin and does not spread.** OQ-031 answered by the owner
        2026-08-16, on the same criterion as `crew`: a wrap cleanup stands on its own, so spreading
        it would move a real profit or loss onto goods that did not cause it.
        ⚠️ **Re-measured 2026-08-16: 70 lines, $144,975.00, 8.45% of revenue — the THIRD LARGEST
        product line in the business.** This note read "2 lines, $1,750.00, 0.1% of revenue" until
        2026-08-10, off a line denorm that was null on 227 categorised lines (api-cloudrun#473). An 83×
        error, and it is the reason OQ-031 was framed as a tidy-up when it was the largest open
        decision in this file. The amount reproduces the 2026-08-10 re-measurement to the cent; the
        share moved only because the denominator grew.
        ⚠️ **The labour qualifier matters most here, because of that size.** Owner: "they still need
        labor cost allocated to them", via the causal-job rule — a crew-day spent on a trash sweep
        attributes to this line because that is the job that caused it. $144,975 of revenue on its
        own P&L line with no cost against it would report a margin near 100% and would be the most
        misleading number this report could produce.

    # ── cost-only pools: real absorbed labour that bills nobody DIRECTLY ─────────────────────
    # ⚠️ **`kind: cost_only` is the schema's second pool shape, added 2026-08-16 on the owner's
    # ruling.** An activity pool has revenue AND cost and asks "does its cost land on the goods";
    # a cost-only pool has cost and NO revenue, so the question does not arise — it has nowhere
    # else to go. **A cost-only pool must therefore be `allocated`**, and gate 13d fails on one
    # that is not: a cost pool that does not spread is a cost that reaches no report at all,
    # which is the "vanishes" default in its purest form.
    #
    # These two do not appear as P&L lines of their own. Their cost spreads into the goods lines
    # of the orders that caused it, which is what "can bill goods too" means.

    - id: counter
      kind: cost_only
      status: allocated
      basis: goods_revenue_on_causal_order
      basis_version: 1
      cost_sources:
        labor_line: counter
        labour_accounts: [5800]
      reason: >-
        **Counter hours bill goods, exactly as delivery does** (owner, 2026-08-16: "counter and
        warehouse can bill goods too (just like delivery does)"). A counter hour is spent serving a
        customer collecting or returning an order, so it is a joint cost of that order's goods
        revenue and it is not severable — nobody buys a counter hour. That is ADR-0029's criterion
        for `Delivery` applied unchanged, and it reaches the same answer.
        ⚠️ **It has no product line and needs none.** `Delivery` has one because a delivery is
        CHARGED FOR and an operator picks the line; a counter hour is never billed as a line, so
        there is no revenue to categorise. The absence is the reason this is a cost-only pool, not
        an omission.
        ⚠️ **Its size is unmeasured and will stay unmeasured until v2 runs.** The current system has
        never had the absorbed-labour stage, so counter hours measure as zero everywhere
        (erp-spec#14). **Decided on the criterion rather than on the number**, which is the right
        way round: severability does not depend on magnitude.

    - id: warehouse
      kind: cost_only
      status: allocated
      basis: goods_revenue_on_causal_order
      basis_version: 1
      cost_sources:
        labor_line: warehouse
        labour_accounts: [5800]
      reason: >-
        **Warehouse hours bill goods, exactly as delivery does** (owner, 2026-08-16). Prep, pull,
        check-in and put-away are performed for a specific order and absorb against it, so the
        goods of that order bear the cost. Not severable — nobody buys a warehouse hour.
        ⚠️ **NOT the same thing as `deferred_pools.warehouse_overhead`, and the two were conflated
        until 2026-08-16.** That entry is rent and utilities: an operating expense below this
        report's gross margin until an ADR moves it into COGS (erp-spec#12). This is a warehouse
        HOUR, which is already in COGS via 5800 and already absorbed against a causal job. One is a
        facility cost with no causal order; the other is labour with one.

  # ── pools that are the same shape and are NOT yet expressible ────────────────────────────────
  # `pools` above is keyed by an ACTIVITY PRODUCT LINE, because that is what today's data has: an
  # activity's revenue and cost meet on a line an operator picked. The pools below have no product
  # line and in some cases no accounts, so the schema cannot express them yet and inventing a shape
  # for them would be guessing.
  #
  # This is the honest bucket, on the same terms as `unwritten` in `ledger/posting-rules.yaml`:
  # every entry owes a tracked issue, and gate 13 fails on one that does not carry it. A deferral
  # that nobody is holding is indistinguishable from an omission.
  deferred_pools:
    - id: vehicle_cogs
      issue: erp-spec#12
      reason: >-
        ADR-0030 moves vehicle running cost into COGS on the 5800/5801 absorbed/unabsorbed pattern,
        and explicitly does NOT choose the accounts — "the chart picks the next free pair". With no
        accounts there is nothing to pool. 2025 actuals across 6400–6404 total $21,844.77.
        It is also the pool that most changes this report: `Delivery` currently carries almost no
        cost, which is exactly why the un-allocated view shows it at a loss.

    - id: trip_travel
      issue: erp-spec#12
      reason: >-
        The cost of a shared run that served several jobs. It is a sub-allocation INSIDE delivery
        cost — from one trip to the several orders it served — before this report's allocation from
        an order to its goods. Two chained allocations, and the inner one has no basis stated and no
        data: nothing records which orders shared a run.

    - id: warehouse_overhead
      issue: erp-spec#12
      reason: >-
        Still an operating expense, not COGS, so it is below the gross margin this report presents
        and there is no pool to spread. It becomes real only if a decision moves it into COGS, which
        no ADR has made.
        ⚠️ **NOT the same question as `labor_line: warehouse`, and this entry used to leave that
        dangling.** It said the labour classification "already exists … which is the narrower thing
        and is not the same claim" without saying where the narrower thing goes. ✅ It goes to the
        **`warehouse` cost-only pool** above (owner, 2026-08-16) — a warehouse HOUR is already in
        COGS via 5800, already absorbed against a causal job, and spreads onto that job's goods.
        This entry is about rent and utilities, which are not in COGS at all and have no causal
        order to spread from. **Two facts that share a word.**

  # ── the imputed-labour view, REQUIRED and NOT official ───────────────────────────────────────
  # ⚠️ **A contributed owner shift posts NOTHING** (OQ-047, owner 2026-08-16: "stick with gaap"). No
  # obligation was incurred, so no expense is recognised — ASC 958-605, which lets an entity
  # recognise donated services, is not-for-profit only. **The consequence lands here:** real work
  # was performed, no cost reaches the job, and this report's gross margin is flattered by exactly
  # that labour.
  #
  # **That is what GAAP requires, and it is why the imputed view is REQUIRED rather than optional.**
  # A margin that is honest only in a report nobody runs is not honest. The shift record survives a
  # contributed shift in full — hours, causal job, allocation-row identity, `labor_line` — so
  # everything the imputed view needs is already captured; nothing further has to be recorded at
  # posting time for it to become computable later.
  #
  # ⚠️ **It is explicitly NOT the official allocation, and that fence is ADR-0029's.** This is a
  # SECOND number for the same thing, and ADR-0029 exists because two reports that disagree about
  # the margin on the same product line have no authority to appeal to. The imputed view is
  # management information; the official product-line P&L above is the managed number. **The same
  # discipline this file already applies** to the un-allocated view, which "must never be published
  # as the product-line margin".
  imputed_labour_view:
    required: true
    official: false
    status: unwritten
    blocked_by: [OQ-048]
    issue: erp-spec#32
    reason: >-
      **What rate to impute is not decided.** ADR-0019 costs labour at "that person's actual
      per-contact wage", and an owner who is never paid has no actual wage — the field may be empty
      or may hold a number nobody has ever honoured. Three candidates answering different questions
      (the person's own rate, a replacement-hire rate, a single notional owner rate), and the
      agricultural-extension literature's answer is the second: owner-operator compensation "should
      be equivalent to hired compensation for accurate profitability measurement". OQ-048.
      ⚠️ **Whatever is chosen is a BASIS and owes a version**, on this file's existing discipline —
      two imputed views computed at different rates would disagree about the same job's margin.
      ⚠️ **Unmeasurable until v2 runs.** How many owner shifts exist is recorded nowhere, because the
      current system has no absorbed-labour stage at all (erp-spec#14). `compensation` being present
      from day one is what makes the population countable the moment the stage exists — and until
      then **the size of the distortion this view corrects is unknown**, which is an argument for
      writing it early rather than waiting to see whether it matters.

  # ── presentation ─────────────────────────────────────────────────────────────────────────────
  presentation:
    own_and_allocated_shown_separately: true
    own_and_allocated_reason: >-
      ⚠️ **The single most important rule on this report, and it is a measurement, not a
      preference.** Re-measured 2026-08-16 (erp-spec#15 fixed; the probe reads prod Firestore under
      ADC): on **125 of 307** delivery-bearing order-groups ex-void — holding **$104,875.00, 45.45% of
      ex-void delivery revenue** — the pool is LARGER than the goods revenue it spreads over. Ratio
      median 0.840, p90 3.33, max 25.00.
      ⚠️⚠️ **This share was predicted to FALL and it ROSE.** Pre-repair it was 115 of 305 / $89,425 /
      41.4%, median 0.775; like-for-like on the 2026-08-09 base rule and classification it is now
      **45.20%, 129 of 314, median 0.862**. The prediction assumed api-cloudrun#473 suppressed only the
      base. It suppressed BOTH sides and suppressed the pool harder — `Delivery` gained $20,437.50 and
      almost all of it on 4100 Service Income, where a service-heavy order has little goods revenue to
      categorise against it.
      **So the re-measurement makes this rule bigger, not smaller.** The rule never depended on the
      magnitude — one group where the pool exceeds its base is enough to require the two figures be
      shown separately — but the population it protects against is larger than recorded.
      Where a pool exceeds its base, pro-rata spreading does not adjust a product line's margin, it
      REPLACES it. `Crafty` receives **$21,549.26** of allocated delivery revenue against **$16,990.00**
      of its own — **126.8%** (pre-repair $21,958 against $11,735, 187%) — from five near-identical
      invoices where a $1,500–$2,500 delivery sits against $480–$800 of Crafty as the only goods on the
      order. ⚠️ `Crafty` itself nearly tripled corpus-wide to $45,530.48 and its account mix inverted to
      90.26% on 4200 Retail Sales, so anything reasoning from the old figure is reasoning about a much
      smaller line than exists.
      So every figure appears twice, own and allocated, and never only as their sum. A reader who
      cannot separate them cannot tell a product's economics from an activity's.
      (`inbox/2026-08-16-adr-0031s-figures-re-measured-two-of-three-predicted-directions-failed.md`)

    unallocated_row_shown: true
    unallocated_row_reason: >-
      An order carrying activity revenue and NO goods line has no denominator, under every basis.
      Re-measured 2026-08-16 **under this file's own base definition** — null-product-line goods
      included, voids excluded: **12 order-groups, $11,400.00, 4.94% of ex-void delivery revenue**
      (13 / $11,650.00 / 4.93% including the void). It is reported on its own row, never forced
      onto an arbitrary line, never spread across all lines, and never dropped.
      ⚠️ **These are service-only JOBS, not orphaned deliveries**, and the row should be read that
      way: CFS sold labour — install, tear-out, relocate, trash removal — with no rental or retail
      goods on the order at all, so there is genuinely no product line the pool belongs to. That is
      the argument FOR the row rather than a defect it records. **85.5% of it is one customer, one
      service, five weeks**: five Netflix `Duradeck Install / Tear Out / Relocate` invoices totalling
      $9,750.00 between 2025-02-28 and 2025-04-04. 2024 contains none at all and 2026 contains one
      $250 line, so it is not a standing practice.
      Watch the row for service-only work becoming a larger share of the business — not for booking
      errors. (`inbox/2026-08-09-correction-the-unallocable-population-is-smaller-and-is-one-customer.md`)
      ⚠️⚠️ **A retraction stood here from 2026-08-10 to 2026-08-16 and it was WRONG. It is withdrawn.**
      It read: "THE DOMINANT CASE HERE PROBABLY IS NOT UNALLOCABLE… Duradeck **is** categorised at the
      product master, as `Surface Protection`, so after the repair they carry a goods line and have a
      denominator… 85.5% of this row's measured population disappears and 'service-only jobs, not a
      defect' was a conclusion drawn from the defect."
      Measured 2026-08-16: **`products/kqzVClx5uJrJ07bEjokX.tracking_category_name` is `"Delivery"`.**
      It is the install / tear-out / relocate **labour**, not the deck. All 15 lines across the five
      invoices are `Delivery` at both the line and the master, every one of the five still has a base of
      $0.00, and none carries a goods line at all. The retraction inferred a category from a product
      NAME and never read either product record — the same error class as api-cloudrun#473 itself, one
      level up. **The 2026-08-09 reading above is reinstated in full.**
      ⚠️ And the row did not shrink: it grew. 11 groups / $11,150.00 → **12 / $11,400.00**; the SHARE
      fell 5.16% → 4.94% only because the pool denominator grew. Nothing became allocable. By year,
      ex-void: 2023 1 / $100.00 · 2024 1 / $250.00 · 2025 9 / $10,800.00 · 2026 1 / $250.00.
      **The row is retained on its own merits regardless.** An order carrying activity revenue and no
      goods line genuinely has no denominator, and forcing such a pool onto an arbitrary line would be
      worse than reporting it — that argument never rested on the population size.
      (`inbox/2026-08-16-correction-the-duradeck-retraction-reasoned-from-a-product-name.md`)

    null_product_line_row_shown: true
    null_product_line_row_reason: >-
      A line that resolves to NO product line is a countable population and gets a row. Goods-account
      revenue that resolves to none is part of the allocation BASE and absorbs its share; service and
      other revenue that resolves to none is neither pool nor base and reports below the allocated
      margin.
      ⚠️ **REFRAMED 2026-08-16 (ADR-0036).** This read "`product_line: null` is a legal determination,
      not an absence (ADR-0025, REQ-LED-001), so it is a countable population" — a statement about a
      DECLARED field on a posting, which no longer exists. The row survives and its meaning is now
      structural rather than declared: the line either resolves against the product master or it does
      not, and the two ways it can fail to are stated in `ledger/dimensions.yaml`
      (`unresolved_cases`) — no product at all, or a product nobody categorised. **The absence-versus-null
      rule did not disappear from the report; it disappeared from the ledger and became a join
      outcome**, which is why the population is now measured rather than declared.
      Re-measured 2026-08-16 the untracked share is **14.76% of line revenue** ($253,269.75 of
      $1,715,472.79), and it is exactly the two populations that are not defects: **130 custom lines
      with no product master** ($233,610.63) and **183 lines on genuinely uncategorised products**
      ($19,659.12). The first is the one to watch — a custom line is where a new product line announces
      itself. (15.00% of $1,688,980.87 on 2026-08-10, across 128 / $233,667.63 and 170 / $19,638.96 —
      the money is flat and the denominator grew.)
      ⚠️ The sub-population that is in the allocation BASE rather than merely reported under this row is
      the null lines on a GOODS account: **264 lines, $38,678.20, 2.25% of line revenue** — 4200
      $21,716.14 / 36, 4000 $10,671.16 / 220, 4210 $6,290.90 / 8.
      (`inbox/2026-08-10-the-untracked-revenue-denorm-is-repaired-and-28-7-percent-is-now-15-percent.md`)
      ⚠️ This read "28.8% ... 2.8% correctly dimensionless, 22.1% service revenue where null is the
      decided answer, 4.0% — 143 lines, $67,156 — where a product line obviously applies and nobody
      set one" until 2026-08-10. That decomposition was taken off the invoice-line denorm; joined to
      the product master, **the whole of "nobody set one" is $688.00 — 0.041% of all line revenue**
      (api-cloudrun#473, repaired). The 22.1% in particular was not service revenue where null was
      decided; most of it was a derivation that never ran.

  # ── revenue with no line-level representation ────────────────────────────────────────────────
  revenue_without_line_representation: >-
    **The report is built from POSTINGS, not from invoice lines, and that is what closes this hole.**
    ⚠️ **The mechanism changed on 2026-08-16 and the guarantee did not weaken — it moved.** This read
    "REQ-LED-001 refuses a posting to a dimensioned account that does not DECLARE its product line,
    so every revenue posting carries a product line or an explicit null". Under ADR-0036 a posting
    carries no product line at all; what REQ-LED-001 now refuses is a posting with no LINE IDENTITY
    where its rule names one, and the product line is resolved through that key. So there is still no
    revenue invisible to this report — every revenue posting resolves to a product line or to one of
    the two unresolved cases, and both have rows here. **The guarantee is arguably stronger**: a
    declared classification could be wrong and still pass, while a line identity either resolves or
    is refused.
    ⚠️ The hole is real in HISTORY. The 2023 P&L shows 4120 Contract Labor Income of $156,500 while
    only $31,570 across 3 lines appears in the invoice corpus carrying line-level tracking — the
    rest is not in those 999 invoices at all. That revenue cannot be given a product line by this
    report, because the documents that would say do not exist. It belongs to ADR-0020's restatement,
    which forbids altering any amount, so the restated postings will resolve to no product line and
    land in that row. ⚠️ They will also carry `causal_orders: null` — these are the legacy CRMS
    imports, 30 invoices referencing no order, and the owner ruled on 2026-08-16 that an explicit
    null source order is legal precisely so this population stays postable. **A pre-cutover period's null row is therefore not comparable to a
    post-cutover one**, and the report must say which side of the cutover a period falls on rather
    than let a reader compare across it.
