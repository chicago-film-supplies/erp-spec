# The official product-line P&L — the ONE allocation ADR-0029 promises.
#
# ADR-0029: the ledger records un-allocated facts and never allocates; allocation happens once, in
# a specified report, "stated once rather than chosen per report, or two reports will disagree
# about the margin on the same product line". ADR-0031 states the basis.
#
# ⚠️ **Two views exist and only one is the managed number.** The ledger's own grouping shows
# `Delivery` at a structural loss BY CONSTRUCTION — delivery revenue is a surcharge, delivery cost
# is crew plus vehicle, and the two were never meant to cover each other. Reading that as a managed
# P&L concludes delivery should be cut, which would cut product revenue. This report is the answer
# to that, and it is why the un-allocated view must never be published as the product-line margin.

report:
  id: product_line_pl
  title: Product-line P&L (official)
  authority: ADR-0029
  basis: goods_revenue_on_causal_order
  basis_version: 1

  period_source: >-
    ADR-0017. Open periods read MongoDB live; a closed period reads its sealed, hashed Parquet
    artifact, queried through DuckDB (ADR-0024). Periodised by ACCOUNTING DATE, never posting
    timestamp (ADR-0010) — reading it over posting timestamp misfiles every late entry and the
    result still balances, which is what makes the mistake survivable and therefore dangerous.

  sealed_at_close: false
  sealed_at_close_reason: >-
    The allocated view is RECOMPUTED on demand from sealed inputs, not sealed as its own artifact.
    Sealing it would create a second immutable object that can disagree with the first, and the
    reconciliation between them would have no authority to appeal to. Recomputation is safe only
    because the basis is versioned and the inputs are hashed: `(sealed period artifact, basis
    version)` determines the output, so reproducibility is a property of two recorded facts rather
    than of a stored copy.
    ⚠️ This is the load-bearing dependency on `basis_version`. If a basis is ever mutated in place
    instead of superseded, this decision silently becomes wrong for every historical period.

  excludes:
    - what: void documents
      reason: >-
        A voided invoice is not revenue and its delivery line is not a pool. Measured 2026-08-09:
        41 of 999 invoices are void and carry $5,750.00 of delivery revenue, 2.7% of the total —
        the then-headline $216,050.25 figure includes them.
        (`inbox/2026-08-08-void-invoices-not-filtered.md`)
        ⚠️ The `Delivery` headline is now **$234,987.75** (re-measured 2026-08-10, api-cloudrun#473).
        The void carve-out is unchanged in kind; its share of the larger figure has not been
        re-measured and is blocked on erp-spec#15.

  # ── which product lines are goods, and which are activity ────────────────────────────────────
  # The taxonomy mixes categories of GOODS with categories of ACTIVITY, and the mix is not stable:
  # of the FIVE activity lines TWO are material — `Delivery` 13.91% and `Trash & Cleanup` 8.58%,
  # together 22.5% of revenue — `Transport` is mid-sized at 2.35%, and two are small (`Crew` 0.21%,
  # `Transaction Fees` 0.29%). `Transport` was restored by OQ-034 on 2026-08-16.
  #
  # ⚠️ **`activity` no longer implies `spreads`, and that is the most misreadable thing in this
  # file.** Of the five, exactly ONE spreads: `Delivery`, because it is not severable — "we wouldn't
  # do a delivery with no products". The other four are severable and keep their own margin
  # (OQ-031, OQ-034). So `line_kinds` answers "is this a thing supplied or a thing performed", and
  # the pool's `status` answers "does its cost land on the goods" — two different questions that
  # were the same question when only `Delivery` had been decided.
  # ⚠️ This read "one carries 12.8% and two are rounding errors" until 2026-08-10, off a line denorm
  # that was null on 227 categorised lines (api-cloudrun#473). That is
  # tolerable only because the ledger does not allocate — this file is where the distinction is
  # made, and it is made HERE rather than in `ledger/dimensions.yaml` because ADR-0018 keeps the
  # chart plain expressly so it does not explode into reporting axes.
  #
  # Gate 13 requires every declared product line to appear exactly once. Adding a value to
  # `ledger/dimensions.yaml` without deciding its kind is a build break, not a silent default —
  # which matters because the default would be "goods", and a goods line silently starts absorbing
  # delivery cost.
  line_kinds:
    Carts & Ramps: goods
    Crafty: goods
    Expendables: goods
    Fans & Heaters: goods
    Hair & Makeup: goods
    Janitorial: goods
    Office Supplies: goods
    Power, Lights & Tools: goods
    Replacements: goods
    Surface Protection: goods
    Tables & Chairs: goods
    Tents: goods
    Traffic, Safety & Signage: goods
    Walkies & Hotspots: goods
    Wardrobe: goods
    Crew: activity
    Delivery: activity
    Trash & Cleanup: activity
    Transaction Fees: activity
    Transport: activity

  # ── the pools ────────────────────────────────────────────────────────────────────────────────
  # One entry per ACTIVITY line, and every one of them lands in exactly one bucket — the same
  # coverage discipline `ledger/posting-rules.yaml` applies to events. "Nobody decided" is not a
  # state this file can be in.
  pools:
    - id: delivery
      product_line: Delivery
      status: allocated
      basis: goods_revenue_on_causal_order
      basis_version: 1
      accounts: [4100, 4110]
      note: >-
        **Both accounts, and the delivery line's margin includes both.** 4100 Service Income is the
        delivery / setup / removal charge, a service a person performs and therefore labour-bearing;
        4110 Delivery Surcharges carries a premium priced for a CONDITION of that same delivery.
        They are two accounts because the two revenues have different COST CAUSATION, not because
        they are different product lines — so both are pooled and both spread.
        ⚠️ **OQ-032 answered 2026-08-16, and it retracts the framing this note used to carry.** It
        read "4110 is off-hours, rush or weekend, which nobody performs", then corrected itself to
        say the premise "holds for 62.3% and NOT for a third of it". Both readings asked the wrong
        question. Owner: **"the performance IS the delivery** — the distance surcharge is because it
        takes longer, the rush surcharge is because it was unplanned." Nothing on 4110 is a
        separately performed thing; every member is a premium on the one performance, priced for a
        condition of it.
        Composition measured 2026-08-09 across the account ($45,776.06): Off Hours 37.2%, Distance
        Charge 33.3%, Weekend 22.9%, Card Fee 4.3%, Rush 1.1%.
        ⚠️ **Two OQ-032 restatements change this pool and have not run yet.** `Card Fee` leaves 4110
        for **4700 Transaction Fee Income** — a payment fee is not a premium on a delivery, and it is
        the one member that fails the criterion. And the miscoded lines move onto 4110: `Rush Charge`
        sits on 4100 for 86% of its value against the stated rule, `Distance Charge` leaks onto 4100
        on 3 lines. **Until both run, the 79.8 / 20.0 split is that split plus an unmeasured coding
        error**, and anything reasoning from the ratio inherits it.
        ✅ **The forecasting consequence is RESOLVED for distance, and it inverts ADR-0029's stated
        direction.** Owner, 2026-08-16: the extra cost of a distant delivery is "the opportunity cost
        of the team being gone longer (and thus unavailable for a second delivery), and additional
        gas." Three components, and only one of them is an entry: **wage** is unchanged (same
        crew-day near or far, so OQ-006 stands for labour), **fuel** is a real cost and lands in
        vehicle COGS (ADR-0030), and **opportunity cost** is deliberately not booked — it surfaces
        through ADR-0019's absorption model, as the long haul absorbing its person-day into 5800
        while no second job absorbs the rest of the day, leaving 5801 Unabsorbed Labour. That is
        HOT-010's "absorption measures UTILISATION", and it answers HOT-004 without loading a
        premium onto the job.
        ⇒ predicting delivery cost from 4100 volume alone **under-predicts** in a long-haul period.
        ⚠️ Out-of-hours and weekend remain unreconciled and are the narrower question: they cost more
        in WAGE (ADR-0019's 1.5x) where distance costs more in FUEL, and whether the premium exceeds
        the wage uplift is unmeasured.
        → **OQ-032**. None of this touches the basis: both accounts pool and spread as one, which is
        the whole point of
        `inbox/2026-08-09-correction-the-surcharge-split-is-not-an-allocation-rule.md`. It touches
        what the un-allocated view can be READ as.
        (OQ-006, and
        `inbox/2026-08-09-4110-is-a-third-distance-charges-and-distance-is-performed.md`.)
        Cost joins this pool as it arrives: labour COGS carrying `cost_type: delivery` (ADR-0019,
        5800/5801) is in the ledger now; vehicle COGS is ADR-0030 and its accounts are unchosen.

    - id: transaction_fees
      product_line: Transaction Fees
      status: not_allocated
      accounts: [4700, 5500]
      reason: >-
        A card fee is caused by the PAYMENT METHOD, not by the goods. It varies with how the
        customer chose to settle and not with what was supplied or moved, so spreading it over goods
        would make a product look expensive because someone paid by card. It stays on its own line,
        below the allocated margin. Measured 2026-08-09: 72 lines, $2,581.98, 0.2% of revenue.
        Consistent with api-cloudrun#401, which moves Card Fee off a `sale` line and onto a real
        `transaction_fee` — a fee is not a sale, and it is not a product line's cost either.
        ✅ **This pool has a COST side, named by the owner 2026-08-16: `5500 Cost of Goods Sold:
        Merchant Fees`** (Active). So it is the one activity line whose margin is already fully
        expressible — 4700 revenue against 5500 cost, both on the same product line, neither
        allocated. Every other pool is waiting on a cost that is not in the ledger yet.
        It also absorbs OQ-032's `Card Fee` restatement: the $1,968 currently inside 4110 moves to
        **4700**, pairing with 5500 on the cost side rather than sitting inside delivery revenue
        with its cost somewhere else entirely.

    - id: transport
      product_line: Transport
      status: not_allocated
      accounts: [4100, 4150, 5300]
      reason: >-
        **Severable — carries its own margin.** OQ-034 answered by the owner 2026-08-16: "trucking
        is our own longer or bigger haul that doesn't fit into the standard delivery charge
        paradigm, it should carry its own margin." That is the severability test passing, on the
        same criterion as `crew` and `trash_cleanup`: `Delivery` spreads because it is a joint cost
        of the product revenue, and a haul sold on its own terms is not.
        ⚠️ **This pool holds TWO economically different things, and the allocation answer happens to
        be the same for both.** Owner, same ruling: "shipping is a pass through, trucking is our own
        longer or bigger haul." `Shipping` (16 lines, $5,665.00, account **4150 Shipping & Handling
        Income**) is third-party freight bought and re-billed — no CFS crew-day and no vehicle.
        `Trucking` (7 lines, $34,000.00, account 4100) is CFS-performed and labour-bearing, which is
        ADR-0011's ruling on OQ-010 — a trucked leg generates a shift and absorbs a person-day.
        Neither spreads, so one pool is correct today. **What differs is the COST side** — a freight
        invoice versus crew plus vehicle — so a reader must not take the single line as a claim that
        the two are the same kind of work. Whether they eventually become two product lines is not
        decided and blocks nothing.
        ⚠️ **The asymmetry is visible in the accounts, and it means this pool's margin is HALF
        expressible today.** Owner, 2026-08-16: `5300 Cost of Goods Sold: Shipping (Rentals & Sales
        Only)` pairs with `4150`. So the **Shipping** half is complete — a passthrough with its
        revenue and its bought-in cost on the same product line, which is what a passthrough should
        look like, and its margin is the markup. The **Trucking** half has revenue on 4100 and its
        cost in two places that are not here: labour COGS carrying `cost_type: delivery`
        (ADR-0019, 5800/5801) and vehicle COGS, whose accounts ADR-0030 has not chosen. **Reading
        this pool's margin before vehicle COGS lands overstates trucking**, in exactly the way the
        file header warns about for `Delivery`.
        Restored to `ledger/dimensions.yaml` by the same ruling: 23 lines, $39,665.00, 2.35% of
        revenue, the 14th largest of 20 lines — above `Expendables`, `Carts & Ramps` and
        `Janitorial`, all of which were already declared. It had been dropped on a measurement that
        read the invoice-line denorm rather than the product master (api-cloudrun#473).
        ⚠️ `spikes/harness/allocation-basis-probe.ts` classifies `Transport` as goods by omission and
        is now wrong — erp-spec#15 already blocks re-running it.

    - id: crew
      product_line: Crew
      status: not_allocated
      accounts: [4100]
      reason: >-
        **Severable.** ADR-0029's argument for spreading `Delivery` is that delivery is NOT
        severable — "we wouldn't do a delivery with no products, we would rent far fewer products if
        we weren't delivering them" — so delivery cost is a joint cost of the product revenue. Crew
        hired out to a customer fails that test: it is work sold on its own terms. Spreading it would
        move a real profit or loss onto goods that did not cause it, which is ADR-0029's own error in
        the opposite direction. Owner, OQ-031, 2026-08-16.
      note: >-
        **SEVERABLE — keeps its own margin and does not spread.** OQ-031 answered by the owner
        2026-08-16. ADR-0029's severability argument for `Delivery` does not transfer: "we wouldn't
        do a delivery with no products", but crew hired out to a customer stands on its own.
        Spreading it would move a real profit or loss onto goods that did not cause it — the same
        error as leaving delivery alone, in the opposite direction.
        ⚠️ **Not allocated is NOT the same as not costed.** Owner, same ruling: "they still need
        labor cost allocated to them", via the **causal-job rule** — the shift lands on the line it
        performed. So this pool carries its own labour cost as well as its own revenue, and its
        margin is a real one. A severable line with revenue and no cost against it would report a
        margin near 100%, which is the failure this clause exists to prevent.
        Measured 2026-08-10: 9 lines, $3,550.00, 0.21% of revenue.

    - id: trash_cleanup
      product_line: Trash & Cleanup
      status: not_allocated
      accounts: [4100]
      reason: >-
        **Severable**, on the same criterion as `crew`: a wrap cleanup is a service contracted on its
        own terms, not a joint cost of the rental. Spreading $144,975 onto goods that did not cause
        it would misstate both sides — goods margin down, and a real service margin erased. Owner,
        OQ-031, 2026-08-16.
      note: >-
        **SEVERABLE — keeps its own margin and does not spread.** OQ-031 answered by the owner
        2026-08-16, on the same criterion as `crew`: a wrap cleanup stands on its own, so spreading
        it would move a real profit or loss onto goods that did not cause it.
        ⚠️ **Re-measured 2026-08-10: 70 lines, $144,975.00, 8.58% of revenue — the THIRD LARGEST
        product line in the business.** This note read "2 lines, $1,750.00, 0.1% of revenue" until
        then, off a line denorm that was null on 227 categorised lines (api-cloudrun#473). An 83×
        error, and it is the reason OQ-031 was framed as a tidy-up when it was the largest open
        decision in this file.
        ⚠️ **The labour qualifier matters most here, because of that size.** Owner: "they still need
        labor cost allocated to them", via the causal-job rule — a crew-day spent on a trash sweep
        attributes to this line because that is the job that caused it. $144,975 of revenue on its
        own P&L line with no cost against it would report a margin near 100% and would be the most
        misleading number this report could produce.

  # ── pools that are the same shape and are NOT yet expressible ────────────────────────────────
  # `pools` above is keyed by an ACTIVITY PRODUCT LINE, because that is what today's data has: an
  # activity's revenue and cost meet on a line an operator picked. The pools below have no product
  # line and in some cases no accounts, so the schema cannot express them yet and inventing a shape
  # for them would be guessing.
  #
  # This is the honest bucket, on the same terms as `unwritten` in `ledger/posting-rules.yaml`:
  # every entry owes a tracked issue, and gate 13 fails on one that does not carry it. A deferral
  # that nobody is holding is indistinguishable from an omission.
  deferred_pools:
    - id: vehicle_cogs
      issue: erp-spec#12
      reason: >-
        ADR-0030 moves vehicle running cost into COGS on the 5800/5801 absorbed/unabsorbed pattern,
        and explicitly does NOT choose the accounts — "the chart picks the next free pair". With no
        accounts there is nothing to pool. 2025 actuals across 6400–6404 total $21,844.77.
        It is also the pool that most changes this report: `Delivery` currently carries almost no
        cost, which is exactly why the un-allocated view shows it at a loss.

    - id: trip_travel
      issue: erp-spec#12
      reason: >-
        The cost of a shared run that served several jobs. It is a sub-allocation INSIDE delivery
        cost — from one trip to the several orders it served — before this report's allocation from
        an order to its goods. Two chained allocations, and the inner one has no basis stated and no
        data: nothing records which orders shared a run.

    - id: warehouse_overhead
      issue: erp-spec#12
      reason: >-
        Still an operating expense, not COGS, so it is below the gross margin this report presents
        and there is no pool to spread. It becomes real only if a decision moves it into COGS, which
        no ADR has made. `cost_type: warehouse` already exists on 5800 for labour, which is the
        narrower thing and is not the same claim.

  # ── presentation ─────────────────────────────────────────────────────────────────────────────
  presentation:
    own_and_allocated_shown_separately: true
    own_and_allocated_reason: >-
      ⚠️ **The single most important rule on this report, and it is a measurement, not a
      preference.** On 115 of 305 delivery-bearing order-groups — holding $89,425, **41.4% of all
      delivery revenue** — the pool is LARGER than the goods revenue it spreads over. Ratio median
      0.775, p90 3.13, max 25.0.
      ⚠️ **Measured on the pre-repair corpus; pending re-measurement, blocked on erp-spec#15.** The
      probe read a line denorm that was null on 227 categorised lines, so those lines counted toward
      no base at all (api-cloudrun#473). **This share must FALL** — the base grows on exactly the
      groups where it was thinnest. The rule does not depend on the magnitude: one group where the
      pool exceeds its base is enough to require the two figures be shown separately, and the
      `Crafty` case is a real invoice pattern, not a rounding artifact.
      Where a pool exceeds its base, pro-rata spreading does not adjust a product line's margin, it
      REPLACES it. `Crafty` receives $21,958 of allocated delivery revenue against $11,735 of its
      own — 187% — from five near-identical invoices where a $1,500–$2,500 delivery sits against
      $480–$800 of Crafty as the only goods on the order.
      So every figure appears twice, own and allocated, and never only as their sum. A reader who
      cannot separate them cannot tell a product's economics from an activity's.

    unallocated_row_shown: true
    unallocated_row_reason: >-
      An order carrying activity revenue and NO goods line has no denominator, under every basis.
      Measured 2026-08-09 **under this file's own base definition** — null-product-line goods
      included, voids excluded: **11 order-groups, $11,150.00, 5.16% of delivery revenue**
      (12 / $11,400.00 / 5.28% including the one void). It is reported on its own row, never forced
      onto an arbitrary line, never spread across all lines, and never dropped.
      ⚠️ **These are service-only JOBS, not orphaned deliveries**, and the row should be read that
      way: CFS sold labour — install, tear-out, relocate, trash removal — with no rental or retail
      goods on the order at all, so there is genuinely no product line the pool belongs to. That is
      the argument FOR the row rather than a defect it records. **85.5% of it is one customer, one
      service, five weeks**: five Netflix `Duradeck Install / Tear Out / Relocate` invoices totalling
      $9,750.00 between 2025-02-28 and 2025-04-04. 2024 contains none at all and 2026 contains one
      $250 line, so it is not a standing practice.
      Watch the row for service-only work becoming a larger share of the business — not for booking
      errors. (`inbox/2026-08-09-correction-the-unallocable-population-is-smaller-and-is-one-customer.md`)
      ⚠️⚠️ **THE DOMINANT CASE HERE PROBABLY IS NOT UNALLOCABLE, re-read 2026-08-10.** Those five
      Netflix orders qualified because their lines carried no product line — but Duradeck **is**
      categorised at the product master, as `Surface Protection`, so after the repair
      (api-cloudrun#473) they carry a goods line and have a denominator. If that holds, **85.5% of
      this row's measured population disappears** and "service-only jobs, not a defect" was a
      conclusion drawn from the defect. Pending re-measurement, blocked on erp-spec#15; the share
      must FALL and may approach zero.
      **The row is retained on its own merits.** An order carrying activity revenue and no goods
      line genuinely has no denominator, and forcing such a pool onto an arbitrary line would be
      worse than reporting it — that argument never rested on the population size. What is retracted
      is the claim that the population is real and characterised.

    null_product_line_row_shown: true
    null_product_line_row_reason: >-
      `product_line: null` is a legal determination, not an absence (ADR-0025, REQ-LED-001), so it
      is a countable population and gets a row. Goods-account revenue carrying null is part of the
      allocation BASE and absorbs its share; service and other revenue carrying null is neither pool
      nor base and reports below the allocated margin.
      Measured 2026-08-10 the untracked share is **15.00% of line revenue** ($253,306.59 of
      $1,688,980.87), and after the repair it is exactly the two populations that are not defects:
      **128 custom lines with no product master** ($233,667.63) and **170 lines on genuinely
      uncategorised products** ($19,638.96). The first is the one to watch — a custom line is where
      a new product line announces itself.
      (`inbox/2026-08-10-the-untracked-revenue-denorm-is-repaired-and-28-7-percent-is-now-15-percent.md`)
      ⚠️ This read "28.8% ... 2.8% correctly dimensionless, 22.1% service revenue where null is the
      decided answer, 4.0% — 143 lines, $67,156 — where a product line obviously applies and nobody
      set one" until 2026-08-10. That decomposition was taken off the invoice-line denorm; joined to
      the product master, **the whole of "nobody set one" is $688.00 — 0.041% of all line revenue**
      (api-cloudrun#473, repaired). The 22.1% in particular was not service revenue where null was
      decided; most of it was a derivation that never ran.

  # ── revenue with no line-level representation ────────────────────────────────────────────────
  revenue_without_line_representation: >-
    **The report is built from POSTINGS, not from invoice lines, and that is what closes this hole.**
    REQ-LED-001 refuses a posting to a dimensioned account that does not DECLARE its product line,
    so in the target system there is no revenue invisible to this report: every revenue posting
    carries a product line or an explicit null, and both have rows here.
    ⚠️ The hole is real in HISTORY. The 2023 P&L shows 4120 Contract Labor Income of $156,500 while
    only $31,570 across 3 lines appears in the invoice corpus carrying line-level tracking — the
    rest is not in those 999 invoices at all. That revenue cannot be given a product line by this
    report, because the documents that would say do not exist. It belongs to ADR-0020's restatement,
    which forbids altering any amount, so the restated postings will carry `product_line: null` and
    land in the null row. **A pre-cutover period's null row is therefore not comparable to a
    post-cutover one**, and the report must say which side of the cutover a period falls on rather
    than let a reader compare across it.
