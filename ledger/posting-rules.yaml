# Posting rules — the ONLY place a business event becomes debits and credits.
#
# Past this boundary the ledger knows nothing about discounts, legs or rentals. Each rule names its
# trigger, its source document, and the balanced set of postings it produces.
#
# ── coverage is measured against the event storm, not against a list someone typed ──────────────
# The previous revision of this file carried a trailing comment naming **six** rules that "must
# exist". Counting events with `ledger` as producer or consumer across `contexts/*/events.yaml`
# gives **29** (re-measured 2026-08-17, `code:2026-08-17:erp-spec:contexts/*/events.yaml`). The
# comment predated the m1 event storm and was never revisited, so m3's exit criterion — "posting
# rules defined for every source document type" — was not merely unmet, it was unmeasurable.
#
# Every one of the 29 appears below in exactly one of four buckets, and gate 10f fails if any event
# is missing from all of them or present in more than one:
#
#   rules[] status: specified  14   fully written, with golden vectors
#   rules[] status: blocked     2   named blocker that is genuinely still open; NO postings written
#   no_posting[]               13   produces no GL posting at all, with the reason
#   unwritten[]                 0   in scope, no blocker, not yet specified — each names an issue
#
# ✅ **AND SOMETHING COUNTS THEM NOW — gate 10q.** ⚠️ Both numbers above were WRONG when it landed:
# the table said `no_posting[] 11` against **13** entries, stale since `EVT-PRO-001` arrived with
# the procurement context and `EVT-BIL-007` with ADR-0033, and the paragraph said **24** because
# that was the 2026-08-09 measurement and nothing re-took it (24 + 3 procurement + `EVT-BIL-007` +
# `EVT-FUL-008` = 29, which is what makes the old number recognisable rather than merely wrong).
# **When a doc states a count, something must count it** — the chart header carried "138 entries,
# four minted" for weeks on the same footing, until gate 16.
#
# **`unwritten` is empty as of 2026-08-16, and this time nothing is parked anywhere.** It held seven
# rules after this file's first pass; six were specified on 2026-08-09 and `EVT-FUL-001` moved to
# `no_posting` (erp-spec#5). The last two — `EVT-PRO-002` and `EVT-PRO-003` — are specified below as
# `obligation_accrued` and `vendor_bill_received` (erp-spec#14), which is what makes m3's
# `posting_rules_cover_events` and `vectors_cover_rules` reachable at all: both require
# `unwrittenRules === 0`, so a single entry here holds two exit criteria red.
# The bucket stays in the schema — it is where the next uncovered event goes, and gate 10f requires
# each entry to name a GitHub issue so it cannot become a dumping ground.
#
# ── rule shape ──────────────────────────────────────────────────────────────────────────────────
#   id                       snake_case, unique
#   status                   specified | blocked | unwritten
#   trigger.event            an EVT- id that resolves
#   trigger.source_document  the document the rule reads
#   accounting_date          a NAMED FIELD of the source document. Never a clock word — the date a
#                            transaction belongs to is business data (ADR-0010, charter fence).
#   posting_timestamp        always the literal `assigned_by_ledger`. Monotonic, never back-dated.
#   postings[]               paired transfers, matching TigerBeetle's model and the vector shape:
#                              debit_account / credit_account   a GL code, or a dotted path
#                              per                              fans the posting over a collection
#                              amount                           a dotted path — NEVER an expression
#                              keys                             which KEYS this transfer carries
#   control_total            a field of the source document the transfer amounts must sum to
#   invariants[]             what must hold, in prose, each traceable to a REQ/ADR
#   vectors_dir              ledger/vectors/<id>/
#
# **A posting whose amount is zero is not written.** A TigerBeetle transfer carries a non-zero
# amount, so a zero-value leg is an absence rather than a transfer — a fully depreciated asset is
# disposed of with ONE relief leg, not two, an ordinary payment writes no unapplied leg, and a
# `per:` over an empty collection produces nothing at all. This is why `asset_basis_adjusted` can
# legitimately post nothing while still being `specified`, and why the control total of such an
# entry is zero rather than unstated. **Gate 10m fails on a zero-amount transfer in any vector** —
# it was added after a deliberately zero leg passed every other check, because a zero adds nothing
# to a control total and 10i therefore cannot see it.
#
# **`amount:` is a path, never arithmetic.** Gate 10e forbids `+ - * / %` in it. This is a fence,
# not formatting: every rounding decision stays upstream in the source document where the money
# rules already apply, so a posting rule can never become the place a rate gets quantized. It is
# also what stops OQ-018's overtime-premium allocation from quietly landing inside a posting rule
# instead of inside the shift record.
#
# ── KEYS, and why this file is now the authority on them (ADR-0036, superseding ADR-0018) ───────
# **A transfer carries KEYS, not classifications.** Until 2026-08-16 each posting declared a
# `dimensions:` map, and WHICH dimensions it owed was read off its accounts' own `dimensions:` lists
# in `chart-of-accounts.yaml` (ADR-0025). ADR-0036 removed both: a product line is
# `products.uid_tracking_category`, a mutable field on a mutable master that has moved twice in one
# month, and freezing it into an immutable transfer is the defect whichever field holds it.
#
# ⚠️ **The authority MOVED, it did not disappear, and it moved to this file.** Which keys a posting
# owes is a property of WHAT HAPPENED, not of where it landed — so it is stated per posting here,
# and `chart-of-accounts.yaml` no longer carries a `dimensions:` key at all (gate 10a fails on one).
# Gate 10h checks every golden vector's transfers against the rule the vector names: two files the
# rule does not control, so the check stays independent of the thing it is checking.
#
#   keys:
#     causal_orders:  a dotted path to the order or orders that caused the transfer, or the literal
#                     `null` where this rule ALWAYS declares that none applies. **Present on every
#                     posting of every rule** — that universality is REQ-LED-001.
#     invoice:        a dotted path, only where the posting arises from billing.
#     line:           a dotted path to the ROW within the source document — `item.path`, never
#                     `item.uid` (`uid` identifies the product and repeats within one document).
#   keys: mirrors_original_transfer / mirrors_retracted_transfer
#                     a reversal copies the keys of what it reverses. ⚠️ **A stated limit**: gate
#                     10h can enforce the universal `causal_orders` arm on these and cannot check
#                     the rest, because the key set varies per mirrored transfer rather than per
#                     rule. `invoice_voided` and `settlement_reversed` are the only two.
#
# **ABSENCE is refused; an explicit null is not** (REQ-LED-001). A declared null is a determination —
# countable, reportable, attributable — while a missing key is indistinguishable from an oversight.
# An empty list is refused alongside absence, for the reason `""` was refused for a dimension: it
# satisfies a naive presence check while meaning nothing.
#
# ⚠️ **A key the rule does not name is refused as firmly as a missing one.** That arm has bitten
# already — gate 10h was fired red against a `vendor_bill_received` vector on 2026-08-16 with
# `transfer[N]: declares \`product_line\` but neither account requires it`. It is the arm erp-spec#20
# recorded as "genuinely undecided", which was stale when it was written.

rules:
  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: invoice_issued
    status: specified
    trigger:
      event: EVT-BIL-001
      source_document: invoice
    accounting_date: invoice.invoice_date
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: false
    postings:
      - debit_account: 1200
        credit_account: line.revenue_account
        per: invoice.lines
        amount: line.net_minor
        keys:
          causal_orders: line.causal_orders
          invoice: invoice.id
          line: line.path
      - debit_account: 1200
        credit_account: tax_component.payable_account
        per: invoice.tax_components
        amount: tax_component.amount_minor
        keys:
          causal_orders: null
          invoice: invoice.id
    control_total: invoice.total_minor
    invariants:
      - >-
          **A revenue transfer carries three keys and no classification** (ADR-0036, REQ-LED-001):
          the causal order, the invoice, and the row within it. The product line is NOT among them —
          it is derived at report time by joining `line` to the product master.
          **What is refused is ABSENCE, not null.** An explicit `causal_orders: null` records that no
          causal order applies and is recorded; a missing key means nobody decided and is refused, as
          is an empty list. ⚠️ **The null arm is not hypothetical here** — 30 of 1,010 issued
          invoices carry no `order` divider at all, holding 87 revenue-bearing lines worth
          $87,839.76, and **0 of the 30 reference an order while 30 of 30 carry a `crms_id`**. They
          are legacy CRMS imports: a migration population, not a live pattern. Owner, 2026-08-16:
          "we can allow source order null."
          **One key may serve all three.** `INVOICE_ITEM_LEVELS` is `[order, destination, group]`
          against `ORDER_ITEM_LEVELS`'s `[destination, group]`, so an invoice item's path is the
          order item's path prefixed by an order divider and `path[0]` IS the causal order. ✅ Owner,
          2026-08-16: "we can change order path to match invoice path in v1" (api-cloudrun#538),
          which turns "where the two agree" from a conditional into an invariant for everything the
          live system produces. It cannot reach the 30 — they reference no order, so there is nothing
          for a divider to name.
          ⚠️ **A posting keyed on a wrong path is wrong forever.** 59 of 9,307 comparable invoice
          lines (0.634%) sit at a different path than their order line — six times the count
          api-cloudrun#485 reported before it was closed `NOT_PLANNED` with the divergence standing.
          The 267 invoice-only lines are NOT part of that number; counting all 326 would manufacture
          a defect out of ordinary invoicing.
          **4800 Other Income is unaffected and still means what it meant** — "this was not a
          categorised sale at all". An account is a ledger fact; a category is not.
      - >-
          No posting takes an accounting date inside a closed period (ADR-0010, ADR-0017). The check
          is on accounting date, never on posting timestamp.
      - >-
          The credit account is determined by the item's TYPE, not by which product the operator
          picked — a `surcharge` books to 4110 and a `service` to 4100, always (ADR-0021).
      - >-
          This posting is what MAKES the invoice issued (ADR-0022). `lifecycle` is derived from the
          existence of this AR posting, never assigned.
    relates_to: [REQ-LED-001, ADR-0010, ADR-0017, ADR-0018, ADR-0021, ADR-0022]
    vectors_dir: ledger/vectors/invoice_issued/

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: invoice_voided
    status: specified
    trigger:
      event: EVT-BIL-002
      source_document: invoice
    accounting_date: void.accounting_date
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: false
    postings:
      - debit_account: original_transfer.credit_account
        credit_account: original_transfer.debit_account
        per: original_journal_entry.transfers
        amount: original_transfer.amount_minor
        keys: mirrors_original_transfer
    control_total: invoice.total_minor
    invariants:
      - >-
          **A reversal, never a delete** (REQ-BIL-001, the no-hard-deletes fence). Every transfer of
          the original entry reappears with its two accounts exchanged and its amount and KEYS
          unchanged — so the reversal is keyed to the same causal order, invoice and line as what it
          reverses, and any report derived from those keys nets to zero rather than losing one side.
          ⚠️ **This invariant read "the same dimensions" until 2026-08-16 and the substitution is not
          cosmetic.** Under ADR-0018 the reversal had to copy a CLASSIFICATION, so a category renamed
          between the posting and the void would net two different product lines against each other
          and leave both standing in the report. Under ADR-0036 both legs resolve through the same
          key to the same master record, whatever it says today — **the netting is now structural
          rather than dependent on nobody having reclassified anything in between.**
      - >-
          **If the original's period is closed, the reversal takes an accounting date in an OPEN
          period** (ADR-0017, EVT-BIL-002). A closed period's Parquet artifact is immutable and
          hashed; restating it would break the hash, which is the guarantee. The reversal is a new
          entry in an open period, not an edit of a sealed one.
      - >-
          An invoice with no AR posting is a draft document and there is nothing to reverse
          (ADR-0022). Voiding one is refused.
      - >-
          Voiding is not a bad-debt write-off. A void says the sale did not happen; a write-off says
          it happened and the money did not arrive, and that debits 6900 instead.
    relates_to: [ADR-0010, ADR-0017, ADR-0022]
    vectors_dir: ledger/vectors/invoice_voided/

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: period_closed
    status: specified
    trigger:
      event: EVT-LED-002
      source_document: period_close_request
    accounting_date: period.last_day
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: false
    postings: []
    no_postings_reason: >-
      Closing a period moves no money. It seals one — freezing the accounting-date range and
      recording the hash of the period's Parquet artifact. A close that posted anything would be
      changing the figures it is meant to be fixing.
    writes:
      close_record:
        period: period.id
        closed_at: assigned_by_ledger
        parquet_sha256: artifact.sha256
    control_total: null
    invariants:
      - >-
          The close record carries the **sha256 of the period's Parquet artifact** (EVT-LED-002,
          ADR-0017). Without it a closed period has no drift guarantee at all, so a close with no
          hash is refused.
      - >-
          After close, no posting may take an accounting date inside the period — regardless of its
          posting timestamp (ADR-0010). This is the invariant `formal/period-close.qnt` model-checks
          in m5; the vector and the model are two independent expressions of it, and if they disagree
          one of them is wrong.
      - >-
          Parquet is exported from MongoDB, not from TigerBeetle — Mongo holds the accounting date
          and is queryable, and TigerBeetle has no bulk export (ADR-0017).
      - >-
          A period with zero postings still closes and still produces a hashed artifact. A close that
          only works when there is activity is a hole, not a simplification.
    relates_to: [ADR-0010, ADR-0017]
    vectors_dir: ledger/vectors/period_closed/

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: settlement_recorded
    status: specified
    trigger:
      event: EVT-BIL-003
      source_document: settlement_session
    accounting_date: session.accounting_date
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: true
    postings:
      - debit_account: session.deposit_account
        credit_account: 1200
        per: session.settlements
        amount: settlement.amount_minor
        keys:
          causal_orders: null
          invoice: settlement.invoice
      - debit_account: session.deposit_account
        credit_account: 2050
        amount: session.unapplied_minor
        keys:
          causal_orders: null
    control_total: session.amount_minor
    invariants:
      - >-
          **One journal entry per SESSION, not per invoice** — a session is one operator action, and
          one payment may be applied across several invoices. That is what makes this entry span
          several source documents and is half of erp-spec#3's evidence that `journal_entry_id`
          cannot be derived from a single source-document reference. The current system already groups
          this way: `settlements.uid_session`, documented as "one per operator action — groups a batch
          payment or a multi-invoice allocation"
          (`code:2026-08-09:core@33f5654:src/schemas/settlement.ts`).
      - >-
          **The entry accounts for ALL the money that arrived** (control total), and the part that
          relieves no receivable is a liability rather than a refusal. `session.unapplied_minor`
          credits **2050 Customer Credit Balances** — the same account an unallocated credit note
          sits in, because it is the same fact: customer value CFS holds that is attached to no
          invoice. This is what all four surveyed suites do with an advance (OQ-028; NetSuite
          `Customer Deposits`, SAP a special G/L reconciliation account, Intacct an AR Advance, Odoo a
          down-payment liability).
          The remainder is zero on an ordinary payment, so the leg is not written at all — see the
          note on zero amounts in this file's header.
      - >-
          **Recording an overpayment is not endorsing it.** An operator who keys $15,000 for $1,500
          gets a visible liability rather than an error, and the deliberate cost is that the mis-key
          lands silently. The money is in the bank either way, and refusing to record it puts the
          ledger further from the bank rather than closer — so the check belongs in the client, which
          **warns before recording a remainder** (owner, 2026-08-09). A warning an operator can
          override is the right shape for a fact that is real but usually wrong.
      - >-
          **A session names exactly ONE deposit account.** Money that arrives in two accounts is two
          events, however it looked to the operator. Without this the debit side of the fan is
          ambiguous and the bank reconciliation (EVT-BNK-002) has nothing stable to match against.
      - >-
          A settlement against an invoice with **no AR posting** is refused — a draft invoice never
          debited AR, so crediting it manufactures a negative receivable (ADR-0022). Money received
          before an invoice exists is a customer prepayment, not a settlement.
      - >-
          **Both legs declare `causal_orders: null`, and the settlement leg carries the INVOICE.**
          Settlement moves money that was already keyed at the sale; a payment is caused by a
          customer paying, not by a job, and splitting one cheque across the orders behind an invoice
          would be an allocation with no basis. The unapplied leg carries no invoice either — it
          relieves no receivable, which is the whole reason it credits 2050 rather than 1200.
          ⚠️ This invariant read "Neither account carries a dimension: 1200 and the cash accounts all
          name none" until 2026-08-16. **That was an argument from the CHART, and the chart no longer
          answers it** (ADR-0036): the reason is now stated about the event.
    relates_to: [ADR-0010, ADR-0014, ADR-0022]
    vectors_dir: ledger/vectors/settlement_recorded/

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: settlement_reversed
    status: specified
    trigger:
      event: EVT-BIL-004
      source_document: settlement_reversal
    accounting_date: reversal.accounting_date
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: false
    postings:
      - debit_account: retracted_transfer.credit_account
        credit_account: retracted_transfer.debit_account
        per: reversal.retracted_transfers
        amount: retracted_transfer.amount_minor
        keys: mirrors_retracted_transfer
    control_total: reversal.amount_minor
    invariants:
      - >-
          **A bounced payment asserts the money never arrived** — distinct from a credit note, which
          asserts that money owed is being given back. The first reverses cash against AR; the second
          reverses revenue. Conflating them books a sale as uncollected or an uncollected sale as a
          return, and both misstate revenue.
      - >-
          **A reversal, never a delete, and never an edit** (REQ-BIL-001). The current system already
          holds this shape: `settlements` is append-only, a correction is a NEW row carrying
          `reverses`, and `reverses` is "provenance only, never arithmetic"
          (`code:2026-08-09:core@33f5654:src/schemas/settlement.ts`). Live example — settlement
          `4ab47fcb6d599e406636`, `type: payment_reversal`, `reason: source_retracted`, retracting
          `441cb6e9177eaf7085a1` on invoice 1689 (`api:2026-08-09:get_settlements`).
      - >-
          **Whole rows only — a retraction carries the amount of the row it retracts.** A partial
          reversal is refused: it would leave the retracted settlement half-standing with no record of
          which half, and "the payment partly arrived" is not a fact a bounce can assert.
      - >-
          **A settlement is retracted at most once.** A second retraction of the same row debits AR
          twice for one bounce and leaves the invoice reporting more owed than was ever billed.
      - >-
          **The reversal takes its OWN accounting date, in an open period** (ADR-0017) — the same
          manoeuvre `invoice_voided` performs, and for the same reason: a sealed period's Parquet
          artifact is hashed, so restating it breaks the guarantee.
    relates_to: [ADR-0010, ADR-0017, ADR-0022]
    vectors_dir: ledger/vectors/settlement_reversed/

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: credit_note_issued
    status: specified
    trigger:
      event: EVT-BIL-005
      source_document: credit_note
    accounting_date: credit_note.date
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: false
    postings:
      - debit_account: line.revenue_account
        credit_account: 2050
        per: credit_note.revenue_reversal_lines
        amount: line.net_minor
        keys:
          causal_orders: line.causal_orders
          line: line.path
      - debit_account: 6900
        credit_account: 2050
        per: credit_note.write_off_lines
        amount: line.net_minor
        keys:
          causal_orders: null
      - debit_account: tax_component.payable_account
        credit_account: 2050
        per: credit_note.tax_components
        amount: tax_component.amount_minor
        keys:
          causal_orders: null
    control_total: credit_note.total_minor
    invariants:
      - >-
          **The credit side is 2050 Customer Credit Balances, NOT 1200.** A credit note is
          issued against a **settlement point** (ADR-0033 §3 — a credit is negative receivable and
          partitions the way the receivable does; pre-tree this said "an organization") and allocated
          to invoices afterwards, so between the two it is attached to no invoice. Crediting AR at issue puts the unallocated balance in the control
          account while no invoice in the subledger carries it, and AR stops tying to the sum of open
          invoices by exactly that amount. The current system already keeps this number —
          `credit-notes.remaining_credit_cents` — and moves an invoice's `amount_credited` only when an
          allocation row exists (`code:2026-08-09:core@33f5654:src/schemas/settlement.ts`).
      - >-
          **Bad debt is not a revenue reversal, and that is the whole of the debit side.** A write-off
          says the sale happened and the money did not arrive, so it debits **6900 Bad Debt** and the
          revenue stands. Everything else is a return or an allowance — the customer never owed it —
          and debits **the line's own revenue account**. This is `deriveCreditPostingAccount` in the
          current system (`code:2026-08-09:core@33f5654:src/schemas/credit-note.ts`), and history does
          not obey it: 4 of 12 live notes are miscoded, CN-1007 booking a bad-debt write-off to 4210.
      - >-
          **A write-off reverses no tax.** The sale stands, so the tax charged on it stands; relief for
          tax remitted on an uncollectible receivable is claimed on the return, which is the tax
          context's business and not a reversal of this posting. A revenue-reversal note DOES reverse
          its tax, because that sale is being undone.
      - >-
          **A line whose posting account cannot be determined is refused, not defaulted.**
          `deriveCreditPostingAccount` returns null for `correction` and `unspecified` deliberately —
          a correction may be adding a credit that was missed or removing one that never happened, so
          the account depends on what is being corrected and the operator must state it.
      - >-
          **A revenue-reversal line carries the CAUSAL ORDER and the LINE of the sale it reverses**
          (REQ-LED-001, ADR-0036) — otherwise the reversal nets the total to zero while leaving the
          original standing in every derived report. ⚠️ This read "carries the product line of the
          sale it reverses" until 2026-08-16; keying to the line is strictly stronger, because the
          product line is then read off the same master record for both halves and cannot disagree.
          **It carries NO invoice key, and that is ADR-0033 rather than an omission.** A credit note
          is issued against a SETTLEMENT POINT and allocated to invoices afterwards, so between the
          two it is attached to no invoice — which is also why the credit side is 2050 and not 1200.
          `credit_note_allocated` is where the invoice key appears.
          **A write-off declares `causal_orders: null`.** Bad debt is caused by the customer not
          paying, not by the job that earned the revenue; the sale stands and its own posting keeps
          its keys.
    relates_to: [REQ-LED-001, ADR-0022, ADR-0025]
    vectors_dir: ledger/vectors/credit_note_issued/

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: credit_note_allocated
    status: specified
    trigger:
      event: EVT-BIL-006
      source_document: allocation_session
    accounting_date: session.accounting_date
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: true
    postings:
      - debit_account: 2050
        credit_account: 1200
        per: session.allocations
        amount: allocation.amount_minor
        keys:
          causal_orders: null
          invoice: allocation.invoice
    control_total: session.amount_minor
    invariants:
      - >-
          **This is the entry that spans source documents, and it is measured rather than argued.**
          One operator action may draw on several credit notes: invoice 1767 takes $247.75 from
          CN-1015 and $27.26 from CN-1017 under one `uid_session`
          (`api:2026-08-09:get_settlements`). One note may also be split across several invoices —
          CN-1015's $259.74 goes $247.75 to invoice 1767 and $11.99 to invoice 1751. Either way the
          entry references more than one source document, which is why `journal_entry_id` cannot be
          derived from one (erp-spec#3).
      - >-
          **The accounting date is `max(credit_note.date, invoice.date)`** — the only date on which
          both facts are true. Verified 6 of 6 on prod and already load-bearing in the current system,
          where an allocation carries its own date rather than the note's
          (`code:2026-08-09:core@33f5654:src/schemas/settlement.ts`).
      - >-
          **An allocation may not exceed the note's remaining credit.** 2050 holds one balance per
          note; over-allocating drives that balance negative, which is the ledger asserting the
          business gave back more than it ever credited. `credit-notes.remaining_credit_cents` is the
          live counterpart.
      - >-
          Allocating to an invoice with **no AR posting** is refused, for the same reason a settlement
          against a draft is (ADR-0022) — there is no receivable to relieve.
      - >-
          **Issue and allocation are separate events on purpose.** Collapsing them would make an
          unallocated credit unrepresentable, and a credit note is unallocated for as long as the
          customer has not been billed against it.
      - >-
          ⚠️ **The two legs may sit at DIFFERENT settlement points, and the rule must read both rather
          than assume one.** Under ADR-0033 the 2050 leg is attributed to the node holding the credit
          (`from_billed_to`) and the 1200 leg to the node the invoice was addressed to
          (`to_billed_to`). Where they differ, EVT-BIL-007 records the authorization — it posts
          nothing, because this rule already moves the money exactly once.
          **Both nodes must resolve to the SAME organization.** A crossing between two organizations
          is refused outright: ASC 210-20-45-1 permits setoff only between amounts due to and from
          the same party, and that is the one line all six references in the 2026-08-11 survey agree
          on. Moving value between legal entities is a refund out and a payment in, not an
          allocation.
          Historical population for a crossing: **zero** — 8 of 9 prod allocations name their note's
          own organization, and the ninth crosses a duplicate `Free Spirit Media` pair that the
          ADR-0032 mapping collapses (`api:2026-08-11:get_credit_notes_uid_allocations`).
    relates_to: [ADR-0010, ADR-0014, ADR-0022, ADR-0033]
    vectors_dir: ledger/vectors/credit_note_allocated/

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: asset_disposed
    status: specified
    trigger:
      event: EVT-FA-003
      source_document: asset_disposal
    accounting_date: disposal.accounting_date
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: false
    postings:
      - debit_account: asset.accumulated_depreciation_account
        credit_account: asset.asset_account
        amount: disposal.accumulated_gaap_minor
        keys:
          causal_orders: null
      - debit_account: 1998
        credit_account: asset.asset_account
        amount: disposal.nbv_gaap_minor
        keys:
          causal_orders: null
    control_total: asset.cost_minor
    invariants:
      - >-
          **The GAAP book, and only the GAAP book, posts** (ADR-0026). Tax NBV differs — most of this
          fleet is §179'd to zero in year 1 while GAAP carries it 5, 10 or 20 years — so the tax gain
          differs too, and it is §1245 recapture rather than a book gain. `EVT-FA-003` carries
          `nbv_tax_minor` for exactly that reason: the register computes the tax result and the read
          side reports it. No tax-basis value reaches TigerBeetle.
      - >-
          **Accumulated depreciation plus net book value equals cost**, which is what the control
          total checks. The two legs relieve the asset account to zero between them; if the register's
          two numbers disagree with the asset's cost, the entry is refused rather than plugged.
      - >-
          **PROCEEDS ARE NOT POSTED HERE.** Cash for a sold asset arrives through the sale document —
          an invoice line coded to 1998 (EVT-BIL-001, ADR-0021) or a bank receipt (EVT-BNK-002).
          Posting them here as well would debit the cash twice. 1998 therefore holds the NBV as a
          debit and the proceeds as a credit, and its balance IS the gain or loss without anything
          having to compute one — which is also why no leg of this rule needs a conditional.
      - >-
          **A loss is a debit to 1998 and that is by design.** The account's chart entry already says
          so: it is the one place in this chart where a normal balance is routinely violated, and its
          live classification as an Asset is corrected to revenue there.
      - >-
          **An asset is disposed of once.** A second disposal credits an asset account already at
          zero, manufacturing a negative asset and a second gain out of one sale.
      - >-
          A fully depreciated asset has a zero NBV, so the second leg is **not written at all** — one
          transfer, not a zero-amount one. See the note on zero amounts in this file's header.
    relates_to: [ADR-0007, ADR-0010, ADR-0021, ADR-0026]
    vectors_dir: ledger/vectors/asset_disposed/

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: asset_basis_adjusted
    status: specified
    trigger:
      event: EVT-FA-004
      source_document: basis_adjustment
    accounting_date: adjustment.effective_date
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: false
    postings:
      - debit_account: capitalisation.asset_account
        credit_account: capitalisation.funding_account
        per: adjustment.capitalisations
        amount: capitalisation.amount_minor
        keys:
          causal_orders: null
    control_total: adjustment.capitalised_minor
    invariants:
      - >-
          **Prospective, never retrospective.** The adjustment changes the remaining schedule from its
          effective date forward. An effective date earlier than the asset's last posted depreciation
          would require restating depreciation already posted — and in a closed period, already sealed
          and hashed (ADR-0017) — so it is refused. `EVT-FA-004` says this outright: "Not a
          restatement of prior periods."
      - >-
          **A tax-book adjustment posts NOTHING** (ADR-0026). A §179 election changes the tax basis
          and the tax schedule; the GAAP carrying value is untouched, so there is nothing to
          capitalise and `capitalisations` is empty. The entry's control total is zero and it writes no
          transfer — which is the difference between "no effect on the ledger" and "no effect", and
          `EVT-FA-004` carries `book` precisely so the two are distinguishable.
      - >-
          **A capital improvement is capitalised, not expensed** — Dr the asset account, Cr whatever
          funded it: **2010 Accrued Expenses: Received Not Invoiced** where the work is done and the
          vendor has not billed (the ordinary case, and the one erp-spec#14 corrected across this
          file), 2000 Accounts Payable where an invoice already exists, a cash account where it was
          paid outright, or 1999 Fixed Asset Clearing until the improvement is in service. Expensing
          it to 6xxx would understate the asset and overstate the period, and depreciate nothing.
      - >-
          **Cost basis is per book** (ADR-0007), so an adjustment names the book it applies to. An
          improvement that raises both bases is two register facts and one GL posting.
      - >-
          **`causal_orders: null`, declared rather than omitted.** A capital improvement is caused by
          the asset needing it, not by a job. ⚠️ This invariant read "No dimension applies: asset,
          payable and clearing accounts all name none" until 2026-08-16 — an argument from the chart,
          which no longer answers it (ADR-0036).
    relates_to: [ADR-0007, ADR-0010, ADR-0017, ADR-0026]
    vectors_dir: ledger/vectors/asset_basis_adjusted/

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: shift_recorded
    status: specified
    trigger:
      event: EVT-FUL-002
      source_document: shift
    accounting_date: shift.date
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: false
    postings:
      - debit_account: 5800
        credit_account: 2010
        per: shift.absorbed_allocations
        amount: allocation.amount_minor
        keys:
          causal_orders: allocation.causal_job
          line: allocation.id
      - debit_account: 6600
        credit_account: 2010
        amount: shift.unabsorbed_minor
        keys:
          causal_orders: null
    control_total: shift.cost_minor
    invariants:
      - >-
          **BUT-FOR CAUSATION BUILDS `absorbed_allocations`** (owner, 2026-08-17): _"if not for the
          order the person would not be hired"_. A guaranteed day is borne by the order that caused
          the hire, **including the part the work did not fill**.
          · **one order** → the whole paid day absorbs to it;
          · **several orders** → the idle portion splits **pro-rata by hours worked**, on the same
            basis and the same largest-remainder rounding the overtime premium already uses
            (OQ-018). No new machinery — a second amount on allocation rows that already exist.
          · **several days on one job** → each day is its own shift posting against the same
            `causal_job`; the cost stacks by accumulation and **there is no rule to write**.
          · **no order at all** → nothing absorbs, and the whole day is `shift.unabsorbed_minor`.
          ⚠️ **The unabsorbed leg therefore means "paid time no order caused"** — training, a company
          meeting, warehouse cleanup, unassigned shop time — **not** "the unworked part of a
          guaranteed day", which now belongs to the job. ADR-0019's frozen text calls the
          absorbed/unabsorbed gap a utilisation measure; under but-for that gap is small by
          construction, and "what is the guarantee costing us" is answered from `hours_guaranteed`
          against `hours_worked` on the shift records rather than from a GL account.
          ⚠️ **AND THAT LEG IS NOT COGS — it debits `6600 - Wages`, an operating expense** (ADR-0038,
          accepted 2026-08-17). `5801` was minted for it and is **deleted**: where no order caused
          the hire there is no revenue the cost is applicable to. Measured: the live COGS block is
          Xero type `Direct Costs` and 6600 is type `Expense`, so this leg lands below gross profit
          exactly where the incumbent already puts it.
          ⚠️ **Absorbed cost may never exceed `shift.cost_minor`.** But-for moved idle hours into
          the job; it did not license charging a job for hours nobody was paid for
          (`absorbed-hours-exceeding-the-paid-day-rejected`).
      - >-
          ⚠️ **A `contributed` SHIFT WRITES NO TRANSFER** (OQ-047, owner 2026-08-16; GAAP). An owner
          may work a shift and take no wage for it. **No obligation was incurred, so nothing is
          recognised** — ASC 958-605, which lets an entity recognise donated services, is
          not-for-profit ONLY, and a for-profit entity records no expense for owner labor it did
          not pay for. `shift.compensation` is the discriminator (`paid | contributed`) and it
          arrives on `EVT-FUL-002`.
          ⚠️ **Posting one anyway is the failure this refuses, and it is a SILENT one.** The credit
          leg is 2010 Accrued Expenses: Received Not Invoiced, so a contributed shift posted as a
          normal one asserts a liability that no bill can ever relieve — in the one account whose
          entire purpose is "received not invoiced". The entry balances, the control total matches,
          and 2010's balance stops meaning anything. `contributed-owner-shift-posts-nothing` is the
          accept vector and `contributed-shift-that-posts-rejected` is its minimal pair.
          **The shift and its `absorbed_allocations` are still RECORDED** — hours, causal job and
          `labor_line` all survive, because they are what the costing layer needs. **The imputed
          cost is a REPORT, not a posting** (ADR-0036's two layers: TigerBeetle holds the GL, Mongo
          holds the projection). ⚠️ **The GAAP gross margin is therefore flattered by contributed
          labor, and that is what GAAP requires** — which is why the imputed view has to EXIST
          rather than be optional. A margin that is honest only in a report nobody runs is not
          honest.
          **Surveyed before deciding** (CLAUDE.md → _Accounting decisions_). GAAP, Xero, SAP and
          Odoo keep an uncompensated labor cost out of the financial statements; NetSuite posts it
          against a cost-variance account and Intacct into a 9xxx range excluded from all standard
          reports. **All six agree on the credit side: nothing credits a payable.** The rejected
          alternative — Dr 5800 / Cr an owner-contribution account, which is what live `3130 Owner's
          Capital: Owner's Billable Time` was for — is refused on GAAP rather than on convenience
          (`inbox/2026-08-16-survey-an-unpaid-owner-shift-is-not-an-expense-and-every-reference-fences-imputed-labour-out-of-the-statements.md`).
          ✅ **This needs no conditional in the rule.** `cost_minor` is zero on a contributed shift,
          and this file already rules that a posting whose amount is zero is not written — so both
          legs and the control total fall out of the existing machinery.
      - >-
          **The credit leg is NOT a payroll liability, because CFS has no payroll liability and never
          has** (OQ-024). Payroll processing is a charter non-goal: an external employer of record
          stays, and CFS "does not calculate withholding, file payroll tax, or move payroll money".
          **An EOR is not payroll — it is a vendor that invoices.** Measured on CFS's own balance
          sheet at 2025-12-31 on both bases: current liabilities are 2000, the 2100 credit-card block,
          2200, 2600 and the two PSA accounts, and **no payroll liability in any of four comparative
          years** — consistent with 2160/2170/2180/2190 all being Archived. The ledger therefore never
          carries gross-to-net; withholding and employer taxes are the EOR's ledger.
      - >-
          ⚠️ **AMENDED 2026-08-16 (erp-spec#14): the credit leg is 2010 Accrued Expenses: Received
          Not Invoiced, not 2000 Accounts Payable.** It read 2000 because procurement's accrual stage
          did not exist and there was nowhere else for it to go — and that was wrong on the shift
          date, which is the whole point of the rule. **The EOR has not invoiced when the shift is
          worked**, so there is no invoice, no terms and no trade payable; there is a known amount
          owed for work already performed, which is a matched accrual. `vendor_bill_received`
          reclassifies it into 2000 when the EOR's invoice arrives.
          Nothing else about this rule moved at the time: the amount, the dates and the
          absorbed/unabsorbed split were unchanged, and the golden vectors changed one account code
          each. (Both dimensions were still on the transfer then; ADR-0036 removed them later the
          same day.)
          **This is the correction erp-spec#14 called "not a pure addition"**, and it is the reason
          the issue's own "nothing is blocked" framing understated it — until 2010 existed, every
          shift in the ledger overstated trade payables by its own cost.
      - >-
          ⚠️ **THE UTILISATION GAP NO LONGER EXISTS IN THE GL, and that is deliberate.** This
          invariant read "5800 absorbed / 5801 unabsorbed measures UTILISATION, not rate deviation"
          (ADR-0019), with the guaranteed-but-unworked balance landing in 5801 and the gap between
          the two as the idle-capacity number. **Two accepted decisions removed both halves**:
          but-for causation (ADR-0019, owner 2026-08-17) moved the unworked balance onto the order
          that caused the hire, and ADR-0038 removed `5801` outright. Utilisation is now a report
          over `hours_guaranteed` against `hours_worked` on the shift records — erp-spec#36 — and
          **not a subtraction between two GL accounts**. ⚠️ HOT-010's rate-variance half was refuted
          separately: OQ-050 measured that the EOR prices burden per RUN, so an apportioned rate IS
          a standard rate and a variance can fire (erp-spec#38).
      - >-
          **The unabsorbed leg declares `causal_orders: null` BY DESIGN and that is load-bearing** —
          now against `6600 - Wages` rather than a COGS account (ADR-0038). Paid time no order caused
          belongs to no job, and a leg that named one would make 6600 a plug absorbing whatever the
          allocation could not place. The null is DECLARED rather than the key omitted, which is the
          whole of REQ-LED-001: a determination someone can be asked about, not an oversight.
          ⚠️ **The refusal is unchanged by the account moving.** A causal order on this leg is
          refused because the rule does not name one, which is gate 10h's test — not because of
          anything the chart says, and not because of which account it debits.
          ⚠️ This invariant read "5801 is undimensioned BY DESIGN. Its chart entry names no dimension,
          so a posting to it may not declare one… 5800 names **both** `product_line` and `cost_type`;
          it is the only account in the chart that names `cost_type` at all (ADR-0025)." **Both
          halves are gone** (ADR-0036): no account names a dimension, and `cost_type` is renamed
          `labor_line` and derived from the shift's own allocation row rather than posted (OQ-042).
          The absorbed/unabsorbed distinction survives untouched — it is an ACCOUNT distinction, and
          accounts are exactly what ADR-0036 keeps.
      - >-
          **The overtime hour splits in two** (OQ-018). The BASE rate for every hour, overtime
          included, is direct labor charged to the causal job worked. The **PREMIUM** is allocated
          **pro-rata by hours across that day's causal jobs** — the standard cost-accounting
          convention, because the premium is caused by the day's volume in aggregate rather than by
          whichever job was on the clock after hour eight. Chronological attribution would make the
          same two jobs in the opposite order produce different COGS.
      - >-
          **A labor posting is keyed to the CAUSAL JOB, and its product line is read off the shift's
          allocation row at report time** (ADR-0036, OQ-042). ⚠️ This invariant read "A labor posting
          takes the product line of the REVENUE it serves… which is the entire reason `product_line`
          sits on revenue and COGS alike" until 2026-08-16. **The economics are unchanged and the
          mechanism is not**: delivery labor serving a delivery charge still lands in `Delivery` and
          crew prepping a table rental in `Tables & Chairs` — the report derives it, the transfer does
          not carry it. Gross margin by product line stays computable because both the revenue and
          the cost resolve through their own keys to the same master data.
          ⚠️ **`allocation.id` is a key in its own right, and HOT-014 is why.** One shift produces
          three transfers when it serves three jobs, so the causal order alone does not identify a
          row; the allocation row needs its own identity or two of the three become indistinguishable
          in the projection.
          **It is NOT allocated across the order's goods** (ADR-0029). A delivery serving a mixed
          order is keyed to the delivery job whole, because allocation is destructive and the
          official product-line P&L can spread it afterwards — where posting it spread cannot be
          undone.
          Measured: `Delivery` is the largest tracked line in the business at **$236,487.75 and
          13.91% of revenue**, so this rule decides where a large number lands
          (re-measured 2026-08-10,
          `inbox/2026-08-10-the-untracked-revenue-denorm-is-repaired-and-28-7-percent-is-now-15-percent.md`;
          read $216,050 / 12.8% until then, off a line denorm that was null on 227 categorised
          lines — api-cloudrun#473).
      - >-
          **The allocation is performed in the SHIFT RECORD, never here.** `amount:` is a dotted path
          with no arithmetic, so the pro-rata rounding — and the residual cent when hours do not
          divide the premium evenly — is decided upstream, in the document, where the money rules
          already apply. This is the fence that keeps a posting rule from becoming the place a rate
          gets quantized, and `overtime-premium-pro-rata-across-the-days-jobs` is a deliberately
          non-dividing case.
      - >-
          **Overtime a customer specifically asked for is charged direct to the order that asked, and
          the override is recorded AS an override** — the same shape OQ-004 gave a `handling_bucket`
          override, so costing can always tell a stated exception from the default.
      - >-
          **A sixth consecutive day worked is 1.5x for the whole day, and premium applies once**
          (OQ-019). The 6th-day multiplier does not compound with the after-eight-hours multiplier: a
          tenth hour on a sixth day is 1.5x, not 2.25x. "Consecutive" is a rolling count of calendar
          days worked, not a position within a payroll week — the industry convention, and CFS is
          non-union so nothing forces the statutory workweek reading.
      - >-
          ⚠️ **A seventh consecutive day POSTS. It is a compliance failure, not a rate** (OQ-019).
          Illinois ODRISA requires 24 consecutive hours of rest in every consecutive seven-day period,
          so the SCHEDULER refuses one with an audited override. The ledger records what happened —
          work performed is cost incurred, and refusing to post it would understate COGS and hide the
          breach in the one system that noticed it. The control belongs where the action is taken, not
          where the fact is recorded, which is the same reasoning OQ-028 applied to an overpayment.
    relates_to: [ADR-0019, ADR-0025, ADR-0036, ADR-0038, REQ-LED-001]
    vectors_dir: ledger/vectors/shift_recorded/

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: vehicle_cost_absorbed
    status: specified
    trigger:
      event: EVT-FUL-008
      source_document: vehicle_absorption_run
    accounting_date: run.period_last_day
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: false
    postings:
      - debit_account: 5900
        credit_account: 6409
        per: run.absorbed_allocations
        amount: allocation.amount_minor
        keys:
          causal_orders: allocation.causal_job
          line: allocation.id
      - debit_account: 5901
        credit_account: 6409
        amount: run.unabsorbed_minor
        keys:
          causal_orders: null
      - debit_account: 6409
        credit_account: 5901
        amount: run.over_absorbed_minor
        keys:
          causal_orders: null
    control_total: run.entry_total_minor
    invariants:
      - >-
          **The credit is 6409, never the natural accounts** (ADR-0030). 6400–6403 keep taking
          postings — a tank of diesel names no causal job, so the purchase records WHAT WAS BOUGHT
          and this run records WHY IT WAS CONSUMED. Crediting 6400–6403 directly is one account
          cheaper and destroys the gross figure that answers "how much fuel did we buy, how much was
          repairs"; with the contra in place the natural accounts net to zero while their gross
          activity survives.
          ⚠️ **The first draft of ADR-0030 said 6400–6403 "stop taking new postings", and its two
          halves could not both hold**: a posting made at the pump must choose absorbed or
          unabsorbed where no causal job is known, so everything lands unabsorbed, 5900 is never
          debited, and the gap is identically the whole cost. The split needs a pool in between, and
          a pool is a natural account.
      - >-
          **Absorption rides the SHIFT'S OWN ALLOCATION ROWS — no new event, no new document, no new
          key** (ADR-0030). A delivery, trucking or trash-removal job generates a shift (ADR-0011,
          OQ-010) carrying hours, a causal job and a `labor_line`; this run applies the vehicle rate
          to the same rows, so `allocation.causal_job` and `allocation.id` are the keys
          `shift_recorded` already writes. ✅ **The Delivery / Trash & Cleanup split comes for free**
          — the shift's `labor_line` already says which product line the row belongs to, so vehicle
          cost inherits the answer instead of needing an allocation of its own, and a single
          undifferentiated vehicle pool could not have served both (`Delivery` spreads onto the goods
          it delivered; `Trash & Cleanup` is severable and keeps its own margin).
          ⚠️ **`allocation.id` is a key in its own right, for HOT-014's reason**: one run posts many
          rows against the same causal job, so the order alone does not identify a transfer.
      - >-
          **5901 declares `causal_orders: null` BY DESIGN**, exactly as `shift_recorded`'s
          unabsorbed leg does. The residual
          belongs to no job; a residual that could name one would make 5901 a plug absorbing whatever
          the allocation failed to place, and the account IS the fleet-utilisation number.
          ⚠️ **AND IT IS WHY 5901 SURVIVED WHILE `5801` DID NOT** (ADR-0038): a rate residual on a
          fleet that DOES serve revenue is a costing imprecision, where a day no order caused is an
          absence of causation and reaches no revenue at all. ADR-0019 can say "absorption measures
          utilisation,
          NOT rate variance" because labor is costed at actual, from a real per-contact wage on a
          real bill. A van has no actual per-job cost — the true cost of a van-day is unknowable
          until a transmission fails — so this is a **predetermined rate on a stated normal-capacity
          denominator** (ASC 330-10-30-3) and 5901 is utilisation **and** rate deviation together.
          ADR-0030 calls naming the denominator a requirement rather than a footnote, and **it is
          not named anywhere yet: OQ-052.**
      - >-
          ⚠️ **A period may OVER-absorb, and the third posting is the conventional treatment rather
          than a decision ADR-0030 took.** A predetermined rate applied to actual distance can exceed
          the pool, and money is a non-negative integer here, so the direction is a separate leg
          (Dr 6409 / Cr 5901) rather than a negative amount. Exactly one of `unabsorbed_minor` /
          `over_absorbed_minor` is non-zero and the other writes no transfer at all, because a
          posting whose amount is zero is not written.
          ⚠️ **ADR-0030 does not address the over-absorbed direction** — it reasons only about "the
          standing cost of having a fleet at all". Resting it in 5901 as a credit is the single
          under/over-applied account every reference uses, and it mints nothing; **prorating it
          across the jobs instead is the alternative, and choosing between them is accounting-shaped
          (CLAUDE.md rule 8a). OQ-052 holds it.** Written rather than parked because a rule that only
          works when the numbers go one way is a hole, not a simplification — and
          `a-period-that-over-absorbs-credits-5901` is what stops that branch being a claim nobody
          exercised.
      - >-
          **`control_total: run.entry_total_minor` is the sum the entry posts, and the run states the
          pool separately so the two can disagree.** Under-absorbed:
          `entry_total = absorbed + unabsorbed = pool`. Over-absorbed:
          `entry_total = absorbed + over_absorbed`, which is `pool` plus twice the over-absorption.
          The run also carries `pool_minor`, and `pool = absorbed + unabsorbed - over_absorbed` is
          what a reader checks the document against. Using `pool_minor` as the control total would
          have made the over-absorbed case unrepresentable — the arithmetic would simply not close.
      - >-
          **6404 Vehicle: Tickets never absorbs and is not in the pool** (ADR-0030). A parking fine
          is not a cost of serving a job but a cost of how one was served, and absorbing it would
          make a product line look expensive because somebody parked badly. The survey supplies the
          harder reason: a fine is nondeductible (IRC §162(f)) and therefore a permanent Schedule M-1
          difference ADR-0026 keeps out of both books, and an account absorbed into a product line is
          no longer separable for that purpose. **6403 Parking & Tolls is the opposite case and IS in
          the pool** — a toll is deductible and is incurred by a specific run.
      - >-
          ⚠️ **A HIRED truck never enters this run** (ADR-0030). A hire arrives already attributed to
          a causal job, so it posts direct at actual to `5902 - Cost of Goods Sold: Vehicle (Hired)`
          through `vendor_bill_received`'s `bill.direct_lines[]`, which already carries both a
          `debit_account` and its own `causal_orders`. Pooling it was recommended earlier the same
          session on the grounds that "one mechanism is simpler to specify", **which is not the
          criterion the survey established**, and the reversal removed the hazard that this rate's
          denominator would have to include rented mileage or double-count it.
      - >-
          **The quantity is COMPUTED DISTANCE, and a destination that fails the plausibility gate is
          QUARANTINED rather than defaulted** (ADR-0030). Not zero distance, which silently
          under-absorbs, and not an average, which silently invents one. ⚠️ **A wrong coordinate is a
          valid-looking number and this corpus contains them** — `TBD, Chicago, IL` resolved near
          Bloomington, a Woodstock address resolved to New York state because the ZIP was read as a
          street number. The discriminator is stored, not heuristic: a bad geocode carries
          `urn:mbxadr-itp:` where a matched address carries `urn:mbxadr:`. It is **one-way** — every
          bad one is interpolated and not every interpolated one is bad — so it screens rather than
          decides, and pairs with a service-radius bound.
      - >-
          **The rate is applied UPSTREAM, in the run document, and `amount:` stays a dotted path.**
          Same fence as OQ-018's overtime premium: every rounding decision stays where the money
          rules already apply, so a posting rule can never become the place a rate gets quantized.
          **The rate is versioned** with the discipline `reporting/allocation-bases.yaml` states — a
          later composite of distance and time SUPERSEDES rather than mutates, because two periods
          computed at different rates would disagree about the same job's margin.
          ⚠️ **It is not REGISTERED in that file, and that is deliberate**: every field there
          (`base`, `zero_base`, `rounding`) describes spreading a pool proportionally over a base,
          and a rate applied to a quantity has none of them. ADR-0030 cites the discipline, not the
          registry.
      - >-
          ⚠️ **The presentation consequence is not optional** (SAB Topic 11.B / ASC 220-10-S99-8).
          Vehicle depreciation is deliberately deferred to SPIKE-005, so this cost-of-sales line
          excludes the depreciation related to the same activity — which means the line must be
          labelled to say so and **must not carry an unqualified gross margin**. That is exactly what
          the product-line P&L reports, so the label belongs there.
    relates_to: [ADR-0011, ADR-0019, ADR-0029, ADR-0030, ADR-0036, OQ-052, REQ-LED-001]
    vectors_dir: ledger/vectors/vehicle_cost_absorbed/

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  # BLOCKED — the blocker is named, is genuinely open, and NO postings are invented.
  # Gate 10h requires `postings: []` and zero vectors on these: a blocked rule cannot dodge the
  # vector requirement by half-specifying itself, and a plausible guess in a golden vector is worse
  # than a blank because it will be believed.
  # ⚠️ **This banner sat above `shift_recorded` — a `specified` rule — until 2026-08-17**, which read
  # as though the labor rule were blocked. It was left behind when that rule was unblocked.
  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: depreciation_run
    status: blocked
    blocked_by: [SPIKE-005]
    trigger:
      event: EVT-FA-002
      source_document: depreciation_schedule
    accounting_date: period.last_day
    posting_timestamp: assigned_by_ledger
    postings: []
    known:
      - "Dr 7000 Depreciation Expense / Cr the matching `Less-Accumulated Depreciation` account."
      - >-
          **Two sets of numbers per asset per period, ONE of them a posting** (ADR-0026). GAAP and tax
          bases run separately and both must produce a full P&L and balance sheet, but only the GAAP
          set reaches TigerBeetle; the tax set is derived at report time from the register's schedule.
          ⚠️ This entry previously read "Two postings per asset per period, not one", which asserted a
          parallel posting ledger nobody had decided on and which the fixed-asset suites mostly do not
          build — see `inbox/2026-08-09-tax-and-gaap-statements-are-both-required.md`.
    unknown:
      - >-
          **SPIKE-005** — hand-roll versus library. The conventions the engine applies (mid-month,
          half-year), the class lives (GDS vs ADS), and §179 and bonus effects on basis all change
          the AMOUNT, so no vector can be written until the engine is chosen and graded against its
          corpus. Errors here have filing consequences, not just reporting ones.
    relates_to: [ADR-0007]

  - id: bank_transaction_matched
    status: blocked
    blocked_by: [SPIKE-004]
    trigger:
      event: EVT-BNK-002
      source_document: bank_transaction
    accounting_date: bank_transaction.posted_date
    posting_timestamp: assigned_by_ledger
    postings: []
    known:
      - "Dr/Cr the cash account for the instrument, against the posting the transaction matched."
    unknown:
      - >-
          **SPIKE-004** — what Plaid actually provides. Pending-versus-posted semantics decide which
          date is the accounting date and whether a pending row may post at all; transaction-id
          stability decides whether match state can be keyed on it without corrupting silently. Plaid
          is a consumer-fintech product, not an accounting bank feed, and the gap is the deliverable.
      - >-
          Whether an unmatched transaction rests in **2500 Suspense** is the same spike's question —
          which is why 2500's disposition in the chart of accounts is `undecided` rather than a guess.
    relates_to: [ADR-0002, ADR-0009]

  - id: asset_acquired
    status: specified
    trigger:
      event: EVT-FA-001
      source_document: purchase_order
    accounting_date: acquisition.acquired_on
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: false
    postings:
      - debit_account: acquisition.debit_account
        credit_account: 2010
        amount: acquisition.cost_minor
        keys:
          causal_orders: null
    control_total: acquisition.cost_minor
    invariants:
      - >-
          **Unblocked by OQ-020, which gave procurement an owner.** The rule was blocked because no
          context owned purchase orders, so writing it would have placed procurement in the ledger by
          default — the arbitrary placement `contexts/ledger/events.yaml` refuses to make. Procurement
          is now the ninth context and owns the inbound document.
      - >-
          **The GAAP book posts and only the GAAP book** (ADR-0026). Cost basis is carried per book —
          §179 and bonus change the tax basis on day one for most of this fleet — but the tax basis is
          a fixed-asset register fact that the read side reports, never a transfer. An acquisition that
          posted both books would double the balance sheet.
      - >-
          **The debit is the asset account if the asset is in service, and 1999 Fixed Asset Clearing if
          it is not.** `in_service_on` is distinct from `acquired_on`
          (`contexts/fixed-assets/entities/asset.yaml`) and drives the depreciation convention, not
          this posting. 1999's balance at period end is therefore a real signal — assets bought and not
          yet capitalised — rather than a rounding account.
      - >-
          **The accounting date is when the asset was ACQUIRED, not when it entered service.** The
          obligation to the vendor arises on acquisition; depreciation starts on the in-service date.
          Conflating them would either delay a liability that exists or start depreciating an asset
          that is still in a crate.
      - >-
          ⚠️ **AMENDED 2026-08-16 (erp-spec#14): credit 2010 Accrued Expenses: Received Not Invoiced,
          not 2000 Accounts Payable.** This invariant previously read "Credit 2000 … that stage is
          procurement's to specify and is not modelled here yet" — it named its own defect and
          deferred it. The stage now exists: under procurement's three-stage lifecycle (OQ-020) a
          receipt that precedes its invoice accrues first, and `vendor_bill_received` reclassifies it
          into 2000 when the vendor bills.
          **An asset is acquired on the day it is received, and the vendor invoices later** — so on
          the acquisition date there is no invoice and no terms, and 2000 would be asserting trade
          debt that does not exist yet. The posting declares `causal_orders: null` either way, so
          nothing else about it changes.
      - >-
          **Below the capitalisation threshold there is no acquisition at all.** The live chart draws
          the line at $1,000 in the account names themselves — 6300 Tools, Machinery & Equipment (Less
          Than 1K), 6204 Building: Improvements (Less Than 1K), 6500 Rental Inventory (less than 1K).
          A cheap purchase is an expense, never an asset with a schedule, and routing one here would
          create a depreciating asset out of a box of clamps.
      - >-
          **`causal_orders: null`, declared rather than omitted** (REQ-LED-001, ADR-0036). An
          acquisition is not caused by a job — CFS buys a truck, not a truck for order 4471 — and the
          goods acquire a product line only when they earn revenue (ADR-0029). ⚠️ This invariant read
          "No dimension: asset accounts, 1999 and 2000 all name none" until 2026-08-16, which argued
          from the chart; the chart no longer answers it, and the reason was always about the event.
    relates_to: [ADR-0007, ADR-0026, ADR-0029]
    vectors_dir: ledger/vectors/asset_acquired/

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: obligation_accrued
    status: specified
    trigger:
      event: EVT-PRO-002
      source_document: obligation
    accounting_date: obligation.accrual_date
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: false
    postings:
      - debit_account: obligation.debit_account
        credit_account: 2010
        amount: obligation.amount_minor
        keys:
          causal_orders: obligation.causal_orders
        reaches_minted_accounts:
          5150: >-
            The accrual stage takes whatever account the bill would have taken — it is the same cost,
            recognised on the day it was received rather than the day it was invoiced — so a
            pass-through received before its vendor invoice arrives accrues into 5150 and the bill
            then reclassifies the LIABILITY alone (2010 -> 2000), never re-booking the expense.
          5902: >-
            Same reasoning for a hired truck: a hire used in one period and invoiced in the next
            accrues to 5902 with its causal job attached, which is what makes ADR-0030's "direct at
            actual" hold on the date of the job rather than on the date of the invoice.
    control_total: obligation.amount_minor
    invariants:
      - >-
          **The credit leg is 2010 Accrued Expenses: Received Not Invoiced, and it is a MATCHED
          clearing account rather than a period-end estimate.** The survey found all six references
          split accrued liabilities on **matched versus estimated**, not on goods versus services
          (`inbox/2026-08-16-survey-the-accrued-liability-is-a-matched-clearing-account-and-the-bill-reclassifies-rather-than-reverses.md`):
          a matched amount goes to a clearing account relieved by the bill (SAP GR/IR, NetSuite
          `Accrued Purchases`, Odoo `Stock Interim (Received)`), an estimated one to an
          accrued-expenses account relieved by a dated auto-reversal (Xero's model, and the textbook
          one). This event carries an amount from a **source document**, never an estimate, so it is
          the first kind — and that single fact decides `vendor_bill_received` too.
          **It is not 2000 Accounts Payable.** There is no invoice and no agreed terms, so it fails
          2000's own definition, and Reg S-X 5-02.19/20 requires trade creditors to be presented
          separately from other accrued liabilities. **It is not 2160 either**: CFS has no payroll
          liability across four years, payroll is a charter non-goal and the EOR is a vendor that
          invoices (OQ-024).
      - >-
          **This is not the only rule that accrues, and that is the point.** Three rules credit 2010:
          this one, `shift_recorded` (labor, through the shift record) and `asset_acquired` (fixed
          assets, through the acquisition). Procurement owns the accrual STAGE, not every document
          that reaches it — `contexts/procurement/context.md` already fences the asset register and
          stock levels out. What lands here is what procurement itself receives and no other context
          already posts: goods, subrentals, and services received under a purchase order.
      - >-
          ⚠️ **Labor never accrues through this rule.** A shift is one person's paid span for one
          day (OQ-005) costed at their actual wage (ADR-0019), and `shift_recorded` already performs
          the absorbed/unabsorbed split and the overtime pro-rata that no generic accrual could. So
          an obligation never debits 5800 and never carries a labor classification. (This invariant
          argued the point through `cost_type`, "which 5800 alone names"; ADR-0036 removed the field
          from every posting, so the fence is now simply that this rule does not touch 5800.)
      - >-
          **`causal_orders` is DECLARED on every transfer, and both arms are exercised by vectors**
          (REQ-LED-001, ADR-0036). A subrental received for a specific job names it; an insurance or
          fuel accrual is caused by no job and declares an explicit null. ⚠️ This invariant read
          "`product_line` is declared where the debit account names it and omitted where it does not
          … read off the account rather than inferred" — **the account no longer answers it**, and the
          new subject is better: what a receipt was FOR is a fact about the receipt, while its
          category was a fact about a master record. **A single-arm vector set would leave the other
          arm a claim**, which is why both are written.
      - >-
          **The accounting date is when the obligation was INCURRED, not when anyone recorded it**
          (ADR-0010, charter fence). That is the entire value of the stage: the ledger becomes
          accurate on the date work happened rather than on the date a vendor got round to invoicing.
          No posting takes an accounting date inside a closed period (ADR-0017).
      - >-
          **An obligation is accrued once.** A second accrual of the same receipt books the cost
          twice and leaves 2010 holding a liability the bill can never relieve — the same class of
          silent, balanced double-count `vendor_bill_received` guards the other end of.
    relates_to: [REQ-LED-001, ADR-0010, ADR-0017, ADR-0025]
    vectors_dir: ledger/vectors/obligation_accrued/

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  - id: vendor_bill_received
    status: specified
    trigger:
      event: EVT-PRO-003
      source_document: vendor_bill
    accounting_date: bill.bill_date
    posting_timestamp: assigned_by_ledger
    journal_entry:
      spans_multiple_source_documents: true
    postings:
      - debit_account: 2010
        credit_account: 2000
        per: bill.reclassifications
        amount: reclassification.amount_minor
        keys:
          causal_orders: null
      - debit_account: line.debit_account
        credit_account: 2000
        per: bill.direct_lines
        amount: line.amount_minor
        keys:
          causal_orders: line.causal_orders
          line: line.path
        reaches_minted_accounts:
          5150: >-
            A pass-through is CFS buying as the customer's PURCHASING AGENT and re-billing it, so the
            cost arrives as an ordinary vendor bill line coded to 5150 while the recharge lands on
            4140 Pass Through Income (owner, 2026-08-16: "it should get a matching cogs"). The
            vendor's default account supplies the code and the line may override it (ADR-0030).
          5902: >-
            ADR-0030 — a truck hired to perform a job arrives ALREADY ATTRIBUTED to a causal job, so
            it posts direct at actual instead of entering the rate-absorbed 5900/5901 pool, and
            `bill.direct_lines[]` already carries both a `debit_account` and its own `causal_orders`.
            "It needs nothing new." ⚠️ A hire that genuinely cannot be attributed still posts here,
            with `causal_orders: null` as an explicit determination (REQ-LED-001) rather than earning
            a fourth account for a population that may have no members.
    control_total: bill.amount_minor
    invariants:
      - >-
          ⚠️ **THE BILL RECLASSIFIES. IT NEVER RE-BOOKS.** Where the bill resolves an obligation the
          cost is already sitting in its expense or asset account, so the entry moves the LIABILITY —
          Dr 2010 / Cr 2000 — and touches no expense account at all. Re-booking instead (Dr expense /
          Cr 2000) is a **perfectly balanced entry** that doubles the expense and strands the accrual
          in 2010 forever, so no balance check, no control total and no trial balance can catch it.
          It is the single most dangerous mistake in this file, and
          `reclassification-rebooks-the-expense-rejected` is the vector that exists to refuse it.
          Four of five surveyed systems reclassify and name the account for it; the fifth is Xero,
          which has no accrual stage to reclassify from.
      - >-
          **The two postings are discriminated by whether the obligation resolves, and a bill may
          carry both.** `bill.reclassifications` names obligations and the amount of each the bill
          covers; `bill.direct_lines` are costs with no accrual behind them. A `per:` over an empty
          collection writes nothing (see this file's header on zero amounts), so an
          all-reclassification bill and an all-direct bill are the same rule with one arm empty —
          not two rules, and not a conditional inside one.
      - >-
          **A reclassification may not exceed its obligation's outstanding accrued balance.** 2010
          holds one balance per obligation in the projection; over-relieving drives it negative,
          which is the ledger asserting more was relieved than was ever accrued. This is exactly the
          shape `credit_note_allocated` already uses against a note's remaining credit, and the
          check consults the projection rather than a ledger balance for the same reason ADR-0018
          gives there: the chart stays plain, with no account per obligation.
      - >-
          **A partial bill is NORMAL and leaves a residual.** Both SAP and NetSuite treat the
          received-not-invoiced residual as the ordinary state with a reconciliation practice
          attached, not as an error — SAP's GR/IR analysis reads the SIGN of the balance as the
          finding (credit = received not invoiced, debit = invoiced not received). A rule that
          demanded a bill exactly equal its accrual would refuse the common case.
      - >-
          **A bill for MORE than was accrued gets an ordinary direct line for the excess — there is
          no variance account and none should be minted.** 2600 Rounding was dropped from this chart
          on precisely that reasoning: an account whose job is to absorb a difference gives a defect
          somewhere to hide. The excess is real cost, incurred in the bill's period, and it books to
          its own expense account like any other line.
          ⚠️ A bill for **LESS** than was accrued leaves a residual that nothing in this spec yet
          retires — correcting or writing back an over-accrual is a fourth procurement event that
          does not exist. Not invented here; **OQ-045** holds it, and it is not blocking because the
          residual is visible and reportable either way.
      - >-
          **The accounting date is the BILL's date, not the accrual's** (ADR-0010, ADR-0017). The
          cost already belongs to the period it was incurred in and must stay there; only the
          liability moves, and it moves on the day the invoice arrived. Back-dating the
          reclassification to the accrual date would restate a period that may already be sealed and
          hashed, and would move nothing that needed moving.
      - >-
          ⚠️ **The reclassification leg declares `causal_orders: null` and carries no line, and that
          is load-bearing rather than incidental.** It moves a LIABILITY between two liability
          accounts; the keys that say what the cost was for were declared at the accrual and stay on
          the accrual's transfer. Declaring a causal order here would let an AP move silently re-key
          a cost to a different job — a restatement of a derived report through a liability
          reclassification, which is the thing ADR-0020 forbids outright. A direct line, by contrast,
          is the FIRST posting of that cost and carries its own causal order and line.
          ⚠️ This invariant read "2010 and 2000 both name none, so a transfer declaring one is
          refused" — an argument from the chart, which ADR-0036 stopped answering. The refusal itself
          is unchanged: gate 10h still fails on a key the rule does not name.
      - >-
          **One entry per BILL, spanning as many obligations as the bill covers.** An EOR invoice for
          a fortnight matches every shift accrued in it, so a bill routinely references several
          source documents — the third rule in this file to do so, after `settlement_recorded` and
          `credit_note_allocated`, and more evidence that `journal_entry_id` cannot be derived from a
          single source-document reference (erp-spec#3).
      - >-
          **A vendor bill is received once.** A duplicate credits 2000 twice for one invoice and
          would relieve the same accrual twice. Payment of the bill is Banking's event, not this one
          (`contexts/procurement/context.md`).
    relates_to: [REQ-LED-001, ADR-0010, ADR-0017, ADR-0018, ADR-0020, ADR-0025]
    vectors_dir: ledger/vectors/vendor_bill_received/

# ══════════════════════════════════════════════════════════════════════════════════════════════════
# NO POSTING — these reach the ledger context but produce no GL entry. Each says why.
# ══════════════════════════════════════════════════════════════════════════════════════════════════
no_posting:
  - event: EVT-PRO-001
    reason: >-
      **A commitment is not a transaction.** Nothing has been received and no liability has arisen,
      so there is no entry that would balance. Posting one anyway is what makes a commitment look
      like a payable — the precise confusion procurement exists to remove (OQ-020).
      Its value is entirely forecasting: this is the stage that answers "what have we committed to
      spend", which nothing in the current system can answer. That belongs to the read side, not to
      the ledger.

  - event: EVT-LED-001
    reason: >-
      Emitted BY the ledger as the consequence of a rule that already posted. A posting rule
      triggered by it would recurse.

  - event: EVT-FUL-001
    reason: >-
      **A leg moves no money, and the cost of its hours is not the leg's to post.** A shift is one
      PERSON's paid span for one day (OQ-005), costed at that person's actual wage (ADR-0019), and
      leg→shift is many-to-many — so the hours a leg records are already inside a shift. A leg that
      posted on its own would either double-count the person-day or need the shift's cost split
      across its legs, which is the allocation OQ-018 exists to decide and the guesswork OQ-008 set
      out to remove. The revenue consequence arrives at the invoice (EVT-BIL-001), as it does for
      every other fulfillment event here.
      What a leg contributes is the ATTRIBUTION, not the amount: actor, clock-in, clock-out and
      destination are what let `shift_recorded` name a causal job at all. Recorded, first-class
      (ADR-0011), and not a posting.
      ⚠️ Resolved out of the `unwritten` bucket by erp-spec#5. The alternative reading — that a leg
      posts labor on its own — would have made this rule `blocked` on OQ-024 rather than absent,
      because the credit leg of any labor posting still has no account.

  - event: EVT-FUL-003
    reason: >-
      Grouping destinations into a run moves no money. The travel cost a shared trip splits across
      the jobs that caused it arrives through the shifts and legs the trip generates, not through
      the plan.

  - event: EVT-FUL-004
    reason: >-
      A TigerBeetle PENDING transfer on the **inventory-custody** ledger (ADR-0015), not a GL
      posting. Physical custody and money are different ledgers with different rules — custody must
      not go negative, money must.

  - event: EVT-FUL-005
    reason: >-
      The custody pending transfer POSTS. Revenue is recognised when the invoice posts
      (EVT-BIL-001), not when units leave the building, so there is no GL consequence here.

  - event: EVT-FUL-006
    reason: >-
      Units return to custody. A damaged return opens an out-of-service record; if it becomes a
      billable replacement that is an invoice line against 4210, reaching the GL through
      `invoice_issued`.

  - event: EVT-FUL-007
    reason: "The custody pending transfer VOIDS, by cancellation or timeout. Nothing ever left, so nothing posts."

  - event: EVT-BNK-001
    reason: >-
      An import asserts that money moved at the bank, not what it was for. The GL consequence
      arrives at EVT-BNK-002, once the transaction is matched to something.

  - event: EVT-BNK-003
    reason: "Withdraws a match. Changes reconciliation state; moves no money."

  - event: EVT-TAX-001
    reason: >-
      An INPUT to `invoice_issued`'s tax leg, not a rule of its own — it supplies the taxable base
      and the rounded tax amount. Rounding happens here, before posting, which is what keeps every
      posting exact in integer minor units.

  - event: EVT-TAX-002
    reason: >-
      Determines that no tax leg exists. Nothing to post — but the REASON is carried, because
      "no tax" and "no tax BECAUSE" audit differently.

  - event: EVT-BIL-007
    reason: >-
      **The money movement is `credit_note_allocated`'s, and there is exactly one of it.** Applying
      credit held at one settlement point to an invoice at another is Dr 2050 / Cr 1200 — the same
      posting as any allocation. What differs is only which node each leg is attributed to, and a
      second posting for the same movement would double it.
      What this event records is the **authorization**: who permitted the crossing and why. It is a
      control fact, not a transaction, and ADR-0033 §4 is explicit that the control is managerial
      rather than accounting — ASC 210-20-45-1 asks about parties, and within one legal entity there
      is one counterparty, so GAAP requires nothing here at all.
      ⚠️ It reaches the ledger for one reason: the attribution of each leg to a settlement point is
      what makes per-department aging computable, and the posting rule for `credit_note_allocated`
      must read `from_billed_to` / `to_billed_to` rather than assume both legs sit at the same node.
      ⚠️ **Whether settlement point is a ledger KEY or a document attribute is not settled, and
      ADR-0036 sharpens the question rather than answering it.** It was previously framed as "a
      declared ledger DIMENSION or a document attribute", against a `ledger/dimensions.yaml` that
      declared only `product_line` and `cost_type`. That framing is dead: there are no dimensions.
      **The question that replaces it is whether a settlement point is a KEY** — and ADR-0036's own
      criterion applies directly. A settlement point under ADR-0032/0033 is a node in a customer
      tree, which is master data and mutable, so on that criterion it is NOT a key; but which node a
      leg was ATTRIBUTED to at the time is an event fact, which is. That is a real gap, it is
      tracked, and it is why ADR-0032 and ADR-0033 being un-accepted blocks erp-spec#17.

# ══════════════════════════════════════════════════════════════════════════════════════════════════
# UNWRITTEN — in scope, nothing blocking them, not written yet. Each names its issue.
#
# **Empty as of 2026-08-16, and now genuinely empty rather than down to two** (erp-spec#5, #14).
# Nine rules have passed through here. Seven left on 2026-08-09: `settlement_recorded`,
# `settlement_reversed`, `credit_note_issued`, `credit_note_allocated`, `asset_disposed` and
# `asset_basis_adjusted` were specified, and `leg_completed` moved to `no_posting` because it is not
# a rule at all. The last two left on 2026-08-16 as `obligation_accrued` and `vendor_bill_received`.
#
# Three of the nine were not free, and what unblocked each is worth keeping — the pattern is that
# **the blocker was never the prose; it was a missing account or an undecided question**:
#   · `credit_note_issued` had no credit-side account. **2050 Customer Credit Balances** is
#     minted for it, because crediting 1200 at issue breaks the tie between the AR control account
#     and the invoice subledger by exactly the unallocated balance.
#   · `asset_disposed` needed the dual-book question answered first — ADR-0026 (proposed), which
#     keeps the tax book out of the ledger and derives it at report time.
#   · `obligation_accrued` had no credit-side account either. **2010 Accrued Expenses: Received Not
#     Invoiced** is minted for it, and the survey that chose it settled `vendor_bill_received` in the
#     same stroke: a matched accrual is relieved by RECLASSIFICATION, never by a reversal.
#
# The list stays here rather than being deleted: it is where the next uncovered event goes, and an
