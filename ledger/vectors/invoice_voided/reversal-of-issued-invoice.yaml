name: reversal-of-issued-invoice
posting_rule: invoice_voided
kind: accept
source: >-
  Reverses the entry produced by `invoice_issued/two-lines-two-product-lines-with-tax`. 41 of 999
  prod invoices carry `status: "void"` — `api:2026-08-09:db_invoices_query`.

given:
  ledger_state:
    closed_periods: []
  invoice:
    id: INV-VEC-0002
    total_minor: 100031
  void:
    accounting_date: "2026-07-31"
    reason: "issued against the wrong organization"
  original_journal_entry:
    accounting_date: "2026-07-31"
    transfers:
      - { debit_account: 1200, credit_account: 4000, amount_minor: 75000, product_line: "Power, Lights & Tools" }
      - { debit_account: 1200, credit_account: 4200, amount_minor: 12500, product_line: "Expendables" }
      - { debit_account: 1200, credit_account: 2200, amount_minor: 11250 }
      - { debit_account: 1200, credit_account: 2200, amount_minor: 1281 }

derivation: >-
  Each original transfer reappears with its two accounts EXCHANGED and its amount and dimensions
  unchanged. Four in, four out; 75000 + 12500 + 11250 + 1281 = **100031** = control total, the same
  number as the original entry, because a reversal is the same money in the other direction.
  **The dimensions are carried across, not dropped.** A reversal that lost them would leave the
  original's product-line revenue standing in a dimensional report while the total netted to zero —
  the two views would disagree, and the dimensional one would be wrong.
  **This is a new entry, not a deletion of the old one** (REQ-BIL-001, the no-hard-deletes fence).
  Both entries stand; the invoice's `lifecycle` becomes `voided` because a reversal EXISTS, which is
  ADR-0022's derivation, never an assigned flag.

expect:
  transfers:
    - { debit_account: 4000, credit_account: 1200, amount_minor: 75000, accounting_date: "2026-07-31", product_line: "Power, Lights & Tools" }
    - { debit_account: 4200, credit_account: 1200, amount_minor: 12500, accounting_date: "2026-07-31", product_line: "Expendables" }
    - { debit_account: 2200, credit_account: 1200, amount_minor: 11250, accounting_date: "2026-07-31" }
    - { debit_account: 2200, credit_account: 1200, amount_minor: 1281, accounting_date: "2026-07-31" }
  rejects: []
