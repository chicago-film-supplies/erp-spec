name: capital-improvement-is-capitalised
posting_rule: asset_basis_adjusted
kind: accept
source: >-
  `EVT-FA-004` — "a capital improvement or a basis correction changed an asset's carrying value,
  changing the remaining depreciation schedule from that point forward". Accounts live: 1700
  Vehicles, 2000 Accounts Payable (`api:2026-08-09:db_chart_of_accounts_query`). Amounts synthetic.

given:
  ledger_state:
    closed_periods: ["2026-07"]
    last_depreciation_posted: "2026-07-31"
  asset:
    id: FA-VEC-0004
    description: "Box truck, in service 2022-05"
    asset_account: 1700
    accumulated_depreciation_account: 1701
    cost_minor: 4500000
  adjustment:
    effective_date: "2026-08-12"
    book: both
    reason: "replacement lift gate — extends service life"
    capitalised_minor: 250000
    capitalisations:
      - { asset_account: 1700, funding_account: 2000, amount_minor: 250000 }

derivation: >-
  A new lift gate on a box truck, $2,500.00, on account. Dr 1700 / Cr 2000 — one transfer,
  `control_total` = `adjustment.capitalised_minor` = **250000**.
  **Capitalised, not expensed.** The improvement extends the asset's service life, so it belongs in
  the carrying value and depreciates over the remaining life. Booking it to a 6xxx expense would
  understate the asset, overstate the period by the full $2,500.00, and depreciate nothing — the
  single most common fixed-asset error, and the one an operator makes by choosing the obvious
  account on a bill.
  **Effective 2026-08-12, and July is closed.** The adjustment takes effect from the current open
  period forward: the truck's remaining schedule is recomputed from here, and no depreciation already
  posted is touched. That is what `EVT-FA-004`'s "Not a restatement of prior periods" means in
  postings, and `retroactive-adjustment-rejected` is the arm that enforces it.
  `book: both` — the improvement raises the carrying value under GAAP and the basis for tax. The GL
  posting is the GAAP one; the register records both, and the tax schedule follows its own
  convention from here (ADR-0007, ADR-0026).
  No dimension: 1700 and 2000 both name none.

expect:
  transfers:
    - {
        debit_account: 1700,
        credit_account: 2000,
        amount_minor: 250000,
        accounting_date: "2026-08-12",
      }
  rejects: []
