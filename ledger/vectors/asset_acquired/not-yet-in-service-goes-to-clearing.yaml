name: not-yet-in-service-goes-to-clearing
posting_rule: asset_acquired
kind: accept
source: >-
  1999 Fixed Asset Clearing's own chart entry — "holds acquisition cost until an asset is in
  service, then clears to the asset account", and its period-end balance is "a real signal — assets
  bought and not yet capitalised" (`api:2026-08-09:db_chart_of_accounts_query`). Amounts synthetic.

given:
  ledger_state:
    closed_periods: []
  acquisition:
    asset_id: FA-VEC-0011
    description: "Box truck — delivered, awaiting lift-gate fitting and plates"
    acquired_on: "2026-08-03"
    in_service_on: null
    debit_account: 1999
    cost_minor: 4500000
    basis_gaap_minor: 4500000
    basis_tax_minor: 4500000

derivation: >-
  A $45,000.00 truck that CFS owns and owes for, but cannot yet use. The obligation to the vendor is
  real on 2026-08-03, so the entry posts — to **1999 Fixed Asset Clearing**, not to 1700 Vehicles.
  **`in_service_on` is null and that is the whole difference from `in-service-on-acquisition`.**
  Depreciation cannot start on an asset that is not in service, and 1700 is where depreciable assets
  live; parking the cost in 1700 early would either start a schedule too soon or need a null
  in-service date on a depreciating asset.
  **The accounting date is still the acquisition date.** Waiting for the in-service date to post
  would leave a $45,000 liability off the balance sheet for as long as the truck sat in the yard.
  **1999's balance is a report, not a rounding account**: it answers "what have we bought and not
  yet put to work", and it should be small and old-less. A balance that ages is an asset somebody
  forgot to commission.
  `control_total` = 4500000. No dimension: 1999 and 2000 name none.

expect:
  transfers:
    - {
        debit_account: 1999,
        credit_account: 2000,
        amount_minor: 4500000,
        accounting_date: "2026-08-03",
      }
  rejects: []
