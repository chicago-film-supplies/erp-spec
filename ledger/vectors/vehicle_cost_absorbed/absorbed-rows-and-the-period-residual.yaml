name: absorbed-rows-and-the-period-residual
posting_rule: vehicle_cost_absorbed
kind: accept
source: >-
  ADR-0030 — "Each period: `Dr 5900` for the portion absorbed against causal jobs, `Dr 5901` for the
  residual, `Cr 6409` for the total." Shape from the ADR; **amounts synthetic**, and deliberately so:
  the rate and its normal-capacity denominator are OQ-052 and nothing in this repo may state them
  yet. The rate implied here is $0.60 per computed mile and it is illustrative — this vector asserts
  where the money lands, never how much it is.

given:
  ledger_state:
    closed_periods: []
  run:
    id: VAR-VEC-0001
    period: "2026-07"
    period_last_day: "2026-07-31"
    rate_version: 1
    pool_minor: 72500
    absorbed_minor: 45000
    unabsorbed_minor: 27500
    over_absorbed_minor: 0
    entry_total_minor: 72500
    absorbed_allocations:
      - {
          id: ALC-VEC-0011,
          causal_job: ORD-VEC-0001,
          labor_line: delivery,
          distance_source: computed,
          miles: 240,
          amount_minor: 14400,
        }
      - {
          id: ALC-VEC-0012,
          causal_job: ORD-VEC-0002,
          labor_line: trash_cleanup,
          distance_source: computed,
          miles: 510,
          amount_minor: 30600,
        }

derivation: >-
  One month of owned-fleet cost. The pool is the period's gross activity on the natural accounts
  **6400 - Vehicle: Repairs & Maintenance**, 6401, 6402 and 6403 — **6404 Vehicle: Tickets is
  excluded**, because a fine is nondeductible under IRC §162(f) and ADR-0026 keeps it out of both
  books, which an absorbed account could not do.
  Two shifts served causal jobs and carry the allocation rows `shift_recorded` already wrote: this
  run adds a second amount to rows that exist rather than creating any document of its own. Their
  `labor_line` values differ — `delivery` and `trash_cleanup` — which is the split ADR-0030 says
  comes for free: the vehicle cost inherits the product line from the shift instead of needing an
  allocation of its own.
  **14400 + 30600 = 45000 absorbs into 5900**, each row keyed to its own causal job and its own
  allocation id (HOT-014 — one run posts many rows against jobs, so the order alone does not identify
  a transfer). The pool was 72500, so **27500 is the residual and lands in 5901 with
  `causal_orders: null`** — a declared determination, not a blank (REQ-LED-001).
  `entry_total_minor` is 45000 + 27500 = 72500, which equals `pool_minor` here because the period
  under-absorbed. The two fields coincide in this direction and separate in the other, which is what
  `a-period-that-over-absorbs-credits-5901` exists to show.
  ⚠️ **The residual is NOT the same measure 5801 carries.** Labor is costed at actual, so ADR-0019
  can call the 5800/5801 gap utilisation alone. A van has no actual per-job cost, so this residual is
  utilisation **and** rate deviation together, and reporting them apart needs the odometer-and-fuel
  sampling ADR-0030 names — not a second GL account.

expect:
  transfers:
    - {
        debit_account: 5900,
        credit_account: 6409,
        amount_minor: 14400,
        accounting_date: "2026-07-31",
        causal_orders: [ORD-VEC-0001],
        line: ALC-VEC-0011,
      }
    - {
        debit_account: 5900,
        credit_account: 6409,
        amount_minor: 30600,
        accounting_date: "2026-07-31",
        causal_orders: [ORD-VEC-0002],
        line: ALC-VEC-0012,
      }
    - {
        debit_account: 5901,
        credit_account: 6409,
        amount_minor: 27500,
        accounting_date: "2026-07-31",
        causal_orders: null,
      }
  rejects: []
