name: paid-day-no-order-caused-lands-in-5801
posting_rule: shift_recorded
kind: accept
source: >-
  ADR-0019 — `5801` holds hours attributable to **no job at all**. Owner, 2026-08-17: the guarantee
  follows but-for causation, _"if not for the order the person would not be hired"_, so a day an
  order DID cause absorbs entirely into that order. This vector is the complement: a paid day **no
  order caused**. Wage is the live default, $30.00/hr. Hours synthetic.

given:
  ledger_state:
    closed_periods: []
    consecutive_days_worked: 2
  shift:
    id: SH-VEC-0007
    person: PER-VEC-0001
    date: "2026-08-06"
    wage_minor_per_hour: 3000
    hours_guaranteed: 8
    hours_worked: 0
    hours_idle: 8
    hours_at_premium: 0
    premium_minor: 0
    base_minor: 24000
    cost_minor: 24000
    unabsorbed_minor: 24000
    absorbed_allocations: []

derivation: >-
  A full paid day with **no causing order** — training, a company meeting, unassigned shop time. No
  order triggered the hire, so but-for attributes it to nothing and the whole 24000 lands in 5801
  with `causal_orders: null`. `absorbed_allocations` is empty, and `per:` over an empty collection
  produces no transfer, so 5800 is untouched.
  ⚠️ **THIS VECTOR EXISTS BECAUSE BUT-FOR NEARLY EMPTIED 5801.** Before 2026-08-17 the account's
  only accept vector was a guaranteed day whose work ran short — and that case now absorbs entirely
  into the job that caused the hire. Without this one, **5801 would be an account with no exercised
  accept path**, which is this repo's own definition of a claim rather than a capability.
  **What 5801 means changed with the ruling and this vector is where the new meaning is executable.**
  It is no longer "the unworked part of a guaranteed day" — that belongs to the job now — but "paid
  time no order caused". ⚠️ ADR-0019's frozen text calls the 5800/5801 gap a utilisation measure;
  under but-for that gap is small by construction, and the question "what is the 8-hour guarantee
  costing us" is answered from `hours_guaranteed` against `hours_worked` on the shift records rather
  than from this account.

expect:
  transfers:
    - {
        debit_account: 5801,
        credit_account: 2010,
        amount_minor: 24000,
        accounting_date: "2026-08-06",
        causal_orders: null,
      }
  rejects: []
