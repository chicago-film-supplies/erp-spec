name: causal-order-on-unabsorbed-hours-rejected
posting_rule: shift_recorded
kind: reject
source: >-
  ADR-0036 moves the key obligation off the account and onto the posting rule, which states that the
  unabsorbed leg declares `causal_orders: null`; a rule that names no key refuses one just as firmly
  as a rule that names one refuses its absence.
  ⚠️ **The leg debits `6600 - Wages` since ADR-0038 (2026-08-17), not `5801`** — which is deleted.
  The refusal did not move with it: gate 10h tests the KEY against the RULE, and has never consulted
  the account.
  ⚠️ **Renamed from `product-line-on-unabsorbed-hours-rejected` on 2026-08-16.** The old vector
  refused a product line on the idle leg. **The rename makes it strictly stronger**: a product line
  was a classification anyone could later revise, while a causal order is a claim that three unworked
  hours were caused by a specific job — and it is frozen into an immutable transfer.

differs_from: paid-day-no-order-caused-lands-in-6600
differs_in: ["shift.unabsorbed_causal_job"]

given:
  ledger_state:
    closed_periods: []
    consecutive_days_worked: 2
  shift:
    id: SH-VEC-0005
    person: PER-VEC-0001
    date: "2026-08-06"
    wage_minor_per_hour: 3000
    hours_guaranteed: 8
    hours_worked: 0
    hours_idle: 8
    hours_at_premium: 0
    premium_minor: 0
    base_minor: 24000
    cost_minor: 24000
    unabsorbed_minor: 24000
    unabsorbed_causal_job: ORD-VEC-0001
    absorbed_allocations: []

derivation: >-
  Identical to `paid-day-no-order-caused-lands-in-6600` except that the idle day is handed a causal
  job — `ORD-VEC-0001` — which is what makes it plausible rather than obviously wrong.
  ⚠️ **RE-BASED 2026-08-17.** It used to differ from `guaranteed-hours-unworked-land-in-5801`, a
  vector whose whole premise the owner's but-for ruling reversed. The REFUSAL is unchanged and the
  case it guards is now the only one where the unabsorbed leg carries an amount at all. Amounts balance and the control total is satisfied. It is refused on
  the key alone.
  **The unabsorbed posting's rule declares `causal_orders: null`, so a transfer supplying one is
  refused.** Declaring a key the rule does not name is the same class of error as omitting one it
  does, and gate 10h treats it the same way. ⚠️ This derivation argued from the CHART until
  2026-08-16 — "5801 names no dimension, so a posting to it may declare none" — and the chart no
  longer states obligations (ADR-0036). The refusal is unchanged; its authority moved to
  `ledger/posting-rules.yaml`.
  **The reason is not tidiness.** Idle time is caused by no job; that is the definition of
  unabsorbed. Attaching a causal order to it asserts that three unworked hours were caused by that
  order, which would inflate its cost with capacity it never consumed and — worse — make the account
  *look* attributable. **The unabsorbed leg is the one whose value comes from being
  un-attributable**: "paid time no order caused" is a countable population only while nothing can be
  quietly pushed across the boundary. ⚠️ It used to read "5801 is the one ACCOUNT whose value comes
  from being un-attributable… the gap between it and 5800 is the utilisation number" — under
  ADR-0038 there is no such account and under but-for there is no such gap. **The refusal survives
  both; what it protects is the population, not the subtraction.**
  Once that leg can carry a causal order it becomes a plug — a place to put whatever the allocation
  could not place, dressed as an allocation. The next step down that path is deciding idle time "really
  belonged" to a job after all, and then the KPI reports zero forever.
  ⚠️ **A null here is a DECLARATION, not a blank**, and the difference is what stops the account
  becoming invisible instead of becoming a plug. "Hours attributable to no job" is a countable,
  reportable population precisely because the key is written down as null rather than left off.
  The right way to say these hours were caused by that order is to have worked them: absorb them into
  5800 against the causal job, which `guaranteed-hours-absorb-into-the-job-that-caused-the-hire`
  does with the whole day.

expect:
  transfers: []
  rejects:
    - reason: "the unabsorbed leg declares a causal order, and `shift_recorded`'s 6600 posting declares `causal_orders: null` — a key the rule does not name is refused, and paid time no order caused stays a countable population only while nothing can be pushed across that boundary (ADR-0036, ADR-0038)"
