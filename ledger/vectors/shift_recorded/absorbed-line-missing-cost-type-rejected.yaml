name: absorbed-line-missing-cost-type-rejected
posting_rule: shift_recorded
kind: reject
source: >-
  REQ-LED-001 and ADR-0025 — the dimension obligation is read off the account, and **5800 is the
  only account in the chart that names `cost_type`**. Nothing else in the spec exercises it, so
  without this vector the second dimension is declared and never tested.

differs_from: overtime-premium-pro-rata-across-the-days-jobs
differs_in: ["shift.absorbed_allocations[1].cost_type"]

given:
  ledger_state:
    closed_periods: []
    consecutive_days_worked: 3
  shift:
    id: SH-VEC-0004
    person: PER-VEC-0001
    date: "2026-08-06"
    wage_minor_per_hour: 3000
    hours_worked: 11
    hours_at_straight_time: 8
    hours_at_premium: 3
    premium_minor: 4500
    base_minor: 33000
    cost_minor: 37500
    unabsorbed_minor: 0
    absorbed_allocations:
      - { causal_job: ORD-VEC-0001, hours: 5, base_minor: 15000, premium_share_minor: 2046, amount_minor: 17046, product_line: "Delivery", cost_type: delivery }
      # cost_type ABSENT on this line — the only difference from the accept vector
      - { causal_job: ORD-VEC-0002, hours: 4, base_minor: 12000, premium_share_minor: 1636, amount_minor: 13636, product_line: "Crew" }
      - { causal_job: ORD-VEC-0003, hours: 2, base_minor: 6000, premium_share_minor: 818, amount_minor: 6818, product_line: "Tables & Chairs", cost_type: warehouse }

derivation: >-
  Identical to the accept vector except that line 2's `cost_type` **KEY IS ABSENT**. Every amount is
  right, the control total balances, the product line is present and valid — the entry is refused on
  one missing dimension.
  5800's chart entry names **both** `product_line` and `cost_type`, so a posting to it owes both.
  **What is refused is ABSENCE, not null** (ADR-0025): had someone determined that no kind of work
  applies and written `cost_type: null`, that is a decision and would be recorded. A missing key
  means nobody decided, and an undecided field is indistinguishable from an oversight — which is
  precisely how 28.7% of line revenue came to carry no product line in the current system.
  **This is the only place `cost_type` is exercised in the entire spec.** `ledger/dimensions.yaml`
  declares it with three values and says it applies to 5800 alone; before this vector that
  declaration was enforced by nothing, because no other rule posts to a labour account. A dimension
  no vector ever supplies is a dimension the implementation can quietly ignore.
  **The whole entry is refused, not the line.** A partial posting would credit Accounts Payable for
  a day's cost the debit side does not add up to, which the control total is what makes visible.

expect:
  transfers: []
  rejects:
    - reason: "cost_type is not declared on a posting to 5800, whose chart entry requires it — absence is refused, an explicit null is not (REQ-LED-001, ADR-0025)"
      allocation: 1
