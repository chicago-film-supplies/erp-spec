name: guaranteed-hours-unworked-land-in-5801
posting_rule: shift_recorded
kind: accept
source: >-
  ADR-0019 and OQ-008 — a scheduled person is **guaranteed 8 hours** whether or not the work fills
  them, so the unworked balance is a real cost attributable to no job. Wage is the live default,
  $30.00/hr. Hours synthetic.

given:
  ledger_state:
    closed_periods: []
    consecutive_days_worked: 2
  shift:
    id: SH-VEC-0002
    person: PER-VEC-0001
    date: "2026-08-06"
    wage_minor_per_hour: 3000
    hours_guaranteed: 8
    hours_worked: 5
    hours_idle: 3
    hours_at_premium: 0
    premium_minor: 0
    base_minor: 24000
    cost_minor: 24000
    unabsorbed_minor: 9000
    absorbed_allocations:
      - {
          id: ALC-VEC-0011,
          causal_job: ORD-VEC-0001,
          hours: 5,
          base_minor: 15000,
          premium_share_minor: 0,
          amount_minor: 15000,
        }

derivation: >-
  A guaranteed eight-hour day with five hours of causal work in it. 5 x 3000 = **15000** absorbs
  into 5800 against the job; the remaining 3 x 3000 = **9000** is owed to the person, caused by no
  job, and lands in 5801. `control_total` = 24000 = the day's cost, and the two transfers sum to it.
  **The gap between the two accounts is the utilisation number** (ADR-0019) — ⚠️ **and it is NOT
  utilisation ALONE, which this derivation asserted until 2026-08-17.** It read "Not a rate
  variance — costing is actual at that person's own wage, so no standard rate exists to deviate
  from". Measured against the EOR's own exports (OQ-050, HOT-016): wages are itemised per person but
  **employer burden is priced per payroll RUN**, so a per-shift cost is part actual and part
  apportioned — and pro-rata apportionment IS a standard rate. The gap therefore carries utilisation
  AND rate deviation, and `labor_variance` fires. HOT-010 still resolves, on corrected reasoning.
  **5801 carries NO dimension, and that is the design rather than an omission.** Its chart entry
  names none, so declaring one would be refused exactly as omitting one on 5800 would be — the
  obligation is read off the accounts (ADR-0025). Idle time belongs to no product line and to no
  kind of work; giving it either would turn the account into a plug that quietly absorbs whatever
  the allocation could not place, and the KPI would stop meaning anything. See
  `causal-order-on-unabsorbed-hours-rejected`.
  The absorbed line carries both dimensions, because 5800 names both.
  Contrast `overtime-premium-pro-rata-across-the-days-jobs`, where the day overflowed instead of
  underflowing: same account pair, opposite direction, and only one of the two legs is written in
  each.
  ⚠️ **AMENDED 2026-08-16 (erp-spec#14): both legs credit 2010 Accrued Expenses: Received Not
  Invoiced, where they credited 2000 Accounts Payable.** The EOR has not invoiced on 2026-08-06 —
  the work has been performed and the amount is known, which is a matched accrual and not trade
  debt. `vendor_bill_received` reclassifies it into 2000 when the EOR's invoice arrives, and one
  invoice will relieve many shifts. Only the account code moved: amounts, dates, the
  absorbed/unabsorbed split and both dimension declarations are unchanged, and 2010 names no
  dimension exactly as 2000 did, so the obligation on each leg is identical.

expect:
  transfers:
    - {
        debit_account: 5800,
        credit_account: 2010,
        amount_minor: 15000,
        accounting_date: "2026-08-06",
        causal_orders: ["ORD-VEC-0001"],
        line: ALC-VEC-0011,
      }
    - {
        debit_account: 5801,
        credit_account: 2010,
        amount_minor: 9000,
        accounting_date: "2026-08-06",
        causal_orders: null,
      }
  rejects: []
