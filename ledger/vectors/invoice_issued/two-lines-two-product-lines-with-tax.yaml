name: two-lines-two-product-lines-with-tax
posting_rule: invoice_issued
kind: accept
source: >-
  Shape from a real multi-line taxed invoice — `api:2026-08-09:db_invoices_query`, 999 invoices /
  9,197 line items in prod. Amounts synthetic. Tax RATES are live and pinned:
  `api:2026-08-09:db_taxes_query` — Chicago Rental Tax **15%** (effective 2026-01-01) and Chicago
  Sales Tax **10.25%** (effective 2020-01-01), 9 taxes total.

given:
  ledger_state:
    closed_periods: []
  invoice:
    id: INV-VEC-0002
    invoice_date: "2026-07-31"
    total_minor: 100031
    lines:
      - net_minor: 75000
        revenue_account: 4000
        product_line: "Power, Lights & Tools"
        basis: "2 units x $125.00/day x 3 days"
      - net_minor: 12500
        revenue_account: 4200
        product_line: "Expendables"
        basis: "10 units x $12.50"
    tax_components:
      - { payable_account: 2200, amount_minor: 11250, tax: "Chicago Rental Tax", rate_percent: 15, base_minor: 75000 }
      - { payable_account: 2200, amount_minor: 1281, tax: "Chicago Sales Tax", rate_percent: 10.25, base_minor: 12500 }

derivation: >-
  **Hand-computed, so the expectation does not restate the rule.**
  Line 1 — rental: 2 x 12500 x 3 = 75000 minor. Chicago Rental Tax at 15% on 75000:
  75000 x 15 / 100 = 11250 exactly, no rounding decision.
  Line 2 — retail: 10 x 1250 = 12500 minor. Chicago Sales Tax at 10.25% on 12500:
  12500 x 1025 / 10000 = 1281.25, rounded half-up to **1281**. This is the one rounding in the
  vector and it happens at TAX DETERMINATION (EVT-TAX-001), before posting — which is exactly why
  every transfer below is an exact integer and account 2600 Rounding is dropped from the chart.
  control_total = 75000 + 12500 + 11250 + 1281 = **100031** = $1,000.31, and the four transfer
  amounts sum to the same number.
  Both revenue accounts are `dimensioned: true`, so both revenue transfers carry a `product_line`
  and the two are DIFFERENT — which is the point of the vector. Neither carries a `cost_type`:
  `dimensions.yaml` requires that only on COGS. The tax transfers credit an undimensioned
  liability and carry no dimension at all.

expect:
  transfers:
    - { debit_account: 1200, credit_account: 4000, amount_minor: 75000, accounting_date: "2026-07-31", product_line: "Power, Lights & Tools" }
    - { debit_account: 1200, credit_account: 4200, amount_minor: 12500, accounting_date: "2026-07-31", product_line: "Expendables" }
    - { debit_account: 1200, credit_account: 2200, amount_minor: 11250, accounting_date: "2026-07-31" }
    - { debit_account: 1200, credit_account: 2200, amount_minor: 1281, accounting_date: "2026-07-31" }
  rejects: []
