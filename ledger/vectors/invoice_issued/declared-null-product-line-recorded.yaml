name: declared-null-product-line-recorded
posting_rule: invoice_issued
kind: accept
source: >-
  The population is ADR-0020's restatement residue, named there explicitly: Warehouse Rental,
  Office Rental, Indoor Parking, Location Scouting, Security, Safety & Security Assessment — the
  facility and professional-service lines with no equipment category. Amounts synthetic; the line
  description is one of that set.

given:
  ledger_state:
    closed_periods: []
  invoice:
    id: INV-VEC-0008
    invoice_date: "2026-07-20"
    total_minor: 180000
    lines:
      - net_minor: 180000
        revenue_account: 4100
        product_line: null
        description: "Warehouse Rental — 30 days"
    tax_components: []

derivation: >-
  **The accept case that makes the rejection vectors mean something.** 4100 Service Income names
  `product_line` in its chart entry, so the posting must DECLARE it — and it does, as an explicit
  null: this is a real service sale, and no tracked product line applies to it (OQ-025, ADR-0025).
  Contrast the three rejects, all of which are the same shape with a different value:
    · `missing-product-line-rejected`     — the key is ABSENT. Nobody decided. Refused.
    · `empty-string-product-line-rejected` — `""`. Passes a naive NOT NULL check, means nothing. Refused.
    · `unknown-product-line-rejected`      — a value outside the declared set. Refused.
  Only the declared null is recorded, and the difference between it and the first is the entire
  content of REQ-LED-001. The measured 28.7% of untracked revenue was the first case: postings
  where the field was quietly left empty and the system accepted them. A declared null is a
  decision — countable, reportable, and attributable to whoever made it.
  **The line stays on 4100, not 4800.** Warehouse Rental is operating service revenue; moving it to
  Other Income to avoid the null would understate operating revenue and, for the historical
  population, would move money between P&L sections — which ADR-0020 forbids outright.
  control_total = 180000 = the single transfer amount. No tax component: 4100 carries
  `default_tax_profile: tax_none` live.

expect:
  transfers:
    - { debit_account: 1200, credit_account: 4100, amount_minor: 180000, accounting_date: "2026-07-20", product_line: null }
  rejects: []
