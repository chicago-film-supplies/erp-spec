name: missing-product-line-rejected
posting_rule: invoice_issued
kind: reject
source: >-
  The population this rejects is real and measured: 383 of 9,197 prod line items carry no
  `tracking_category`, **28.74% of line revenue** — `api:2026-08-09:db_invoices_query`, and not
  historical (74 already created in 2026). ADR-0020 restates the history; this vector is what stops
  it regrowing.

differs_from: two-lines-two-product-lines-with-tax
differs_in: ["invoice.lines[1].product_line"]

given:
  ledger_state:
    closed_periods: []
  invoice:
    id: INV-VEC-0003
    invoice_date: "2026-07-31"
    total_minor: 100031
    lines:
      - net_minor: 75000
        revenue_account: 4000
        product_line: "Power, Lights & Tools"
      - net_minor: 12500
        revenue_account: 4200
        # product_line ABSENT — the only difference from the accept vector
    tax_components:
      - { payable_account: 2200, amount_minor: 11250 }
      - { payable_account: 2200, amount_minor: 1281 }

derivation: >-
  Identical to `two-lines-two-product-lines-with-tax` in every field except that line 2's
  `product_line` KEY IS ABSENT. 4200 names `product_line` in its chart entry, so REQ-LED-001
  refuses the posting.
  **This is the case a declared null is NOT.** See `declared-null-product-line-recorded`, which is
  accepted: there, someone determined that no tracked product line applies and wrote it down. Here
  nobody decided anything, and an undecided field is indistinguishable from an oversight — which is
  precisely how 28.74% of line revenue came to carry no product line in the current system. The
  boundary the rule draws is absence versus null, not empty versus non-empty.
  **The whole entry is refused, not the offending line.** A partial posting would leave AR debited
  for a total the revenue side does not add up to — the control total is what makes that visible,
  and it is why rejection has to be all-or-nothing.

expect:
  transfers: []
  rejects:
    - reason: "product_line is not declared on a posting to 4200, whose chart entry requires it — absence is refused, an explicit null is not (REQ-LED-001, ADR-0025)"
      line: 1
