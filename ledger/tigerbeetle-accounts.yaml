# TigerBeetle representation of the chart of accounts.
#
# **This file holds NO account list, deliberately.** ADR-0018 keeps the chart plain — one account
# per GL code — so the TigerBeetle account tree is a total function of
# `ledger/chart-of-accounts.yaml`. A second hand-maintained copy of ~110 accounts would be a second
# thing to keep in agreement, and the workspace rule is to prefer a single source of truth over a
# parity assertion between two hand-maintained lists. What this file holds is the rules that
# compute the tree.
#
# ── the premise that died ────────────────────────────────────────────────────────────────────────
# The previous revision said "Blocked on ADR-0008 (proposed)" and described a dimension-exploded
# model: one TB account per (GL code x product line x cost type). **ADR-0008 is superseded by
# ADR-0018**, which decided the opposite, so the blocker named a decision that had already been
# reversed and the file's premise was dead. The blocker is gone; the exploded model is gone.

ledger_id: 1
currency: USD
asset_scale: 2

notes:
  asset_scale: >-
    Cents. Money is integer minor units everywhere (charter fence), so the scale is fixed at
    ledger creation and a change is a new ledger plus a migration, not a config edit.

# ── how a GL account becomes a TigerBeetle account ──────────────────────────────────────────────
account_id_rule: >-
  TB account id = the GL `code` from `ledger/chart-of-accounts.yaml`, widened to u128. Deterministic,
  so the entire account tree rebuilds from the chart with no id registry that can be lost or drift.
  Codes are unique in the chart and the gate enforces it, which is what makes this safe.

account_code_rule: >-
  TB account `code` (u16) = the GL code. Live codes top out at 8200, so they fit with room to spare.
  `code` is the only classifier TigerBeetle itself can group on.

# ⚠️ The single most expensive thing to get wrong in this file.
flags_rule: >-
  **NO balance-direction flag on any GL account.** `debits_must_not_exceed_credits` and
  `credits_must_not_exceed_debits` make an overdraw unrepresentable — which is exactly right for
  the inventory-custody ledger, where EVT-FUL-005 says in terms that this is what makes overselling
  physical custody unrepresentable rather than merely checked (ADR-0015) — and **wrong for a general
  ledger**. A revenue account legitimately goes debit-side on a reversal (`invoice_voided`), and
  Accounts Receivable legitimately goes credit-side on a customer overpayment. Setting these flags
  per normal balance would make correct entries fail at the database.
  `normal_balance` in the chart of accounts is a REPORTING property, not a constraint.

separate_ledgers: >-
  The GL and the inventory-custody ledger are different TigerBeetle ledgers. Physical custody and
  money obey different rules — custody must not go negative, money must — and one ledger cannot
  hold both policies.

# ── the transfer field budget ───────────────────────────────────────────────────────────────────
# **FOUR discretionary reference fields, not three.** The three `user_data` fields are assigned
# below and each claimant is separately justified; `Transfer.code` is a fourth, and it is unclaimed.
#
# erp-spec#3's ARITHMETIC is settled — the miscount is corrected, both candidate evictions are
# closed, and the query surface is measured. **What is not settled is who gets the fourth field**,
# and there are now two claimants for it: the dimensions HOT-013 argues about (ADR-0036's rejected
# alternative), and an **actor ref** (owner, 2026-08-16). Only one can have it.
#
# ⚠️ **Note what changed about the SHAPE of the problem.** erp-spec#3 posed an eviction problem —
# too many claimants, which do we throw out. That problem is gone: nothing needs evicting. What
# replaced it is an allocation problem for one spare u16, and the two contenders are decided on
# entirely different grounds (is a classification a ledger fact? is an audit trail?). They are not
# comparable on capacity and must not be traded off as though they were.
transfer_field_budget:
  status: proposed
  blocked_by: [SPIKE-003]

  assignment:
    user_data_128: journal_entry_id
    user_data_64: source_document_ref
    user_data_32: accounting_date
    code: unclaimed

  unassigned_claimants:
    - actor_ref # owner, 2026-08-16 — see `actor_ref_is_a_fifth_claimant` below
    - causal_order_ref # ADR-0036 (proposed)
    - line_identity_item_path # ADR-0036 (proposed)

  # ⚠️ The fourth field, and the one every count downstream of this file got wrong.
  transfer_code_is_a_fourth_field: >-
    `Transfer.code` is a **u16, user-defined, "the reason for (or category of) the transfer"**, and a
    first-class filter in `QueryFilter` alongside the three `user_data` fields. Constraints: it must
    not be zero, and on a `post_pending`/`void_pending` it must be zero (inherits) or match the
    pending transfer's code
    (`code:2026-08-16:.claude/docs/tigerbeetle.txt` — `Transfer.code` L12725, `QueryFilter` L13178).
    ⚠️ **Do not confuse it with `account_code_rule` below**, which is the **Account's** `code` — a
    different field on a different record. That collision is most likely why the Transfer's `code`
    went uncounted: `research-drop/reference/tigerbeetle.md` asserted `user_data_128/64/32` were the
    **only** per-transfer reference fields, and erp-spec#3's "three fields, four claimants",
    HOT-013's "three slots, six live claimants" and ADR-0026's "fifth claimant" all inherited the
    error. The reference note is corrected.
    **It is the candidate home for the dimensional payload, and the payload fits with room to
    spare.** Measured across all 13 `specified` posting rules: **no posting dimensions both legs** —
    every dimensioned posting pairs one dimensioned account with an undimensioned counterparty. 19 of
    138 accounts are dimensioned, 18 `[product_line]` and 5800 alone `[product_line, cost_type]`. So
    the maximum payload on one transfer is 21 `product_line` values (20 + explicit null) × 4
    `cost_type` values (3 + explicit null) = **84 combinations, 7 bits** in a u16.
    ⚠️ **Sizing is not deciding, and the cost is real.** That the payload fits answers the
    REPRESENTATION question; it does not say the ledger should carry dimensions at all — that is
    HOT-013's choice. And if dimensions land here they displace `code`'s conventional occupant, the
    transfer's reason, so raw TigerBeetle data would not say which rule produced a transfer.

  accounting_date_encoding: >-
    Packed `YYYYMMDD` as an integer — 2026-07-31 is `20260731`. **Not epoch seconds**: u32 epoch
    seconds hits the 2038/2106 cliff inside an asset's useful life, and an instant invites a reader
    re-deriving a local calendar day from it, which is wrong across midnight and is the exact bug
    class the workspace already pays for in `toChicagoStartOfDay`. An accounting date is a calendar
    day and nothing else (ADR-0010).

  evicted:
    posting_rule: >-
      Recoverable from `(source_document_ref, journal_entry_id)` through the MongoDB projection.
      The ledger's job is balances; which rule produced an entry is a reporting concern, and
      ADR-0017 already makes MongoDB load-bearing for the accounting record. Evicting it is what
      lets `accounting_date` take `user_data_32` at no cost.

  # ── the fifth claimant, raised by the owner 2026-08-16 ────────────────────────────────────────
  actor_ref_is_a_fifth_claimant: >-
    **WHO caused a posting is not recorded anywhere on a transfer, and the spec asks for it
    everywhere else.** ADR-0011 makes legs first-class precisely so every movement carries an actor,
    a clock and a shift; `EVT-FUL-002` carries `actor_id`; ADR-0033's cross-settlement-point event
    carries an actor and a reason. The GL posting is the one place the chain stops.
    ✅ **It passes ADR-0036's criterion, and that is the reason it belongs in this table rather than
    being waved off with `product_line`.** ADR-0036 refuses classifications and keeps KEYS. An actor
    is a key: an immutable historical fact about an event that happened, not a mutable master-data
    attribute. `products.uid_tracking_category` can be re-categorised next month; who performed a
    shift on 2026-08-12 cannot. So the argument that evicts the dimensions does not evict this.
    ⚠️ **Cardinality is not the constraint. ENCODING is.** Measured 2026-08-16
    (`api:2026-08-16:db_users_count` = **1**, `db_contacts_count` = **165**): the entire actor
    population is 166 today, and a generous v2 ceiling of a few thousand still leaves a u16 with
    three orders of magnitude spare. **But actor uids are STRINGS** — Firestore ids and uuids — so no
    numeric field holds one directly. Any assignment needs either a minted small-int actor registry
    (the shape `account_code_rule` already uses for GL codes) or a truncated hash, which trades a
    registry for a collision risk in an immutable store. **Cheap to fit, not free to encode.**

  # ⚠️ Three placements, and the constraint that separates them is NOT capacity.
  actor_ref_placement_options: >-
    **A — `Transfer.code` (u16), as a registry int.** Fits 166 actors with room for ~65,000. Cost:
    `code` loses its conventional occupant, the transfer's reason — though `posting_rule`, the thing
    that would have been, is already evicted to Mongo. Cost: it collides head-on with ADR-0036's
    rejected alternative, which also wants `code`. Only one of dimensions and actor can have it.
    **B — swap: actor → `user_data_32`, accounting date → `code` as a DAY NUMBER.** A u16 day count
    from a 2000-01-01 epoch spans 65,535 days ≈ **to 2179**, so the date does fit, and `user_data_32`
    then holds an actor id with 4.29e9 of headroom — enough for a hash rather than a registry.
    ⚠️ **But it puts the accounting date behind the `post_pending` inheritance rule**, and an
    accounting date is exactly the thing that must be free to differ between a pending transfer and
    its post. Do not take option B for that reason alone; the packing works and the semantics do not.
    **C — actor lives only in the Mongo/Parquet projection.** Costs nothing in the budget. Cost: after
    a Mongo loss TigerBeetle can rebuild every balance and say nothing about who did anything — the
    same self-describing argument that kept `accounting_date` in the ledger, applied to a weaker
    claim. Whether the audit trail is a ledger fact or a projection fact is the actual question.
    ✅ **The `post_pending` constraint does not bind the GL ledger at all.** `code` must be zero
    (inherits) or match the pending transfer's code on a `post_pending`/`void_pending` — and
    **no GL posting rule uses a pending transfer.** Pending/post appears only on the
    inventory-custody ledger (ADR-0015, `EVT-FUL-004`/`005`/`007`), which is a separate TigerBeetle
    ledger with separate rules. So option A is unconstrained on the GL side and constrained on the
    custody side, where the actor genuinely does differ between reserving stock and releasing it.
    **Undecided. This is the owner's call**, and it is the live half of what erp-spec#3 was opened
    for — the dead half being the eviction arithmetic, corrected above.

  # ── why the first two fields are not redundant, proved in BOTH directions ─────────────────────
  the_pair_answers_grouping_and_provenance: >-
    Owner, 2026-08-16: **why do `journal_entry_id` and `source_document_ref` need to be different?**
    The entry below proves only that the grouping is not a function of the document. The converse —
    is the document derivable from the entry id? — had never been asked, and it is what makes the
    pair non-redundant rather than merely conventional.
    **Measured across the 13 `specified` posting rules: 3 span several source documents** —
    `settlement_recorded`, `credit_note_allocated` and `vendor_bill_received`. The other 10 do not.
    · **For those 3, no derivation exists even in principle**: one entry, many documents, one per
    transfer, so the entry id cannot say which invoice a given transfer relieved.
    · **For the other 10 it exists only through the projection**, which defeats the point — a
    `journal_entry_id` is an opaque uid, so from TigerBeetle alone it identifies a group and says
    nothing about what the group was for. Deriving the document from it means asking Mongo, the
    exact dependency the field is carried to avoid.
    ⇒ **Grouping and provenance are two facts.** TigerBeetle's `linked` flag gives a set atomicity
    but not identity — atomic and anonymous — so the group needs an id; and a transfer must name its
    own document or the ledger is not self-describing. Neither derives the other.
    (`inbox/2026-08-16-the-two-reference-fields-answer-different-questions-and-a-path-fits-neither.md`)

  # ⚠️ The claimant ADR-0036 introduces, and the one place it can actually go.
  line_identity_replaces_the_document_ref_rather_than_joining_it: >-
    Owner, 2026-08-16: **is line identity (`item.path`) already using one of these fields?** No — it
    appears nowhere in this table today. It enters only through ADR-0036 (`proposed`), and measuring
    it changes the arithmetic in both directions.
    ✅ **A path SUBSUMES a document ref**, because it names the document and the row within it. So
    stored line identity should **displace** `source_document_ref` in `user_data_64` rather than sit
    beside it. That is a real saving and it is the answer to the question.
    ⚠️ **But it does not fit, and it is not close.** Measured over all 1,010 prod invoices (14,410
    items) and all 987 orders (13,573 items): invoice paths run to **depth 7** and **178 bytes**,
    median 115B, and **14,410 of 14,410 exceed a u128's 16 bytes — 100%**. A single 36-char uuid
    overflows a u128 on its own, and the corpus mixes three uid flavours (20-char Firestore, 36-char
    uuid, 43-char `custom-` uuid), so no packing rescues it. **Storing line identity means storing a
    HASH or a minted surrogate.** Collision is not the risk — 19,176 revenue-bearing lines gives a
    ~1e-11 birthday bound on 64 bits. **Opacity is**: TigerBeetle would hold a fingerprint that
    VERIFIES against the projection rather than a reference that RESOLVES without it, which is a
    weaker self-description than the one the two fields above were justified by.
    ⚠️ **And it does not reliably carry the causal order.** ADR-0036 says `path[0]` **is** the causal
    order; **30 of 1,010 invoices (2.97%) carry no `order` divider at all**, holding **87
    revenue-bearing lines worth $87,839.76** whose `path[0]` is a line. A posting keyed on `path[0]`
    for one of those would record a line uid in a field the spec says holds an order — wrong forever,
    in an immutable store. (Orders structurally have no order divider — `ORDER_ITEM_LEVELS` is
    `[destination, group]` — and that is the schema, not a gap.)
    ✅ **The 30 are a MIGRATION population, and the discriminator is decisive: 0 of them reference an
    order and 30 of 30 carry a `crms_id`.** Legacy CRMS imports, not a live pattern.
    ✅ **Owner, 2026-08-16: v1 can re-base order paths to match invoice paths.** That makes
    `ORDER_ITEM_LEVELS` `[order, destination, group]` and the two structurally identical, so
    `path[0]` is the causal order on everything the live system produces — ADR-0036's "where the two
    agree" becomes an invariant rather than a conditional. It cannot reach the 30, which reference no
    order for a divider to name. **A v1 re-path is a real change**: `path` is the row identity and
    13,573 order items would be recomputed by `computeItemPaths`, so it needs its own api-cloudrun
    issue rather than riding along here.
    ⇒ **The economy saves ONE field, not two**, and the spare u16 now has **three** contenders: the
    dimensions HOT-013 argues about, the actor ref, and the causal order on the 2.97% of invoices
    where `path[0]` cannot supply it.

  # The finding that closed the other escape hatch.
  # ⚠️ Read the two entries together: erp-spec#3 offered `journal_entry_id` and `posting_rule` as
  # candidate evictions that "may make the shortfall disappear rather than force a choice", and
  # **the answer is no on both** — one is refused below, the other was already evicted and the slot
  # it freed was already spent on `accounting_date`. Neither frees a `user_data` slot. The shortfall
  # dissolved anyway, but through `Transfer.code` above, not through an eviction.
  journal_entry_id_is_not_derivable: >-
    erp-spec#3 asked whether `journal_entry_id` could be derived as (source document, posting event)
    under ADR-0014 and the field thereby freed. **It cannot.** `EVT-BIL-006 CreditNoteAllocated`
    states outright that a credit note applied across several invoices "is the case that may span
    source documents, which is why journal-entry grouping cannot simply be derived from a single
    source document reference". `EVT-BIL-003 SettlementRecorded` has the same shape — one payment
    allocated across several invoices. One journal entry, several source documents, so the grouping
    is not a function of the source document reference. The field stays reserved.

  why_this_is_not_an_adr: >-
    ADR-0010 says in terms that which field carries the accounting date is blocked on SPIKE-003,
    and SPIKE-003 is open. Recording the working assignment here as `status: proposed` with its
    blocker named is the honest form; minting an ADR would assert a decision the spike has not
    supplied the evidence for.

  # ✅ SETTLED 2026-08-16 against the 0.17.9 reference — this entry used to name it as unsettled.
  the_query_surface_is_settled_and_it_does_not_move_the_answer: >-
    erp-spec#3 flagged a contradiction — `research-drop/reference/tigerbeetle.md` said flatly "no
    queries" while 0.16.x/0.17.x was believed to expose a limited `query_transfers`. **The belief is
    correct.** TigerBeetle 0.17.9 ships `query_transfers` and `query_accounts` taking a `QueryFilter`
    (`code:2026-08-16:.claude/docs/tigerbeetle.txt` — `QueryFilter` L13178, Requests L9442):
    **equality only** on `user_data_128`, `user_data_64`, `user_data_32`, `ledger` and `code`;
    **range only** on `timestamp_min` / `timestamp_max`, which is TigerBeetle's own timestamp —
    posting time, the wrong date (ADR-0010) — plus `limit` (capped at the batch max, `too_much_data`
    above it) and `flags.reversed`.
    ⇒ **No range filter on `user_data`, therefore no period query**, so the assignment above holds
    exactly as written and periodisation still comes from the projection (ADR-0017). The reference
    note's "no queries" is stale and is corrected there.
    ⚠️ **And the query surface is not what HOT-013 turns on.** The case for carrying dimensions in
    TigerBeetle is reconstruction after a Mongo loss, which needs the value **present**, not
    filterable — a full walk of ~15k transfers rebuilds a dimensional P&L regardless of what
    `QueryFilter` can express. Settling this removed a stated blocker without moving either side of
    the argument.

  what_spike_003_still_owes: >-
    Two of its three exit criteria, and **neither is about the field budget**. Criterion 1 —
    "documented rule for which field carries accounting date" — is answerable now and is the
    `assignment` above: `user_data_32`, packed `YYYYMMDD`. What is left is the `imported` flag's
    timestamp and monotonicity semantics, and that live posting resumes after an import batch.
    **HOT-013 does not depend on either**, so it is not waiting on this spike.
