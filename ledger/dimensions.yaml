# Dimensions — axes a balance can be sliced by, carried ON the posting, never derived later.
#
# REQ-LED-001: a posting to an account that names a dimension must DECLARE it. What is refused is
# ABSENCE, not null.
#
#   product_line: "Crew"   a tracked value
#   product_line: null     a determination — no tracked product line applies to this line
#   (key absent)           REFUSED
#   product_line: ""       REFUSED — it satisfies a naive NOT NULL check and means nothing
#
# The distinction is the whole requirement. An explicit null is a decision: it is countable,
# reportable, and shows up as a number someone can be asked about. Absence is not, and it is
# indistinguishable from an oversight.
#
# ⚠️ **The 28.7% was NOT "nobody decided" — that reading is retracted, measured 2026-08-09.**
# Joining every untracked line to its product master
# (`inbox/2026-08-09-untracked-revenue-is-mostly-a-denorm-failure-not-an-undecided-dimension.md`):
# **51.8% ($252,161.36) is a DENORMALISATION FAILURE** — the product is categorised and the line is
# not; 48.0% is custom lines with no product record at all; and **0.1% ($688.00, 35 lines) is
# genuinely undecided**. Exactly one line in the corpus disagrees with its master rather than being
# empty.
# ✅ **The propagation defect is FIXED, measured 2026-08-10** (api-cloudrun#473,
# `inbox/2026-08-10-the-untracked-revenue-denorm-is-repaired-and-28-7-percent-is-now-15-percent.md`).
# `tracking_missing` 227 → **0**; a dry re-run of the repair touches 0 invoices. Untracked line
# revenue is now **14.76%** ($253,269.75 of $1,715,472.79), and what remains is the two populations
# that were never defects: 130 custom lines with no product master ($233,610.63) and 183 lines on
# genuinely uncategorised products ($19,659.12) — re-measured 2026-08-16 (15.00% of $1,688,980.87
# across 128 / $233,667.63 and 170 / $19,638.96 on 2026-08-10: the money is flat and the denominator
# grew). ✅ **`tracking_missing` is still 0 and the denorm now agrees with the master on every one of
# 9,394 revenue lines** — 0 nulls-against-a-categorised-master, 0 disagreements, 0 lines set against an
# uncategorised master. The repair is holding.
# ⚠️ Zero DISAGREEMENTS is not purely good news. An invoice is a point-in-time document and a line that
# disagrees with a since-renamed master is expected and must never be repaired — so that branch of the
# rule has never once been exercised, which by this repo's own standard makes it a claim rather than a
# capability. **And the writer contradicts it**: `productLineDenorms` is the sole author of the field
# and product wins unconditionally, so any PUT to an issued invoice restamps its lines with the
# product's CURRENT category. Three artifacts assert point-in-time fidelity and the writer does not
# implement it; the empty disagreeing population is why nothing can go red on that. Filed as
# **api-cloudrun#537** — and it matters here because ADR-0020's restatement rule forbids any amount
# moving, while a rename would silently restate closed-period product-line reports.
# ⚠️ That $19,638.96 is NOT comparable to the $688.00 above — `Other` was retired at the product
# master in the same sitting, moving 12 products and ~135 lines out of a named category. **$688.00
# is the number to cite for "how often did an operator decline to classify".**
#
# The requirement is unchanged and its target moves: refusing absence is still right, but the defect
# it guards against is PROPAGATION, not an operator failing to choose. A posting rule that refuses
# an absent dimension is satisfied by a system that reliably copies the product's category — which
# is the actual fix, and it is api-cloudrun#473.
# The same shape the tax context already uses — EVT-TAX-002 carries an exemption REASON, because
# "no tax" and "no tax BECAUSE" audit differently.

dimensions:
  - id: product_line
    description: What category of goods or service the line belongs to.
    required_on: [revenue, cogs]
    declaration: required # the KEY must be present on every posting to an account naming it
    null_permitted: true # as an explicit determination that no tracked value applies
    source: "api:2026-08-08:db_tracking_categories_query (21 values in the current system)"
    values:
      - Crafty
      - Surface Protection
      - Traffic, Safety & Signage
      - Replacements
      - Delivery
      - Wardrobe
      - Fans & Heaters
      - Office Supplies
      - Hair & Makeup
      - Power, Lights & Tools
      - Trash & Cleanup
      - Janitorial
      - Walkies & Hotspots
      - Carts & Ramps
      - Expendables
      - Tables & Chairs
      - Crew
      - Tents
      - Transport
      - Shipping
    note: >-
      **20 values.** `Other` was deleted by OQ-022 — it read as a category and meant "nobody chose",
      which is the one thing a non-nullable dimension must not let back in. ✅ **The source system
      reached the same conclusion independently on 2026-08-10**: `Other` was retired at the product
      master (12 products) and stripped from the historical CFS lines and the Xero ledger. Its
      revenue is now *unallocated*, which is honest, rather than *allocated to a bucket naming
      nothing*. ✅ **`Transport` is RESTORED, 2026-08-16 (OQ-034).**
      It had been dropped 2026-08-09 on a measurement of **zero lines and zero revenue** across all
      9,194 revenue-bearing lines — and **that measurement read the invoice-line denorm, not the
      product master.** At the master, `Trucking` (7 lines, $34,000.00) and `Shipping` (16 lines,
      $5,665.00) both carried `Transport` throughout: **23 lines, $39,665.00, 2.31%** — the 14th
      largest of 20, above `Expendables`, `Carts & Ramps` and `Janitorial`, all of which stayed
      declared. ✅ Every one of those amounts reproduces to the cent on a 2026-08-16 re-run
      (`spikes/harness/product-line-matrix-probe.ts`); only the share moved, because line revenue grew
      to $1,715,472.79. None ever reached a line because the line-level `tracking_category` was not derived
      from the product (api-cloudrun#473, repaired 2026-08-10).
      **Three independent systems of record agreed and none of them was the one being read**: the
      product master, Xero (prod invoice #1987's `Trucking` line was tagged `Transport` in the Xero
      ledger while the CFS line was null), and — since the repair — the CFS lines themselves.
      ⚠️ **The line holds two economically different things**, and OQ-034 records the owner's split:
      `Shipping` is a **passthrough** (third-party freight, its own account 4150, no CFS crew-day),
      `Trucking` is **CFS's own longer or bigger haul** and is labour-bearing per ADR-0011/OQ-010.
      Both are severable and neither spreads.
      ⚠️ **The two values ARE now declared separately here, and the corpus has not been restated.**
      Measured 2026-08-16: `Shipping` reads **0 lines** when the dimension is read directly, because
      every one of the 23 lines still carries the single value `Transport`. The split is derivable by
      account — 4100 $34,000.00 / 7 lines is trucking, 4150 $5,665.00 / 16 lines is shipping, matching
      OQ-034's figures exactly — so nothing is unknown. What is outstanding is the historical
      restatement, an ADR-0020 obligation. **A zero row here is not another `Transport` failure; check
      which of the two it is before acting on it.**
      **This is the value that most nearly proves the whole absence-versus-null rule below**: it was
      not undecided, it was never written, and for six days the spec omitted a value three source
      systems were actively recording.
      Why it was never used is the part worth keeping. **Activity lines and goods lines compete for
      the same line item, and goods lines win**: shipping a walkie is categorised `Walkies &
      Hotspots` (706 lines, $178,980.10), by what was shipped rather than by the shipping. `Delivery`
      survives — **537 lines and $236,487.75, 13.79%**, the largest tracked line in the business
      (re-measured 2026-08-16; 534 / $234,987.75 / 13.91% on 2026-08-10) — only because a delivery line
      has no product to be categorised as instead.
      **Adding a value back is cheap by design**: ADR-0018 took dimensions off account identity
      precisely so cardinality grows by addition and a new product line stops being a migration.
      That is what made restoring `Transport` a one-line change rather than a schema event.
      ✅ **ADR-0020's restatement plan referenced this value and now has its target back** — OQ-025's
      notes list "Trucking to `Transport`" among the mechanical mappings, which was left dangling
      while the value was dropped. The restatement is no longer blocked on re-homing those 23 lines.
      Two mechanisms replace **`Other`**, and they state DIFFERENT facts — that is why there are two:
        · `product_line: null` on a dimensioned account — "this IS a categorised kind of sale, and
          no tracked product line applies to it". The line stays where it belongs on the P&L.
        · **4800 Other Income** — "this was not a categorised sale at all": interest, cashback, a
          vendor refund, a one-off oddity. The account requires no dimension, so the receipt is
          visibly non-operating on the face of the statement rather than hiding inside revenue.
      Neither is a fallback for the other. Coding a real service to 4800 would understate operating
      revenue; nulling a genuine one-off on 4100 would overstate it.
      ADR-0020's restatement residue — Warehouse Rental, Office Rental, Indoor Parking, Location
      Scouting, Security, Safety & Security Assessment — takes **`product_line: null`** (OQ-025).
      They do not map to a tracked product line, so null is the true statement about them; it is
      not a fallback and not a bucket. They stay on 4100 Service Income, which keeps the
      restatement to assigning a dimension and moves no money between P&L sections — the thing
      ADR-0020 forbids.

  - id: cost_type
    description: What kind of work a labour posting represents.
    required_on: [labour_cogs]
    declaration: required
    null_permitted: true
    source: inbox/2026-08-08-two-reporting-dimensions.md
    values: [delivery, counter, warehouse]
    note: >-
      **Labour only** (OQ-021, resolving HOT-011). `required_on: [labour_cogs]` means the accounts
      whose `dimensions` list in `ledger/chart-of-accounts.yaml` names `cost_type` — today that is
      5800 alone. It was previously `[cogs]`, which required a "kind of work" on
      `5000 Cost of Goods Sold: Retail Inventory`, where none of delivery / counter / warehouse is
      true, and REQ-LED-001's text required one on every rental revenue posting as well. The chart
      states the obligation per account precisely so that no rule has to infer it from a class.

# Cardinality is no longer a concern, and the reason is worth keeping. ADR-0008 exploded these
# dimensions into account identity — 20 product lines x 3 cost types = 60 accounts per dimensioned
# GL code — so a third dimension would have multiplied again. **ADR-0018 superseded it**: the chart
# stays plain and dimensions ride on the posting, so cardinality now grows by ADDITION and adding a
# product line stops being a migration.
#
# What that costs: with dimensions off account identity, **nothing structural catches a missing
# one**. Under ADR-0008 a posting with no product line had no account to land in. Now it has one,
# and only the declaration rule above stands between REQ-LED-001 and a silent absence. That is why
# the rejection vectors in `ledger/vectors/` are not optional decoration — they are the entire
# enforcement of this file.
#
# **A null is a reportable population, and should be reported — off the AUTHORITATIVE field.**
# "Share of revenue with a null product line" is a number the read side can produce at any time; the
# current system's equivalent was invisible until someone went looking and found 28.7%. ⚠️ **That
# number was wrong**: it counted the invoice-line denorm, not the product master behind it, and the
# share that actually meant "nobody decided" was **$688.00 — 0.041% of all line revenue** (0.141% of
# the untracked population; cite the base). Watch the population, and if it grows,
# the answer is a new product line or a real decision — never a default value. But a watch pointed
# at a derived copy measures the derivation, not the decision.
#
# HOT-011 is **resolved** (OQ-021). Revenue accounts carry a product line; `cost_type` is labour
# only; and REQ-LED-001's statement was amended to match rather than left contradicting this file.
# Two authorities, deliberately split: the per-account `dimensions` list in
# `ledger/chart-of-accounts.yaml` says WHICH postings owe a dimension, and this file says which
# VALUES it may take. Gate 10 checks every vector against both — and therefore against neither the
# rule nor the vector it is checking.
