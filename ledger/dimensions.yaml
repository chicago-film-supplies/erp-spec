# Dimensions — axes a balance is sliced by AT REPORT TIME. **Not carried on any posting.**
#
# ⚠️ **This file changed KIND on 2026-08-16, and the path did not.** ADR-0036: "`ledger/dimensions.yaml`
# describes a **reporting** taxonomy, not a ledger one." A posting records the GL account and its
# KEYS — causal order(s), invoice link, line identity — and every classification is derived by
# joining those keys to the master data (ADR-0036, superseding ADR-0018). Nothing below is declared
# on a transfer, checked against a transfer, or frozen at posting time.
#
# ⚠️ **The path is deliberately unchanged and that was a measured refusal, not an oversight.**
# erp-spec#19 proposed moving this file under `reporting/`. Four IMMUTABLE ADRs cite
# `ledger/dimensions.yaml` in backticks — ADR-0020, ADR-0025, ADR-0035 (rejected, left as written)
# and ADR-0036 itself — and gate 11 checks that every path cited in prose resolves. Their bodies are
# frozen by `frozen_sha256` (gate 14), so a move buys four PERMANENT gate-11 exemptions to relocate
# a file whose kind is stated in its own header anyway. An allowlist that cannot expire is the thing
# gate 11's exemption rule exists to prevent. **The claim ADR-0036 makes is about this file's
# CONTENT, and content is what changed.**
#
# ── what the ledger no longer does, and what replaced it ────────────────────────────────────────
# Until 2026-08-16 every posting to an account whose chart entry named a dimension had to DECLARE
# that dimension, and the interesting rule was ABSENCE versus NULL: a value or an explicit null is a
# determination, a missing key is an oversight, and `""` is refused because it passes a naive NOT
# NULL check while meaning nothing.
#
# **ADR-0036 dissolves that rule for these dimensions rather than weakening it.** There is no key to
# omit, because there is no key: the classification is read off the product master through the
# posting's line identity. A posting cannot fail to declare a product line any more than it can fail
# to declare the product's name.
#
# The absence-versus-null rule did not go away — **it MOVED, to the keys**, where ADR-0036 says it
# is stronger: a posting whose causal order is ABSENT is unallocatable and is refused; one that
# declares `causal_orders: null` has recorded a determination someone can be asked about. That is
# REQ-LED-001 today, and `contexts/ledger/features/posting-keys.feature` is where it is exercised.
#
# What replaces the declaration check as the thing that can go wrong is a **coverage measurement**,
# not a gate: the share of revenue whose line resolves to no product master, or to a product nobody
# categorised. `reporting/product-line-pl.yaml`'s `unallocated` bucket already carries it, and gate
# 13 already fails when a value here is unclassified there. The defect class the old rule guarded
# is now unrepresentable; the defect class that remains is measurable.
#
# ⚠️ **THIS IS WHY THE MEASUREMENT HISTORY BELOW IS KEPT.** It is not decoration. Every number in it
# was produced by reading a DERIVED COPY — the invoice-line denorm — while the authority sat on the
# product master, and the headline moved by a factor of ~700 when someone finally joined to the
# master. ADR-0036 removes the copy, so the trap that produced it is gone; the discipline it teaches
# is not.

# ── measurement history, retained ───────────────────────────────────────────────────────────────
# **The 28.7% was NOT "nobody decided" — that reading was retracted, measured 2026-08-09.**
# Joining every untracked line to its product master
# (`inbox/2026-08-09-untracked-revenue-is-mostly-a-denorm-failure-not-an-undecided-dimension.md`):
# **51.8% ($252,161.36) was a DENORMALISATION FAILURE** — the product is categorised and the line is
# not; 48.0% is custom lines with no product record at all; and **0.1% ($688.00, 35 lines) was
# genuinely undecided**. Exactly one line in the corpus disagreed with its master rather than being
# empty.
# ✅ **The propagation defect is FIXED, measured 2026-08-10** (api-cloudrun#473,
# `inbox/2026-08-10-the-untracked-revenue-denorm-is-repaired-and-28-7-percent-is-now-15-percent.md`).
# `tracking_missing` 227 → **0**; a dry re-run of the repair touches 0 invoices. Untracked line
# revenue is now **14.76%** ($253,269.75 of $1,715,472.79), and what remains is the two populations
# that were never defects: 130 custom lines with no product master ($233,610.63) and 183 lines on
# genuinely uncategorised products ($19,659.12) — re-measured 2026-08-16 (15.00% of $1,688,980.87
# across 128 / $233,667.63 and 170 / $19,638.96 on 2026-08-10: the money is flat and the denominator
# grew). ✅ **`tracking_missing` is still 0 and the denorm now agrees with the master on every one of
# 9,394 revenue lines** — 0 nulls-against-a-categorised-master, 0 disagreements, 0 lines set against an
# uncategorised master.
# ✅ **api-cloudrun#537 is DISSOLVED for v2 by ADR-0036, and stays live for v1.** The defect was that
# `productLineDenorms` is the sole author of the line's category and product wins unconditionally, so
# a PUT to an issued invoice restamps its lines with the product's CURRENT category — three artifacts
# asserted point-in-time fidelity and the writer did not implement it. **v2 has no denorm to restamp.**
# The historical-classification question does not vanish, it changes owner: a P&L "as classified then"
# is re-derivable from a categorisation history on the product master, with no ledger field and no
# invoice-line copy at all (ADR-0036 Consequences). ⚠️ It is still live for v1, where the restamp can
# silently restate a closed-period product-line report against ADR-0020's no-amount-moves rule.
# ⚠️ That $19,638.96 is NOT comparable to the $688.00 above — `Other` was retired at the product
# master in the same sitting, moving 12 products and ~135 lines out of a named category. **$688.00
# is the number to cite for "how often did an operator decline to classify".**

dimensions:
  - id: product_line
    description: What category of goods or service a line belongs to.
    kind: reporting
    derived_from: >-
      `products.uid_tracking_category` at the product master, reached from a posting's LINE IDENTITY
      key (ADR-0036). Never stored on a transfer, never snapshotted at posting time.
    unresolved_cases:
      - what: the line references no product
        example: a custom line typed by an operator
        report_as: unallocated
      - what: the product exists and carries no category
        example: a product nobody classified
        report_as: unallocated
    source: "api:2026-08-08:db_tracking_categories_query (21 values in the current system)"
    values:
      - Crafty
      - Surface Protection
      - Traffic, Safety & Signage
      - Replacements
      - Delivery
      - Wardrobe
      - Fans & Heaters
      - Office Supplies
      - Hair & Makeup
      - Power, Lights & Tools
      - Trash & Cleanup
      - Janitorial
      - Walkies & Hotspots
      - Carts & Ramps
      - Expendables
      - Tables & Chairs
      - Crew
      - Tents
      - Transport
      - Shipping
    note: >-
      **20 values.** `Other` was deleted by OQ-022 — it read as a category and meant "nobody chose",
      which is the one thing a classification must not let back in. ✅ **The source system
      reached the same conclusion independently on 2026-08-10**: `Other` was retired at the product
      master (12 products) and stripped from the historical CFS lines and the Xero ledger. Its
      revenue is now *unallocated*, which is honest, rather than *allocated to a bucket naming
      nothing*. ✅ **`Transport` is RESTORED, 2026-08-16 (OQ-034).**
      It had been dropped 2026-08-09 on a measurement of **zero lines and zero revenue** across all
      9,194 revenue-bearing lines — and **that measurement read the invoice-line denorm, not the
      product master.** At the master, `Trucking` (7 lines, $34,000.00) and `Shipping` (16 lines,
      $5,665.00) both carried `Transport` throughout: **23 lines, $39,665.00, 2.31%** — the 14th
      largest of 20, above `Expendables`, `Carts & Ramps` and `Janitorial`, all of which stayed
      declared. ✅ Every one of those amounts reproduces to the cent on a 2026-08-16 re-run
      (`spikes/harness/product-line-matrix-probe.ts`); only the share moved, because line revenue grew
      to $1,715,472.79. None ever reached a line because the line-level `tracking_category` was not derived
      from the product (api-cloudrun#473, repaired 2026-08-10).
      **Three independent systems of record agreed and none of them was the one being read**: the
      product master, Xero (prod invoice #1987's `Trucking` line was tagged `Transport` in the Xero
      ledger while the CFS line was null), and — since the repair — the CFS lines themselves.
      ⚠️ **The line holds two economically different things**, and OQ-034 records the owner's split:
      `Shipping` is a **passthrough** (third-party freight, its own account 4150, no CFS crew-day),
      `Trucking` is **CFS's own longer or bigger haul** and is labor-bearing per ADR-0011/OQ-010.
      Both are severable and neither spreads.
      ⚠️ **The two values ARE now declared separately here, and the corpus has not been restated.**
      Measured 2026-08-16: `Shipping` reads **0 lines** when the dimension is read directly, because
      every one of the 23 lines still carries the single value `Transport`. The split is derivable by
      account — 4100 $34,000.00 / 7 lines is trucking, 4150 $5,665.00 / 16 lines is shipping, matching
      OQ-034's figures exactly — so nothing is unknown. What is outstanding is the historical
      restatement, an ADR-0020 obligation. **A zero row here is not another `Transport` failure; check
      which of the two it is before acting on it.**
      **This is the value that most nearly proves why a classification must not be frozen onto a
      posting**: it was not undecided, it was never written, and for six days the spec omitted a value
      three source systems were actively recording. ⚠️ Under ADR-0018 its restoration would have been
      a ledger restatement of 23 postings; under ADR-0036 it is a report re-run. **That is the whole
      argument for this file's change of kind**, and it is measured rather than asserted — the value
      has moved twice in one month (`Other` retired, `Transport` dropped and restored).
      Why `Transport` was never used is the part worth keeping. **Activity lines and goods lines compete
      for the same line item, and goods lines win**: shipping a walkie is categorised `Walkies &
      Hotspots` (706 lines, $178,980.10), by what was shipped rather than by the shipping. `Delivery`
      survives — **537 lines and $236,487.75, 13.79%**, the largest tracked line in the business
      (re-measured 2026-08-16; 534 / $234,987.75 / 13.91% on 2026-08-10) — only because a delivery line
      has no product to be categorised as instead.
      **Adding a value back is cheap by design**, and ADR-0036 made it cheaper still: ADR-0018 took
      dimensions off account identity so cardinality grew by addition rather than by migration, and
      ADR-0036 takes them off the posting as well, so a new product line is now a master-data edit
      that no historical transfer has to agree with.
      ✅ **ADR-0020's restatement plan referenced this value and now has its target back** — OQ-025's
      notes list "Trucking to `Transport`" among the mechanical mappings, which was left dangling
      while the value was dropped. The restatement is no longer blocked on re-homing those 23 lines.
      **4800 Other Income is the account-side counterpart, and it is a DIFFERENT statement from an
      unclassified line** — that is why both exist. An unresolved product line says "this was a
      categorised kind of sale and no tracked category applies to it"; 4800 says "this was not a
      categorised sale at all": interest, cashback, a vendor refund, a one-off oddity. Coding a real
      service to 4800 understates operating revenue; leaving a genuine one-off on 4100 unclassified
      overstates it. ⚠️ **4800 survived ADR-0036 and the null did not**, because an account is a
      ledger fact and a category is not.
      ADR-0020's restatement residue — Warehouse Rental, Office Rental, Indoor Parking, Location
      Scouting, Security, Safety & Security Assessment — resolves to **no tracked product line**
      (OQ-025) and reports as `unallocated`. They stay on 4100 Service Income, which moves no money
      between P&L sections — the thing ADR-0020 forbids.

  - id: labor_line
    description: What kind of work a labor cost represents.
    kind: reporting
    derived_from: >-
      The **shift's own allocation row**, reached from the posting's causal-order and line-identity
      keys (OQ-042; owner, 2026-08-16: "labor_line should follow same protocol as products, what's
      recorded in the immutable ledger is wages… so ledger account rides TigerBeetle, the
      classification is a Mongo [detail]").
      ⚠️ **Deriving from a SHIFT RECORD is not the same trade as deriving from a product master, and
      ADR-0036 says so explicitly**: a shift is a recorded historical fact, not a mutable master
      attribute, so the criterion "could this be revised without anyone having observed something
      new?" is satisfied rather than waived. The classification still lives in Mongo; what makes it
      safe is that its SOURCE does not move.
    source: >-
      Owner, 2026-08-16, recorded in ADR-0036's Consequences (accepted, `frozen_sha256`) and in
      `inbox/2026-08-16-owner-rulings-line-identity-is-item-path-ephemeral-reports-are-never-sealed-and-cost-type-becomes-labour-line.md`.
      Supersedes `inbox/2026-08-08-two-reporting-dimensions.md`, which named the field `cost_type`
      with three values.
    values:
      - delivery
      - counter
      - warehouse
      - trash_&_cleanup
      - shipping_&_handling
      - trucking
      - crew
    note: >-
      **Renamed from `cost_type` and grown from 3 values to 7, 2026-08-16** (ADR-0036, owner:
      "cost_type is too broad, i think it should change to labor_line or _class or _category (same
      for product, no reason for them not to match)"). `cost_type` was too broad to mean anything —
      it named a kind-of-cost taxonomy while carrying only kinds of *labor* — and `labor_line`
      pairs with `product_line` by design.
      ⚠️ **AMERICAN SPELLING, and the live books decided it rather than taste.** Of 134 live accounts,
      `4120 Contract **Labor** Income` is the only one naming the concept and **no account contains
      "Labor"** (`api:2026-08-16:db_chart_of_accounts_query`, 134 accounts). The repo's British
      prose is spec-side drift from the incumbent chart. The field was never called `labor_line` in
      any artifact, so the rename went `cost_type` → `labor_line` directly and passed through no
      intermediate form.
      ⚠️ **The `&` in two value ids is deliberate and is ADR-0036's spelling**, frozen at acceptance.
      They mirror the `product_line` values `Trash & Cleanup` and `Shipping` rather than inventing a
      second orthography for the same concepts.
      **Five of the seven mirror an activity product line; `counter` and `warehouse` bill nobody** —
      which is the whole reason this is a separate axis rather than a re-use of `product_line`. A
      warehouse hour is real cost against no revenue line, and collapsing the two taxonomies would
      make it invisible or force it into a category it does not belong to.
      ⚠️ **NOTHING IN `ledger/` EXERCISES THIS, AND NOTHING EVER WILL — the consumer is the
      REPORT.** Owner, 2026-08-16: "the p&l by product line will distribute labor costs with
      labor_line delivery across product lines, the same mechanism will allow other combos for
      future reporting." **`labor_line` is an allocation pool's COST SELECTOR**, declared per pool as
      `cost_sources.labor_line` in `reporting/product-line-pl.yaml` and enforced by gate 13h: every
      value is `billable` (selected by exactly one pool) or `bills_nobody` (selected by none, with a
      live blocker). ⚠️ **The selection was PROSE until 2026-08-16, and that is how the `transport`
      pool came to select `labor_line: delivery`** — correct when the enum had three values, wrong
      from the moment it had seven, and invisible to every gate.
      ⚠️ **This is what the 3 → 7 growth was FOR.** With three values exactly one activity pool could
      name its own labor. Five of the seven now mirror an activity product line and there are
      exactly five activity lines, so the correspondence is total — which is what makes a coverage
      gate possible at all. The mapping is **not** derivable from the names: `trucking` ↔ `Transport`
      is the counter-example, because `Transport` is the incumbent Xero tracking category and
      `trucking` is what the owner calls the work.
      ⚠️ **`counter` and `warehouse` bill nobody, and where their cost lands is undecided** — spread
      like `delivery`, reported unallocated, or attached to the causal order's goods directly. Both
      are real absorbed labor in 5800. Carried as **OQ-046**.
      ⚠️ **The vector that used to exercise this is gone and is not coming back.** Under ADR-0025 the
      value was declared on a posting to 5800 and exactly one golden vector supplied it — the vector
      then called `absorbed-line-missing-cost-type-rejected`, whose own derivation said "this is the
      only place `cost_type` is exercised in the entire spec". It was repurposed to refuse a missing
      causal job (`ledger/vectors/shift_recorded/absorbed-line-missing-causal-job-rejected.yaml`).
      **That is correct, not a loss**: a `ledger/` vector could only ever have exercised a posted
      value, and the value is no longer posted.

# ── why cardinality stopped being the question, twice ───────────────────────────────────────────
# ADR-0008 exploded these dimensions into ACCOUNT identity — 20 product lines x 3 cost types = 60
# accounts per dimensioned GL code — so a third dimension multiplied again. **ADR-0018 superseded
# it**: the chart stayed plain and dimensions rode on the posting, so cardinality grew by ADDITION.
# **ADR-0036 superseded THAT**: they ride nowhere. Growing this file is now a master-data edit that
# no account and no historical transfer has to agree with, which is why `labor_line` could go from
# three values to seven in one sitting.
#
# What ADR-0018 cost, and what ADR-0036 does about it. Under ADR-0008 a posting with no product line
# had no account to land in; under ADR-0018 it had one, and only the declaration rule stood between
# REQ-LED-001 and a silent absence — which is why the rejection vectors were "the entire enforcement
# of this file". Under ADR-0036 there is nothing to omit. **The enforcement did not weaken, it moved
# to the keys**: `ledger/vectors/` still carries the absence-versus-null pair, against
# `causal_orders` (`invoice_issued/declared-null-causal-order-recorded` beside
# `invoice_issued/missing-causal-order-rejected`), and gate 10h still fails on both arms.
#
# **A population with no resolvable classification is a reportable number, and should be reported.**
# "Share of revenue that resolves to no product line" is a figure the read side produces at any
# time; the current system's equivalent was invisible until someone went looking and found 28.7% —
# a number that turned out to be measuring a broken derivation. ⚠️ **The lesson survives the
# architecture change**: a watch pointed at a derived copy measures the derivation, not the
# decision. Under ADR-0036 there is only one copy left, which is the master, so the watch has
# nowhere else to point.
#
# HOT-011 is **resolved** (OQ-021) and its subject is now moot: it asked whether the dimension
# obligation was per class or per account, and ADR-0036 answers "neither — there is no obligation".
# ⚠️ The split of authority it produced is gone with it. `ledger/chart-of-accounts.yaml` no longer
# says WHICH postings owe a dimension — it carries no `dimensions:` key at all — and this file no
# longer says which values a posting may take, because no posting takes one. **What this file now
# governs is the vocabulary of the REPORT**, and gate 13 is what checks it (every value classified
# goods or activity in `reporting/product-line-pl.yaml`), not gate 10.
