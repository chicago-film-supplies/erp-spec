# Dimensions — axes a balance can be sliced by, carried ON the posting, never derived later.
#
# REQ-LED-001: both mandatory dimensions are NOT NULLABLE on revenue and COGS postings.
# A posting missing either is rejected, not recorded. The current system's optional dimension is
# why 28.7% of line revenue has none.

dimensions:
  - id: product_line
    description: What category of goods or service the line belongs to.
    required_on: [revenue, cogs]
    nullable: false
    source: "api:2026-08-08:db_tracking_categories_query (21 values in the current system)"
    values:
      - Crafty
      - Surface Protection
      - Traffic, Safety & Signage
      - Replacements
      - Delivery
      - Wardrobe
      - Fans & Heaters
      - Office Supplies
      - Hair & Makeup
      - Transport
      - Power, Lights & Tools
      - Trash & Cleanup
      - Janitorial
      - Transaction Fees
      - Walkies & Hotspots
      - Carts & Ramps
      - Expendables
      - Tables & Chairs
      - Crew
      - Tents
    note: >-
      **20 values — `Other` was deleted** (OQ-022). A non-nullable dimension makes `Other` the new
      null: the bucket that reads as a category and means "nobody chose". The escape hatch is an
      ACCOUNT, not a value — a one-off product or service that maps to no product line is coded to
      4800 Other Income, which requires no dimension. So an uncategorised receipt is visibly
      uncategorised on the face of the P&L instead of hiding inside operating revenue.
      ⚠️ This leaves ADR-0020's restatement residue without a target: Warehouse Rental, Office
      Rental, Indoor Parking, Location Scouting, Security and Safety & Security Assessment are
      historical lines on 4100 Service Income with no product line and no `Other` to fall back on.
      Moving them to 4800 reassigns an account rather than assigning a dimension, and that moves
      money between P&L sections. **OQ-025.**

  - id: cost_type
    description: What kind of work a labour posting represents.
    required_on: [labour_cogs]
    nullable: false
    source: inbox/2026-08-08-two-reporting-dimensions.md
    values: [delivery, counter, warehouse]
    note: >-
      **Labour only** (OQ-021, resolving HOT-011). `required_on: [labour_cogs]` means the accounts
      whose `dimensions` list in `ledger/chart-of-accounts.yaml` names `cost_type` — today that is
      5800 alone. It was previously `[cogs]`, which required a "kind of work" on
      `5000 Cost of Goods Sold: Retail Inventory`, where none of delivery / counter / warehouse is
      true, and REQ-LED-001's text required one on every rental revenue posting as well. The chart
      states the obligation per account precisely so that no rule has to infer it from a class.

# Cardinality is no longer a concern, and the reason is worth keeping. ADR-0008 exploded these
# dimensions into account identity — 20 product lines x 3 cost types = 60 accounts per dimensioned
# GL code — so a third dimension would have multiplied again. **ADR-0018 superseded it**: the chart
# stays plain and dimensions ride on the posting, so cardinality now grows by ADDITION and adding a
# product line stops being a migration.
#
# What that costs: with dimensions off account identity, **nothing structural catches a missing
# one**. Under ADR-0008 a posting with no product line had no account to land in. Now it has one,
# and only the `nullable: false` rule above stands between REQ-LED-001 and a silent null. That is
# why the rejection vectors in `ledger/vectors/` are not optional decoration — they are the entire
# enforcement of this file.
#
# HOT-011 is **resolved** (OQ-021). Revenue accounts carry a product line; `cost_type` is labour
# only; and REQ-LED-001's statement was amended to match rather than left contradicting this file.
# Two authorities, deliberately split: the per-account `dimensions` list in
# `ledger/chart-of-accounts.yaml` says WHICH postings owe a dimension, and this file says which
# VALUES it may take. Gate 10 checks every vector against both — and therefore against neither the
# rule nor the vector it is checking.
