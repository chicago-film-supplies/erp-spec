  - code: 5800
    name: "Cost of Goods Sold: Wages (Absorbed)"
    class: expense
    normal_balance: debit
    disposition: new
    status_live: absent
    reason: >-
      Required by ADR-0019. Hours actually worked on a job, at that person's actual per-contact
      wage. ⚠️ This reason read "dimensioned to the job's product line and the work's cost type"
      until 2026-08-16 — **5800 was the only account in the chart naming two dimensions, and under
      ADR-0036 it names none.** What the posting carries instead is the CAUSAL JOB; both
      classifications are derived from the shift's own allocation row at report time (OQ-042).
      **Code chosen, not inherited:** the previous revision put this on 5100, which is live and
      occupied. The live
      Direct Costs block runs 5000, 5001, 5100, 5200, 5300, 5400, 5500, 5600, 5700, so 5800 is the
      next free hundred and keeps the absorbed/unabsorbed pair adjacent. Named in the live house
      style (`Cost of Goods Sold: <thing>`) rather than the invented `COGS – ` form, and it is the
      "cogs: wages" of the taxonomy that retires 5400.
    source: ADR-0019

  - code: 5801
    name: "Cost of Goods Sold: Wages (Unabsorbed)"
    class: expense
    normal_balance: debit
    disposition: new
    status_live: absent
    reason: >-
      Required by ADR-0019. Guaranteed-but-unworked hours and idle time — a real cost attributable
      to no job, which is what makes the absorbed/unabsorbed gap a measure of UTILISATION rather
      than rate deviation. **It carries NO CAUSAL ORDER, and that is the whole account**: idle time
      is attributable to no job, so its postings declare `causal_orders: null` — an explicit
      determination rather than a missing key (REQ-LED-001, ADR-0036). ⚠️ This reason read
      "DELIBERATELY UNDIMENSIONED… a dimension on it would let idle time be attributed to a product
      line" until 2026-08-16; the lie to avoid is unchanged and the mechanism that prevents it moved
      from the chart to the key. Sub-numbered under 5800 per the live convention (1501 under 1500, 5001
      under 5000); the previous revision's 5199 sat inside the 51xx Subrentals block, which has
      nothing to do with labour.
    source: ADR-0019

