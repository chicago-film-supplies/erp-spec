# Chart of accounts.
#
# The whole live chart, carried across with an explicit per-account DISPOSITION. Pruning to
# ADR-0018's "plain chart, one account per GL code" is therefore auditable rather than silent, and
# this file cannot drift from `migration/field-map.yaml` without the difference being visible.
# ⚠️ **That sentence used to end "~60 accounts plus a dimension column". There is no dimension
# column.** ADR-0036 superseded ADR-0018 on 2026-08-16 and the plain-chart half survived unchanged;
# what went is everything the column was for — see the keys rule below.
#
# Measured 2026-08-09 against prod (`db_chart_of_accounts_query`): **134 accounts, 112 Active,
# 22 Archived**. Every one of the 134 appears below. `code` is a NUMBER in the live collection —
# a string filter silently returns 0 rows.
#
# **139 entries**, because five are minted rather than carried across — each `disposition: new`,
# `status_live: absent`, with the rule that needs it named in its `reason`: 5800/5801 for
# absorbed/unabsorbed labour (ADR-0019), **2050 Customer Credit Balances** for `credit_note_issued`,
# which had no credit-side account at all (erp-spec#5), **2010 Accrued Expenses: Received Not
# Invoiced** for `obligation_accrued`, which had none either (erp-spec#14), and **5150 Cost of Goods
# Sold: Pass Through**.
# ⚠️ **This paragraph read "138 entries, because four are minted" until 2026-08-16 and was wrong by
# one in both halves** — 5150 was added without it being updated, and nothing counts these numbers,
# so the header could disagree with the file indefinitely. Re-counted here: 139 `code`, 139
# `status_live` (112 Active / 22 Archived / 5 absent), 139 `disposition` (108 adopt / 21 drop /
# 4 merge / 5 new / 1 undecided).
#
# ✅ **AND SOMETHING COUNTS THEM NOW — gate 16** (erp-spec#8). `spikes/harness/live-chart-probe.ts`
# writes `migration/live-chart.measured.yaml` from CFS's Firestore mirror of the live chart (never
# the Xero API), and `validate.ts` checks THIS file against it: every live code adopted, merged or
# explicitly dropped and never omitted; every `status_live` equal to the live `status`; every
# `disposition: new` genuinely absent from the live chart and no `new` landing on an occupied code;
# and `139 == 134 + 5` as arithmetic rather than as a sentence. **This file IS the live→target GL
# correspondence erp-spec#8 asked for** — what was missing was never an artifact, only an execution.
# ⚠️ A NAME divergence fails only under `adopt`, which means "keep as is". Under `merge` / `drop` /
# `undecided` a different name is the decision being recorded.
#
# ⚠️ **All five were minted for a rule that could not otherwise be written, and none of them for
# tidiness.** That is the bar: an account enters this file because a posting rule has no legal
# account for one of its legs, not because a chart "should have" one.
#
# A `disposition` is a PROPOSAL for the cutover, with a reason, for the owner to review. It is not
# a decision already taken. Where no defensible proposal exists the value is `undecided` and the
# entry names what would settle it.
#
# ── per-account shape ───────────────────────────────────────────────────────────────────────────
#   code            int, unique across this file
#   name            the account's name in v2
#   class           asset | liability | equity | revenue | expense
#   normal_balance  debit | credit
#   contra          optional bool — true where normal_balance opposes the class default
#   disposition     adopt | rename | merge | drop | new | undecided
#   status_live     Active | Archived | absent   (`absent` = does not exist in the live chart)
#   class_live      ONLY where the live class differs from `class` above; requires a `note`
#   merge_into      required by `merge`; must resolve to a code in this file
#   reason          required by drop | merge | new | undecided
#   blocked_by      required by any `undecided`; must name an OPEN OQ- / SPIKE- / HOT-
#   source          dated and pinned
#   note            free text
#
# ── what is NOT here, deliberately ──────────────────────────────────────────────────────────────
# **`xero_id` is not copied in.** ADR-0009 fences foreign identifiers out of domain models; the
# live→target correspondence belongs in `migration/field-map.yaml`, not in the chart.
#
# ── two corrections this revision makes ─────────────────────────────────────────────────────────
# 1. **The previous revision invented `5100 = "COGS – Labour Absorbed"`.** Live `5100` is
#    `Cost of Goods Sold: Subrentals`, Active. The whole live 5x00 block is occupied (5000, 5001,
#    5100, 5200, 5300, 5400, 5500, 5600, 5700), so the absorbed/unabsorbed pair moves to the next
#    free hundred — 5800/5801 — and sits adjacent, per the live sub-numbering convention
#    (1501 under 1500, 5001 under 5000, 6001 under 6000).
# 2. **`5190 COGS – Labour Variance` is gone**, and 5100's "standard cost applied to causal jobs"
#    note with it. HOT-010 and ADR-0019 killed the rate variance — with no standard rate it could
#    never fire — but only `posting-rules.yaml`'s comment followed; the accounts did not.
#
# ── THERE IS NO `dimensions:` KEY, AND THAT IS THE DECISION (ADR-0036, superseding ADR-0018) ────
# **An account is a GL code and its behaviour. It says nothing about what a posting to it must
# carry.** Until 2026-08-16 every entry here held a `dimensions:` list — 19 of 139 non-empty, 18
# `[product_line]` and 5800 alone `[product_line, cost_type]` — and that list was the authority for
# WHICH postings owed a dimension (ADR-0025, resolving HOT-011). ADR-0036 removed the obligation, so
# the key was **DELETED rather than emptied to `[]`**, and gate 10a now FAILS on an account that
# carries one.
#
# ⚠️ **The choice between deleting and emptying was deliberate, and ADR-0036's own text reads the
# other way.** Its Consequences say "`5800`'s `dimensions: [product_line, cost_type]` becomes
# `dimensions: []`" — the vivid statement of the effect on the one account that owed two. Its next
# bullet says the lists "are **obsoleted** in their current form". A key that can only hold `[]` on
# every one of 139 entries carries no information and invites the next author to fill one in; the
# repo's own rule is to prefer making a defect class unrepresentable over policing it. Deleting is
# the stronger reading of "obsoleted", and 10a is what makes it enforced rather than asserted.
#
# ── what a posting carries instead: KEYS ────────────────────────────────────────────────────────
# **Causal order(s), invoice link, line identity** — facts about the event, not classifications of
# it (ADR-0036). Which keys a given posting owes is read off its POSTING RULE in
# `ledger/posting-rules.yaml`, never off its account, because the obligation is a property of what
# happened and not of where it landed. Gate 10h checks a golden vector's transfers against the rule
# they claim; the chart's job is now only 10g — that the account exists at all.
#
# ⚠️ **The absence-versus-null rule did not weaken; it MOVED and got stronger.** It used to say a
# posting to a dimensioned account must DECLARE the dimension — a value, or an explicit null meaning
# "no tracked value applies" — with a missing key refused and `""` refused alongside it. It now says
# the same thing about **`causal_orders` on every posting**, which is a better subject: a category
# can defensibly be absent from a document that never had one, while a posting with no causal order
# is unallocatable (REQ-LED-001, ADR-0036).
#
# **4800 Other Income survives the change and the null did not**, and the difference is exactly why
# only one of them was ever a ledger fact. An unresolvable product line says "this was a categorised
# kind of sale and no tracked category applies"; 4800 says "this was not a categorised sale at all"
# — interest, cashback, a vendor refund. The first is now derived at report time and reported as
# `unallocated` (`ledger/dimensions.yaml`, `reporting/product-line-pl.yaml`); the second is an
# ACCOUNT, and accounts are what this file is for. Coding a real service to 4800 still understates
# operating revenue.

