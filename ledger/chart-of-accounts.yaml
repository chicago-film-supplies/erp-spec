      **Where own-crew cost sits today, and what ADR-0019 moves it out of** (OQ-011). After the
      move this account retains only wages attributable to no job — administrative and office time
      — which is why it stays undimensioned. Job labour goes to 5800, idle and guaranteed-unworked
      time to 5801. The account surviving with a narrower meaning is the point; deleting it would
      lose the non-job population.

