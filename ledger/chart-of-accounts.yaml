  - code: 5400
    name: "Cost of Goods Sold: Job Costs"
    class: expense
    normal_balance: debit
    disposition: drop
    status_live: Active
    reason: >-
      **A dead account** (OQ-023). It was a catchall for one-off project job costs, and in v2 that
      population is captured by the specific COGS accounts instead — wages to 5800/5801,
      subcontractors to 5200, equipment rental to 5100. A catchall beside those accounts is where
      cost goes to avoid being classified, which is the whole failure the dimensioned COGS block
      exists to prevent. Active rather than Archived, so its history still imports under ADR-0020;
      it takes no new postings.
    source: "api:2026-08-09:db_chart_of_accounts_query"

  - code: 5500
