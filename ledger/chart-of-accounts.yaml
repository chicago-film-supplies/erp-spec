    dimensions: []
    disposition: drop
    status_live: Archived
    reason: >-
      Archived, and payroll processing is an explicit charter non-goal. Employer payroll tax is
      real cost, but CFS incurs it through the external employer of record's invoice — a purchase
      document, costed with the labour it accompanies under ADR-0019, not a payroll tax CFS
      calculates or files. ⚠️ OQ-011 cites this account as evidence that labour cost is recorded
      today; that is a statement about what exists, not a requirement that it survive. If the EOR
      invoice turns out to itemise employer tax separately and it needs its own line, this is the
