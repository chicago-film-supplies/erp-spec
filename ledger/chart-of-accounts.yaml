  # ══ COST OF GOODS SOLD ═══════════════════════════════════════════════════════════════════════
  - code: 5000
    name: "Cost of Goods Sold: Retail Inventory"
    class: expense
    normal_balance: debit
    disposition: adopt
    status_live: Active
    source: "api:2026-08-09:db_chart_of_accounts_query"
    note: >-
      Resolves to the product line of the item sold. A labour classification has no meaning here — its values are
      delivery/counter/warehouse, which describe labour — and that is HOT-011.

  - code: 5001
    name: "Cost of Goods Sold: Purchase Discounts"
    class: expense
    normal_balance: credit
    contra: true
    disposition: adopt
    status_live: Active
    note: >-
      ✅ **The surviving account for supplier discounts, decided 2026-08-16 (OQ-026)**; `4300
      Discounts Received` merges into it. ASC 330's default treatment is a reduction of the cost of
      the goods, and the binding requirement is consistency rather than the choice itself.
      **Carries no product line.** A supplier discount has no CUSTOMER product line — it reduces what
      CFS paid, not what CFS sold — and ADR-0025 makes the obligation per account, so `[]` is a legal
      shape here. Same empty list as 4700/5500 and for the same reason: this is not a sale.
    source: "api:2026-08-09:db_chart_of_accounts_query"

  - code: 5100
    name: "Cost of Goods Sold: Subrentals"
    class: expense
    normal_balance: debit
    disposition: adopt
    status_live: Active
    source: "api:2026-08-09:db_chart_of_accounts_query"
    note: >-
      ⚠️ **This code was in collision.** The previous revision of this file invented `5100 = "COGS –
      Labour Absorbed"` with the note "Standard cost applied to causal jobs". Live 5100 is
      Subrentals and is Active; the labour account moved to 5800; and ADR-0019 replaced standard
      cost with actual, so the note went with it. Equipment rented in to fill an order takes the
      product line of what it substitutes for.

  - code: 5150
    name: "Cost of Goods Sold: Pass Through"
    class: expense
    normal_balance: debit
    disposition: new
    status_live: absent
    reason: >-
      **4140 Pass Through Income had no cost side.** Owner, 2026-08-16: "it should get a matching
      cogs." Every other recharge pair in this chart has one — 4150/5300 for freight, 4700/5500 for
      merchant fees — and without it a passthrough reports its full re-billed amount as margin.
      **Not 5400 Job Costs, and not 5100 Subrentals.** 5400 is `disposition: drop` precisely because
      "a catchall beside those accounts is where cost goes to avoid being classified"; reviving it
      for this would reintroduce exactly that. 5100 Subrentals is gear CFS does not own but still
      SUPPLIES — CFS is the supplier. A passthrough is CFS acting as a **purchasing agent** for the
      customer, which is a different economic role and a different margin story.
      Placed at 5150 to sit adjacent to 5100, the other "obtained from a third party for this job"
      account, following the chart's sub-numbering convention (1501 under 1500, 5001 under 5000).
      ⚠️ The code is a PROPOSAL; the pairing is the decision.
    source: ADR-0029

  - code: 5200
    name: "Cost of Goods Sold: Subcontractors, Sales Commissions"
    class: expense
    normal_balance: debit
    disposition: adopt
    status_live: Active
    source: "api:2026-08-09:db_chart_of_accounts_query"
    note: >-
      **Subcontractor labour is already in COGS here** (OQ-011). ADR-0019's absorption model puts
      own-crew cost beside it in 5800 — a move out of 6600, not an invention. The two labour
      populations become comparable for the first time.

  - code: 5300
    name: "Cost of Goods Sold: Shipping ( Rentals & Sales Only )"
    class: expense
    normal_balance: debit
    disposition: adopt
    status_live: Active
    source: "api:2026-08-09:db_chart_of_accounts_query"
