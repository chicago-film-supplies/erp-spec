# Chart of accounts.
#
# The whole live chart, carried across with an explicit per-account DISPOSITION. Pruning to
# ADR-0018's "~60 accounts plus a dimension column" is therefore auditable rather than silent, and
# this file cannot drift from `migration/field-map.yaml` without the difference being visible.
#
# Measured 2026-08-09 against prod (`db_chart_of_accounts_query`): **134 accounts, 112 Active,
# 22 Archived**. Every one of the 134 appears below. `code` is a NUMBER in the live collection —
# a string filter silently returns 0 rows.
#
# A `disposition` is a PROPOSAL for the cutover, with a reason, for the owner to review. It is not
# a decision already taken. Where no defensible proposal exists the value is `undecided` and the
# entry names what would settle it.
#
# ── per-account shape ───────────────────────────────────────────────────────────────────────────
#   code            int, unique across this file
#   name            the account's name in v2
#   class           asset | liability | equity | revenue | expense
#   normal_balance  debit | credit
#   contra          optional bool — true where normal_balance opposes the class default
#   dimensioned     true | false | undecided — must postings to this account carry the dimensions
#                   `ledger/dimensions.yaml` requires for their class? (see HOT-011 below)
#   disposition     adopt | rename | merge | drop | new | undecided
#   status_live     Active | Archived | absent   (`absent` = does not exist in the live chart)
#   class_live      ONLY where the live class differs from `class` above; requires a `note`
#   merge_into      required by `merge`; must resolve to a code in this file
#   reason          required by drop | merge | new | undecided
#   blocked_by      required by any `undecided`; must name an OPEN OQ- / SPIKE- / HOT-
#   source          dated and pinned
#   note            free text
#
# ── what is NOT here, deliberately ──────────────────────────────────────────────────────────────
# **`xero_id` is not copied in.** ADR-0009 fences foreign identifiers out of domain models; the
# live→target correspondence belongs in `migration/field-map.yaml`, not in the chart.
#
# ── two corrections this revision makes ─────────────────────────────────────────────────────────
# 1. **The previous revision invented `5100 = "COGS – Labour Absorbed"`.** Live `5100` is
#    `Cost of Goods Sold: Subrentals`, Active. The whole live 5x00 block is occupied (5000, 5001,
#    5100, 5200, 5300, 5400, 5500, 5600, 5700), so the absorbed/unabsorbed pair moves to the next
#    free hundred — 5800/5801 — and sits adjacent, per the live sub-numbering convention
#    (1501 under 1500, 5001 under 5000, 6001 under 6000).
# 2. **`5190 COGS – Labour Variance` is gone**, and 5100's "standard cost applied to causal jobs"
#    note with it. HOT-010 and ADR-0019 killed the rate variance — with no standard rate it could
#    never fire — but only `posting-rules.yaml`'s comment followed; the accounts did not.
#
# ⚠️ **HOT-011 is open against the `dimensioned` column.** REQ-LED-001 requires BOTH dimensions on
# every revenue and COGS posting; `dimensions.yaml` requires only `product_line` on revenue; and
# `cost_type`'s own description ("what kind of work a LABOUR posting represents", values
# delivery/counter/warehouse) has no defensible value for a rental revenue posting or for
# `5000 COGS: Retail Inventory`. This column is written on `dimensions.yaml`'s reading, which is the
# narrowest of the three. OQ-021 settles which is authoritative.

