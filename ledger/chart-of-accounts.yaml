      is rounded to the cent at determination (EVT-TAX-001) and *then* posted, so every posting
      balances exactly in integers. A posting that needs a rounding plug is a defect, not a routine
      entry — and golden-vector check 7 (Σ debits == Σ credits, integers only) is what turns that
      from an assertion into a failure. Keeping the account would give the defect a place to hide.
