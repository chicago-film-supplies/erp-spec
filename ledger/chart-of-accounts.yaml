  - code: 2050
    name: "Customer Credit Balances"
    class: liability
    normal_balance: credit
    dimensions: []
    disposition: new
    status_live: absent
    reason: >-
      **Every form of customer value that is not yet attached to an invoice**, and the credit-side
      account `credit_note_issued` had none of (erp-spec#5). Three populations, one account:
      unallocated credit notes, the unapplied remainder of an overpayment (OQ-028), and any deposit
      taken before an invoice exists.
      **The GAAP name, deliberately.** "Customer credit balances" is the phrase the presentation
      rule itself uses — customer credit balances are not netted against receivables — so the
      account is named for the rule that makes it necessary rather than for the document that most
      often fills it.
      **Not 1200, and the survey is the reason it is not.** All four suites surveyed put a credit
      MEMO in receivables (SAP posts it to the customer's ordinary reconciliation account; NetSuite
      is Dr revenue / Cr AR; Odoo reverses the invoice's journal items; Intacct treats it as an AR
      adjustment). But all four draw the same line for value that is NOT attached to a billed sale,
      and give it a liability: SAP a special G/L alternative reconciliation account, explicitly so
      it is "not presented in the balance sheet together with receivables"; NetSuite `Customer
      Deposits`, an Other Current Liability that does not touch AR; Odoo a down-payment product
      booked to a current liability; Intacct an AR Advance.
      **A CFS credit note fails that test on its own data model.** It is scoped to a party rather
      than to a sale — no `query_by_orders`, where `Invoice` requires min-1 — and where it lands is a
      separate `settlements` row that may split it across invoices.
      ⚠️ **Under ADR-0033 that party is a SETTLEMENT POINT, not the pre-tree flat organization.** The
      account and the fact it records are unchanged; what changed is the node the balance hangs off,
      so that per-department aging is one group-by rather than a tree walk. A crossing to a sibling
      settlement point is permitted and recorded (EVT-BIL-007); a crossing between organizations is
      refused, which is ASC 210-20-45-1's same-party boundary. CN-1015: $259.74 issued, $247.75 to
      invoice 1767 and $11.99 to invoice 1751 (`api:2026-08-09:get_settlements`). At issue it is
      attached to nothing, which is the deposit side of the line, not the credit-memo side.
      **ACCEPTED by the owner 2026-08-09**, on the survey rather than on the first argument offered
      for it — see the withdrawal note in
      `inbox/2026-08-09-customer-credit-balances-across-four-suites.md`. The alternative considered
      and rejected: credit 1200 at issue, which is Xero's model and what the live GL does today. It
      would have made `credit_note_allocated` post nothing and moved EVT-BIL-006 to `no_posting`.
      **The migration delta that choice creates is ZERO, measured rather than assumed.** Xero
      credits AR at issue and this account does not, so the two designs disagree only while a note
      is unallocated. Every one of the **9** resolvable allocations in the corpus happened in the
      **same month** the note was issued — none crosses a month-end — so at every historical period
      boundary 2050 and 1200 give identical closing balances and ADR-0020's "the restatement must
      not alter any amount" is satisfied trivially (`api:2026-08-09:search_credit_notes` +
      `get_settlements`, 13 notes / 9 allocations / 0 crossings).
      ⚠️ Two `applied` notes — CN-1013 and CN-1016 — have **no allocation row at all**, so they are
      outside that measurement rather than inside it. That is a defect in the current journal, filed
      as api-cloudrun#469; it does not change the delta unless the missing rows turn out to cross a
      boundary.
    source: "api:2026-08-09:search_credit_notes"
    note: >-
      13 credit notes live, 10 `applied` / 3 `void`, and **none currently unallocated** — every
      `remaining_credit_cents` is 0. So this account's balance is $0.00 at cutover and it is being
      chosen for the state the model permits rather than for one the corpus is sitting in.
      ⚠️ **ONE balance, not one per source.** TigerBeetle holds a single total here; the per-note
      remaining and the per-customer position are projections in the document store, which is where
      `credit-notes.remaining_credit_cents` already lives. ADR-0018 keeps the chart plain, so there
      is no account per note and no account per customer — and the over-allocation check therefore
      consults the projection, not a ledger balance.
      A deposit against undelivered goods is a performance obligation and a credit note is not; if
      deposits ever become material, that distinction is a presentation split within this account
      rather than a reason to have avoided it.

