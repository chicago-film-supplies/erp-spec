name: spec

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, stated HERE rather than inherited.
#
# This job only reads: checkout, then `deno task ci` (fmt --check, validate, and
# a staleness diff over the generated files). It writes nothing back.
#
# ⚠️ Declared explicitly because the alternative is depending on a REPO SETTING.
# With no `permissions:` block a workflow inherits `default_workflow_permissions`,
# which was `write` until 2026-08-29 — so this job held a write-capable
# GITHUB_TOKEN it never used, and its privilege level was invisible in the file
# that defines it. The setting is now `read`, but a setting can be flipped back
# from a web form by someone who will never open this file. An explicit block
# cannot be.
#
# Contrast `tax-rules-refresh.yml`, which legitimately needs `issues: write` and
# says so. An explicit block still ELEVATES above a read-only default, so
# tightening the repo default costs that workflow nothing — which is precisely
# why stating the requirement in the workflow is the robust place for it.
permissions:
  contents: read

# Per-PR group so a superseded push stops paying for a verdict nobody will read.
# GitHub bills a whole minute per job, so run COUNT is the cost here, not
# duration — a run that a newer push has already invalidated is a billed minute
# for an answer about code that no longer exists.
#
# The key is the PR NUMBER on a PR and the SHA on a push, so a push-to-main run
# lands in a group of one and can never be cancelled by a later push: a verdict
# on a commit that is permanently on the default branch is worth its whole
# minute. ⚠️ This is why the group is NOT `github.ref` — on push that resolves
# to `refs/heads/main` for every commit, so a burst of pushes would leave only
# the last one gated.
#
# ⚠️ **Never give this shape to a release or deploy workflow.** Cancelling one
# of those mid-flight is a correctness bug, not a saving.
concurrency:
  group: spec-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ⚠️ **ONE OWNER FOR THE CI CONTRACT.** These four steps used to live here and nowhere else,
      # so the only other copy was whoever remembered to type them before pushing — two owners for
      # one fact, which is the defect class this repo has paid for most often. `tools/ci.ts` is now
      # the definition and this workflow calls it, so `deno task ci` locally and CI here cannot
      # drift. The reasoning that used to sit in these comments moved into that file with it:
      #
      #   - the steps do NOT short-circuit. `if: always()` was load-bearing — gating the
      #     stale-generated-file gate behind validate's success would make it dead code for exactly
      #     as long as something else was broken;
      #   - `deno fmt --check` writes nothing, which is why it runs above `gen`, whose staleness
      #     check is a diff that an in-place formatter would corrupt.
      #
      # ⚠️ It is NOT a replacement for this workflow. A local run uses one machine's Deno against a
      # working tree that may hold anything; this runs on a clean checkout. That difference is the
      # whole point of CI, and it is why `tools/ci.ts` scopes its staleness diff to the generated
      # files while this job's clean checkout makes the two equivalent.
      - name: CI
        run: deno task ci
