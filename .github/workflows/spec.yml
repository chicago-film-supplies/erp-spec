name: spec

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `validate` has been green since 2026-08-09 — a failure here is a real regression, not the
      # seeded day-one worklist it used to be.
      #
      # The steps below keep `if: always()` anyway, and that is deliberate: the moment validate
      # goes red again, the stale-generated-file gate must still run and still be able to fail on
      # its own terms. Gating it behind validate's success would make it dead code for exactly as
      # long as something else was broken — the "a guarantee nothing executes is not a guarantee"
      # failure this repo exists to avoid.
      - name: Validate
        id: validate
        run: deno task validate

      # `deno.json` declared fmt settings from the seed commit and nothing checked them, so 147
      # files drifted (reformatted in 0c3c6ef). The cost was never aesthetic: running the formatter
      # a configured repo obviously invites you to run produces a diff that swamps the actual
      # change, so every session either reverts the churn or lands it on top of unrelated work.
      #
      # `--check` writes nothing, which is why it can sit ABOVE the stale-generated-file step —
      # that step diffs the whole working tree, and a formatter that edited files in place would
      # make the two gates report each other's failures.
      - name: Formatting
        if: always()
        run: deno fmt --check

      - name: Regenerate
        if: always()
        run: deno task gen

      - name: Fail on stale generated files
        if: always()
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are stale. Run 'deno task gen' and commit the result."
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
