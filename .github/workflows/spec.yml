name: spec

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `validate` is expected to fail until the seeded worklist is cleared. The steps below use
      # `if: always()` so the stale-generated-file gate still executes and can still fail on its
      # own terms — otherwise it would be dead code for as long as validate stays red, which is
      # exactly the "guarantee nothing executes" failure this repo is meant to avoid.
      - name: Validate
        id: validate
        run: deno task validate

      - name: Regenerate
        if: always()
        run: deno task gen

      - name: Fail on stale generated files
        if: always()
        run: |
          if ! git diff --quiet -- traceability/ adr/in-force.generated.md; then
            echo "::error::Generated files are stale. Run 'deno task gen' and commit the result."
            git --no-pager diff -- traceability/ adr/in-force.generated.md
            exit 1
          fi
