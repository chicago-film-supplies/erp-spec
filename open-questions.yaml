      ⚠️ **ADR-0020's restatement needs the answer.** OQ-025 lists "Trucking to `Transport`" among
      the mechanical mappings, and that target was deleted for being empty. If `Transport` stays
      dropped, those 23 lines need a different home stated before the restatement runs; if it is
      restored, `reporting/product-line-pl.yaml` must classify it `goods` or `activity` — gate 13
