      **That measurement read `items[].tracking_category`, the line denorm.** At the PRODUCT master,
      `Trucking` (7 lines, $34,000.00) and `Shipping` (16 lines, $5,665.00) both carry `Transport`:
      **23 lines, $39,665.00**, in continuous use, none of which ever reached a line because nothing
