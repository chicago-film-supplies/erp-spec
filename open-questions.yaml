      `gh api -X PUT repos/chicago-film-supplies/erp-spec/branches/main/protection` at that point.

  - id: OQ-017
    headline: "is an employee a record or a role"
    question: >-
      Is an employee a distinct record, or a role attached to a person who may also be a customer
      contact?
    owner: alex
    decide_by: 2026-08-09
    blocks: [REQ-FUL, REQ-LED]
    status: answered
    answer: >-
      One person, many roles. A single party record per human carries role attachments (employee,
      organization contact); the same human is one record whether they are crew or a customer
      contact.
    notes: >-
      Raised by OQ-008 — many CFS crew are also contacts at customer organizations. The role model
      is also what gives wage data an access-control boundary: a wage attaches to the employee
      role, not to the customer-facing contact record. Supersedes the "extend contact with
      employee fields" option, which would have put payroll data on a record readable by people
      who should not see it.

  - id: OQ-018
    headline: "which job absorbs the overtime premium"
    question: >-
      When a shift spans several jobs and crosses into overtime, which job absorbs the overtime
      premium?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: answered
    answer: >-
      **The overtime hour splits in two, and the halves are treated differently.** The BASE rate for
      every hour — overtime hours included — is direct labor, charged to the causal job actually
      worked. The **PREMIUM** is allocated **pro-rata by hours across the causal jobs of that day**.
      Owner, 2026-08-09, and it is the standard cost-accounting convention rather than a house rule:
      the premium is caused by the day's volume in aggregate, not by whichever job happened to be on
      the clock after hour eight
      (`inbox/2026-08-09-labour-premium-rules-survey.md`).
      **Pro-rata by HOURS, the same base as the direct half**, so one rule drives both halves of the
      hour and no second allocation basis has to be agreed.
      The convention's one exception is retained and narrowed: overtime **specifically requested by
      a customer** is charged direct to the order that asked, and — following OQ-004's treatment of
      `handling_bucket` — **an override must be recorded AS an override**, so costing can tell a
      stated exception from the default.
      **The allocation happens in the SHIFT RECORD, never in the posting rule.** `amount:` is a
      dotted path with no arithmetic (gate 10), so the rounding of a pro-rata share — and the
      residual cent when hours do not divide the premium evenly — is decided upstream where the
      money rules already apply. `ledger/vectors/shift_recorded/` carries a deliberately
      non-dividing case for exactly this reason.
    notes: >-
      OQ-008 gives the total from the PO/bill, but not its allocation. Chronological (the premium
      lands on whichever job the clock was on after hour 8) is simple but arbitrary — the same two
      jobs in the opposite order produce different COGS. Pro-rata across the shift's jobs is
      fairer but detaches the premium from the hours that actually caused it. This is precisely
      the "distributing OT" guesswork OQ-008 aims to remove, so it needs a stated rule.

  - id: OQ-019
    headline: "what is a consecutive day"
    question: >-
      What defines a "consecutive day" for the 6th/7th-day 1.5x rule, and does it compound with
      the after-8-hours 1.5x?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: answered
    answer: >-
      **Six consecutive calendar days WORKED — a rolling count, not a payroll week.** Owner,
      2026-08-09: "it's really just whether you have worked six consecutive calendar days." That is
      the industry convention rather than the statutory one, and the two genuinely differ: Entertainment
      Partners defines a sixth day as "where a crew member works six days **in a row**", while the
      legal baseline Wrapbook implements for non-union work is workweek-relative — California's
      seventh-day rule triggers on the seventh consecutive day *within the employer-defined
      workweek*. CFS is **non-union**, so nothing forces the workweek reading, and consecutive-days-worked
      is both simpler and how crew actually experience it.
      **The 6th day is 1.5x for the whole day.** It does not compound with the after-eight-hours
      1.5x — an hour is premium once. A tenth hour on a sixth day is 1.5x, not 2.25x.
      ⚠️ **THE SEVENTH DAY IS NOT A RATE, IT IS A COMPLIANCE FAILURE.** Illinois **ODRISA**, amended
      effective 2023-01-01, requires **24 consecutive hours of rest in every consecutive seven-day
      period** — changed from "one day per calendar week" precisely to stop scheduling across a week
      boundary. Civil penalties to **$250 per offence, each seven-day period a separate offence**,
      with narrow exemptions (part-time ≤20 hrs/week, breakdown or emergency, seasonal agriculture).
      So a seventh consecutive day is generally unlawful here, and pricing it invites it. **The
      SCHEDULER refuses a seventh consecutive day, with an audited override**; the ledger does not.
      **The ledger RECORDS a seventh day if one happens** — see
      `ledger/vectors/shift_recorded/seventh-consecutive-day-is-recorded-not-refused`. Work that was
      performed is a cost that was incurred; refusing to post it would understate COGS and hide the
      breach in the one system that noticed it. Same reasoning as OQ-028's overpayment: a control
      belongs where the action is taken, not where the fact is recorded.
      Whether the ODRISA obligation sits with CFS or with the employer of record is a legal question
      and is deliberately not answered here.
    notes: >-
      Consecutive within what window — a fixed payroll week, or a rolling 7 days? The two give
      different answers for someone working Thursday through Wednesday. And if a person works ten
      hours on their sixth consecutive day, is that 1.5x throughout or 1.5x for eight hours and 2x
      for the last two? Both are defensible; only one can be implemented.

  - id: OQ-020
    headline: "which context owns purchase orders"
    question: >-
      Which context owns purchase orders — or is procurement a ninth bounded context?
    owner: alex
    decide_by: 2026-09-15
    blocks: [EVT-FA-001]
    status: answered
    answer: >-
      **Procurement is the ninth bounded context.** Owner, 2026-08-09. It owns the inbound document
      in all its forms — labor purchase orders, inventory purchase orders, and recurring bills —
      and the payables lifecycle those documents drive.
      **What made it worth the cost is the forecasting surface, which no existing context owns.** The
      procure-to-pay cycle has three stages and each answers a different question: a **PO** is
      committed-not-yet-incurred (spend forecast); an **accrual** is incurred-not-yet-invoiced
      (amount known, date unknown); an **invoice** is dated with terms (cashflow forecast). CFS's
      current system holds only the third, which is why "AP is underutilized today" — there is
      nowhere to record a commitment and nowhere to record work done but not yet billed.
      This also refines OQ-024's answer. `shift_recorded` credits Accounts Payable, but the EOR has
      not invoiced on the shift date — so the accurate credit leg is an **accrued labor liability**
      that the EOR's invoice later reclassifies into 2000. That is procurement's lifecycle, and it is
      why a wages liability has a purpose in v2 even though CFS has never had one.
      ⚠️ **This reopens m2.** Its exit criterion reads "All eight contexts have a context.md",
      `contexts_have_context_md` counts eight, and the context tables in `tools/validate.ts` and
      `tools/generate.ts` are hardcoded to eight. Accepting a ninth means editing a milestone that
      currently reads met. That is the honest cost and it is not a reason to place procurement
      arbitrarily in an existing context — which is the failure `contexts/ledger/events.yaml`
      explicitly refuses to make.
      The scaffolding — context directory, code, events, and the tooling's context tables — is WORK
      rather than decision, and is tracked as a GitHub issue.
    notes: >-
      Raised by OQ-008, which made purchase orders first-class in v2 with two use cases: the
      document labor scheduling generates and costs flow from, and inventory acquisition (retail
      stock, and fixed assets bought for rental or internal ops). None of the eight existing
      contexts owns procurement — ledger records the consequence, fixed-assets receives the asset,
      availability receives the stock, but nothing owns the inbound document. Placing PO events in
      one of them arbitrarily is the failure to avoid. A ninth context is the obvious answer and
      also the expensive one: m2's exit criterion names eight, so adding one reopens m2.

  - id: OQ-021
    headline: "which postings owe which dimensions"
    question: >-
      Which postings must carry which dimensions — is `cost_type` a labor-only dimension, and may
      a revenue or COGS account be undimensioned at all?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED, HOT-011]
    status: answered
    answer: >-
      Revenue accounts carry a **product line**. `cost_type` is a **labor** dimension — its values
      are delivery / counter / warehouse — so it applies to 5800 Cost of Goods Sold: Wages
      (Absorbed) alone, and to no revenue account and no non-labor COGS account.
      REQ-LED-001's statement is amended to match; `ledger/dimensions.yaml` moves `cost_type` from
      `required_on: [cogs]` to `[labor_cogs]`; and the chart of accounts now states the obligation
      **per account** as an explicit `dimensions:` list rather than leaving it to be inferred from
      class. Resolves HOT-011.
      ⚠️ **SUPERSEDED IN ITS ENTIRETY BY ADR-0036, accepted 2026-08-16 — the question is MOOT, not
      re-answered.** "Which postings must carry which dimensions" has no answer because no posting
      carries a dimension: a posting records KEYS and every classification is derived at report time.
      The chart carries no `dimensions:` key at all (gate 10a refuses one), `ledger/dimensions.yaml`
      is a REPORTING taxonomy with no `required_on`, and `cost_type` is renamed `labor_line` and
      derived from the shift's allocation row (OQ-042).
      ✅ **The answer above was correct when it was taken, and it is retained rather than rewritten**
      — it is what resolved HOT-011, and the per-account reading is what made ADR-0025's exemption
      for 5801 expressible instead of special-cased. **What ADR-0036 changed is the premise, not the
      reasoning**: ADR-0025 correctly refused to infer an obligation from a class, and ADR-0036
      refuses the obligation itself.
    notes: >-
      Three statements disagree and all three are load-bearing. REQ-LED-001 says both dimensions on
      every revenue and COGS posting; `ledger/dimensions.yaml` says `product_line` on revenue and
      both on COGS; and the chart of accounts has accounts where even `product_line` has no
      defensible value. `ledger/chart-of-accounts.yaml` is written on the narrowest reading and
      leaves 8 accounts `dimensioned: undecided` pointing here — 4130 PSA Income, 4300 Discounts
      Received, 4400 Markup on Reimbursable Expenses, 5001 COGS Purchase Discounts, and the
      non-operating revenue block. Whichever way this goes, REQ-LED-001's statement or
      `dimensions.yaml`'s `required_on` has to be amended, because they cannot both stand. See
      HOT-011 for the evidence.

  - id: OQ-022
    headline: "does the Other product line survive"
    question: >-
      Does `Other` survive as a `product_line` value, and what value do facility and professional
      service lines take instead?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: answered
    answer: >-
      **`Other` is deleted from the product_line value set** — 21 values become 20. The escape
      hatch for a one-off product or service that maps to no product line is an ACCOUNT, not a
      value: it is coded to **4800 Other Income**, which requires no dimension. Tax and liability
      postings — the bottled water tax among them — likewise carry no dimension, because 2200 and
      2210 require none.
      REQ-LED-001 is unaffected: a posting to an account whose `dimensions` list names
      `product_line` is still REJECTED if it lacks one.
      ⚠️ **Refined the same day by OQ-025**, which drew the line more precisely: what is refused is
      ABSENCE, not null. A declared `product_line: null` records that no tracked value applies and
      is recorded; a missing key means nobody decided and is refused. This answer's original
      closing sentence — "there is no null in a required field" — is superseded by that.
    notes: >-
      ADR-0020 deferred this to m3 explicitly and m3 cannot answer it — it is a taxonomy decision,
      not a finding. A non-nullable dimension makes `Other` the new null: the bucket that means
      "nobody chose" while looking like a choice. ADR-0020 names the exact population that needs a
      real value — Warehouse Rental, Office Rental, Indoor Parking, Location Scouting, Security,
      Safety & Security Assessment — all facility or professional services with no equipment
      category. Every other undimensioned line restates mechanically (Trash Removal and Walk Around
      Trash Sweep to `Trash & Cleanup`, Trucking to `Transport`, Contract Labor to `Crew`), so this
      residue is the whole of the judgement. Deciding it late means restating the restatement.
      —
      The reason the answer works where a bare null would not is ADR-0009's: a null that means "we could
      not categorise this" is indistinguishable from a null that means "this legitimately has no
      category", and once written the distinction is gone. Carrying the absence on the ACCOUNT
      keeps it visible — a line in 4800 asserts "this was not a categorised sale", which is a fact
      about the transaction, where a line in 4100 tagged `Other` asserts "this was a categorised
      sale" and then names no category, which is not.
      ⚠️ It leaves ADR-0020's restatement residue without a target — see OQ-025.
  - id: OQ-023
    headline: "what posts to 5400 Job Costs"
    question: >-
      What posts to `5400 Cost of Goods Sold: Job Costs` today, and does own-crew labor cost belong
      there rather than in a new 5800?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: answered
    answer: >-
      **5400 is a dead account.** It was a catchall for one-off project job costs. In v2 that
      population is captured by the specific COGS accounts instead — wages to 5800/5801,
      subcontractors to 5200, equipment rental to 5100 — so 5400 takes no new postings and its
      `disposition` is `drop`. It stays `Active` in the live chart, so its history still imports
      under ADR-0020.
      This also settles the duplication risk the question was asked about: 5800 does not compete
      with 5400 for the same money, because 5400 stops receiving any.
    notes: >-
      ADR-0019 moves own-crew cost out of 6600 Wages into "a dimensioned COGS account beside the
      existing 5200", and `ledger/chart-of-accounts.yaml` mints 5800 for it. But 5400 already exists,
      is Active, and its live description reads "costs related to the completion of a job that are
      NOT assets and NOT general expenses" — which is a description of job labor among other things.
      If crew cost already lands there, 5800 duplicates it and the migration has two accounts
      competing for the same money. **Not answerable from the CFS API**: the GL line detail is in
      Xero, and this repo may not reach Xero (single-tenant, live, shared daily quota). It needs
      someone to look at the Xero account activity directly.
      —
      Answered without needing that: the account is dead. The answer named the future taxonomy
      directly — "cogs: wages, cogs: subcontractors, cogs:
      equipment rental" — which is why 5800/5801 are named `Cost of Goods Sold: Wages (Absorbed)`
      and `(Unabsorbed)` in the live house style rather than the invented `COGS – ` form.
      A catchall sitting beside specific COGS accounts is where cost goes to avoid being
      classified, which is the failure the dimensioned COGS block exists to prevent.
  - id: OQ-024
    headline: "what is labor's credit leg"
    question: What is the CREDIT leg of a labor cost posting?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED, EVT-FUL-002]
    status: answered
    answer: >-
      **2000 Accounts Payable. The question's premise was wrong: there is no payroll liability to
      find, because CFS has never had one.**
      Measured on CFS's own balance sheet at 2025-12-31, on both bases — current liabilities are
      2000 Accounts Payable, the 2100 credit-card block, 2200 Sales Tax, 2600 Rounding and
      2801/2802 PSA. **No payroll liability of any kind, in any of four comparative years**, which
      is exactly consistent with all four payroll accounts (2160, 2170, 2180, 2190) being Archived
      in the live chart.
      That follows from the charter, which makes payroll processing a **non-goal**: an external
      **employer of record** stays, and CFS "does not calculate withholding, file payroll tax, or
      move payroll money". **An EOR is not payroll — it is a vendor that invoices.** So a labor
      cost posting is an ordinary vendor bill: Dr 5800 / 5801, Cr 2000.
      ADR-0019 already pointed here — "cost flows from the purchase order / bill that labor
      scheduling generates" — but called it an inference from account status. It is no longer an
      inference: a company that owed wages would show the liability, and this one shows none across
      four years of statements.
      Consequence worth stating: **CFS's ledger never carries gross-to-net.** Withholding, employer
      taxes and benefits are the EOR's ledger, and what reaches CFS is one invoiced amount. 6720
      Payroll Tax Expense stays in the chart for historical periods and takes no new posting.
      Evidence: `inbox/2026-08-09-labour-premium-rules-survey.md`,
      `inbox/2026-08-09-book-to-tax-difference-is-exactly-two-accounts.md`.
    notes: >-
      ADR-0019 names both debit legs — 5800 absorbed, 5801 unabsorbed — and no credit. Without one
      `shift_recorded` cannot balance even in principle, which makes this a third blocker on that
      rule alongside OQ-018 and OQ-019. The live chart offers no obvious target: every payroll
      liability (2160 Payroll Wages Payable, 2170, 2180, 2190) is **Archived** and proposed for drop
      as a charter non-goal, and 6600 Wages is an expense, not a liability
      (`api:2026-08-09:db_chart_of_accounts_query`). ADR-0019 says cost flows from the purchase
      order / bill that labor scheduling generates, which points at 2000 Accounts Payable — but
      that is an inference from account status, not a decision, and it interacts with OQ-020 since
      nothing yet owns purchase orders.

  - id: OQ-025
    headline: "where the restatement residue lands"
    question: >-
      With `Other` deleted, where does ADR-0020's restatement residue land — historical revenue
      lines that have no product line and no bucket to fall back on?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: answered
    answer: >-
      **`product_line: null`**, and they stay on 4100 Service Income. They do not map to a tracked
      product line, so null is the true statement about them — not a fallback, not a bucket, and
      explicitly not `undefined`.
      This settles the tension the question was asked about: reassigning them to 4800 Other Income
      would have moved money between P&L sections, which ADR-0020 forbids outright ("the
      restatement must not alter any amount"). Leaving them on 4100 with a declared null keeps the
      restatement to assigning a dimension, which is all ADR-0020 ever asked for.
      Generalised in ADR-0025: what REQ-LED-001 refuses is ABSENCE, not null. A missing key means
      nobody decided; a declared null is a decision.
    notes: >-
      OQ-022 deleted `Other` and made 4800 Other Income the escape hatch for NEW postings. History
      is the harder half. ADR-0020 restates every undimensioned line before import, and most of it
      is mechanical — Trash Removal and Walk Around Trash Sweep to `Trash & Cleanup`, Trucking to
      `Transport`, Contract Labor to `Crew`. The residue is one kind of thing: facility and
      professional services with no equipment category — Warehouse Rental, Office Rental, Indoor
      Parking, Location Scouting, Security, Safety & Security Assessment — sitting on 4100 Service
      Income, which requires a product line.
      Two options and they are not equivalent. Reassigning them to 4800 Other Income **moves money
      between P&L sections** and restates reported revenue mix, which ADR-0021 already flagged as a
      different kind of change from assigning a dimension. Minting a real product line for them
      (`Facilities & Professional Services`) leaves the accounts alone and changes only the
      dimension — but adds a 21st value that OQ-022 was trying to avoid needing.
      ADR-0020 asserts the restatement must not alter any amount; only the first option can.

  - id: OQ-026
    headline: "is a supplier discount income or contra-COGS"
    question: >-
      Is a supplier discount other income (4300) or a contra-COGS (5001), and which of the two
      accounts survives?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: answered
    answer: >-
      **A supplier discount is a CONTRA-COGS. `5001` survives and `4300 Discounts Received` is
      retired (merge_into: 5001).** Owner accepted the survey recommendation 2026-08-16.
      ⚠️ **The question was reframed by the survey, and the reframing is the answer.** ASC 330 treats
      a cash discount as reducing the cost of the goods — but the guidance **permits either
      treatment** and **requires consistency**. So the defect was never which account is right; it
      was that BOTH were Active, making the treatment whichever the operator picked. Under a standard
      that permits either while requiring consistency, operator-by-operator choice is the one thing
      not permitted.
      A prediction made before the survey — that "GAAP likely has a firm answer here, which would
      make this narrower than it looks" — was **wrong**, and is exactly the prior the survey rule
      exists to catch
      (`inbox/2026-08-16-survey-a-vendor-side-amount-becomes-revenue-only-where-control-or-a-markup-does.md`).
      **Both accounts now carry `dimensions: []`.** A supplier discount reduces what CFS PAID, not
      what CFS sold, so it has no customer product line; ADR-0025 makes that obligation per account.
      **Population, from the owner 2026-08-16**: discounts are "often none"; where they exist it is
      net-30 style terms with account vendors. Early-payment terms and small — not volume rebates,
      not marketing or co-op allowances, each of which GAAP treats differently again.
      ⚠️ **One migration precondition, recorded on 4300 rather than left here**: whether 4300 has ever
      been posted to is UNMEASURED. Never → the merge is free. Ever → a restatement under ADR-0020,
      in scope because it alters no amount. AP is thin today (OQ-020), so the answer may exist only
      in Xero.
    notes: >-
      `4300 Discounts Received` (Revenue) and `5001 Cost of Goods Sold: Purchase Discounts`
      (contra-Expense) record the same economic event on opposite sides of the P&L, and **both are
      Active today** — so the treatment is currently whichever account the operator picked.
      It changes reported **gross margin** without changing net income, which makes it a
      presentation decision for the owner and the CPA rather than a mechanical one. Both accounts
      carry `dimensions: undecided` until it is settled, because the dimension follows the answer:
      a discount recorded against COGS plausibly inherits the product line of the goods it
      discounts, where one recorded as other income has no customer product line at all.
      Split out of OQ-021, which settled the dimension rule but not this.
      ✅ **SURVEYED 2026-08-16, combined with OQ-041** —
      `inbox/2026-08-16-survey-a-vendor-side-amount-becomes-revenue-only-where-control-or-a-markup-does.md`.
      ⚠️ **THE QUESTION IS REFRAMED, and a prior stated in that session was wrong.** It was predicted
      that "GAAP likely has a firm answer here, which would make this narrower than it looks."
      **It does not.** ASC 330 and the retail inventory method treat a cash discount as *"credited
      directly to the purchases account at cost, reducing the cost of inventory"* — but the guidance
      is explicit that **either** treatment is permissible: "GAAP allows recognition either as a
      reduction of purchases or as other income, **but consistency must be maintained**."
      ⇒ **The defect is not which account. It is that BOTH are Active.** This question's own notes
      say "the treatment is currently whichever account the operator picked" — and under a standard
      that permits either treatment while requiring consistency, an operator-by-operator choice is
      the one thing that is NOT permitted. So the answer needed is **"pick one and retire the
      other"**, and the default and conceptually preferred treatment is **5001** (reduction of cost).
      **Owner facts scope the population, 2026-08-16**: supplier discounts are "often none"; where
      they exist it is net-30 style terms with account vendors; "any real wholesale price
      relationship would generally warrant creating a product in the catalog". So this is
      **early-payment terms, and small** — not volume rebates, not marketing or co-op allowances,
      each of which GAAP treats differently again and none of which applies here.
      **Still needed before it closes**: whether the live corpus already contains postings on BOTH
      accounts. If it does, retiring one is a restatement under ADR-0020 (it alters no amount, so it
      is in scope); if 4300 has never been used, retiring it costs nothing. Not measured — AP is
      thin in the current system (OQ-020), so this may not be answerable from CFS data at all and may
      have to come from Xero.

  - id: OQ-027
    headline: "is the tax basis accrual or cash"
    question: >-
      Is the tax basis accrual or cash — and what else besides depreciation differs between the two
      books?
    owner: alex
    decide_by: 2026-09-15
    blocks: [ADR-0026]
    status: answered
    answer: >-
      **Accrual** — stated by the owner 2026-08-09 and independently visible in the statements: 1200
      Accounts Receivable (25,824.26) and 2000 Accounts Payable (30,240.04) appear **identically on
      both balance sheets**, and total liabilities agree to the cent. A cash-basis tax statement
      carries neither.
      **And nothing else differs except retail inventory.** Measured account by account across both
      2025 statements: 52 of 60 P&L lines are byte-identical, and the entire difference is
      **7000 Depreciation Expense** (63,553.48) plus **5000 COGS: Retail Inventory** (105.60),
      summing to the net-income difference of 63,659.08 with **zero residual**. On the balance sheet,
      accumulated depreciation (467,638.68) plus 1400 Retail Inventory (259.13) equals the total
      asset difference and the total equity difference exactly.
      The retail-inventory half is **not a basis difference at all** — the owner ruled it an error to
      be corrected (OQ-029). So **depreciation is the only legitimate difference between the books**,
      and ADR-0026's overlay derives from the fixed-asset register alone.
      **Permanent differences are in neither book**: meals, political expenditures and vehicle
      tickets are identical on both statements and are Schedule M-1 adjustments on the return. The
      ledger should carry no M-1 logic at all.
      Evidence: `inbox/2026-08-09-book-to-tax-difference-is-exactly-two-accounts.md`.
    notes: >-
      ADR-0026 fixes WHERE the tax book lives — derived at report time, never posted — but not what
      is in it. Depreciation and §179 are the differences the fixed-asset register can supply on its
      own. Two families it cannot:
      **Basis of accounting.** If CFS files on a cash basis, the tax balance sheet carries no
      Accounts Receivable and no Accounts Payable at all, and the overlay is then far larger than a
      per-asset schedule — it restates working capital. If it files accrual, depreciation may be the
      whole of it.
      **Permanent and timing differences on the P&L** — meals disallowance, accrued-but-unpaid
      items, prepaid timing. Each is small and each is a rule someone has to state.
      A question for the owner and the CPA, not one the repo can measure: the answer is in how the
      1065 has actually been filed. It does not block ADR-0026 (the mechanism is the same either
      way) but it decides how much the derivation has to do, and therefore whether the non-posting
      book stays cheap.

  - id: OQ-028
    headline: "where an overpayment lands"
    question: >-
      Where does a customer overpayment land — money received that exceeds what the invoices it was
      sent for are owed?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: answered
    answer: >-
      **2050 Customer Credit Balances** — the same account an unallocated credit note sits in,
      because it is the same fact: customer value CFS holds that is attached to no invoice. Decided
      by the owner 2026-08-09 on the four-suite survey
      (`inbox/2026-08-09-customer-credit-balances-across-four-suites.md`), which found that SAP,
      NetSuite, Sage Intacct and Odoo each give this value a liability and each use **one** such
      account rather than one per source.
      `settlement_recorded` therefore **records the remainder rather than refusing the session**.
      The mis-key argument for refusing — $15,000 keyed for $1,500 becomes a silent liability — was
      judged the weaker case: the money is in the bank either way, so refusing puts the ledger
      further from the bank rather than closer. **The client warns before recording a remainder**,
      and the warning is overridable because the fact is real and merely unusual.
    notes: >-
      Surfaced by writing `settlement_recorded`, whose control total requires a session's rows to sum
      to the money that arrived. If a customer pays more than the invoices in that session are owed,
      the remainder has nowhere to go and the whole entry is refused — so the deposit cannot be
      recorded at all until someone decides.
      **The current system has the same hole and hides it better**: every `settlements` row names an
      invoice (`uid_invoice` is required), so an overpayment is not representable and in practice
      gets over-applied to an invoice or left off the books. Xero models it as a first-class
      `Overpayment` object, which CFS does not mirror.
      Three candidates, and they are not equivalent. **2050 Customer Credits (Unallocated)** — the
      account minted for credit notes — states the same fact (value owed to a customer, not yet
      applied) and needs no new account, but merges two populations an operator may want to see
      apart. A **new customer-deposits liability** keeps them separate at the cost of another
      account. **2500 Suspense** is the wrong answer that will be reached for by default; its own
      disposition is already `undecided` pending SPIKE-004.
      Not a blocker on `settlement_recorded`: refusing is a defensible rule and matches today's
      model. It is a gap in what the system can record, which is why it is a question and not a bug.

  - id: OQ-029
    headline: "why the two books cost inventory differently"
    question: >-
      Why do the two books cost retail inventory differently, and which basis does v2 carry as the
      GL number?
    owner: alex
    decide_by: 2026-09-15
    blocks: [ADR-0026]
    status: answered
    answer: >-
      **They should not differ — the divergence is an error in the current books, and v2 carries one
      retail-inventory cost on both bases** (owner, 2026-08-09: "retail costing should be the same
      between them, that outage is a mistake we will correct").
      So **ADR-0026's overlay has ONE source**, the fixed-asset register, and depreciation is the
      only legitimate book difference. The question's premise — that this was a costing-basis choice
      — does not hold.
      Consequence for m6: **the migration must not carry the divergence across.** Whether the prior
      years are corrected in the existing books or the difference is simply not imported is an
      accounting call for the owner and the CPA, not a spec decision.
      ⚠️ Worth keeping from the measurement: the defect was **invisible until the two statements were
      diffed line by line** — 0.6% of the balance, growing across three years, flagged by nothing. A
      tax book produced from one ledger by a stated derivation cannot drift this way silently,
      because a difference in an account the derivation does not name is a difference nobody
      authored. That is an argument FOR ADR-0026 which the ADR did not have, and it comes from the
      defect rather than the design.
      Evidence: `inbox/2026-08-09-retail-inventory-book-difference-is-an-error.md`.
    notes: >-
      Measured 2026-08-09 across both 2025 statements: after depreciation, the **only** other
      book-to-tax difference is retail inventory. 5000 Cost of Goods Sold: Retail Inventory is
      36,985.62 on the tax basis against 36,880.02 on GAAP for 2025, and 1400 Retail Inventory is
      43,392.63 against 43,651.76 — a cumulative 259.13, which is exactly the fold of the annual COGS
      differences (0.66 + 152.87 + 105.60).
      Immaterial today at 0.6% of the balance, and **growing**: 0.66 in 2023, 152.87 in 2024, 105.60
      in 2025.
      It matters structurally rather than numerically. ADR-0026 derives the tax book from the
      fixed-asset register; this difference is not the register, so the overlay has a **second
      source** and the ADR cannot describe it as a fixed-asset feature. Before that can be specified,
      someone has to say what the difference IS — a costing-method difference, a §263A adjustment, a
      write-down treated differently, or an artifact of how the tax package computes inventory.
      Not answerable from the repo or the CFS API: the GL line detail is in Xero and the tax figure
      comes from the tax package. A question for the owner and the CPA.
      Evidence: `inbox/2026-08-09-book-to-tax-difference-is-exactly-two-accounts.md`.

  - id: OQ-030
    headline: "is there a forced-call premium"
    question: >-
      Does CFS introduce a forced-call (short-turnaround) premium, and if so what is the turnaround
      threshold and does the penalty behave as hours or as a flat amount?
    owner: alex
    decide_by: 2026-10-15
    blocks: [REQ-LED]
    status: open
    notes: >-
      Raised by the owner 2026-08-09 while settling OQ-019 — "I may be interested in introducing
      forced calls." Held separate from OQ-019 deliberately: a forced call is a different mechanism
      from a consecutive-day premium and it interacts with a different constraint.
      A **forced call** is a short turnaround — a crew member called back with less than the agreed
      rest between wrap and the next call. Union thresholds are **12 hours** (SAG-AFTRA, sometimes
      11) and **10 hours** (FIST). **Non-union has no statutory turnaround rule at all**, so any CFS
      threshold is policy rather than compliance.
      **The two penalty SHAPES are not equivalent, and this is the decision.** SAG-AFTRA pays a
      **flat amount per violation** (day performer: the lesser of daily rate or $900). FIST treats
      the shortfall as **overtime HOURS**. Only the second flows through the machinery that already
      exists — it becomes premium hours, allocated by OQ-018's pro-rata rule, absorbed into 5800
      like any other premium. A flat penalty is a new kind of cost that belongs to no causal job and
      would need its own account and its own allocation answer.
      ⚠️ **Distinct from ODRISA and not a substitute for it.** A 10-hour turnaround and a
      24-consecutive-hour weekly rest are different constraints; satisfying one says nothing about
      the other. See OQ-019.
      Not urgent — nothing depends on it, and `shift_recorded` is specified without it. It becomes
      real the day a turnaround policy is stated.
      Evidence: `inbox/2026-08-09-labour-premium-rules-survey.md`.

  - id: OQ-031
    headline: "do Crew and Trash spread like Delivery"
    question: >-
      Do `Crew` and `Trash & Cleanup` revenue and cost spread across the goods on the order, the way
      `Delivery` does — or are they severable services that keep their own margin?
    owner: alex
    decide_by: 2026-10-15
    blocks: [ADR-0031]
    status: answered
    answer: >-
      **Both are SEVERABLE and keep their own margin.** Owner, 2026-08-16. Neither spreads across
      the order's goods the way `Delivery` does, because neither fails the severability test the way
      delivery does: a wrap cleanup and a hired-out crew each stand on their own, and spreading them
      would move a real profit or loss onto goods that did not cause it — the same error as leaving
      delivery alone, in the opposite direction.
      **⚠️ With a qualifier that is the load-bearing half: "they still need labor cost allocated to
      them"** (owner, 2026-08-16), **via the causal-job rule** — the shift lands on the line it
      performed. A crew-day spent on a trash sweep attributes to `Trash & Cleanup` because that is
      the job that caused it.
      That uses ADR-0019's existing machinery with no new mechanism, and it is what makes the answer
      meaningful rather than flattering: **$144,975 of revenue on its own P&L line with no cost
      against it would report a margin near 100%.** Severable means it carries its own cost as well
      as its own revenue.
      Sizes at the time of the ruling: `Trash & Cleanup` **70 lines / $144,975.00 / 8.58%** (8.45% of
      the re-measured $1,715,472.79 denominator, 2026-08-16; the amount is unchanged to the cent) — the
      third-largest product line — and `Crew` **9 lines / $3,550.00 / 0.21%**.
      Consequence for `reporting/product-line-pl.yaml`: both move off `blocked` and are classified
      **activity lines that do NOT participate in the goods spread**, which is a third category the
      file does not yet express — `Delivery` spreads, these do not, and both are activities.
    notes: >-
      ADR-0029's argument for spreading `Delivery` is **severability**, in the owner's words: "we
      wouldn't do a delivery with no products, we would rent far fewer products if we weren't
      delivering them." Delivery cost is therefore a JOINT cost of the product revenue, and leaving
      it on its own line reports a loss that is an artefact of the grouping.
      That argument does not obviously transfer. Crew hired out to a customer, and a cleanup
      performed after a wrap, may each be a service that stands on its own margin — in which case
      spreading them would move a real profit or loss onto goods that did not cause it, which is the
      same error in the opposite direction.
      ⚠️ **The "both are small" premise is RETRACTED for `Trash & Cleanup`, by roughly 83x.** It was
      measured off the invoice-line denorm at 2 lines / $1,750.00. Measured at the product master
      instead
      (`inbox/2026-08-09-untracked-revenue-is-mostly-a-denorm-failure-not-an-undecided-dimension.md`),
      `Trash Removal` (40 lines, $111,175.00) and `Walk Around Trash Sweep` (28 lines, $32,050.00)
      both carry `Trash & Cleanup` and neither ever reached a line. True size: **70 lines,
      $144,975.00 — 8.6% of revenue, the THIRD-LARGEST product line**, behind `Delivery` and
      `Walkies & Hotspots` and ahead of `Wardrobe`.
      So this is one of the larger decisions in the reporting spec, not a tidy-up. `Crew` really is
      small (**9 lines / $3,550.00 / 0.21%**, re-measured 2026-08-10) and is still worth answering
      with it, because the two share a criterion — but the two must no longer be reasoned about as a
      pair of rounding errors.
      They stay `blocked` in `reporting/product-line-pl.yaml` rather than quietly following
      `Delivery`, which was the right call for a better reason than the one originally given.
      ✅ **api-cloudrun#473 is FIXED (2026-08-10) and this is no longer blocked on it.** The denorm
      is repaired (`tracking_missing` 227 → 0), so the pool can now be assembled and the confirmed
      size is **70 lines / $144,975.00 / 8.45%** (re-measured 2026-08-16; 8.58% of the smaller
      2026-08-10 denominator). Nothing external blocks this question any more —
      it is waiting on a decision, and it is the largest one outstanding in the reporting spec.
      ⚠️ **`Delivery` and `Trash & Cleanup` together are 22.5% of revenue.** "Answer them together
      for consistency" is still right on the criterion, but the cost of waiting is no longer
      symmetric between the pair.
      Answer them together. Both are "a service a person performs, sold to the customer", and
      splitting the answer would leave the pair inconsistent for no reason.
      ⚠️ The answer is a **criterion**, not two verdicts — the next activity line to appear will ask
      the same question, and `Transport` shows a value can sit unused for years and then matter.

  - id: OQ-034
    headline: "is Transport restored as a product line"
    question: >-
      Is `Transport` restored as a product line, now that the measurement it was dropped on turns
      out to have read the wrong field?
    owner: alex
    decide_by: 2026-10-15
    blocks: [ADR-0020, ADR-0031]
    status: answered
    answer: >-
      **RESTORED, as an ACTIVITY line that does NOT spread — it carries its own margin.** Owner,
      2026-08-16. Same classification as `Crew` and `Trash & Cleanup` under OQ-031's severability
      criterion, and for a stated reason: "trucking is our own longer or bigger haul that doesn't fit
      into the standard delivery charge paradigm, it should carry its own margin."
      That is the severability test passing. `Delivery` spreads because it is a joint cost of the
      product revenue — "we wouldn't do a delivery with no products". A long haul that does not fit
      the standard delivery paradigm is priced and sold as its own thing, so spreading it would move
      a real margin onto goods that did not cause it.
      ⚠️ **The line holds TWO economically different things, and the owner named the split**:
      "shipping is a pass through, trucking is our own longer or bigger haul." So `Shipping`
      (16 lines, $5,665.00, on its own account **4150 Shipping & Handling Income**) is third-party
      freight bought and re-billed — no CFS crew-day, no vehicle. `Trucking` (7 lines, $34,000.00, on
      4100) is CFS-performed and labor-bearing, which is consistent with ADR-0011's ruling on OQ-010
      that a trucked leg generates a shift and absorbs a person-day.
      **Both keep their own margin, so one pool can hold both** — the allocation answer is the same
      for a passthrough and for a severable own-haul. What differs is the COST side: freight invoice
      versus crew plus vehicle. **Whether they should eventually be two product lines is not decided
      here** and does not block anything; it is recorded so a later reader does not mistake the
      single line for a claim that the two are the same kind of work.
      ⚠️ **The cost accounts make the asymmetry concrete, and only ONE half is expressible today.**
      Owner, 2026-08-16: **`5300 Cost of Goods Sold: Shipping (Rentals & Sales Only)` pairs with
      `4150`**. So `Shipping` is complete — bought-in cost and re-billed revenue on the same line,
      and its margin is the markup, which is what a passthrough should look like. `Trucking` is not:
      its revenue is on 4100 and its cost is labor (ADR-0019, 5800/5801) plus vehicle, and
      **ADR-0030 has not chosen the vehicle COGS accounts**. Until it does, this pool's margin
      overstates trucking — the same trap the product-line P&L header warns about for `Delivery`.
      Consequences: `ledger/dimensions.yaml` restores the value; `reporting/product-line-pl.yaml`
      gains `Transport: activity` and a `not_allocated` pool; and **OQ-025's "Trucking to
      `Transport`" mapping has a target again**, which is what ADR-0020's restatement was waiting on.
      `spikes/harness/allocation-basis-probe.ts` classifies it as goods by omission and is now wrong.
    notes: >-
      `ledger/dimensions.yaml` dropped `Transport` on 2026-08-09 because
      `inbox/2026-08-09-product-line-by-revenue-account-matrix.md` measured **zero lines and zero
      revenue across all 9,194 revenue-bearing lines** — "it had never once been used" — and a
      paragraph was written explaining why activity lines lose to goods lines.
      **That measurement read `items[].tracking_category`, the line denorm.** At the PRODUCT master,
      `Trucking` (7 lines, $34,000.00) and `Shipping` (16 lines, $5,665.00) both carry `Transport`:
      **23 lines, $39,665.00**, in continuous use, none of which ever reached a line because nothing
      derives the line's category from the product (api-cloudrun#473, and
      `inbox/2026-08-09-untracked-revenue-is-mostly-a-denorm-failure-not-an-undecided-dimension.md`).
      The value is left DROPPED for now rather than silently restored — deleting it was the owner's
      call and reversing it is too — but the stated reason is retracted and the explanation built on
      top of it explains an artifact.
      ⚠️ **ADR-0020's restatement needs the answer.** OQ-025 lists "Trucking to `Transport`" among
      the mechanical mappings, and that target was deleted for being empty. If `Transport` stays
      dropped, those 23 lines need a different home stated before the restatement runs; if it is
      restored, `reporting/product-line-pl.yaml` must classify it `goods` or `activity` — gate 13
      fails until it does, which is the gate working.
      Restoring is cheap by design: ADR-0018 took dimensions off account identity precisely so
      cardinality grows by addition.
      ✅ **The evidence for this question is now complete, 2026-08-10 — three independent sources
      agree and the spec is the only one that disagrees.** (1) The **product master** carried
      `Transport` throughout. (2) **Xero** did too — prod invoice #1987's `Trucking` line was tagged
      `Transport` in the Xero ledger while the CFS line was null. (3) Since api-cloudrun#473 the
      **CFS lines themselves** carry it, so `ledger/dimensions.yaml` now omits a value the source
      system actively writes. At **$39,665.00 / 2.35%** it is the 14th largest of 20 lines — above
      `Expendables`, `Carts & Ramps` and `Janitorial`, all of which are declared.
      Nothing further needs measuring. **This is a decision waiting on its owner, not on evidence.**
      One consequence to weigh with it: if restored, is `Transport` a **fifth activity line**?
      Trucking and shipping are things performed, not things supplied, which is the ACTIVITY test
      ADR-0031 uses — and `spikes/harness/allocation-basis-probe.ts` currently classifies it as
      goods by omission.

  - id: OQ-032
    headline: "does Distance Charge belong on 4110"
    question: >-
      Does `Distance Charge` belong on 4110, given that 4110 is defined as a premium nobody
      performs — and does `Rush Charge` move to 4110 to match the stated rule?
    owner: alex
    decide_by: 2026-10-15
    blocks: [ADR-0031]
    status: answered
    answer: >-
      **Both stay on 4110, because the account was never about who performs the surcharge — it is a
      premium ON the delivery, and the delivery is the performance.** Owner, 2026-08-16: "the
      performance is the delivery, the distance surcharge is because it takes longer, the rush
      surcharge is because it was unplanned, i think both fit 4110 fine."
      The criterion that follows: **4110 carries a premium priced for a CONDITION of the job** —
      longer, unplanned, out-of-hours, weekend — rather than for a separately performed thing. The
      account's own name already said so (`4110 Delivery Surcharges`); what was wrong was ADR-0029's
      gloss on it, not the account.
      Neither option this question offered was taken, and both were framed on the retracted premise.
      Three consequences follow:
      · **The miscoded lines restate to 4110** (owner, 2026-08-16). `Rush Charge` sits on 4100 for
        12 of 13 lines and **$3,000 of $3,500 — 86% by value** — against the stated rule; `Distance
        Charge` leaks onto 4100 on 3 lines / $950.00. In scope for ADR-0020: moving a line between
        two revenue accounts alters no amount, which is the only thing that restatement forbids.
        This also removes the unmeasured coding error the 79.8% / 20.0% split currently carries.
      · **`Card Fee` leaves 4110 for `4700 Transaction Fee Income`** (owner, 2026-08-16). At 4.3%
        ($1,968) it is the one member that fails the criterion — a payment-processing fee is not a
        premium on a delivery. 4700 exists and is Active. `api-cloudrun#401` is the v1 half of the
        same move.
      · ✅ **The FORECASTING consequence is now resolved, and it decomposes into three things rather
        than one.** Owner, 2026-08-16: "the additional cost on a distant delivery is the opportunity
        cost of the team being gone longer (and thus unavailable for a second delivery), and
        additional gas."
        **Wage — unchanged, so OQ-006 stands.** The same crew-day is consumed whether the delivery
        is near or far, so no extra wage is caused and "the premium the customer pays is margin, not
        cost" is correct about the labor component.
        **Fuel — a REAL incremental cost, and it already has a home.** It is vehicle cost, ADR-0030,
        which moves vehicle expense into COGS. So distance-surcharge revenue does correlate with a
        bookable cost, and ADR-0029's flat "the surcharge adds revenue and no cost" is wrong to that
        extent.
        **Opportunity cost — real, and deliberately NOT booked.** A crew gone all day on one long
        haul cannot take a second delivery. That is not an entry — GAAP books no opportunity cost —
        and it **needs no new mechanism, because ADR-0019's absorption model already expresses it**:
        the long haul absorbs its person-day into 5800, the rest of the day has no second job to
        absorb it, and the shortfall surfaces as **5801 Unabsorbed Labor**. HOT-010 settled that
        absorption measures UTILISATION rather than rate deviation, which is exactly the signal
        being described. This also answers HOT-004's question — a long haul does not need a
        byproduct-loss premium loaded onto the job, because the cost of the foregone second job
        appears on its own as reduced absorption.
        ⇒ **A model predicting delivery cost from 4100 volume alone under-predicts in a long-haul
        period**, which is the opposite of ADR-0029's stated direction. Distance surcharge revenue is
        the best available proxy for a driver nothing else records.
        ⚠️ **Out-of-hours and weekend are still unreconciled** and are a smaller question: they cost
        more in WAGE (ADR-0019's 1.5x rules) where distance costs more in FUEL. Whether the premium
        exceeds the wage uplift is not measured. Left open, and it is narrower than the question this
        bullet used to carry.
    notes: >-
      **4110 is not homogeneous.** Measured 2026-08-09 across the whole corpus
      (`inbox/2026-08-09-4110-is-a-third-distance-charges-and-distance-is-performed.md`): of
      $45,776.06 on the account, **Distance Charge is 33.3%** ($15,250.00, 41 lines), Off Hours
      37.2%, Weekend 22.9%, Rush 1.1%, and `Card Fee` 4.3% — a payment fee inside delivery revenue.
      **Distance is performed.** Somebody drives the extra miles; it burns fuel and crew hours and is
      the clearest cost driver in the whole delivery pool. So ADR-0029's "4110 is off-hours, rush or
      weekend, which nobody performs" is true of 62.3% of the account and false of a third of it.
      The consequence is a forecasting one and it **inverts**: distance causes both the charge and
      the cost, so distance-surcharge revenue is the *best* available proxy for the driver nothing
      else records. A model predicting delivery cost from 4100 volume alone under-predicts in a
      long-haul period — the opposite of the error ADR-0029 warns about, from the same account.
      ⚠️ **The coding is inconsistent in both directions and that corrupts the ratio.** `Rush Charge`
      is on 4100 for **12 of 13 lines and $3,000 of $3,500 — 86% by value** — against a stated rule
      that puts rush on 4110; `Distance Charge` leaks onto 4100 on 3 lines / $950.00. So the measured
      79.8% / 20.0% split is that split *plus* an unmeasured coding error, and anything reasoning
      from the ratio inherits it.
      Two coherent answers. **Move distance to 4100** and 4110 becomes homogeneous and means
      something; or **redefine 4110** as "surcharges" without the not-performed claim and drop the
      forecasting consequence. The first is a restatement under ADR-0020 and is in scope — moving a
      line between two revenue accounts alters no amount, which is the only thing ADR-0020 forbids.
      Nothing about ADR-0031's allocation basis turns on this: both accounts pool together and
      spread as one. What turns on it is what the un-allocated view can be READ as, which ADR-0029
      says is the whole purpose of keeping it.

  - id: OQ-033
    headline: "which physical basis becomes allocation v2"
    question: >-
      Once the shipping specs are populated, which physical basis becomes allocation basis v2 —
      weight, cube, or dimensional weight — and what coverage precondition gates its activation?
    owner: alex
    decide_by: 2026-12-15
    blocks: [ADR-0031]
    status: open
    notes: >-
      Owner, 2026-08-09: **product shipping specs will be populated this year**, which gives
      ADR-0031's `ability_to_bear` proxy an expiry date rather than an indefinite life
      (`inbox/2026-08-09-shipping-specs-are-scheduled-so-the-proxy-has-an-expiry.md`).
      **A physical spec is SUFFICIENT here, not merely better.** The official allocation spreads one
      order's pool across that order's lines, so only what varies *between lines of the same order*
      matters. Distance, crew size and drive time are order-level and cancel out entirely; weight
      and cube are the only line-level physical facts. Distance stays necessary for `trip_travel`
      (erp-spec#12), which is a different allocation.
      **The basis is probably neither weight nor cube alone.** A truck runs out of mass or space,
      whichever comes first, which is why carriers bill on **dimensional weight** —
      `max(actual weight, volume ÷ dimensional factor)`. It matters for this catalogue specifically:
      tents, tables, wardrobe rails and surface protection are bulky and light, a walkie case or a
      Duradeck sheet is dense and small. `shipping` carries weight AND all three dimensions, so both
      inputs arrive together and the choice is real.
      ⚠️ **The activation precondition is the load-bearing half.** Uniform zero fails loudly — every
      denominator is zero and the whole pool lands in the unallocated bucket. **Partial population
      fails silently**: an unmeasured line absorbs zero cost, the shares still sum exactly to the
      pool, the control total passes, and the least-maintained catalogue entries report the best
      margins. So v2 must require every goods line in an order's base to carry a non-zero driver, or
      degrade that whole order to the unallocated bucket — never spread over the measured subset.
      ⚠️ **Owner, 2026-08-16: "shipping.weight will exist for MANY products by the time v2 is in
      dev."** So partial population is the ANTICIPATED state, not a hazard to guard against — which
      promotes the precondition above from hardening to **the primary requirement of v2**. v2 is not
      "allocate by weight"; it is "allocate by weight where the whole order's base is measured, and
      degrade the order otherwise".
      Two consequences follow that were not recorded before
      (`inbox/2026-08-16-owner-shipping-weight-will-exist-for-many-products-by-the-time-v2-is-in-dev.md`):
      **the unallocated bucket becomes a COVERAGE METER**, so coverage must be reported on the face of
      the report beside it — the bucket's size is uninterpretable without it; and **v2 activates at a
      coverage THRESHOLD, not at the first non-zero weight**, or its early periods are mostly-bucket
      and its later ones mostly-allocated, and product-line margins move across the series because
      someone weighed inventory rather than because anything economic changed. Every individual run
      would still look internally consistent, which is the failure `reporting/allocation-bases.yaml`
      calls the worst shape of wrong.
      ✅ **core#51 is CLOSED (2026-08-10) and no longer blocks this.** It asked for the four dimensions
      to become nullable before the population effort, because `0` meant both "weighs nothing" and
      "nobody has weighed it" and the precondition could not otherwise be evaluated. They are
      `z.number().nullable()` (`code:2026-08-16:core@3847366:src/schemas/product.ts`) and prod agrees:
      measured 2026-08-16 across all **567** products, identically on all four fields — **0 non-zero,
      3 zero, 537 null, 27 with the block absent.** "Unmeasured" is representable in the schema and
      distinguished in the data, so the precondition can be written correctly today. Re-measured on
      every `deno task allocation` run, which prints a ⚠️⚠️ the first time a non-zero value appears.

  - id: OQ-035
    headline: "is there a production-type classification"
    question: >-
      Does CFS introduce a production-type classification — `studio | indie |
      corporate/commercial/industrial | event | student`, possibly splitting `studio` by budget tier —
      and does it attach to the production, defaulted from the organization?
    owner: alex
    decide_by: 2026-10-15
    blocks: []
    status: open
    notes: >-
      Raised by the owner 2026-08-10. It answers a question `product_line` cannot: **which KIND of
      production earns**. A commercial is short, intense and high-touch; a feature is long and
      low-touch. Different margins, different working capital, different risk — and nothing in the
      spec can currently slice by it.
      **Surveyed before proposing** (CLAUDE.md → Accounting decisions):
      `inbox/2026-08-10-survey-a-classification-is-snapshotted-at-posting-and-changed-by-a-named-realignment.md`.
      The survey **reframes the question the owner asked.** "Posting dimension or joinable attribute?"
      is not the axis: **not one of the six references joins to the master at report time.** All six
      snapshot the classification onto the transaction. What divides them is what happens when the
      master changes afterwards — and each pairs the snapshot with a NAMED retroactive operation
      (SAP realignment; GAAP recast-and-disclose under ASC 280, deliberately renamed from "restate" by
      ASU 2023-07 to keep it distinct from error correction; Odoo bulk journal-item edit). Xero has
      none, which is why CFS's history cannot be re-cut today.
      ⚠️ **"Joinable attribute" is the one option no reference supports.** The instinct behind it is
      sound — you will mistype a production and want to fix it without a migration — but every system
      meets that need with a realignment operation rather than a live join, because a live join cannot
      be audited. Joining to a mutable order field only moves the silent restatement one hop.
      **The org default is safe under this criterion**, as three snapshots each recording its
      provenance: `org.default_production_type` → `order.production_type` (at order creation) →
      `posting.production_type` (at posting). Changing the org's default reaches forwards only.
      ⚠️ **This is the same SHAPE that failed on 2026-08-10** — a denormalized copy of a master
      attribute — so the narrow lesson must be carried, not the broad one. The defect was not that a
      denorm existed; it was that **nothing derived it**: two writers, one of which took the value
      from the client on trust (api-cloudrun#473). A snapshot needs exactly one server-side writer,
      must record what it derived from so a realignment can find the population, and must be measured
      against the AUTHORITY rather than the copy.
      **The value set needs measuring, not inventing.** The owner's revision — `studio | indie |
      corporate/commercial/industrial | event | student`, with `studio` possibly splitting into
      high-budget (TPS, 20th, Disney) and low-budget (Hallmark, Lifetime) — is a better fit than the
      first draft, which had `tv` and `show` overlapping. The 286 organization names and the order
      names carry enough signal to derive the real set; a budget-tier split in particular should be
      checked against actual order values before it is declared, since "high budget" is an assertion
      about the customer that the corpus can confirm or refute.
      **Migration delta: nil, and for an unusual reason.** Xero's cap of 2 active tracking categories
      is already fully consumed, so no production-type history exists in the incumbent to carry
      across. The delta is that **the cap disappears** — an argument for ADR-0001 not previously made
      in this form: the incumbent's binding constraint on management reporting is a hard product
      limit, not a configuration choice.
      Depends on OQ-036 for its grain: production type attaches to a PRODUCTION, and the production
      layer does not exist as a first-class thing today — it is a substring inside
      `organizations.name`.
      ✅ **OQ-036's survey named that grain, 2026-08-10: a production is a PROJECT** — a
      dimension-bearing cost object in all four commercial references (SAP WBS, NetSuite Projects,
      Intacct's project dimension, Odoo analytic accounts) — not a level of the customer tree.
      Production type therefore attaches to the project, and the `org.default → order → posting`
      chain above becomes `org.default → project → posting`.
      ⚠️ **Do not attach it to a customer clone**, which is the only shape available today. That is
      the wrong axis and would inherit the 2026-08-10 denormalization trap in a new costume.
      **The value set is still unmeasured, and the owner's own background suggests the proposed cut
      may be wrong** —
      `inbox/2026-08-10-what-actually-separates-a-low-budget-studio-from-an-indie.md`. The tier split
      is motivated by duration (3–6 weeks), spend, and delivery-vs-pickup; low-budget studio is said
      to resemble indie on all three. If that holds, the real boundary is `high-budget studio` vs
      everything else and `studio` is doing no work as a category. One discriminator is already
      half-answered against it: 55.92% of revenue is customer-collecting both ways corpus-wide
      (HOT-002), so "prefers in-store pickup" is near the corpus norm rather than a tier marker.
      **Measure before declaring the set** — a category nothing distinguishes in the data reports as
      a bucket while saying nothing, which is what retired `Other`. The measurement is itself blocked
      on OQ-036, because grouping by customer today measures the naming convention.

  - id: OQ-036
    headline: "how company, production and department are modelled"
    question: >-
      How are a customer's company, its productions and its departments modelled, given that
      settlement is per department and the current workaround duplicates the organization with a
      name suffix?
    owner: alex
    decide_by: 2026-11-15
    blocks: [OQ-035]
    status: answered
    answer: >-
      Three levels — customer (the LEGAL ENTITY) → project (production) → settlement point
      (department) — where **the tree is determined by legal liability**: a node sits under a parent
      only where that parent is legally liable for the child's debts. Projects and settlement points
      are addressing beneath the liable entity and do not change who owes. Owner, 2026-08-10: "the
      tree does mean liability." Drafted as ADR-0032 (proposed).
      ⚠️ Direct consequence: **a separately-incorporated production is its own customer, not a
      child.** `Pops, Puffs, Pebbles Canada LTD` and `Pops, Puffs, Pebbles, LLC` are two customers;
      the ~15 single-purpose production LLCs are roots with no parent however obvious the studio
      behind them. The tree therefore cannot answer economic concentration — OQ-037.
    notes: >-
      Raised by the owner 2026-08-10: invoices settle by department, and "locations doesn't want to
      see what office or wardrobe owes". Measured the same day —
      `inbox/2026-08-10-three-concepts-are-crammed-into-the-organization-name.md`,
      `api:2026-08-10:db_organizations_query`, all 286 organizations.
      **31 of 286 orgs are department clones across 11 parent companies.** `Netflix Productions, LLC`
      is **10 records with no un-suffixed parent** — the customer as an entity does not exist in the
      system, so total exposure to Netflix is unobtainable without a string match. Four delimiter
      conventions are in use (` - `, `: `, ` / `, ` // `), all four within Netflix alone, so the
      structure is not machine-readable even as a stopgap. One department is spelled two ways
      (`Transportation`, `Transpo`).
      **The data says three levels, not two.** The owner asked for departments on organizations;
      `20th Television - Deli Boys - S2: Locations` is company + production + department at once.
      The production layer is also where OQ-035's production type actually attaches.
      **The requirement behind the workaround is real** — per-department AR balance, statement and
      aging. What it costs: no customer-level credit exposure, no customer-level history (a repeat
      customer reads as eleven new ones), and no stable migration key.
      ⚠️ **A separate defect surfaced by the same query**: exact-duplicate organization names
      (`Enlace Chicago`, `Free Spirit Media`, `Full Spectrum Features`, `Omnicom`, `Sound Off Films`,
      each ×2) plus three records suffixed with a literal `(copy)`. `Sound Off Films` exists three
      times. Not the same problem, but it lands in the same place at migration and it means
      match-on-name is not a viable key.
      ✅ **Survey run 2026-08-10** —
      `inbox/2026-08-10-survey-a-department-is-a-settlement-point-and-a-production-is-a-project.md`.
      **CRITERION: separate settlement is an ADDRESSING concern, not an IDENTITY concern.** Every
      reference but Xero keeps ONE customer identity and hangs N settlement points off it; not one
      creates a second customer. SAP uses partner functions (sold-to / bill-to / **payer**), NetSuite
      subcustomers with Consolidated Payments — its A/R aging shows the un-consolidated balance per
      subcustomer AND the hierarchy total, which is exactly the both-views requirement — Intacct
      parent-child "National Accounts", Odoo `res.partner` children typed `invoice`. GAAP defines one
      customer by **common control** (ASC 280-10-50-42; binds public entities only, so cited for the
      criterion and not as an obligation on CFS).
      Identity carries credit exposure, trading history, pricing inheritance and concentration.
      Settlement carries the invoice, statement, aging bucket and dunning email. Conflate them and
      you get one or the other — CFS has settlement and has given up identity.
      **CFS's workaround is the documented XERO workaround, and its costs are known upstream**:
      contact groups filter but produce no consolidated statement, and the duplicate-contact route is
      explicitly warned against because it double-counts the receivable and payments on one copy do
      not clear the other.
      **A production is a PROJECT** — a dimension-bearing cost object in all four commercial
      references (SAP WBS, NetSuite Projects, Intacct's project dimension, Odoo analytic accounts) —
      and that is where OQ-035's production type attaches.
      ⚠️ **CORRECTED 2026-08-10, same day** —
      `inbox/2026-08-10-correction-the-settlement-point-is-project-x-department-not-customer-x-department.md`.
      The survey first concluded this was "two axes, not a tree", and computed Netflix as 1 customer
      + 2 projects + 5 settlement points = "8 records that compose". **The axes do not factor and
      that arithmetic is wrong.** Owner, 2026-08-10: "these projects staff up entirely separately —
      the locations team on one project is different from the team on another even if they're both
      20th at the same time", and "every project and/or dept will have its own set of contacts".
      `Saturn Return: Locations` and `Big Red: Locations` share a department NAME and nothing else.
      **A settlement point is (project × department), subordinate to the project, not to the
      customer.** NetSuite supports this natively — "projects are tracked as subcustomers", and the
      hierarchy is a parent plus its subcustomers plus THEIR subcustomers, so customer → job →
      department is a native three-level chain with balances payable at any level. SAP determines
      partners **per document**, header and item, overriding the customer-master default.
      ⚠️ **The diagnosis changes with it: the defect is FLATNESS, not duplication.** The 31 records
      are not clones — they are close to the correct LEAVES already, each with its own receivable and
      coordinator. What is missing is the root and the middle. "10 records become 1" was the wrong
      target; record count barely falls, and what appears is the ability to ask a question at the
      top.
      ⚠️ **Migration trap: contacts must NOT be consolidated.** `organizations.contacts[]` is
      embedded per organization, so because each department clone IS an organization, the current
      model accidentally gets contacts right. Merging to one customer pools them — exactly the
      failure Xero users report of contact groups, where reminders go to every address on the record
      rather than the one the invoice went to. The settlement point must remain the contact-bearing
      entity.
      **Open sub-question this raises**: much of the corpus is single-purpose production LLCs
      (`Enemies Movie, LLC`, `Whale Shark Movie LLC`, `GODSHOT MOVIE LLC`), where customer and
      project are the same entity and the credit risk sits on the LLC rather than any studio behind
      it. So "roll up to the parent for credit exposure" may be wrong for the indie half. **Does the
      hierarchy express LEGAL LIABILITY or COMMERCIAL RELATIONSHIP?** They are not the same tree, and
      SAP models them as different partner functions precisely for that reason.
      **Migration delta is real and is the largest found so far** — a re-keying, not a
      re-dimensioning. The 10→1+N+M mapping must be authored and committed (ADR-0009 fences foreign
      ids out, four delimiter conventions make a parse unreliable, and `Transportation`/`Transpo` is
      one department spelled two ways). Match-on-name is independently unusable: 5 exact-duplicate
      pairs plus 3 literal `(copy)` records. ⚠️ **AR balances must not move** — the consolidated
      balance must be proven equal to the sum of the parts, per invoice and per settlement, which is
      ADR-0020's amount assertion applied to a different axis.

  - id: OQ-037
    headline: "is there an economic customer grouping too"
    question: >-
      Does CFS want an ECONOMIC grouping of customers alongside ADR-0032's liability tree — "which
      studios do we actually depend on" — and if so, what is it keyed on and how is it kept from
      contaminating the liability tree?
    owner: alex
    decide_by: 2026-12-15
    blocks: []
    status: answered
    answer: >-
      **No — the question is withdrawn rather than answered, because its premise fails.** Owner,
      2026-08-10: A24 backs `Enemies Movie, LLC`, but **A24 carries no legal liability for it and
      does not control it** — Enemies holds its own insurance and stands alone. ASC 280-10-50-42's
      major-customer test is **common CONTROL**, so on GAAP's own test A24 is not an economic parent
      either. The liability tree and the common-control grouping therefore do NOT diverge on the case
      that motivated this question, and the ~45–50 single-purpose-LLC count that sized it was only
      ever a name-pattern heuristic.
      **What the owner actually wants from the grouping is a different axis entirely** — "from a
      financial reporting angle it's a high budget feature". That is OQ-035's **production type**,
      attached to the project. Revenue by production type answers "what kind of work do we depend on";
      "which studios do we depend on" was a bad proxy for it.
      ⇒ **No economic grouping is built.** No second tree, no backer tag, no report-time grouping —
      and therefore nothing that could contaminate the liability tree, which was the whole hazard this
      question was held open to manage. ADR-0032 amended 2026-08-10 to withdraw its
      economic-concentration objection.
      Recorded in
      `inbox/2026-08-10-interview-the-org-tree-root-stays-organization-and-contacts-are-memberships.md`.
    notes: >-
      Left open deliberately by ADR-0032 rather than decided with it, because the mechanism differs
      by answer and because it must not be allowed to corrupt the tree collections depends on.
      **ADR-0032 chose liability, and liability splits things economics would join.**
      `Pops, Puffs, Pebbles Canada LTD` and `Pops, Puffs, Pebbles, LLC` are one production and two
      legal entities, so two customers. The ~15 single-purpose production LLCs — `Enemies Movie,
      LLC`, `Whale Shark Movie LLC`, `GODSHOT MOVIE LLC`, `Freaky Monday LLC`, `First Snow LLC` — are
      roots with no parent, however obvious the studio behind them. That is CORRECT for credit and
      collection and WRONG for "which studios do we actually depend on".
      **GAAP asks the economic question, not the liability one.** ASC 280-10-50-42 defines one
      customer by **common control** for the 10%-of-revenue major-customer disclosure. It binds
      public entities, so it does not oblige CFS — but it is evidence that the economic roll-up is
      the one a reader of financial statements is assumed to want, and it is a real management
      question regardless of who is required to publish it.
      Three shapes to choose between, and they are not equivalent:
      · **a many-to-one tag** on the customer — cheapest, no second hierarchy to maintain, but
        nothing enforces that a customer has exactly one economic owner;
      · **a second tree** — expressive, and two hierarchies over one entity set is a known
        maintenance hazard;
      · **a report-time grouping** — no stored structure at all, defined in the reporting layer,
        which keeps the liability tree provably uncontaminated but leaves the grouping unversioned.
      ⚠️ **Whatever is chosen must not be reachable from the liability tree**, in either direction. A
      credit hold must never propagate along an economic edge, and a concentration report must never
      be answered by walking the liability tree. Those are different questions with different
      correct answers, and the whole point of separating them is that neither silently answers the
      other.
      Depends on nothing; ADR-0032 can be accepted without it.
      ✅ **Sized 2026-08-10 by reading all 286 organization names, and it is SMALLER than ADR-0032
      implies.** The liability tree already captures the two largest studio customers, because their
      productions are **not** separately incorporated — every one of the 10 `Netflix Productions,
      LLC` records names that same legal entity, and every one of the 6 `20th Television` records
      names that one. Departments and productions there are internal divisions of a single LLC, so
      the liability tree groups them exactly right and loses nothing.
      **The divergence is confined to genuinely separate LLCs**, of which ~45–50 of 286 carry
      single-purpose production names (`Enemies Movie, LLC`, `Whale Shark Movie LLC`, `GODSHOT MOVIE
      LLC`, `Freaky Monday LLC`, `First Snow LLC`, `Big Time Movie LLC`, …). ⚠️ **That count is a
      name-pattern heuristic and is not evidence of anything by itself** — it does not distinguish a
      genuine indie, where there IS no parent and the liability tree is simply correct, from a studio
      production wearing its own LLC, where the two trees diverge.
      **So the question reduces to one the owner can answer in a sentence and no query can:** of the
      single-purpose production LLCs, how many are studio productions in disguise rather than
      genuine independents? If most are true indies, this OQ is worth little and should be **dropped**
      rather than answered — the liability tree would already be giving the right answer for
      substantially all revenue.
      ⚠️ A related identity defect found in the same read: **`20th Television` and `Twentieth
      Television` are one legal entity spelled two ways**, alongside the 5 exact-duplicate pairs and
      3 `(copy)` records already recorded. That is an ADR-0032 migration problem, not an OQ-037 one,
      and it is captured in `migration/field-map.yaml`.

  - id: OQ-038
    headline: "does CFS operate credit limits and holds"
    question: >-
      Does CFS operate credit limits and credit holds in v2 — what triggers a hold, who overrides
      one, what may a held organization still do, and does a hold reach every project beneath?
    owner: alex
    decide_by: 2026-12-15
    blocks: []
    status: open
    notes: >-
      Raised by ADR-0032's amendment, 2026-08-10, and it exists because the ADR's first draft
      overreached. That draft asserted that "credit limits and credit holds attach to the customer,
      never to a project or department" and that "a hold applies to every project beneath" — stated
      as a consequence of choosing liability.
      ⚠️ **There is no incumbent behaviour behind either sentence.** Owner, 2026-08-10: CFS operates
      no credit limits today. So the ADR was designing a control that has never existed while
      appearing to record a consequence of one that had, which is the failure mode
      `ledger/dimensions.yaml` calls out elsewhere — a rule with no input that can never fire.
      ADR-0032 now claims only that credit exposure is **READABLE** at the organization. That much IS
      a genuine consequence: the flat clone table cannot answer "what is Netflix's total exposure"
      without a string match across ten records, and a root fixes it. Everything beyond reading is
      this question.
      **Survey obligation.** A hold is a posting-and-presentation control, so CLAUDE.md → _Accounting
      decisions_ applies in full — six references before a recommendation. Two shapes are already
      known to differ and the split is informative: **NetSuite** does NOT include subcustomers in a
      parent's limit by default, so a parent can sit at its limit while its subcustomers trade on
      unrestricted — unless Consolidated Payments is enabled, at which point the top-level limit
      governs the whole hierarchy and subcustomer limits stop being enforced. That is a direct
      analogue of "does a hold reach every project beneath", answered configurably rather than
      structurally
      (`inbox/2026-08-11-survey-unallocated-credit-sits-with-the-legal-party-and-crossing-departments-is-a-management-control.md`).
      **Xero cannot inform this one.** It has no hierarchy, so the incumbent has no delta to measure
      — the migration cost is nil by construction and the whole question is greenfield design.
      Not a blocker on ADR-0032 or ADR-0033; neither depends on an answer.

  - id: OQ-039
    headline: "where each half of tax_profile attaches"
    question: >-
      `organizations.tax_profile` carries two different concepts in one enum — who owes (applied /
      exempt) and where the goods went (three Illinois municipalities). Under ADR-0032's tree, where
      does each half attach, and does a project ever hold its own exemption?
    owner: alex
    decide_by: 2027-01-15
    blocks: []
    status: open
    notes: >-
      **Measured 2026-08-11** (`api:2026-08-11:db_organizations_count`, five queries, all 286
      organizations): **273 `tax_applied`, 11 `tax_exempt`, 1 `tax_rantoul`, 1 `tax_frankfort`, 0
      `tax_paxton`**.
      Two enum members describe the **party** — exemption is a property of who owes, and travels with
      the legal entity. Three name **Illinois municipalities**, which describe where the goods were
      delivered and are properties of the destination, not of the payer. `migration/field-map.yaml`
      currently maps the whole field UP to the root on the reasoning that "tax status is a property
      of the party that owes"; that reasoning is sound for two of the five values and not for the
      other three.
      ⚠️ **Deliberately NOT decided as part of the customer-structure work.** Owner, 2026-08-11: "dont
      close any tax adrs we have a lot to figure out with that." A 2026-08-10 interview had provisionally
      split the field; that provisional answer is **withdrawn** and superseded by this question. The
      interview note recording it is append-only and stands as written — this is the correction.
      **Settling an attachment point as a side effect of an ADR about customer structure is the wrong
      order** when the surrounding tax design is still open: ADR-0026's dual-basis non-posting tax
      book, the `tax` bounded context, and two live v1 defects on the same seam —
      **api-cloudrun#486** (nothing on the order path reads the org's `tax_profile`, so every
      tax-exempt customer's order gets taxed at cutover) and **manager#248** (order-level
      `tax_profile` selector with profile-aware recompute).
      **The field maps forward unchanged and unsplit until this is answered**, and
      `migration/field-map.yaml` records it as blocked rather than mapped — an honest "not yet
      decided" beats a mapping that looks settled.
      Three things to settle together, since answering one alone re-opens the others: where exemption
      attaches; whether jurisdiction leaves the organization for the destination; and whether a
      **project** can hold its own exemption certificate independently of the organization, which is
      real in this industry — state film-incentive certificates are issued per production, not per
      company. That third part is what makes this a tree question at all rather than a pure tax one.
      **Survey obligation applies in full** (CLAUDE.md → _Accounting decisions_) — six references
      before a recommendation, and Xero is the incumbent whose delta must be measured rather than
      assumed.

  - id: OQ-040
    headline: "is settlement point a ledger dimension"
    question: >-
      Is `settlement_point` a declared LEDGER DIMENSION, or a document attribute the read side joins
      to — given that ADR-0033 requires per-settlement-point aging to be computable without walking
      the tree?
    owner: alex
    decide_by: 2026-12-15
    blocks: [ADR-0033]
    status: open
    notes: >-
      Surfaced 2026-08-11 while writing EVT-BIL-007's `no_posting` entry, which could not state where
      each leg's node attribution lives.
      ⚠️ **REFRAMED 2026-08-16 by ADR-0036, which sharpens this question rather than answering it.**
      It was posed as "a third declared DIMENSION or a document attribute". There are no dimensions
      on a posting any more, so the live form is **"is a settlement point a KEY?"** — and ADR-0036's
      own criterion cuts both ways here, which is exactly why it is still open. A settlement point is
      a node in a customer tree (ADR-0032/0033): master data, mutable, therefore not a key. But which
      node a leg was ATTRIBUTED to at the time is an event fact, therefore a key. Nothing below is
      invalidated; read "dimension" as "key" throughout.
      **The gap is concrete.** `ledger/dimensions.yaml` declares exactly two classifications —
      `product_line` and `labor_line` — and neither can express "which department owes this". ADR-0033
      requires that the sum of settlement-point balances be checkable **without traversing the tree**,
      because the tree walk is the thing being checked and a guard that consults its own oracle is not
      a guard. That independent property needs the node to be readable somewhere the ledger can group
      by.
      **Two shapes, and they are not equivalent:**
      · **A third declared dimension.** ADR-0018 already took dimensions off account identity, so
        cardinality grows by addition rather than by exploding the chart — the same argument that made
        restoring `Transport` cheap (OQ-034). But ADR-0025 makes dimension obligation **per account**,
        so this would need a `required_on` answer for every account, and the honest answer is
        "receivable and customer-credit accounts only" — a much narrower obligation than either
        existing dimension carries.
      · **A document attribute** the read side joins to, with the ledger holding only the
        journal-entry reference. Cheaper, and it keeps a customer-structure concept out of the
        chart — but OQ-035's survey found that **not one of six references joins to a master at
        report time**, and the reasoning transfers: a live join cannot be audited, and re-keying a
        settlement point would silently restate history.
      ⚠️ That second bullet is the trap to avoid re-deriving: this looks like a cheap join and it is
      the same shape that failed on 2026-08-10 (api-cloudrun#473).
      **Survey obligation applies** (CLAUDE.md → _Accounting decisions_) — this is "where something
      posts", six references before a recommendation. SAP's head office/branch is the closest
      analogue already read: items post to the branch account and clear from the head office, so the
      node is on the POSTING rather than joined at report time
      (`inbox/2026-08-11-survey-unallocated-credit-sits-with-the-legal-party-and-crossing-departments-is-a-management-control.md`).
      **Blocks ADR-0033's acceptance**, not its drafting: the ADR's decisions stand either way, but
      its independent-check consequence cannot be implemented until this is answered.
      ✅ **SURVEYED 2026-08-16 against all six references —**
      `inbox/2026-08-16-survey-the-party-is-a-subledger-key-and-the-dimension-is-a-gl-slice-and-they-ride-different-legs.md`.
      **THE CRITERION: is the question answered from a TRIAL BALANCE or from a SUBLEDGER?** A
      dimension slices the P&L and appears in a dimensional trial balance. A party drives aging,
      statements and dunning — subsidiary-ledger reports that GAAP says are **not** in the trial
      balance at all. Five of six references keep the two structurally apart: GAAP (control account +
      AR subsidiary ledger), Xero (contact is a report grouping, explicitly not a tracking category),
      SAP ("in GL you will not have the list of vendors but a few reconciliation accounts"), NetSuite
      (customer is the entity field; segments are the dimension mechanism and GL impact is an opt-in
      flag), Odoo (`partner_id` on the receivable leg, `analytic_distribution` on the P&L legs).
      **Odoo is the sharpest: they ride DIFFERENT LEGS of the same journal entry** — its Partner
      Ledger has to fetch analytics from the counterpart income/expense lines because
      "receivable/payable lines rarely carry analytic data directly".
      **Sage Intacct dissents** — Customer is one of its standard dimensions. Scoped rather than
      discounted: that is how Intacct produces customer-sliced *P&L*, not how it produces aging.
      **RECOMMENDATION (owner's call): a settlement point is a SUBLEDGER KEY on the
      receivable-bearing leg, NOT a third declared dimension.** `ledger/dimensions.yaml` stays at
      two. Three supports: (1) the repo already has this shape — `product_line` is
      `required_on: [revenue, cogs]` and `cost_type` on `[labor_cogs]`, so **neither is required on
      1200 or 2050**, and the survey names why; (2) it is what makes ADR-0033's independent check
      genuinely independent — "group open invoices by `billed_to.id`" is a subledger query, whereas a
      dimensional GL read would be the same machinery as the roll-up it must not agree with by
      construction; (3) the reconciliation obligation comes free and is GAAP's own — the sum of
      settlement-point balances equals the 1200 control account.
      ⚠️ **The survey did NOT resolve where the party key physically lives on a TigerBeetle transfer,
      and found that nothing else does either — HOT-013.** Counting claimants exposed a contradiction
      that exists WITHOUT settlement point: ADR-0018 says dimensions ride in `user_data`, and all
      three `user_data` fields are already assigned to `journal_entry_id`, `source_document` and
      `accounting_date`. One transfer is one debit plus one credit account, so a single
      `invoice_issued` transfer (Dr 1200 / Cr 4100) owes both an AR-side and a revenue-side value —
      **three slots, six live claimants**. erp-spec#3's "four claimants" never counted the two
      dimensions. **This question cannot be fully closed until HOT-013 is**, but the recommendation
      above is unaffected by it: it holds whichever way the storage question falls, and it removes
      one claimant rather than adding one.

  - id: OQ-041
    headline: "does a pass-through carry a product line"
    question: >-
      Does a pass-through purchase carry a product line — and if so, which one: the line of the
      thing bought, or none at all?
    owner: alex
    decide_by: 2026-11-15
    blocks: []
    status: answered
    answer: >-
      **A pass-through resolves to NO product line.** Owner accepted the survey recommendation
      2026-08-16.
      ⚠️ **The LEDGER half of this answer is moot as of the same day (ADR-0036).** It read
      "`product_line: null`, and the obligation to DECLARE stands. Both `4140 Pass Through Income`
      and `5150 Cost of Goods Sold: Pass Through` carry `dimensions: [product_line]`, and the value
      written is normally null." There is no obligation and no `dimensions:` list — the chart states
      neither. **The underlying fact survives and changes audience**: a pass-through is a real sale
      of a thing that by rule is not in the catalogue, so its line resolves against no product master
      and reports as `unallocated` (`reporting/product-line-pl.yaml`).
      ⚠️ **The distinction from 4700/5500 also survives and can no longer be drawn in the chart.**
      It was "a pass-through owes a declaration and a card fee owes none"; both now owe nothing at
      the posting. The real difference — a pass-through IS a sale, a card fee is a recharge caused by
      how the customer paid — has to be carried by the REPORT.
      `ledger/dimensions.yaml` already defines that exact fact — "this IS a categorised kind of sale,
      and no tracked product line applies to it" — and a pass-through is precisely that: a real sale
      of a thing that by rule is not in the catalogue.
      ⚠️ **Deliberately DIFFERENT from what 4700/5500 took the same day**, which is no dimension
      obligation at all. A card fee is not a sale; a pass-through is. Two empty-looking answers, two
      different reasons, and keeping them apart is what `dimensions.yaml` exists for.
      ✅ **Observed, not only proposed**: the one pass-through line in the corpus
      (`1Qr50IQXdPjKC2cB7WyV` — "Internet @ Firehouse", $800.00) already carries
      `tracking_category: null`.
      **The prior question — gross or net — was settled by the survey: CFS is a PRINCIPAL, so the
      presentation is GROSS.** 4140 carries the full re-billed amount, 5150 the full vendor cost.
      ASC 606's test is CONTROL, and responsibility-for-acceptability plus price discretion establish
      it; SAP's third-party order processing explains the remaining indicator, since a **statistical
      goods receipt** is exactly how a principal holds no inventory. NetSuite's default is the
      opposite (net, unless "Track Billable Expense in" is set), so gross is a recorded decision
      rather than an assumption.
      ✅ **A rule accepted with it**: pass-through items are **exclusively custom items, never
      product/service catalogue entries** (owner). Self-enforcing by its own logic — a durable
      wholesale price warrants a catalogue product instead — and already true of the corpus: 0 of 549
      products carry `coa_revenue: 4140`. **Requirement-shaped and enforceable: a PRODUCT configured
      to 4140 should be refused.** Tracked as erp-spec work rather than left in prose.
      ⚠️ **Accepted as unmeasurable**: where the vendor cost landed in Xero cannot be established
      from CFS data — a pass-through's cost is an ACCPAY bill and CFS deliberately mirrors none, and
      this repo must not call the Xero API. The revenue half IS visible and IS gross.
      ⚠️ **Rests on the arrangement, not on volume.** One line is not a population. The determination
      assumes CFS is primarily responsible on every pass-through; if that ever varies, one account
      cannot carry both treatments and the determination becomes per-arrangement.
    notes: >-
      Raised 2026-08-16 while pairing a cost account to `4140 Pass Through Income`. Owner: CFS buys
      something for a customer, marks it up and bills them for it, "usually from a vendor that isnt
      willing or able to onboard direct with our customer" — CFS acting as a purchasing agent.
      **The chart previously asserted an answer.** 4140's note read "a rebilled cost takes the
      product line of the thing passed through, so the dimension is available even though the margin
      is nil". Both halves were wrong: the margin is the **markup**, not nil, and the product-line
      claim is an assumption rather than a rule. A widget bought for a customer from a one-off vendor
      may belong to **no CFS product line at all** — the taxonomy describes what CFS supplies and
      performs, and this is neither.
      **Measured 2026-08-16, and the shape of the usage is the evidence.**
      `api:2026-08-16:db_products_count`: **0 of 549 products** carry `price.coa_revenue: 4140`, so
      nothing is configured to post here. `api:2026-08-16:db_invoices_query` over the first **63**
      invoices found **1** line on 4140 — a `custom-` line, typed by hand. That is exactly what an
      account reached only by ad-hoc entry looks like, and it is why no product master can supply the
      dimension the way it does for every other revenue account.
      ⚠️ **Not a corpus-wide count.** 63 of 999 invoices; the sweep stopped there because a full
      count needs a script rather than MCP paging. The population is small but its exact size is
      unmeasured, and "how often does CFS actually pass through" is worth knowing before deciding —
      a handful of lines and a regular practice deserve different answers.
      **Three candidate answers**, and the third is the one the Transaction Fees ruling makes
      available: the line of the thing bought (what the chart assumed); `product_line: null` on a
      dimensioned account, meaning "this IS a categorised kind of sale and no tracked line applies";
      or **no dimension obligation at all**, as 4700/5500 now have — ADR-0025 makes it per-account,
      and a purchasing-agent recharge is arguably no more a product line than a card fee is.
      Both `4140` and the newly minted **`5150 Cost of Goods Sold: Pass Through`** carry
      `dimensions: undecided` and name this question, so neither can be posted to until it is
      answered.
      ⚠️ **Accounting-shaped, so CLAUDE.md's six-reference survey applies** before a recommendation.
      Gross-versus-net presentation of an agency arrangement is a real GAAP question (ASC 606's
      principal-versus-agent test), and if CFS is an agent rather than a principal the answer may not
      be a dimension at all — it may be that only the markup is revenue.
      ✅ **SURVEYED 2026-08-16** —
      `inbox/2026-08-16-survey-a-vendor-side-amount-becomes-revenue-only-where-control-or-a-markup-does.md`.
      **The principal-versus-agent half is SETTLED: CFS is a PRINCIPAL, so the presentation is
      GROSS** — 4140 carries the full re-billed amount and 5150 the full vendor cost. Owner facts,
      2026-08-16: CFS is primarily responsible if the item is wrong ("we own the problem") and CFS
      sets the price with discretion over the markup; CFS carries no inventory risk because the
      customer commits first.
      ⚠️ **Not decided by counting indicators, and an earlier framing in that session was wrong to
      imply it was.** ASC 606-10-55-36ff is explicit that the three indicators are *evidence, not a
      three-part test* — "meeting two of three doesn't automatically make the entity a principal".
      The determination rests on CONTROL, and responsibility-for-acceptability plus price discretion
      is what establishes that CFS directs the good's use before transfer. Absence of inventory risk
      is ordinary in a buy-to-order arrangement.
      **NetSuite's default is the opposite and that is worth knowing**: without its "Track Billable
      Expense in" setting it credits the EXPENSE account — a net presentation — so gross is a
      deliberate configuration rather than a shape to assume. Odoo makes the same line a per-expense
      policy field, "At cost" versus "Sales price".
      **RECOMMENDATION on the dimension this question actually asks: `product_line: null`, keeping
      the obligation to declare.** `ledger/dimensions.yaml` already defines that fact exactly — "this
      IS a categorised kind of sale, and no tracked product line applies to it" — and a pass-through
      is precisely that: a real sale of a thing that by rule is not in the catalogue. ⚠️ **Different
      from what 4700/5500 took the same day** (no dimension obligation at all), because a card fee is
      not a sale. Two empty-looking answers, two different reasons.
      ✅ **A rule the owner stated and the data already obeys**: "pass through items should
      exclusively be custom items (not product/service catalog)." Measured — 0 of 549 products carry
      `coa_revenue: 4140`. It is self-enforcing by the owner's own logic, since any durable wholesale
      price "would generally warrant creating a product in the catalog", and it is requirement-shaped:
      a PRODUCT configured to 4140 should be refused.
      ⚠️ **CORRECTED 2026-08-16, same day** —
      `inbox/2026-08-16-correction-two-of-three-unreachable-references-were-a-bad-query-and-sap-models-this-case-exactly.md`.
      **SAP was not unreachable, it was skipped by a malformed query — and it is the strongest
      reference in the survey.** SAP's third-party order processing is CFS's case exactly: goods go
      supplier-direct to the customer, a **statistical goods receipt** records the flow WITHOUT
      creating inventory, the vendor invoice posts separately, and the sales order line becomes
      billing-relevant. That is a **gross** presentation, and the statistical receipt is precisely the
      mechanism for holding no inventory while still being the principal. ⇒ It EXPLAINS the one
      indicator that pointed "agent" rather than merely outweighing it. Sage Intacct likewise
      supports automatic percentage markups on billable transactions.
      **The migration delta is narrower than stated and is partly unanswerable by design.** Reading
      the document (`api:2026-08-16:db_invoices_get` on `1Qr50IQXdPjKC2cB7WyV`): invoice 1308,
      "Internet @ Firehouse", **$800.00**, `GWave Productions, LLC / Office`, 2023-09-15 — CFS bought
      internet at a shoot location and re-billed it. **The revenue side is visible and IS gross**: the
      full $800 posts to 4140, not a markup-only figure. **The cost side cannot be seen** — a
      pass-through's cost is an ACCPAY bill, and CFS deliberately mirrors none of them, and this repo
      must not call the Xero API. So the open question is "where did the vendor cost land", not
      "gross or net".
      ✅ **And that line already carries `tracking_category: null`** — the dimension recommendation
      above, observed in the corpus rather than only proposed. One line is not a population, but the
      operator who typed it reached the same answer.

  - id: OQ-042
    headline: "is labor_line posted or derived"
    question: >-
      Does `labor_line` (formerly `cost_type`) stay a POSTING field, or is it derived from the
      shift's allocation row the same way `product_line` is derived from the product master?
    owner: alex
    decide_by: 2026-11-15
    blocks: [ADR-0036]
    status: answered
    answer: >-
      **DERIVED, not stored — `labor_line` follows exactly the same protocol as `product_line`.**
      Owner, 2026-08-16: "labor_line should follow same protocol as products, what's recorded in the
      immutable ledger is wages… **so ledger account rides TigerBeetle, the classification is a
      Mongo** [detail]."
      So the rule generalises rather than acquiring an exception: **the posting carries the GL
      ACCOUNT and its keys; every classification is a Mongo concern.** What TigerBeetle records about
      a shift is that wages were incurred — the account — and *what kind of work it was* is read off
      the shift's allocation row at report time, the same way a product line is read off the product
      master.
      The survey's own reasoning supports it: the case for storing rested on `labor_line` being an
      observation rather than a lookup, and the case against was that the shift record already holds
      it per allocation row and the posting must carry that row's identity anyway (HOT-014). The
      second wins, and the criterion is not violated — deriving from the **shift record** crosses
      into a recorded historical fact, not into a mutable master.
      ⚠️ **Consequence for the sweep (erp-spec#19): 5800's `dimensions: [product_line, cost_type]`
      becomes `dimensions: []`**, and 5800/5801 stop being the exception in the chart.
    notes: >-
      Surfaced 2026-08-16 by ADR-0036's own criterion, applied to the one dimension ADR-0036
      deliberately did not sweep along. The owner's ruling addressed **product lines**; `cost_type`
      was renamed `labor_line` and its enum grown to seven in the same breath, but its *location*
      was not decided.
      **THE CRITERION, and it is ADR-0036's own rather than a new one: could this value be revised
      later without anyone having observed something new?** Yes ⇒ it is a classification and must be
      derived. No ⇒ it is a fact and may be stored.
      **The case for STORING it.** `labor_line` records an observation made at the time — this
      person did delivery work on this job. Nobody re-decides it later from a master record, which is
      exactly what separates it from `product_line`, whose value is
      `products.uid_tracking_category` and has moved twice in one month.
      **The case for DERIVING it.** `shift_recorded` fans `per: shift.absorbed_allocations`, and each
      row already carries `product_line`, `cost_type` and `causal_job`. If the posting carries the
      ROW's identity — which HOT-014 showed it must anyway, since one shift becomes several transfers
      and `source_document` resolves only to the shift — then `labor_line` is reachable without
      storing it, and the ledger holds keys uniformly rather than keys plus one exception.
      ⚠️ **The two are not symmetric, and that is what makes this a real question rather than a
      preference.** Deriving `product_line` crosses into a **mutable master**; deriving `labor_line`
      crosses only into the **shift record**, which is itself a recorded historical fact. So the
      derivation is safe in a way the product-master one is not — which weakens the strongest argument
      for storing it.
      **Blocks ADR-0036's acceptance only in the sense that the ADR should say which**; its decision
      on `product_line` stands either way.
      (`inbox/2026-08-16-owner-rulings-line-identity-is-item-path-ephemeral-reports-are-never-sealed-and-cost-type-becomes-labour-line.md`)

  - id: OQ-043
    headline: "do the masters carry an event history"
    question: >-
      Should the product and organization masters carry an EVENT HISTORY, so that a classification as
      it stood at any past date is recoverable?
    owner: alex
    decide_by: 2026-12-15
    blocks: []
    status: open
    notes: >-
      Owner, 2026-08-16: "i like the idea of maintaining an event history on products and
      organizations." Recorded as a question rather than folded into ADR-0036, because it is a
      capability nobody has costed.
      **What it buys, specifically, in the ADR-0036 design.** ADR-0036 derives the product line at
      report time from the current master, so every historical product-line P&L re-runs **as
      classified NOW**. With a categorisation history it also re-runs **as classified THEN** — the
      strongest form of the re-runnability the owner gave as the reason for allocation-as-reporting,
      and it needs no ledger field at all.
      ⚠️ **It is not needed for correctness and must not be presented as if it were.** ADR-0036 is
      safe without it: the sealed compliance artifacts (balance sheet, account-level P&L) carry no
      product line, so a re-categorisation cannot restate a closed period. This is a BI capability on
      a BI report.
      **Two questions inside it**: whether the history is a general audit log or specifically a
      classification history (much cheaper, and the only part this design uses), and whether
      organizations need it for the same reason — a customer-type P&L is the other ephemeral report
      the owner named, and customer type is the same shape of mutable classification.
      ⚠️ **v1 already holds part of the answer and it should be measured before designing.** Products
      and organizations both carry a `version` field and a `updated_by`, and `uid_thread` links a
      comment thread — so some change signal exists today. Whether it is enough to reconstruct a past
      categorisation is unverified.

  - id: OQ-044
    headline: "what stays in 6600 Wages"
    question: >-
      Once wages move into COGS, what stays in `6600 Wages` — and can salaried sales/admin staff who
      never touch a delivery be COGS too, or must they remain operating expense?
    owner: alex
    decide_by: 2026-12-15
    blocks: []
    status: open
    notes: >-
      Owner, 2026-08-16: wages "are currently in gen opex and should be moved to cogs. we'll keep the
      gen opex wages for future salaried staff that dont do deliveries (sales, admin etc... **though
      i guess they could all be cogs, not sure**)." The first half is decided; the parenthesis is
      this question.
      ✅ **The STRUCTURAL half is settled 2026-08-16: "we'll keep both labor accounts."** `6600 Wages`
      is retained alongside the new `5800`, so "could they all be COGS" is answered **no** at the
      level of the chart — an operating-expense wages account continues to exist and to hold
      somebody. What remains open is only WHO, and the sales/admin asymmetry below is the live part
      of it.
      ⚠️ **HALF OF THIS QUESTION WAS ANSWERED ELSEWHERE ON 2026-08-17, and it is worth knowing before
      you answer the rest.** ADR-0038 (accepted, owner's ruling) decides that **labor no causal order
      produced is operating expense and stays in `6600`** — so the residue this question asks about
      now has a stated rule rather than an open shape, and it explicitly includes training days,
      warehouse cleanup and maintenance projects. It also **deleted `5801`**: there is no unabsorbed
      COGS account, so nothing can land between the two answers.
      ⇒ **What is genuinely left is narrower than the text above suggests**: not "what stays in
      6600", which ADR-0038 answers, but whether a salaried person who NEVER works a causal job can
      nonetheless be COGS. On ADR-0038's own criterion the answer follows — no causal order, no
      revenue the cost is applicable to, so no — and what the ruling would add is whether CFS wants
      to say so for a population that has no shifts at all.
      ✅ **The move itself is ALREADY SPECIFIED and needs no new decision.** `ledger/chart-of-accounts.yaml`
      carries `5800 Cost of Goods Sold: Wages (Absorbed)`, `disposition: new`, `status_live: absent`,
      against `6600 Wages` (`status_live: Active`, `type: Expense`). ADR-0019 is the decision behind
      it. ⚠️ This bullet named `5801 Cost of Goods Sold: Wages (Unabsorbed)` alongside it until
      2026-08-17; ADR-0038 removed that account.
      **What is open is only the RESIDUE — what 6600 keeps.**
      ⚠️ **Do not survey this as an open question. GAAP is narrow here and the answer is probably
      no.** COGS is direct cost of revenue; general and administrative salaries are period costs and
      belong in SG&A. Classifying admin salary as COGS overstates gross margin's denominator and
      misstates a subtotal investors and lenders read. **The interesting half is sales**, not admin —
      and the live books have already taken a position on it: `5200 Cost of Goods Sold:
      Subcontractors, **Sales Commissions**` is Active, so commission-based selling cost is in COGS
      today while salaried selling cost would not be. Whether that asymmetry is deliberate or
      inherited is worth asking before extending it.
      **Survey obligation applies** (CLAUDE.md → _Accounting decisions_) — "what an account means" —
      but scope it to the residue: what do the six references put in COGS-labor versus SG&A-labor,
      and what is their criterion for splitting one person's time across the two.
      ⚠️ **Utilisation is the trap to avoid.** ADR-0019's 5800/5801 split measures utilisation, so a
      salaried person who does deliveries **some** of the time is not an all-or-nothing case — they
      absorb into 5800 for hours on a causal job and land in 5801 otherwise. A person who NEVER
      touches a delivery has no absorption mechanism at all, which is what makes them different in
      kind rather than in degree. That distinction, not the job title, is the likely criterion.

  - id: OQ-045
    headline: "what retires an over-accrual residual"
    question: >-
      When a vendor bills LESS than was accrued, what retires the residual left in
      `2010 Accrued Expenses: Received Not Invoiced` — and who is allowed to do it?
    owner: alex
    decide_by: 2027-02-15
    blocks: []
    status: open
    notes: >-
      Opened 2026-08-16 by erp-spec#14, which specified `obligation_accrued` and
      `vendor_bill_received` and deliberately did **not** invent the answer to this.
      **What IS decided.** A bill for MORE than was accrued needs nothing: the excess is an ordinary
      direct line to its own cost account, in the bill's period
      (`ledger/vectors/vendor_bill_received/bill-exceeds-the-accrual-and-the-excess-is-a-direct-line.yaml`).
      A **partial** bill is normal and leaves a residual on purpose — both SAP and NetSuite treat the
      received-not-invoiced residual as the ordinary state with a reconciliation practice attached,
      and its sign is the finding (credit = received not invoiced, debit = invoiced not received).
      **What is NOT decided** is the case where the vendor's final bill comes in under the accrual
      and no further bill is coming. The cost was overstated in the period it was accrued, and the
      difference sits in 2010 with nothing left to relieve it. That needs a fourth procurement event
      — an obligation correction or write-back — and inventing it alongside the other three would
      have been machinery for a branch nothing takes.
      ⚠️ **The reason it must be a DECISION and not a default is the period.** The accrual may sit in
      a period that is closed and hashed (ADR-0017), so the correction cannot restate it; it has to
      post in an open period, which means the two periods disagree about that job's cost and
      somebody has to say that is acceptable. The alternative — a materiality threshold below which
      the residual is written off automatically — is a policy, and a threshold that lives only in an
      operator's habit is not a threshold (the same reasoning
      `asset_acquired/below-capitalisation-threshold-rejected` pins for the $1,000 line).
      **Survey obligation applies** (CLAUDE.md → _Accounting decisions_) — "where something posts".
      Scope it narrowly: what do the six references do with an unclearable GR/IR residual, and what
      is their criterion for writing one off rather than chasing it. SAP's F.19 reclassification is
      the obvious starting point, and note that it **reclassifies rather than clears** — which is
      evidence the write-off is a separate, deliberate act everywhere.
      ⚠️ **NARROWED 2026-08-22, and the other half is now decided.** `ADR-0041` found — via the
      2026-08-18 rule 8a survey — that this OQ and erp-spec#38 are **one seam from two sides**: the
      residual left in 2010 after `vendor_bill_received` relieves the accrual IS the labor variance,
      and neither artifact named the other. ADR-0041 takes the **arithmetic** half: an EOR run that
      is FULLY BILLED, where the difference is a rate estimate error, posts to
      `5190 - Cost of Goods Sold: Labor Variance` keyed to the run's causal orders. **What stays
      here is the JUDGEMENT half** — a vendor who may or may not bill again, where nobody can say
      whether the residual is a variance or a liability still owed. **One is arithmetic; the other
      is a judgement about a vendor relationship**, which is precisely why this OQ says it must be a
      decision and not a default. The fence executes:
      `ledger/vectors/vendor_bill_received/partial-bill-residual-routed-through-5190-rejected.yaml`
      is a true minimal pair — identical amount, accounts and keys — refusing a variance on an
      incomplete run.
      Not blocking: 2010's residual is visible and reportable either way, and nothing in m3 depends
      on it.
  - id: OQ-046
    headline: "where counter and warehouse labor lands"
    question: >-
      `counter` and `warehouse` labor bill nobody and name no product line, so no allocation pool
      selects them. Where does their cost land — spread like `delivery`, reported unallocated, or
      attached to the causal order's goods directly?
    owner: alex
    decide_by: 2027-01-15
    blocks: []
    status: answered
    answer: >-
      **SPREAD, exactly as `delivery` does.** Owner, 2026-08-16: *"counter and warehouse can bill
      goods too (just like delivery does)."* A counter hour serves a customer collecting or
      returning an order and a warehouse hour preps, pulls, checks in or puts away for one — both
      are joint costs of that order's goods revenue and neither is severable, because nobody buys a
      counter hour. That is ADR-0029's criterion for `Delivery` applied unchanged.
      They are **cost-only pools** — `kind: cost_only` in `reporting/product-line-pl.yaml`, a second
      pool shape added the same day. An activity pool has revenue AND cost and asks whether that
      cost lands on the goods; a cost-only pool has cost and no revenue to categorise, so the
      question does not arise and it has nowhere else to go. ⇒ **a cost-only pool must be
      `allocated`**, and gate 13d fails on one that is not.
      ✅ **The ruling made coverage TOTAL, and the two-branch structure this question created was
      deleted the day it was written.** `reporting/product-line-pl.yaml` briefly carried
      `labor_line_kinds` (`billable` / `bills_nobody`) with an `unpooled_labor_lines` honest-bucket
      beside it; with nothing left in the second branch, **a branch with no members is a claim
      rather than a capability** and it went. Gate 13h now simply requires every declared
      `labor_line` to be selected by exactly one pool.
      ✅ **And that totality is structural rather than lucky.** `labor_line` is read off the shift's
      ABSORBED ALLOCATION row, and an absorbed allocation names a causal job by definition — hours
      belonging to no job are UNABSORBED, post to 5801, carry no allocation row and therefore no
      `labor_line` at all. Every value the taxonomy can hold is attributable to a job whose goods
      can bear it.
    notes: >-
      ⚠️ **RESTATED TWICE ON 2026-08-16, the day it was opened, and the original was WRONG in its
      conclusion.** It first asked "what exercises `labor_line`? … since ADR-0036 nothing in the repo
      consumes it." **The report consumes it** — `labor_line` is an allocation pool's COST SELECTOR
      (owner, same day), declared as `cost_sources.labor_line` per pool. Nothing in `ledger/`
      exercises it and nothing ever will, because ADR-0036 makes it derived; the consumer was one
      directory away, describing the selection in a pool's prose instead of declaring it, **which
      reads as "no consumer" to a grep and to a gate**. The evidence was right and the conclusion
      was not, which is why the history is kept here rather than overwritten.
      ⚠️ **`warehouse` here was never `deferred_pools.warehouse_overhead`, and the two were conflated
      until this was answered.** That entry is rent and utilities — an operating expense below this
      report's gross margin until an ADR moves it into COGS (erp-spec#12), with no causal order to
      spread from. This is a warehouse HOUR, already in COGS via 5800 and already absorbed against a
      job. Two facts that share a word.
      ⚠️ **The size of either pool is unmeasured and will stay unmeasured until v2 runs** — the
      current system has never had the absorbed-labor stage, so both measure as zero everywhere
      (erp-spec#14). **Decided on the criterion rather than on the number**, which is the right way
      round: severability does not depend on magnitude.
      (`inbox/2026-08-16-labor-line-is-the-pools-cost-selector-and-a-report-is-a-selector-crossed-with-a-base.md`)

  - id: OQ-047
    headline: "does an unpaid owner shift post"
    question: >-
      An owner works a shift and is not paid for it. Does the ledger post the cost — and if so, what
      does it credit, given that no vendor will ever invoice for it and 2010 Accrued Expenses:
      Received Not Invoiced would be asserting a liability that cannot be relieved?
    owner: alex
    decide_by: 2027-01-15
    blocks: []
    status: answered
    answer: >-
      **STICK WITH GAAP. A `contributed` shift writes NO TRANSFER.** Owner, 2026-08-16, accepting the
      survey's recommendation: "stick with gaap, and your rec".
      `EVT-FUL-002` gains **`compensation: paid | contributed`**. A `paid` shift posts exactly as
      before (Dr 5800/5801, Cr 2010). A `contributed` shift — one an owner worked and took no wage
      for — posts **nothing**: no obligation was incurred, so no expense was incurred. ASC 958-605,
      the standard that lets an entity recognise donated services, is **not-for-profit only**.
      ✅ **No conditional is needed in the posting rule.** `cost_minor` is zero on a contributed
      shift, and `ledger/posting-rules.yaml` already rules that a posting whose amount is zero is not
      written — both legs and the control total fall out of machinery that already exists.
      **THE SHIFT AND ITS ALLOCATIONS ARE STILL RECORDED**, and that is the whole design: hours,
      causal job, allocation-row identity and `labor_line` all survive, so the costing layer keeps
      everything it needs. **Suppressing the EVENT would have been the wrong fix** — it would lose
      the hours, and with them any chance of measuring how much contributed labor the business runs
      on. Under ADR-0036 the ledger holds keys and the projection holds everything derived; an
      imputed labor cost is a projection fact by exactly that argument.
      ⇒ **`3130 Owner's Capital: Owner's Billable Time` returns to `disposition: drop`**, and this
      time for the right reason: the GAAP answer needs no fenced offset at all, because nothing is
      posted to offset. The account was correct machinery for the treatment that was NOT chosen.
      ⚠️ **What this does NOT fix, and it is a consequence rather than an oversight:** the GAAP gross
      margin stays flattered by contributed labor. **That is what GAAP requires**, and it is why the
      imputed view has to EXIST rather than be optional — a margin that is honest only in a report
      nobody runs is not honest. The imputed view is one of the "other combos" the owner's
      `labor_line` ruling makes cheap, and **what rate to impute is not decided** — see OQ-048.
      **Golden vectors:** `contributed-owner-shift-posts-nothing` (accept) and
      `contributed-shift-that-posts-rejected` (reject, its minimal pair). ⚠️ The reject is the
      load-bearing one: a contributed shift posted anyway **balances**, matches its control total and
      passes every other gate in the file, so nothing arithmetic can see it. Without that vector the
      discriminator is a field an implementation can read and ignore.
    notes: >-
      Opened 2026-08-16. Owner: *"i think what we need is a line in the labor pos or bills that
      allows for an owner shift unpaid or paid, so that unpaid owner shifts dont dilute cogs."*
      Surveyed per CLAUDE.md → _Accounting decisions_
      (`inbox/2026-08-16-survey-an-unpaid-owner-shift-is-not-an-expense-and-every-reference-fences-imputed-labour-out-of-the-statements.md`).
      **Two failures, and they are opposite.** Posting a contributed shift as a normal one credits
      2010 for a bill that will never arrive, and 2010's whole purpose is "received not invoiced".
      Posting nothing leaves the job's COGS excluding real work, so gross margin is overstated and
      the absorbed/unabsorbed utilisation number silently omits owner hours — **the "dilute COGS"
      the owner names**.
      ⚠️ **THE SURVEY DOES NOT COME BACK UNANIMOUS, and the split is the useful part.** GAAP, Xero,
      SAP and Odoo keep an uncompensated labor cost out of the financial statements entirely
      (ASC 958-605 is not-for-profit ONLY; "Xero Projects isn't integrated into the P&L"; SAP's
      secondary cost elements "do not cause any change in any values in Financial Accounting";
      Odoo's timesheet cost is analytic with "no exact counterparts in the general accounts").
      **NetSuite and Intacct DO post it** — NetSuite against a project **cost variance** account,
      Intacct into a **9xxx range excluded from all standard financial reports**, and Intacct states
      the two-books structure outright: "these are ESTIMATED labor costs used for project costing;
      ACTUAL labor cost will come from Payroll."
      **THE CRITERION all six agree on**, which is worth more than the default: *does this cost
      represent an obligation the entity actually incurred?* If yes it belongs in the statements; if
      no it belongs in a costing layer fenced off from them — and each fences it differently. ⚠️
      **The unanimous part is the CREDIT side: nobody credits a payable.** That is exactly the
      defect at issue.
      **RECOMMENDATION (owner's call): a `compensation` discriminator on the shift, and a
      contributed shift writes NO TRANSFER.** `paid` posts as today; `contributed` posts nothing,
      because no obligation was incurred — the majority answer and the one GAAP requires of a
      for-profit entity. The shift record and its `absorbed_allocations` are written regardless, so
      the costing layer keeps the hours and the causal job, and **the imputed cost becomes a REPORT
      rather than a posting**. ADR-0036 already built that two-layer split — TigerBeetle holds the
      GL, Mongo holds the projection, every classification is derived — so the survey's criterion and
      this repo's existing architecture agree, which is the strongest form the recommendation can
      take. It is also one of the "other combos" the owner's `labor_line` ruling makes cheap.
      ⚠️ **What the recommendation does NOT fix, stated so it is not discovered later:** the GAAP
      gross margin stays flattered by contributed labor. That is what GAAP requires, and it is why
      the imputed report has to EXIST rather than be optional — **a margin that is honest only in a
      report nobody runs is not honest.**
      ⚠️ **The rejected alternative is live and is NetSuite's**: Dr 5800 / Cr an owner-contribution
      account, so the GAAP margin is right and the credit is fenced. Refused on GAAP rather than on
      convenience — a for-profit entity recognising an expense and a capital contribution for donated
      owner services is not a treatment the standard permits. **If the owner's priority is one honest
      margin over statement conformity, that is the trade to re-open.**
      ⚠️ **THE INCUMBENT ALREADY HAD THE FENCED OFFSET AND THIS REPO PROPOSED DELETING IT.**
      `3130 Owner's Capital: Owner's Billable Time` is Archived in the live chart and carried
      `disposition: drop`, on the reason that "booking it to equity would put the cost outside COGS
      entirely". **That reads the account as the DEBIT side and it is the CREDIT side** — debit 5800,
      credit owner's capital, and the job bears the cost while the credit records that it was
      contributed rather than owed. Its disposition moves to `undecided`, blocked here.
      ⚠️ **The migration delta cannot be measured before v2 runs**, and that is the finding rather
      than a gap: how many owner shifts have ever been worked is recorded nowhere, because the
      current system has no absorbed-labor stage at all (erp-spec#14). **What would measure it is
      the discriminator itself**, present from day one so the population is countable the moment the
      stage exists.
  - id: OQ-048
    headline: "at what rate an owner shift is imputed"
    question: >-
      At what rate is a contributed (unpaid owner) shift costed in the IMPUTED labor view — the
      person's own wage had they been paid, a replacement-hire rate, or a single notional owner
      rate?
    owner: alex
    decide_by: 2027-03-15
    blocks: []
    status: open
    notes: >-
      Opened 2026-08-16 by OQ-047's answer. **The GAAP decision does not depend on this and is not
      waiting for it** — a contributed shift posts nothing whatever rate is chosen. What waits is
      the imputed view, which OQ-047 makes required rather than optional.
      **Why it is a real decision and not a lookup.** ADR-0019 costs labor at "that person's actual
      per-contact wage", and **an owner who is never paid has no actual wage** — the field may be
      empty, or may hold a number nobody has ever honoured. So the imputed view needs a rate the
      shift record does not supply. Three candidates, and they answer different questions:
      · **the person's own wage rate**, if one is recorded — cheapest, and it measures "what this
        shift would have cost if we had paid it";
      · **a replacement-hire rate** — what it would cost to have someone else do the work, which is
        the number that matters for "can this business run without the owner working for free";
      · **a single notional owner rate** — simplest to administer and the least defensible per-hour,
        because an owner delivering and an owner doing books are not the same cost.
      ⚠️ **The agricultural-extension literature calls this an imputed owner labor and management
      charge and treats the SECOND as the correct one** — owner-operator compensation "should be
      equivalent to hired compensation for accurate profitability measurement". That is a
      recommendation from a field that has thought about owner-operated businesses for decades, and
      it is the starting point rather than the answer.
      ⚠️ **Whatever is chosen is a BASIS and owes a version** — `reporting/allocation-bases.yaml`'s
      discipline applies, because two imputed views computed at different rates would disagree about
      the same job's margin, which is the failure ADR-0029 exists to prevent. It is also why the
      imputed view must be explicitly NON-OFFICIAL: ADR-0029 permits exactly one official
      allocation, and this is a second number for the same thing.
      ⚠️ **Unmeasurable until v2 runs.** How many owner shifts exist is recorded nowhere — the
      current system has no absorbed-labor stage at all (erp-spec#14) — so there is no corpus figure
      to size this from. `compensation` being present from day one is what makes the population
      countable the moment the stage exists.
  - id: OQ-049
    headline: "do the board and threads survive into v2"
    question: >-
      Does v2 carry the operational collaboration surface — the board (`cards`, `lists`) and the
      comment threads (`threads`, `comments`) — or does the charter's silence mean it is out of
      scope?
    owner: alex
    decide_by: 2027-01-31
    blocks: []
    status: answered
    answer: >-
      **BOTH survive.** Owner, 2026-08-17: _"a version of the current board/calendar/list def
      survives into v2, its current form is a very rough draft"_ and _"a version of
      comments/threads also survives"_. The charter's silence did not mean out of scope.
      ⚠️ **"The concept survives" and "the data migrates" are DIFFERENT CLAIMS and only the first
      is settled.** The board's v2 shape is a redesign, so nothing can be mapped to it yet; and the
      thread corpus is ~99% empty containers (4,153 threads against 44 comments, from event-card
      churn), so whether THAT DATA is carried is a separate question this does not answer. All four
      collections stay `quarantine` in the field map with their REASONS rewritten.
      ⇒ **OQ-051 takes the part that is still open** — where the chat seam sits.
      ⚠️ **The charter still names neither surface**, in scope or out, which is the gap this question
      actually exposed. A ruling in a session is not a charter amendment.
    notes: >-
      Opened 2026-08-16 while authoring the m6 collection dispositions (erp-spec#8). **5,315
      documents across four collections turn on a silence**: the charter's in-scope list runs order →
      fulfillment → invoice → posting → report and never reaches a board, and its out-of-scope list —
      which is explicit about payroll, multi-currency, multi-entity, CRMS and a general-purpose
      accounting product — does not exclude one either.
      **Measured 2026-08-16** (`migration/live-paths.measured.yaml`): `cards` 1,114 docs / 56 paths,
      `lists` 4 / 16, `threads` 4,153 / 18, `comments` 44 / 21.
      ⚠️ **The four are NOT one object, and treating them as one is the trap.** A card is a scheduled
      unit of work carrying `sources[].{collection,uid}` back to the order or booking that caused it,
      plus a destination, a recurrence and an `action` — it is downstream of the Trello integration
      the migration drops, so "the board goes" is at least arguable. **Threads are broader**: `cards`,
      `roles` and the template projection all carry a `uid_thread`, so a comment thread attaches to
      domain objects the board has nothing to do with. Dropping the board does not settle threads.
      ⚠️ **And the thread corpus is mostly empty.** 4,153 threads against 44 comments — the known
      cause is event-card delete/recreate churn leaving orphans behind, symptom-fixed in v1 on
      2026-06-24 with the deeper root deferred (api-cloudrun#227). So a second question sits inside
      the first: if threads survive, is a corpus that is ~99% empty containers MIGRATED or REBUILT? A
      migration that carries them forward imports the defect rather than the data.
      **Held as `quarantine` in `migration/field-map.yaml` meanwhile**, which is one of the three
      dispositions m6's criterion accepts — so these count as settled for the milestone and remain
      unsettled for the migration. ⚠️ That is the correct reading, because "hold it aside" IS a
      migration behaviour, and it is also exactly the reading that would let a milestone look
      finished. Do not read `quarantine` as `mapped`.
  - id: OQ-050
    headline: "does the EOR reconcile per person"
    question: >-
      Does the EOR's charge for a W-2 crew member reconcile PER PERSON and PER SHIFT, or only in
      aggregate — and therefore is the burdened cost rate an ACTUAL cost or an estimate that must be
      trued up at period close?
    owner: alex
    decide_by: 2027-02-28
    blocks: [ADR-0019]
    status: answered
    answer: >-
      **BOTH, on different halves of the same payroll — which is why guessing which one it would be
      could not have worked.** Measured 2026-08-17 against Wrapbook payroll 759715 (owner-supplied
      Payroll Register + Invoice Fee Summary):
      · **WAGES are itemised per person, per day, per project**, with hours and dollars — actual and
      attributable;
      · **BURDEN is priced per RUN** — one applicable-wages base with an effective rate per
      component — so reaching a per-shift cost requires APPORTIONMENT.
      ⇒ **A per-shift labor cost is part actual and part apportioned, and pro-rata apportionment IS
      a standard rate applied to actual hours.** ADR-0019's "a rate variance cannot exist where
      there is no standard rate" fails on measurement, not on argument.
      **Run 759715: wages $2,323.50 + fees $461.23 = CFS cost $2,784.73, an effective 19.85% (ADR-0019/M2)** —
      statutory 18.36% plus a 1.49% platform fee. ⚠️ **3.15 points BELOW the 23% blended average**,
      so the dispersion between runs is real.
      ⚠️ **AND THE BURDEN IS CAPPED PER PERSON PER YEAR, so a flat factor is SYSTEMATICALLY wrong
      rather than imprecise.** FUTA (0.60%) stops at ~$7,000 and Illinois SUTA (7.05%, the largest
      component) at ~$13,600 — about 233 and 453 hours at $30/hr. ⚠️ **CORRECTED 2026-08-17: this
      read "leaving a ~4.51% uncapped floor of Medicare plus workers comp", and the floor is
      12.20%** (`ADR-0041/M1`). `4.51` is `1.45 + 3.06` — it omits the 1.49% platform fee (which ADR-0019 later
      established is uncapped) **and Social Security's 6.20%, which caps at the SSA wage base —
      thousands of hours at $30/hr, against the 233 and 453 above.** Only FUTA and SUTA switch off
      within a season: **7.65 points, not 13.85**. ADR-0019 carries the same defect at 6.00% / 13.85
      and is frozen, so it is HOT-018
      (`inbox/2026-08-17-adr-0019s-burden-cap-arithmetic-treats-social-security-as-capping-mid-season-and-it-does-not.md`).
      The direction is unchanged and the SIZE is roughly halved. A regular crew member crosses both inside a season, so a flat
      rate over-states late-year hours and under-states early-year ones, biasing early-season job
      margins against late-season ones with nothing in the numbers looking wrong.
      ⇒ **The apportionment needs a period-close true-up** — exactly SAP's confirm-at-plan,
      revalue-at-actual shape, which the survey found and ADR-0019 does not consider.
      ⚠️ **Two things the register settles incidentally.** `Job Title & Union / Local` reads
      "Production Staff / Non-Union", confirming the owner's statement in the data. And the fee
      summary carries `Contractor Wages` and `Loan-Out Wages` lines (both $0.00 this run), so
      Wrapbook CAN run contractors — **"the payment channel determines the classification" is not
      quite the rule**; the discriminator is `Worker Type` on the record, not the rail.
      ⚠️ **`Project` reads `CFS2` — the company, not a job.** Wrapbook says who worked, when and for
      how long, and NOT which order those hours served. **The causal job comes from CFS's shift
      records.** ADR-0019 assumes that half correctly and wrongly assumes CFS also owns the first.
      Evidence:
      `inbox/2026-08-17-oq-050-answered-wrapbook-itemises-wages-per-person-per-day-but-prices-burden-per-RUN-so-the-cost-rate-is-an-estimate.md`.
    notes: >-
      Opened 2026-08-17 by the ADR-0019 survey
      (`inbox/2026-08-17-survey-labor-costing-is-normal-costing-not-actual-the-crew-is-two-populations-with-two-true-costs-and-idle-time-splits-normal-from-abnormal.md`).
      ⚠️ **Sage Intacct states the criterion and it is not about rate policy**: _"If payroll captures
      labor cost by employee, project and task, you may be able to post ACTUAL labor cost against
      projects… For many customers where payroll is posted at a SUMMARY level, labor costing
      multiplies hours by a COST RATE. These are ESTIMATED labor costs; actual labor cost comes from
      Payroll."_ So whether ADR-0019 can honestly say "actual" turns on the EOR's reporting
      granularity, not on whether CFS knows its own rates.
      **Owner, 2026-08-17: CFS's own crew is a MIX of W-2 through an EOR and 1099 contractors.** The
      1099 half is settled either way — the contracted rate IS the cost, with no burden behind it.
      **This question is only about the W-2 half**, where the wage is not the cost.
      ✅ **NARROWED the same day.** Owner: CFS is non-union and **average payroll fringe is 23%,
      blended across Wrapbook employees** (the EOR; the 1099 half is paid direct by Zelle/ACH and
      carries none), so
      ⚠️ **AND IT BECAME THE WHOLE DECISION on 2026-08-17.** Owner: _"our cost is just the payment
      to wrapbook, theyre an eor the frings are theirs not mine"_ — the 23% is Wrapbook's PRICING,
      not a CFS burden, and CFS's cost is whatever the invoice says. **Itemised per person ⇒ the cost
      is an ACTUAL and ADR-0019's "a rate variance cannot exist" is CORRECT; aggregate ⇒ CFS must
      apportion and the claim is wrong.** A same-day note asserted the second reading as settled and
      was overstated — see
      `inbox/2026-08-17-correction-wrapbook-is-a-true-eor-so-cfs-cost-is-the-invoice-and-the-refutation-of-adr-0019-was-overstated.md`.
      What was a secondary detail about granularity now decides whether an ADR claim stands.
      the burden MAGNITUDE is no longer part of this question — the cost rate is wage × 1.23 and can
      be written down today. What remains is only whether that rate is an ACTUAL or an ESTIMATE, and
      "average" already answers half of it: applying one factor to every W-2 hour is a standard rate,
      so a small rate variance exists by construction. **The question is now how the true-up works,
      not whether one is needed.**
      ⚠️ **Both answers are workable and they build differently, which is why it is worth deciding
      before the stage is built rather than after.**
      · **Per-person reconciliation** ⇒ the burdened rate is an actual, ADR-0019's language is
        literally true, and 5801 is utilisation alone.
      · **Aggregate only** ⇒ the burdened rate is an ESTIMATE, and a period-close true-up is
        required — which is exactly SAP's shape (confirm at plan price, revalue at actual at close)
        and would give this repo a second, legitimate variance it has so far assumed away.
      ⚠️ **Unmeasurable from the books and from this repo.** `6600 Wages` is one undimensioned line
      ($172,261.35 (ADR-0019/M1) FY2025, `xero:2026-08-17`), every payroll-liability account is Archived, and the
      current system has no shift stage to compare against. **It is a question for the EOR**, not for
      the ledger — what their remittance report contains.
      ⚠️ It also sets the floor on the post-cutover gross margin, which is currently only bounded
      between 61% and 90.5% because nothing splits 6600 into crew and administrative wages. Same
      measurement, two uses.
  - id: OQ-051
    headline: "where the chat seam sits"
    question: >-
      Where is the seam between CFS and a chat system for comments and threads — CFS implements
      them, or they live in Matrix (or a comparable open-source company-chat system) and CFS holds
      only the link?
    owner: alex
    decide_by: 2027-03-31
    blocks: []
    status: open
    notes: >-
      Opened 2026-08-17 by OQ-049's answer. Owner: _"potentially integrating with matrix (or other
      open source slack type of company chat system) or thats separate hard to say where the best
      seam is"_ · _"probably user and/or domain tagging"_.
      **Three shapes, and the owner's own candidate is the third:**
      · **CFS implements threads**, as today — `threads` + `comments` are the thing itself;
      · **chat lives outside** and CFS stores a reference;
      · **tagging** — a message carries a person and/or a domain object (an order, a card) and the
        conversation lives outside entirely. This is the candidate the owner named.
      ⚠️ **The seam decides the migration, not the other way round.** If chat moves out, the 4,153
      thread records are a link table at most; if it stays in, they are the substance. `threads` and
      `comments` are `quarantine` in `migration/field-map.yaml` pending this.
      ⚠️ **Do not let the migration force the seam.** The tempting reasoning is "we have 4,153
      threads so we must implement threads" — but 44 comments across them says the corpus is almost
      entirely empty containers from event-card churn (api-cloudrun#227), which is an argument about
      data hygiene and not about architecture.
      ⚠️ **A tagging seam has a consequence worth pricing before choosing it**: a comment that lives
      outside cannot be part of a sealed period artifact (ADR-0017), so anything that needs an
      audit-durable narrative — a dispute, a credit note reason — cannot rely on it.
  - id: OQ-052
    headline: "the vehicle rate and its denominator"
    question: >-
      What vehicle rate absorbs into 5900, over what normal-capacity denominator — and where does an
      OVER-absorbed balance rest?
    owner: alex
    decide_by: 2027-01-31
    blocks: []
    status: open
    notes: >-
      Opened 2026-08-17 with `vehicle_cost_absorbed`, the posting rule ADR-0030 (vehicle cost into
      COGS) has needed since it was accepted. **The rule does not wait on this** — `amount:` is a
      dotted path, so the rate is applied in the run document upstream of the ledger, exactly as
      OQ-018's overtime premium is applied in the shift record. What waits is the number.
      **Three parts, and the third is the accounting-shaped one.**
      · **The rate.** Cost per computed mile. ADR-0030 puts the 2025 pool at
        **$21,844.77 (ADR-0030/M1) across 6400-6403** and says that figure is UNPINNED and **understated** — it
        omitted rented trucks, which now post direct to 5902 instead. It cannot be re-derived from
        this repo: `chart-of-accounts` mirrors into Firestore without balances and this repo does not
        call the Xero API.
      · **The normal-capacity denominator.** ADR-0030: _"a predetermined rate on a stated
        normal-capacity denominator (ASC 330-10-30-3)"_, and _"the denominator is a requirement, not
        a footnote"_ — because 5901 is utilisation **and** rate deviation together, and an
        unabsorbed account meaning "one of two things, we do not know which" is the plug the ADR
        warns about. Nothing states it anywhere today.
      · ⚠️ **The over-absorbed direction, which ADR-0030 does not address at all.** A predetermined
        rate applied to actual distance can exceed the pool. `vehicle_cost_absorbed` posts it
        `Dr 6409 / Cr 5901` — one under/over-applied account, which is what every reference uses and
        which mints nothing. **Prorating it across the jobs that absorbed it is the alternative**,
        and choosing between them is a where-does-it-post question, so **CLAUDE.md rule 8a applies:
        six references before a recommendation.** The rule carries the conventional treatment as the
        interim so the branch exists and is exercised
        (`a-period-that-over-absorbs-credits-5901`) rather than being a claim nobody took.
      ⚠️ **Two variances, calibrated differently, and the answer must keep them apart** (ADR-0030,
      owner 2026-08-16: _"we should record actuals from time to time if appropriate, there will be
      some variance"_). The BASE variance is computed distance against miles actually driven — a
      round trip is twice a one-way distance, a multi-stop run is LESS than the sum of its legs, and
      a van idling on set covers none. The RATE variance is assumed cost per mile against actual.
      **Periodic odometer and fuel sampling calibrates the RATE, not the base.**
      ⚠️ **The rate is VERSIONED, so a later answer supersedes rather than mutates** — two periods
      computed at different rates would disagree about the same job's margin, which is the failure
      ADR-0029 exists to prevent. It is deliberately NOT registered in
      `reporting/allocation-bases.yaml`: every field there (`base`, `zero_base`, `rounding`)
      describes spreading a pool proportionally over a base, and a rate applied to a quantity has
      none of them. ADR-0030 cites that file's discipline, not its registry.
  - id: OQ-053
    headline: "is CFS principal or agent on a PSA"
    question: >-
      On a production service agreement, is CFS the PRINCIPAL or the AGENT — who contracts the crew,
      whose insurance answers for them, and who bears the loss if the client's money does not arrive?
    owner: alex
    decide_by: 2027-01-31
    blocks: [HOT-017]
    status: answered
    notes: >-
      Opened 2026-08-17 by the PSA survey
      (`inbox/2026-08-17-survey-psa-is-a-principal-or-agent-question-and-the-live-books-answer-it-four-different-ways.md`),
      for erp-spec#35. **It is the question the whole PSA specification waits on**: principal means
      the client's budget is CFS revenue and the union payroll is CFS cost; agent means CFS reports
      only its fee and the budget is money held. Net income is identical; the top line and every
      margin computed from it are not.
      **ASC 606-10-55-37 decides it by CONTROL** — is CFS primarily responsible for fulfilling the
      promise — with the indicators at 55-39 being primary responsibility, inventory risk (not
      applicable to a service) and price discretion.
      ⚠️ **The indicators point at PRINCIPAL, which is the opposite of what the spec assumes.** Owner,
      2026-08-17: overseas productions use a PSA because they **will not stand up a US entity** and
      cannot hold union deals for a few days of filming — so the arrangement exists precisely because
      the client cannot be the employer. Against that, `charter.md` and erp-spec#35 both describe PSA
      as a pass-through, and the ledger survey called it "a pass-through, not a cost CFS bears".
      **Three facts settle it and none of them is in the books:**
      · who signs the crew's engagement — CFS, or the client with CFS administering;
      · whose workers' compensation and general liability answer for those people;
      · who bears the loss if the client's money does not arrive after the crew has been paid.
      ⚠️ **Do not read the live books as the answer.** Measured 2026-08-17, they say both: $69,650 +
      $25,070 billed GROSS to 4100 and 4120, and $7,000 through the 2800 liability — for the same
      customer, on the same shape of work.
      ✅ **One half needs no ruling**: money received before the work is performed is a liability
      under every reference, so `2800` is correct as a holding account whatever D1 decides. And PSA
      labor never enters the rental or delivery pools under either answer — it is its own product
      line.
    answer: >-
      **CFS is the PRINCIPAL** (owner, 2026-08-22 → `ADR-0044`). The three facts this OQ said were
      not in the books all point the same way: **CFS signs the crew engagement**, **CFS buys its own
      GL and inland marine** for the work, and **CFS pays the crew and then pursues the client**, who is
      obligated to repay — so CFS holds a receivable for the FULL BUDGET and bears the risk it
      proves uncollectible. ⭐ **That last fact reads like a hedge and is the evidence**: an agent
      never holds a receivable for the budget, only for its fee, and "difficult to collect" is
      credit risk realised rather than absent. ⚠️ **One indicator dissents and is recorded rather than reconciled away** — there is
      no price discretion, the crew cost passing through at cost plus a stated fee. It loses because
      ASC 606-10-55-39's indicators support the assessment of control rather than forming a
      checklist, and a cost-plus fee is a pricing structure rather than a statement about who is
      obligated.
      ⭐ **Answered by asking the FACTS rather than the classification.** It had been open since
      2026-08-17 phrased as "is CFS principal or agent" — a question that asks the owner to do the
      accounting. Re-asked as who signs, who insures, who eats the loss, it was answered in one
      sitting. **A question addressed to the wrong expertise looks like a question nobody has time
      for.**
      ⭐ **And it turned up something nobody asked about: PSA payroll runs through an EOR** (EP, Cast
      & Crew, Revolution). OQ-024 already settled that an EOR is a vendor that invoices, so the PSA
      cost path exists — erp-spec#35 needs the revenue side, not a payroll path.

  - id: OQ-054
    headline: "does the fleet policy admit sub-6,000 lb vehicles"
    question: >-
      As CFS acquires more vehicles, will any be rated at or below 6,000 lb gross vehicle weight,
      and will any be used less than exclusively for revenue-producing work? The first decides
      whether the §280F passenger-automobile caps bind; the second decides whether listed-property
      recapture can ever fire.
    owner: alex
    decide_by: 2026-11-15
    blocks: [SPIKE-005]
    status: open
    notes: >-
      Opened 2026-08-22 while building SPIKE-005's depreciation corpus, which found §280F named by
      **none** of the four artifacts enumerating that spike's scope (HOT-023).
      ⚠️ **ASKED AS A POLICY QUESTION, NOT A LOOKUP, AND THE FIRST FRAMING WAS WRONG.** It was
      opened as "are the two owned vans over 6,000 lb GVWR" — a one-off sticker check, on the
      reasoning that the population was two and therefore small. **The owner corrected the premise
      the same day: "we do expect to acquire more vehicles."** A static population of two is an
      argument for excluding §280F; a growing fleet is not. **The population that matters is the one
      the policy will produce, not the one on the lot today.**
      **What is settled**: today's two vehicles are used _exclusively_ for delivery and trash
      removal (owner, 2026-08-16), so recapture — which fires only when business use falls to 50% or
      less — has no live population **as long as that exclusivity holds for new vehicles too.** That
      is the second half of this question and it is a policy, not a measurement.
      ⚠️ **§280F is a CEILING ON THE COMBINED DEDUCTION, not a separate calculation.** Pub 946:
      _"The depreciation deduction, **including the section 179 deduction and special depreciation
      allowance**, you can claim for a passenger automobile each year is limited."_ ⇒ it caps the
      very number SPIKE-005's engine computes, which is why it belongs inside that spike rather than
      in one of its own, and why `DEP-011` now covers it regardless of how this question is answered.
      ⭐ **A SECOND-ORDER EFFECT WORTH KNOWING BEFORE THE NEXT PURCHASE.** A vehicle is a
      large-basis asset, so **a Q4 vehicle purchase is the single most likely trigger of the
      mid-quarter 40% test** — which retroactively changes the convention, and the first-year
      deduction, of every personal-property asset placed in service earlier that year (HOT-023).
      **A growing fleet makes that more likely, not less**, and the timing of a vehicle purchase is
      therefore a tax decision and not only a fleet one.
      Related: `1700 Vehicles`, ADR-0030 (vehicle cost into COGS), HOT-023, SPIKE-005, DEP-011.

  - id: OQ-055
    headline: "is advance funding required on a PSA"
    question: >-
      On a production service agreement, must the client fund before the crew is paid, or is
      advance funding merely usual? It is the primary mitigation for the credit exposure the
      principal treatment reveals, and the books do not show it happening.
    owner: alex
    decide_by: 2026-12-15
    blocks: []
    status: open
    notes: >-
      Opened 2026-08-22 by `ADR-0044`, which makes CFS the **principal** on a PSA — so the client's
      whole budget is revenue and **the maximum bad-debt exposure is the budget rather than the
      fee**. The owner's own framing is why this matters: _"they would be obligated to it, but were
      small and if theyre overseas it may be difficult to collect"_
      (`inbox/2026-08-22-owner-refines-the-psa-credit-risk-the-client-is-obligated-but-cfs-is-small-and-overseas-collection-is-hard.md`).
      ⭐ **If the client funds before the crew is paid, the exposure never opens.** Money received in
      advance of performance is a liability under every reference in the 2026-08-17 survey, sits in
      `2800 - PSA Liability Clearing`, and is relieved as the work is performed. ⇒ **advance funding
      stops being a cash-flow preference and becomes the control**, which is `2800`'s real job now
      that ADR-0044 has taken away `charter.md`'s reading of it as the mechanism by which the
      service is sold.
      ⚠️ **THE CORPUS CANNOT ANSWER THIS AND THAT IS ITSELF THE FINDING.** Only **$7,000.00** of
      PSA-shaped value ever passed through `2800` (`ADR-0044/M1`), against 93% billed gross with no
      holding step at all. **If advance funding is already the real policy, the books do not show
      it** — which means either the policy is not what is practised, or the practice is not what is
      recorded, and both are worth knowing before the migration carries the shape forward.
      **What answers it**: the PSA template or engagement letter, and whether crew have ever been
      paid ahead of client funds in practice. ⚠️ **Ask both** — a stated term nobody enforces and an
      enforced habit nobody wrote down are different problems with the same appearance.

  - id: OQ-056
    headline: "a jurisdiction override records no evidence"
    question: >-
      What remains after 2026-08-22's answers and corrections, and it is machinery rather than
      judgement, now that precedence is answered (invoice > order > org, and unexercised): how the
      permitted target set (Frankfort and Rantoul only) is expressed; what REASON an override
      carries, given the policy rests on an assertion of exclusive use that nothing records; and
      what the unstated default is for the 96.4% of destinations carrying no jurisdiction at all.
    owner: alex
    decide_by: 2026-12-15
    blocks: [SPIKE-008]
    status: open
    notes: >-
      ⚠️ **SUPERSEDED IN PART, 2026-08-22 — the tax model was rebuilt 2026-08-17 → 2026-08-22 and
      most of this was already decided in `api-cloudrun`/`core`.** The default is implemented
      (`resolveJurisdiction` = destination ?? org claim ?? `deriveJurisdiction(address, origin)`,
      never a hardcoded `chicago`); the `announced_at` field asked for **already exists as
      `Tax.effective_from`**, which prices nothing and makes the lag auditable; and the
      Frankfort/Rantoul restriction is **WRONG** — three narrower sets already exist for three
      stated reasons, and the owner's phrasing was the practice rather than the constraint.
      ⭐ **AND THE OWNER REFRAMED WHAT THE ITEM IS (2026-08-22): _"the reason in both cases is
      obvious, its just the evidence thats not."_** An exemption's reason is that the customer is
      exempt; an override's is exclusive use. ⇒ **an enum over one obvious value per case buys
      nothing.** What is missing is a durable, checkable artifact that the assertion was made.
      ⭐⭐ **DIRECTION CHANGED 2026-08-22 — the assertion becomes an ACTIVE PATH IN THE CLIENT APP**
      (owner): _"confirm exclusive use in x jurisdiction kind of thing, we'll need a surface to
      facilitate rental agreements anyway."_ **This is strictly better than the picker and it
      DISSOLVES the hardest problem rather than managing it**: a structured attestation contains
      exactly the data the purpose requires, so the verifiability-versus-minimisation conflict —
      raw MIME needed for DKIM, redaction impossible without breaking it — **simply does not
      arise.** No unrelated conversation, no crew lists riding along for seven years. It also moves
      the assertion to the right party: **the customer represents it themselves** rather than an
      operator recording a claim about them.
      ⭐ **The hash discipline transfers to the CLAUSE TEXT** — versioned and immutably snapshotted,
      because "they accepted v3" is worthless unless v3 is reproducible. ⚠️ **And the reordering is
      the real output: client-app attestation is the PRIMARY mechanism; the operator-recorded claim
      with attached correspondence is the FALLBACK** for phone orders and standing relationships
      that never touch the app. The picker is demoted from mechanism to exception — much smaller,
      far less permission-hungry.
      ⚠️ **Two things the spec must now decide that the picker never raised**: what happens when an
      honest representation turns out wrong (gear attested for Frankfort shoots in Chicago) — a
      dated attestation makes it *"as represented at T"* so a change of use is a NEW FACT rather
      than a contradiction, but the correction path must be stated; and **the client app gains a
      FOURTH capability** beyond the 2026-08-18 three, landing on contexts that have zero
      requirements between them.
      **Superseded direction — a Gmail evidence picker** — design input in
      `inbox/2026-08-22-design-input-the-gmail-evidence-picker-store-raw-mime-hash-it-verify-dkim-at-capture-and-keep-it-out-of-the-reaper.md`.
      Store **raw MIME rather than a PDF** (a rendering discards the headers that carry the
      verifiable facts) and render on demand; **hash at capture**; ⭐ **verify DKIM at capture and
      record the verdict**, because verification degrades as selectors rotate; **bind the evidence to
      the order, destination and jurisdiction value it justifies**; record **three dates** so an
      auditor can see whether the evidence predates the billing; **per-user OAuth, never
      domain-wide**. ⚠️ **And keep it out of Uploadcare** — `uploadcare-sweep` reaps unregistered
      reference sources weekly and its delta canary cannot see a source that was never counted; a
      **retention-locked GCS bucket** is the control that makes "we could not have altered it" a
      property rather than a promise.
      ⭐ **STORAGE: LINODE, NOT GCS** (2026-08-22). `ADR-0013` chose Linode for **"no platform
      lock-in"**, and a locked retention policy **IS** platform lock-in in the most literal sense —
      objects cannot be deleted, and cannot be moved either, because moving means copying and then
      deleting the source. **Locking seven years of evidence into GCS means paying GCP until 2033
      for a bucket that cannot be emptied, chosen mid-migration off GCP.** Linode Object Storage is
      S3-compatible and documents Object Lock plus versioning. ⚠️ **Confirm it exposes COMPLIANCE
      mode and not only GOVERNANCE before locking** — GOVERNANCE is bypassable by a principal with
      `s3:BypassGovernanceRetention`, making it a policy control rather than a physical one. The doc
      page is a JS shell and did not answer it; **do not infer it from S3 compatibility.**
      ⚠️ **PII — the lock and erasure collide, and redaction CANNOT resolve it.** A locked bucket
      means an erasure request cannot be honoured for seven years; tax retention is a lawful basis
      for refusing, **but only for what is NECESSARY**, and a whole thread of unrelated conversation
      is not. ⭐⭐ **And verifiability and minimisation are in direct conflict**: verification needs
      the message raw and unmodified, and **redacting anything breaks the DKIM signature and changes
      the hash**. ⇒ **minimisation cannot happen after capture — the only lever is choosing what to
      capture**, once, irreversibly. So: **default the picker to a single MESSAGE rather than the
      thread**; ⚠️ **decide attachments explicitly and probably exclude them by default**, because a
      production thread may carry crew lists — the payroll-adjacent data the workspace rule warns
      about — and that is the one part that could retain something genuinely sensitive for seven
      years without anyone choosing to. And **record the exception to "record structure and
      aggregates, never rows"** rather than drifting past it: the exception is justified because the
      artifact IS the evidence, but an unwritten reasoned exception becomes a precedent nobody
      intended.
      **Retention: 7 years** (owner, 2026-08-22), believed to match the audit limitation. ⚠️ **NOT
      VERIFIED** — amlegal 403s and the chicago.gov PDFs 404, so Chapter 3-4's limitations text was
      never read, and the commonly-cited IRS "7 years" is a records rule-of-thumb rather than a
      statutory limit. ⭐ **Both errors here are ONE-WAY** — too short loses the evidence, too long
