  - id: OQ-017
    question: >-
      Is an employee a distinct record, or a role attached to a person who may also be a customer
      contact?
    owner: alex
    decide_by: 2026-08-09
    blocks: [REQ-FUL, REQ-LED]
    status: answered
    answer: >-
      One person, many roles. A single party record per human carries role attachments (employee,
      organization contact); the same human is one record whether they are crew or a customer
      contact.
    notes: >-
      Raised by OQ-008 — many CFS crew are also contacts at customer organizations. The role model
      is also what gives wage data an access-control boundary: a wage attaches to the employee
      role, not to the customer-facing contact record. Supersedes the "extend contact with
      employee fields" option, which would have put payroll data on a record readable by people
      who should not see it.

  - id: OQ-018
    question: >-
      When a shift spans several jobs and crosses into overtime, which job absorbs the overtime
      premium?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: answered
    answer: >-
      **The overtime hour splits in two, and the halves are treated differently.** The BASE rate for
      every hour — overtime hours included — is direct labour, charged to the causal job actually
      worked. The **PREMIUM** is allocated **pro-rata by hours across the causal jobs of that day**.
      Owner, 2026-08-09, and it is the standard cost-accounting convention rather than a house rule:
      the premium is caused by the day's volume in aggregate, not by whichever job happened to be on
      the clock after hour eight
      (`inbox/2026-08-09-labour-premium-rules-survey.md`).
      **Pro-rata by HOURS, the same base as the direct half**, so one rule drives both halves of the
      hour and no second allocation basis has to be agreed.
      The convention's one exception is retained and narrowed: overtime **specifically requested by
      a customer** is charged direct to the order that asked, and — following OQ-004's treatment of
      `handling_bucket` — **an override must be recorded AS an override**, so costing can tell a
      stated exception from the default.
      **The allocation happens in the SHIFT RECORD, never in the posting rule.** `amount:` is a
      dotted path with no arithmetic (gate 10), so the rounding of a pro-rata share — and the
      residual cent when hours do not divide the premium evenly — is decided upstream where the
      money rules already apply. `ledger/vectors/shift_recorded/` carries a deliberately
      non-dividing case for exactly this reason.
    notes: >-
      OQ-008 gives the total from the PO/bill, but not its allocation. Chronological (the premium
      lands on whichever job the clock was on after hour 8) is simple but arbitrary — the same two
      jobs in the opposite order produce different COGS. Pro-rata across the shift's jobs is
      fairer but detaches the premium from the hours that actually caused it. This is precisely
      the "distributing OT" guesswork OQ-008 aims to remove, so it needs a stated rule.

  - id: OQ-019
    question: >-
      What defines a "consecutive day" for the 6th/7th-day 1.5x rule, and does it compound with
      the after-8-hours 1.5x?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: answered
    answer: >-
      **Six consecutive calendar days WORKED — a rolling count, not a payroll week.** Owner,
      2026-08-09: "it's really just whether you have worked six consecutive calendar days." That is
      the industry convention rather than the statutory one, and the two genuinely differ: Entertainment
      Partners defines a sixth day as "where a crew member works six days **in a row**", while the
      legal baseline Wrapbook implements for non-union work is workweek-relative — California's
      seventh-day rule triggers on the seventh consecutive day *within the employer-defined
      workweek*. CFS is **non-union**, so nothing forces the workweek reading, and consecutive-days-worked
      is both simpler and how crew actually experience it.
      **The 6th day is 1.5x for the whole day.** It does not compound with the after-eight-hours
      1.5x — an hour is premium once. A tenth hour on a sixth day is 1.5x, not 2.25x.
      ⚠️ **THE SEVENTH DAY IS NOT A RATE, IT IS A COMPLIANCE FAILURE.** Illinois **ODRISA**, amended
      effective 2023-01-01, requires **24 consecutive hours of rest in every consecutive seven-day
      period** — changed from "one day per calendar week" precisely to stop scheduling across a week
      boundary. Civil penalties to **$250 per offence, each seven-day period a separate offence**,
      with narrow exemptions (part-time ≤20 hrs/week, breakdown or emergency, seasonal agriculture).
      So a seventh consecutive day is generally unlawful here, and pricing it invites it. **The
      SCHEDULER refuses a seventh consecutive day, with an audited override**; the ledger does not.
      **The ledger RECORDS a seventh day if one happens** — see
      `ledger/vectors/shift_recorded/seventh-consecutive-day-is-recorded-not-refused`. Work that was
      performed is a cost that was incurred; refusing to post it would understate COGS and hide the
      breach in the one system that noticed it. Same reasoning as OQ-028's overpayment: a control
      belongs where the action is taken, not where the fact is recorded.
      Whether the ODRISA obligation sits with CFS or with the employer of record is a legal question
      and is deliberately not answered here.
    notes: >-
      Consecutive within what window — a fixed payroll week, or a rolling 7 days? The two give
      different answers for someone working Thursday through Wednesday. And if a person works ten
      hours on their sixth consecutive day, is that 1.5x throughout or 1.5x for eight hours and 2x
      for the last two? Both are defensible; only one can be implemented.

  - id: OQ-020
    question: >-
      Which context owns purchase orders — or is procurement a ninth bounded context?
    owner: alex
    decide_by: 2026-09-15
    blocks: [EVT-FA-001]
    status: answered
    answer: >-
      **Procurement is the ninth bounded context.** Owner, 2026-08-09. It owns the inbound document
      in all its forms — labour purchase orders, inventory purchase orders, and recurring bills —
      and the payables lifecycle those documents drive.
      **What made it worth the cost is the forecasting surface, which no existing context owns.** The
      procure-to-pay cycle has three stages and each answers a different question: a **PO** is
      committed-not-yet-incurred (spend forecast); an **accrual** is incurred-not-yet-invoiced
      (amount known, date unknown); an **invoice** is dated with terms (cashflow forecast). CFS's
      current system holds only the third, which is why "AP is underutilized today" — there is
      nowhere to record a commitment and nowhere to record work done but not yet billed.
      This also refines OQ-024's answer. `shift_recorded` credits Accounts Payable, but the EOR has
      not invoiced on the shift date — so the accurate credit leg is an **accrued labour liability**
      that the EOR's invoice later reclassifies into 2000. That is procurement's lifecycle, and it is
      why a wages liability has a purpose in v2 even though CFS has never had one.
      ⚠️ **This reopens m2.** Its exit criterion reads "All eight contexts have a context.md",
      `contexts_have_context_md` counts eight, and the context tables in `tools/validate.ts` and
      `tools/generate.ts` are hardcoded to eight. Accepting a ninth means editing a milestone that
      currently reads met. That is the honest cost and it is not a reason to place procurement
      arbitrarily in an existing context — which is the failure `contexts/ledger/events.yaml`
      explicitly refuses to make.
      The scaffolding — context directory, code, events, and the tooling's context tables — is WORK
      rather than decision, and is tracked as a GitHub issue.
    notes: >-
      Raised by OQ-008, which made purchase orders first-class in v2 with two use cases: the
      document labour scheduling generates and costs flow from, and inventory acquisition (retail
      stock, and fixed assets bought for rental or internal ops). None of the eight existing
      contexts owns procurement — ledger records the consequence, fixed-assets receives the asset,
      availability receives the stock, but nothing owns the inbound document. Placing PO events in
      one of them arbitrarily is the failure to avoid. A ninth context is the obvious answer and
      also the expensive one: m2's exit criterion names eight, so adding one reopens m2.

  - id: OQ-021
    question: >-
      Which postings must carry which dimensions — is `cost_type` a labour-only dimension, and may
      a revenue or COGS account be undimensioned at all?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED, HOT-011]
    status: answered
    answer: >-
      Revenue accounts carry a **product line**. `cost_type` is a **labour** dimension — its values
      are delivery / counter / warehouse — so it applies to 5800 Cost of Goods Sold: Wages
      (Absorbed) alone, and to no revenue account and no non-labour COGS account.
      REQ-LED-001's statement is amended to match; `ledger/dimensions.yaml` moves `cost_type` from
      `required_on: [cogs]` to `[labour_cogs]`; and the chart of accounts now states the obligation
      **per account** as an explicit `dimensions:` list rather than leaving it to be inferred from
      class. Resolves HOT-011.
    notes: >-
      Three statements disagree and all three are load-bearing. REQ-LED-001 says both dimensions on
      every revenue and COGS posting; `ledger/dimensions.yaml` says `product_line` on revenue and
      both on COGS; and the chart of accounts has accounts where even `product_line` has no
      defensible value. `ledger/chart-of-accounts.yaml` is written on the narrowest reading and
      leaves 8 accounts `dimensioned: undecided` pointing here — 4130 PSA Income, 4300 Discounts
      Received, 4400 Markup on Reimbursable Expenses, 5001 COGS Purchase Discounts, and the
      non-operating revenue block. Whichever way this goes, REQ-LED-001's statement or
      `dimensions.yaml`'s `required_on` has to be amended, because they cannot both stand. See
      HOT-011 for the evidence.

  - id: OQ-022
    question: >-
      Does `Other` survive as a `product_line` value, and what value do facility and professional
      service lines take instead?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: answered
    answer: >-
      **`Other` is deleted from the product_line value set** — 21 values become 20. The escape
      hatch for a one-off product or service that maps to no product line is an ACCOUNT, not a
      value: it is coded to **4800 Other Income**, which requires no dimension. Tax and liability
      postings — the bottled water tax among them — likewise carry no dimension, because 2200 and
      2210 require none.
      REQ-LED-001 is unaffected: a posting to an account whose `dimensions` list names
      `product_line` is still REJECTED if it lacks one.
      ⚠️ **Refined the same day by OQ-025**, which drew the line more precisely: what is refused is
      ABSENCE, not null. A declared `product_line: null` records that no tracked value applies and
      is recorded; a missing key means nobody decided and is refused. This answer's original
      closing sentence — "there is no null in a required field" — is superseded by that.
    notes: >-
      ADR-0020 deferred this to m3 explicitly and m3 cannot answer it — it is a taxonomy decision,
      not a finding. A non-nullable dimension makes `Other` the new null: the bucket that means
      "nobody chose" while looking like a choice. ADR-0020 names the exact population that needs a
      real value — Warehouse Rental, Office Rental, Indoor Parking, Location Scouting, Security,
      Safety & Security Assessment — all facility or professional services with no equipment
      category. Every other undimensioned line restates mechanically (Trash Removal and Walk Around
      Trash Sweep to `Trash & Cleanup`, Trucking to `Transport`, Contract Labor to `Crew`), so this
      residue is the whole of the judgement. Deciding it late means restating the restatement.
      —
      The reason the answer works where a bare null would not is ADR-0009's: a null that means "we could
      not categorise this" is indistinguishable from a null that means "this legitimately has no
      category", and once written the distinction is gone. Carrying the absence on the ACCOUNT
      keeps it visible — a line in 4800 asserts "this was not a categorised sale", which is a fact
      about the transaction, where a line in 4100 tagged `Other` asserts "this was a categorised
      sale" and then names no category, which is not.
      ⚠️ It leaves ADR-0020's restatement residue without a target — see OQ-025.
  - id: OQ-023
    question: >-
      What posts to `5400 Cost of Goods Sold: Job Costs` today, and does own-crew labour cost belong
      there rather than in a new 5800?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: answered
    answer: >-
      **5400 is a dead account.** It was a catchall for one-off project job costs. In v2 that
      population is captured by the specific COGS accounts instead — wages to 5800/5801,
      subcontractors to 5200, equipment rental to 5100 — so 5400 takes no new postings and its
      `disposition` is `drop`. It stays `Active` in the live chart, so its history still imports
      under ADR-0020.
      This also settles the duplication risk the question was asked about: 5800 does not compete
      with 5400 for the same money, because 5400 stops receiving any.
    notes: >-
      ADR-0019 moves own-crew cost out of 6600 Wages into "a dimensioned COGS account beside the
      existing 5200", and `ledger/chart-of-accounts.yaml` mints 5800 for it. But 5400 already exists,
      is Active, and its live description reads "costs related to the completion of a job that are
      NOT assets and NOT general expenses" — which is a description of job labour among other things.
      If crew cost already lands there, 5800 duplicates it and the migration has two accounts
      competing for the same money. **Not answerable from the CFS API**: the GL line detail is in
      Xero, and this repo may not reach Xero (single-tenant, live, shared daily quota). It needs
      someone to look at the Xero account activity directly.
      —
      Answered without needing that: the account is dead. The answer named the future taxonomy
      directly — "cogs: wages, cogs: subcontractors, cogs:
      equipment rental" — which is why 5800/5801 are named `Cost of Goods Sold: Wages (Absorbed)`
      and `(Unabsorbed)` in the live house style rather than the invented `COGS – ` form.
      A catchall sitting beside specific COGS accounts is where cost goes to avoid being
      classified, which is the failure the dimensioned COGS block exists to prevent.
  - id: OQ-024
    question: What is the CREDIT leg of a labour cost posting?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED, EVT-FUL-002]
    status: answered
    answer: >-
      **2000 Accounts Payable. The question's premise was wrong: there is no payroll liability to
      find, because CFS has never had one.**
      Measured on CFS's own balance sheet at 2025-12-31, on both bases — current liabilities are
      2000 Accounts Payable, the 2100 credit-card block, 2200 Sales Tax, 2600 Rounding and
      2801/2802 PSA. **No payroll liability of any kind, in any of four comparative years**, which
      is exactly consistent with all four payroll accounts (2160, 2170, 2180, 2190) being Archived
      in the live chart.
      That follows from the charter, which makes payroll processing a **non-goal**: an external
      **employer of record** stays, and CFS "does not calculate withholding, file payroll tax, or
      move payroll money". **An EOR is not payroll — it is a vendor that invoices.** So a labour
      cost posting is an ordinary vendor bill: Dr 5800 / 5801, Cr 2000.
      ADR-0019 already pointed here — "cost flows from the purchase order / bill that labour
      scheduling generates" — but called it an inference from account status. It is no longer an
      inference: a company that owed wages would show the liability, and this one shows none across
      four years of statements.
      Consequence worth stating: **CFS's ledger never carries gross-to-net.** Withholding, employer
      taxes and benefits are the EOR's ledger, and what reaches CFS is one invoiced amount. 6720
      Payroll Tax Expense stays in the chart for historical periods and takes no new posting.
      Evidence: `inbox/2026-08-09-labour-premium-rules-survey.md`,
      `inbox/2026-08-09-book-to-tax-difference-is-exactly-two-accounts.md`.
    notes: >-
      ADR-0019 names both debit legs — 5800 absorbed, 5801 unabsorbed — and no credit. Without one
      `shift_recorded` cannot balance even in principle, which makes this a third blocker on that
      rule alongside OQ-018 and OQ-019. The live chart offers no obvious target: every payroll
      liability (2160 Payroll Wages Payable, 2170, 2180, 2190) is **Archived** and proposed for drop
      as a charter non-goal, and 6600 Wages is an expense, not a liability
      (`api:2026-08-09:db_chart_of_accounts_query`). ADR-0019 says cost flows from the purchase
      order / bill that labour scheduling generates, which points at 2000 Accounts Payable — but
      that is an inference from account status, not a decision, and it interacts with OQ-020 since
      nothing yet owns purchase orders.

  - id: OQ-025
    question: >-
      With `Other` deleted, where does ADR-0020's restatement residue land — historical revenue
      lines that have no product line and no bucket to fall back on?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: answered
    answer: >-
      **`product_line: null`**, and they stay on 4100 Service Income. They do not map to a tracked
      product line, so null is the true statement about them — not a fallback, not a bucket, and
      explicitly not `undefined`.
      This settles the tension the question was asked about: reassigning them to 4800 Other Income
      would have moved money between P&L sections, which ADR-0020 forbids outright ("the
      restatement must not alter any amount"). Leaving them on 4100 with a declared null keeps the
      restatement to assigning a dimension, which is all ADR-0020 ever asked for.
      Generalised in ADR-0025: what REQ-LED-001 refuses is ABSENCE, not null. A missing key means
      nobody decided; a declared null is a decision.
    notes: >-
      OQ-022 deleted `Other` and made 4800 Other Income the escape hatch for NEW postings. History
      is the harder half. ADR-0020 restates every undimensioned line before import, and most of it
      is mechanical — Trash Removal and Walk Around Trash Sweep to `Trash & Cleanup`, Trucking to
      `Transport`, Contract Labor to `Crew`. The residue is one kind of thing: facility and
      professional services with no equipment category — Warehouse Rental, Office Rental, Indoor
      Parking, Location Scouting, Security, Safety & Security Assessment — sitting on 4100 Service
      Income, which requires a product line.
      Two options and they are not equivalent. Reassigning them to 4800 Other Income **moves money
      between P&L sections** and restates reported revenue mix, which ADR-0021 already flagged as a
      different kind of change from assigning a dimension. Minting a real product line for them
      (`Facilities & Professional Services`) leaves the accounts alone and changes only the
      dimension — but adds a 21st value that OQ-022 was trying to avoid needing.
      ADR-0020 asserts the restatement must not alter any amount; only the first option can.

  - id: OQ-026
    question: >-
      Is a supplier discount other income (4300) or a contra-COGS (5001), and which of the two
      accounts survives?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: open
    notes: >-
      `4300 Discounts Received` (Revenue) and `5001 Cost of Goods Sold: Purchase Discounts`
      (contra-Expense) record the same economic event on opposite sides of the P&L, and **both are
      Active today** — so the treatment is currently whichever account the operator picked.
      It changes reported **gross margin** without changing net income, which makes it a
      presentation decision for the owner and the CPA rather than a mechanical one. Both accounts
      carry `dimensions: undecided` until it is settled, because the dimension follows the answer:
      a discount recorded against COGS plausibly inherits the product line of the goods it
      discounts, where one recorded as other income has no customer product line at all.
      Split out of OQ-021, which settled the dimension rule but not this.

  - id: OQ-027
    question: >-
      Is the tax basis accrual or cash — and what else besides depreciation differs between the two
      books?
    owner: alex
    decide_by: 2026-09-15
    blocks: [ADR-0026]
    status: answered
    answer: >-
      **Accrual** — stated by the owner 2026-08-09 and independently visible in the statements: 1200
      Accounts Receivable (25,824.26) and 2000 Accounts Payable (30,240.04) appear **identically on
      both balance sheets**, and total liabilities agree to the cent. A cash-basis tax statement
      carries neither.
      **And nothing else differs except retail inventory.** Measured account by account across both
      2025 statements: 52 of 60 P&L lines are byte-identical, and the entire difference is
      **7000 Depreciation Expense** (63,553.48) plus **5000 COGS: Retail Inventory** (105.60),
      summing to the net-income difference of 63,659.08 with **zero residual**. On the balance sheet,
      accumulated depreciation (467,638.68) plus 1400 Retail Inventory (259.13) equals the total
      asset difference and the total equity difference exactly.
      The retail-inventory half is **not a basis difference at all** — the owner ruled it an error to
      be corrected (OQ-029). So **depreciation is the only legitimate difference between the books**,
      and ADR-0026's overlay derives from the fixed-asset register alone.
      **Permanent differences are in neither book**: meals, political expenditures and vehicle
      tickets are identical on both statements and are Schedule M-1 adjustments on the return. The
      ledger should carry no M-1 logic at all.
      Evidence: `inbox/2026-08-09-book-to-tax-difference-is-exactly-two-accounts.md`.
    notes: >-
      ADR-0026 fixes WHERE the tax book lives — derived at report time, never posted — but not what
      is in it. Depreciation and §179 are the differences the fixed-asset register can supply on its
      own. Two families it cannot:
      **Basis of accounting.** If CFS files on a cash basis, the tax balance sheet carries no
      Accounts Receivable and no Accounts Payable at all, and the overlay is then far larger than a
      per-asset schedule — it restates working capital. If it files accrual, depreciation may be the
      whole of it.
      **Permanent and timing differences on the P&L** — meals disallowance, accrued-but-unpaid
      items, prepaid timing. Each is small and each is a rule someone has to state.
      A question for the owner and the CPA, not one the repo can measure: the answer is in how the
      1065 has actually been filed. It does not block ADR-0026 (the mechanism is the same either
      way) but it decides how much the derivation has to do, and therefore whether the non-posting
      book stays cheap.

  - id: OQ-028
    question: >-
      Where does a customer overpayment land — money received that exceeds what the invoices it was
      sent for are owed?
    owner: alex
    decide_by: 2026-09-15
    blocks: [REQ-LED]
    status: answered
    answer: >-
      **2050 Customer Credit Balances** — the same account an unallocated credit note sits in,
      because it is the same fact: customer value CFS holds that is attached to no invoice. Decided
      by the owner 2026-08-09 on the four-suite survey
      (`inbox/2026-08-09-customer-credit-balances-across-four-suites.md`), which found that SAP,
      NetSuite, Sage Intacct and Odoo each give this value a liability and each use **one** such
      account rather than one per source.
      `settlement_recorded` therefore **records the remainder rather than refusing the session**.
      The mis-key argument for refusing — $15,000 keyed for $1,500 becomes a silent liability — was
      judged the weaker case: the money is in the bank either way, so refusing puts the ledger
      further from the bank rather than closer. **The client warns before recording a remainder**,
      and the warning is overridable because the fact is real and merely unusual.
    notes: >-
      Surfaced by writing `settlement_recorded`, whose control total requires a session's rows to sum
      to the money that arrived. If a customer pays more than the invoices in that session are owed,
      the remainder has nowhere to go and the whole entry is refused — so the deposit cannot be
      recorded at all until someone decides.
      **The current system has the same hole and hides it better**: every `settlements` row names an
      invoice (`uid_invoice` is required), so an overpayment is not representable and in practice
      gets over-applied to an invoice or left off the books. Xero models it as a first-class
      `Overpayment` object, which CFS does not mirror.
      Three candidates, and they are not equivalent. **2050 Customer Credits (Unallocated)** — the
      account minted for credit notes — states the same fact (value owed to a customer, not yet
      applied) and needs no new account, but merges two populations an operator may want to see
      apart. A **new customer-deposits liability** keeps them separate at the cost of another
      account. **2500 Suspense** is the wrong answer that will be reached for by default; its own
      disposition is already `undecided` pending SPIKE-004.
      Not a blocker on `settlement_recorded`: refusing is a defensible rule and matches today's
      model. It is a gap in what the system can record, which is why it is a question and not a bug.

  - id: OQ-029
    question: >-
      Why do the two books cost retail inventory differently, and which basis does v2 carry as the
      GL number?
    owner: alex
    decide_by: 2026-09-15
    blocks: [ADR-0026]
    status: answered
    answer: >-
      **They should not differ — the divergence is an error in the current books, and v2 carries one
      retail-inventory cost on both bases** (owner, 2026-08-09: "retail costing should be the same
      between them, that outage is a mistake we will correct").
      So **ADR-0026's overlay has ONE source**, the fixed-asset register, and depreciation is the
      only legitimate book difference. The question's premise — that this was a costing-basis choice
      — does not hold.
      Consequence for m6: **the migration must not carry the divergence across.** Whether the prior
      years are corrected in the existing books or the difference is simply not imported is an
      accounting call for the owner and the CPA, not a spec decision.
      ⚠️ Worth keeping from the measurement: the defect was **invisible until the two statements were
      diffed line by line** — 0.6% of the balance, growing across three years, flagged by nothing. A
      tax book produced from one ledger by a stated derivation cannot drift this way silently,
      because a difference in an account the derivation does not name is a difference nobody
      authored. That is an argument FOR ADR-0026 which the ADR did not have, and it comes from the
      defect rather than the design.
      Evidence: `inbox/2026-08-09-retail-inventory-book-difference-is-an-error.md`.
    notes: >-
      Measured 2026-08-09 across both 2025 statements: after depreciation, the **only** other
      book-to-tax difference is retail inventory. 5000 Cost of Goods Sold: Retail Inventory is
      36,985.62 on the tax basis against 36,880.02 on GAAP for 2025, and 1400 Retail Inventory is
      43,392.63 against 43,651.76 — a cumulative 259.13, which is exactly the fold of the annual COGS
      differences (0.66 + 152.87 + 105.60).
      Immaterial today at 0.6% of the balance, and **growing**: 0.66 in 2023, 152.87 in 2024, 105.60
      in 2025.
      It matters structurally rather than numerically. ADR-0026 derives the tax book from the
      fixed-asset register; this difference is not the register, so the overlay has a **second
      source** and the ADR cannot describe it as a fixed-asset feature. Before that can be specified,
      someone has to say what the difference IS — a costing-method difference, a §263A adjustment, a
      write-down treated differently, or an artifact of how the tax package computes inventory.
      Not answerable from the repo or the CFS API: the GL line detail is in Xero and the tax figure
      comes from the tax package. A question for the owner and the CPA.
      Evidence: `inbox/2026-08-09-book-to-tax-difference-is-exactly-two-accounts.md`.

  - id: OQ-030
    question: >-
      Does CFS introduce a forced-call (short-turnaround) premium, and if so what is the turnaround
      threshold and does the penalty behave as hours or as a flat amount?
    owner: alex
    decide_by: 2026-10-15
    blocks: [REQ-LED]
    status: open
    notes: >-
      Raised by the owner 2026-08-09 while settling OQ-019 — "I may be interested in introducing
      forced calls." Held separate from OQ-019 deliberately: a forced call is a different mechanism
      from a consecutive-day premium and it interacts with a different constraint.
      A **forced call** is a short turnaround — a crew member called back with less than the agreed
      rest between wrap and the next call. Union thresholds are **12 hours** (SAG-AFTRA, sometimes
      11) and **10 hours** (FIST). **Non-union has no statutory turnaround rule at all**, so any CFS
      threshold is policy rather than compliance.
      **The two penalty SHAPES are not equivalent, and this is the decision.** SAG-AFTRA pays a
      **flat amount per violation** (day performer: the lesser of daily rate or $900). FIST treats
      the shortfall as **overtime HOURS**. Only the second flows through the machinery that already
      exists — it becomes premium hours, allocated by OQ-018's pro-rata rule, absorbed into 5800
      like any other premium. A flat penalty is a new kind of cost that belongs to no causal job and
      would need its own account and its own allocation answer.
      ⚠️ **Distinct from ODRISA and not a substitute for it.** A 10-hour turnaround and a
      24-consecutive-hour weekly rest are different constraints; satisfying one says nothing about
      the other. See OQ-019.
      Not urgent — nothing depends on it, and `shift_recorded` is specified without it. It becomes
      real the day a turnaround policy is stated.
      Evidence: `inbox/2026-08-09-labour-premium-rules-survey.md`.

  - id: OQ-031
    question: >-
      Do `Crew` and `Trash & Cleanup` revenue and cost spread across the goods on the order, the way
      `Delivery` does — or are they severable services that keep their own margin?
    owner: alex
    decide_by: 2026-10-15
    blocks: [ADR-0031]
    status: open
    notes: >-
      ADR-0029's argument for spreading `Delivery` is **severability**, in the owner's words: "we
      wouldn't do a delivery with no products, we would rent far fewer products if we weren't
      delivering them." Delivery cost is therefore a JOINT cost of the product revenue, and leaving
      it on its own line reports a loss that is an artefact of the grouping.
      That argument does not obviously transfer. Crew hired out to a customer, and a cleanup
      performed after a wrap, may each be a service that stands on its own margin — in which case
      spreading them would move a real profit or loss onto goods that did not cause it, which is the
      same error in the opposite direction.
      ⚠️ **The "both are small" premise is RETRACTED for `Trash & Cleanup`, by roughly 83x.** It was
      measured off the invoice-line denorm at 2 lines / $1,750.00. Measured at the product master
      instead
      (`inbox/2026-08-09-untracked-revenue-is-mostly-a-denorm-failure-not-an-undecided-dimension.md`),
      `Trash Removal` (40 lines, $111,175.00) and `Walk Around Trash Sweep` (28 lines, $32,050.00)
      both carry `Trash & Cleanup` and neither ever reached a line. True size: **70 lines,
      $144,975.00 — 8.6% of revenue, the THIRD-LARGEST product line**, behind `Delivery` and
      `Walkies & Hotspots` and ahead of `Wardrobe`.
      So this is one of the larger decisions in the reporting spec, not a tidy-up. `Crew` really is
      small (7 lines / $2,625.00) and is still worth answering with it, because the two share a
      criterion — but the two must no longer be reasoned about as a pair of rounding errors.
      They stay `blocked` in `reporting/product-line-pl.yaml` rather than quietly following
      `Delivery`, which was the right call for a better reason than the one originally given.
      Depends on api-cloudrun#473: until the denorm is fixed the pool cannot actually be assembled,
      whatever this decides.
      Answer them together. Both are "a service a person performs, sold to the customer", and
      splitting the answer would leave the pair inconsistent for no reason.
      ⚠️ The answer is a **criterion**, not two verdicts — the next activity line to appear will ask
      the same question, and `Transport` shows a value can sit unused for years and then matter.

  - id: OQ-034
    question: >-
      Is `Transport` restored as a product line, now that the measurement it was dropped on turns
      out to have read the wrong field?
    owner: alex
    decide_by: 2026-10-15
    blocks: [ADR-0020, ADR-0031]
    status: open
    notes: >-
      `ledger/dimensions.yaml` dropped `Transport` on 2026-08-09 because
      `inbox/2026-08-09-product-line-by-revenue-account-matrix.md` measured **zero lines and zero
