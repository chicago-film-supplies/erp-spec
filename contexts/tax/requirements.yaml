# Requirements for TAX. Nothing lands here directly — everything is promoted from inbox/.
#
# Required per requirement: id, statement, rationale, source, priority, verification_method, status.
# verification_method: inspection | analysis | demonstration | test
# priority: must | should | could
# status: draft | agreed | superseded
#
# ── Mined from ADR-0026 (accepted). See contexts/fulfillment/requirements.yaml for the note on how
# an ADR's obligations are mined. Two came from the Decision (001, 002) and three from the
# Consequences (003, 004, 005).

requirements:
  - id: REQ-TAX-001
    statement: >-
      No tax-basis value shall ever be posted to the general ledger, and an account that exists only
      for the tax basis shall never carry a ledger transfer.
    rationale: >-
      ADR-0026: the ledger holds one book and it is GAAP. Every posting rule therefore states one
      set of postings, and they are the GAAP set.
      **All four mature fixed-asset systems default the tax book to non-posting** — SAP's posting
      indicator 0 ("area does not post any values to FI") is a first-class setting, NetSuite states
      alternate methods "are not linked to NetSuite journal postings", and Sage Fixed Assets updates
      the GL from one default posting book and warns that changing it double-posts.
      7001 Section 179 Depreciation Expense is the worked case: it stays in the chart and will never
      carry a transfer, because a §179 election is exactly a tax-basis-only expense.
      ⚠️ A partial second book inside one ledger is not available and the reason is structural: a
      disposal relieves cost against a different accumulated depreciation and a different gain per
      basis, so the credit to the asset account cannot be shared. It is all postings or none.
    source: adr/ADR-0026-tax-basis-is-a-non-posting-derived-book.md
    priority: must
    verification_method: test
    status: draft
    relates_to: [ADR-0007, ADR-0018]

  - id: REQ-TAX-002
    statement: >-
      The tax basis shall be derived at report time from exactly one source — the fixed-asset
      register's per-asset tax schedule — and depreciation shall be the only account in which the two
      bases are permitted to differ; a difference anywhere else shall be reported as a defect rather
      than absorbed as a difference in basis.
    rationale: >-
      ADR-0026 states the derivation as a scope: the tax basis reads GL postings, less their GAAP
      fixed-asset entries, plus the register's tax-basis entries.
      **Measured 2026-08-09 against CFS's real 2025 statements, and it holds exactly**: the two
      bases differ in **two accounts and nothing else** — 7000 Depreciation Expense (63,553.48) and
      5000 COGS Retail Inventory (105.60) — summing to the net-income difference of 63,659.08 with
      **zero residual**, and 52 of 60 P&L lines byte-identical. Total liabilities agree to the cent.
      ⚠️ **The second account was a DEFECT, and that is the argument for this requirement.** The
      retail-inventory divergence was invisible until the two statements were diffed line by line —
      0.6% of the balance, growing across three years, flagged by nothing. Two independently
      maintained sets of statements can drift in any account without either looking wrong. A basis
      derived by a stated rule cannot: a difference in an account the derivation does not name is a
      difference nobody authored, and it has nowhere to hide (OQ-029). The owner ruled that one an
      error to correct, not a difference in basis.
    source: adr/ADR-0026-tax-basis-is-a-non-posting-derived-book.md
    priority: must
    verification_method: test
    status: draft
    relates_to: [ADR-0017, OQ-029]

  - id: REQ-TAX-003
    statement: >-
      The tax-basis derivation shall be deterministic, shall live in exactly one place, and shall be
      covered by input-to-expected-output vectors including rejection cases.
    rationale: >-
      ADR-0026 names this as the real cost of the decision: **the tax basis has no double-entry
      enforcement.** TigerBeetle guarantees the GAAP book and nothing else, so the tax basis rests
      entirely on its derivation being deterministic and on the per-asset audit trail ADR-0007
      already requires.
      That is why the derivation belongs in one place with vectors over it rather than in a report
      template — a rule expressed in a template is re-expressed in every template, and the copies
      drift. The GAAP side already works this way, and the golden vectors in `ledger/vectors/` are
      the precedent: they are the entire enforcement of REQ-LED-001, not decoration.
      ⚠️ One place is necessary and not sufficient. A location ratchet needs a value assertion beside
      it — the money `_str` mirror was rendered in exactly one file, and that one file was wrong in
      both environments until 2026-08-08.
    source: adr/ADR-0026-tax-basis-is-a-non-posting-derived-book.md
    priority: must
    verification_method: test
    status: draft
    relates_to: [ADR-0007, REQ-LED-001]

  - id: REQ-TAX-004
    statement: >-
      A closed period shall seal both bases in one artifact, hashed as a unit, so that a tax-basis
      statement for a closed period cannot drift.
    rationale: >-
      ADR-0026: the sealed artifact for a closed period carries the tax-basis entries alongside the
      GAAP postings and is hashed as one artifact (ADR-0017).
      **Sealing them separately would defeat the point.** The tax basis has no double-entry
      enforcement of its own (REQ-TAX-003), so a separately-sealed tax statement could be
      regenerated against a changed derivation and nothing would notice. One artifact and one hash
      means a tax-basis figure for a closed period is exactly as immutable as the GAAP figure beside
      it.
    source: adr/ADR-0026-tax-basis-is-a-non-posting-derived-book.md
    priority: must
    verification_method: test
    status: draft
    relates_to: [ADR-0017]

  - id: REQ-TAX-005
    statement: >-
      Permanent differences between accounting income and taxable income shall belong to neither
      basis, and no return-reconciliation logic shall be built into the ledger or into the derivation.
    rationale: >-
      ADR-0026, and it is the consequence most likely to be "helpfully" violated. Meals (17,777.88),
      political expenditures (1,250.00) and vehicle tickets (3,635.88) are **identical on both 2025
      statements** despite being nondeductible or half-deductible. They are Schedule M-1 adjustments
      **on the return**, downstream of both sets of statements.
      Form 1065 models it the same way: one balance sheet (Schedule L) plus M-1/M-2 reconciling book
      to tax. The reconciliation is the deliverable, not a third book.
      ⚠️ A system that tried to build these in would be doing the CPA's job with worse information —
      deductibility depends on facts the ledger does not hold, and encoding half of the rule produces
      a number that is neither basis and cannot be reconciled to either.
    source: adr/ADR-0026-tax-basis-is-a-non-posting-derived-book.md
    priority: must
    verification_method: analysis
    status: draft
    relates_to: []

  - id: REQ-TAX-006
    statement: >-
      The system shall resolve a line's tax jurisdiction as a registration answer: no obligation
      where the destination is outside every jurisdiction CFS is registered in; the destination's own
      jurisdiction where CFS is registered there; and otherwise the jurisdiction of the selling
      location.
    rationale: >-
      ADR-0045 P7, ruled by the owner 2026-08-23. ⭐ **The framing is the requirement.** An earlier
      draft called the third arm "a fallback for the case where CFS does not know where the gear is
      used", and that is wrong twice: a customer collection is a **determination** — the buyer's
      location is the seller's counter — and the answer asserts only that CFS is **registered**
      there, never that the property is used there.
      ⚠️ **Stated as a rule rather than as a list of places**, because the places change. Naming
      Chicago in the requirement would hardcode the current warehouse; the selling location's own
      jurisdiction moves with it.
    source: adr/ADR-0045-a-stored-jurisdiction-records-who-asserted-it.md
    priority: must
    verification_method: test
    status: draft
    relates_to: [REQ-TAX-007, REQ-TAX-008]

  - id: REQ-TAX-007
    statement: >-
      The system shall permit a customer's attested statement of intended use to override the
      resolved jurisdiction, and shall restrict the override to a jurisdiction CFS is registered in
      or to the explicit no-obligation answer.
    rationale: >-
      ADR-0045 D3 and P7. The override is not an exception carved out of a known fact — ⭐ **it is
      the only case where the place of use is actually KNOWN**, because the customer asserted it.
      The derivation covers the unknown.
      ⚠️ **The permitted set is the registration set, not a named list.** A list goes stale the day
      CFS registers somewhere new or retires a registration, which has already happened once —
      Paxton was a one-off and is retired (HOT-024).
    source: adr/ADR-0045-a-stored-jurisdiction-records-who-asserted-it.md
    priority: must
    verification_method: test
    status: draft
    relates_to: [REQ-TAX-006, REQ-TAX-008, REQ-TAX-009]

  - id: REQ-TAX-008
    statement: >-
      An organization-level or project-level jurisdiction shall initialize a newly created order or
      invoice and shall have no other effect. A document's own stored jurisdiction shall be the only
      value the rule consults, and its absence shall mean the value was derived.
    rationale: >-
      ADR-0045 D3, ruled by the owner 2026-08-23: *"the org and/or project level just inits created
      orders and invoices with the override it doesnt do anything else."*
      ⭐⭐ **This is what makes a derived answer distinguishable from an asserted one with no extra
      field.** With a live inheritance rung, an absent value means "ask the next rung" and an order
      whose use was affirmatively determined is indistinguishable from one where nobody looked. With
      initialization only, absent means **derived**, unambiguously.
      ⚠️ **And it protects a billed document**: a change to a customer's standing position cannot
      restate an order that was already priced. **The cost is stated rather than hidden** — that
      correction reaches no existing document, and each must be re-opened.
    source: adr/ADR-0045-a-stored-jurisdiction-records-who-asserted-it.md
    priority: must
    verification_method: test
    status: draft
    relates_to: [REQ-TAX-006, REQ-TAX-007]

  - id: REQ-TAX-009
    statement: >-
      An override shall record who asserted it and the level of the customer tree their authority
      reached. The system shall not record which rung of the precedence supplied the value.
    rationale: >-
      ADR-0045 D1, P5, P6. ⚠️ **The negative half is load-bearing.** The rung is a total function of
      fields the document already stores, so a stored copy can only agree with the rule or be wrong
      — and it answers the wrong question anyway: a migration script and an operator both produce a
      document-level value. Prod orders 895 and 902 are that case, and are recorded as *"ordinary
      level-1 overrides indistinguishable from an operator's"*.
      ⭐ **Authority is the fact a derivation cannot reproduce.** A coordinator holds project access
      and not organization access, and at a large customer no contact holds organization access at
      all — so an organization-level value is in practice CFS's own default while a project-level
      one is the customer's representation. **They differ in who COULD have asserted, not only in
      specificity.**
    source: adr/ADR-0045-a-stored-jurisdiction-records-who-asserted-it.md
    priority: must
    verification_method: analysis
    status: draft
    relates_to: [REQ-TAX-007, REQ-TAX-010]

  - id: REQ-TAX-010
    statement: >-
      A correction to a jurisdiction shall be a new assertion at the order or invoice level using the
      same override, and shall be refused once the document carries a payment.
    rationale: >-
      ADR-0045 D4, ruled by the owner 2026-08-23. ⭐ **No separate correction mechanism** — a later,
      more specific statement supersedes a standing one, which is the precedence already ruled on.
      ⭐⭐ **The payment boundary is what reconciles this with ADR-0020's "a restatement must not
      alter any amount."** Unpaid, a correction is an ordinary edit and the amount may move; paid,
      the document is closed and a credit note is the only route.
      ⚠️ **The v1 system enforces neither half** — the payment guard is intended and not installed
      (owner, 2026-08-23; api-cloudrun#648), and the invoice write path carries no jurisdiction input
      (api-cloudrun#630). **The ordering matters: the guard before the input**, or an editable
      jurisdiction on a paid invoice would move a billed amount.
    source: adr/ADR-0045-a-stored-jurisdiction-records-who-asserted-it.md
    priority: must
    verification_method: test
    status: draft
    relates_to: [REQ-TAX-009]

  - id: REQ-TAX-011
    statement: >-
      A line for an item CFS itself consumes shall resolve to the jurisdiction of the CFS location
      that supplied it, and no customer assertion shall reach such a line.
    rationale: >-
      ADR-0045 D5, ruled by the owner 2026-08-23: *"replacements are used by cfs (not the customer,
      the customer is just paying for them) cfs is the end user."*
      ⭐ **This closes a question rather than opening one.** That a customer's override does not reach
      a replacement line looked like a gap and is correct behaviour: an attestation about where the
      **customer** will use gear says nothing about a part **CFS** consumed.
      ⚠️ **Stated as "the CFS location that supplied it" rather than "the default location"**, because
      the owner's rule has two halves and the second is the one v1 cannot honour — three of four write
      paths resolve the default regardless of the document's own store (api-cloudrun#630).
    source: adr/ADR-0045-a-stored-jurisdiction-records-who-asserted-it.md
    priority: must
    verification_method: test
    status: draft
    relates_to: [REQ-TAX-006]
