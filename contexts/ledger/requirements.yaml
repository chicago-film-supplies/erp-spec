# Requirements for LED. Nothing lands here directly — everything is promoted from inbox/.
#
# Required per requirement: id, statement, rationale, source, priority, verification_method, status.
# verification_method: inspection | analysis | demonstration | test
# priority: must | should | could
# status: draft | agreed | superseded

requirements:
  - id: REQ-LED-001
    statement: >-
      Every posting to an account whose chart entry names a required dimension shall DECLARE that
      dimension — either a value drawn from the dimension's declared set, or an explicit null
      recording that no tracked value applies — and a posting that does not declare it shall be
      rejected rather than recorded.
    rationale: >-
      A dimension that may be absent will be absent. Measured 2026-08-08 on the current system:
      28.7% of line revenue ($485,821.72 of $1,689,895.68) carries no product line, concentrated
      in service lines at 71.9%. The dimension was optional and that is the entire cause.
      Amended 2026-08-09 per ADR-0025. The previous wording — "every revenue and COGS posting
      shall carry both a product line and a cost type" — named the two dimensions directly and was
      wrong in both directions: `cost_type` describes labour, so no value of it is true of a rental
      revenue posting, while several revenue accounts arise from no sale and carry no product line
      either. Naming the obligation on the ACCOUNT keeps the rule enforceable without weakening it,
      and the escape hatch for an uncategorisable line is 4800 Other Income.
      Amended again the same day per OQ-025: what is refused is ABSENCE, not null. The measured
      failure was postings where nobody decided and the field was quietly left empty — an explicit
      null is a decision, and a countable, reportable one. An empty string is refused alongside
      absence, because it passes a naive NOT NULL check while meaning nothing.
    source: inbox/2026-08-08-untracked-revenue-share.md
    priority: must
    verification_method: test
    status: draft
    relates_to: [ADR-0009, ADR-0018, ADR-0025, HOT-006, HOT-011]
