# Requirements for LED. Nothing lands here directly — everything is promoted from inbox/.
#
# Required per requirement: id, statement, rationale, source, priority, verification_method, status.
# verification_method: inspection | analysis | demonstration | test
# priority: must | should | could
# status: draft | agreed | superseded

requirements:
  - id: REQ-LED-001
    statement: >-
      Every posting to an account whose chart entry names a required dimension shall DECLARE that
      dimension — either a value drawn from the dimension's declared set, or an explicit null
      recording that no tracked value applies — and a posting that does not declare it shall be
      rejected rather than recorded.
    rationale: >-
      A dimension that may be absent will be absent, and the current system is the demonstration:
      the dimension was optional and untracked line revenue reached **28.8%**.
      **The rule is justified by the absence/null distinction, not by the size of that number** —
      which is fortunate, because the number turned out to be measuring something else. See the
      measurement history below; it is kept because the way it went wrong is itself the argument for
      how this requirement must be verified.
      Amended 2026-08-09 per ADR-0025. The previous wording — "every revenue and COGS posting
      shall carry both a product line and a cost type" — named the two dimensions directly and was
      wrong in both directions: `cost_type` describes labour, so no value of it is true of a rental
      revenue posting, while several revenue accounts arise from no sale and carry no product line
      either. Naming the obligation on the ACCOUNT keeps the rule enforceable without weakening it,
      and the escape hatch for an uncategorisable line is 4800 Other Income.
      Amended again the same day per OQ-025: what is refused is ABSENCE, not null. An explicit null
      is a decision, and a countable, reportable one. An empty string is refused alongside absence,
      because it passes a naive NOT NULL check while meaning nothing.
      ⚠️ **MEASUREMENT HISTORY — the headline moved by a factor of ~700 and the cause changed
      category.** Three passes, each superseding the last, all on the same corpus:
      (1) 2026-08-08 — 28.7% of line revenue carries no product line. Read as operators declining to
      classify. (2) 2026-08-09 — decomposed by ACCOUNT into 2.8% dimensionless / 22.1% service-null /
      4.0% real defect. Still read off the invoice line. (3) **2026-08-10 — joined to the PRODUCT
      MASTER, which nothing before had done**
      (`inbox/2026-08-10-the-untracked-revenue-denorm-is-repaired-and-28-7-percent-is-now-15-percent.md`,
      api-cloudrun#473). Of the $486,516.99 untracked, **227 lines / $252,161.36 were a derivation
      that never ran** — the product WAS categorised — 128 lines / $233,667.63 were custom lines with
      no product master to inherit from, and **35 lines / $688.00 was the whole of "nobody
      decided": 0.041% of all line revenue** (0.141% of the untracked population — cite the base,
      the two are not interchangeable and the source note contrasts the second against a
      share-of-total).
      The defect was **PROPAGATION, not an undecided operator**, and it is now repaired: untracked
      line revenue is **15.00%** ($253,306.59 of $1,688,980.87), all of it custom lines and
      genuinely uncategorised products.
      **What this requires of verification, and it is the point:** a rule refusing an absent
      dimension is fully satisfied by a system that reliably copies the product's category — so this
      requirement would not have caught the defect its own headline number described. `analysis`
      against a derived field measures the derivation. **The verifying measurement must read the
      product master, which is the authority, not the line denorm, which is a copy.**
    source: inbox/2026-08-10-the-untracked-revenue-denorm-is-repaired-and-28-7-percent-is-now-15-percent.md
    priority: must
    verification_method: test
    status: draft
    relates_to: [ADR-0009, ADR-0018, ADR-0025, HOT-006, HOT-011]
