# Domain events for LED.
# Every event needs a producer and at least one consumer, or `terminal: true`.
#
# ✅ PURCHASE ORDERS NOW HAVE A CONTEXT. This header used to record a deliberate gap: POs were
# first-class in v2 (OQ-008) and none of the eight contexts owned them, so placing their events in
# any of them would have been arbitrary and they were left absent pending OQ-020.
# OQ-020 answered it — **procurement is the ninth bounded context** — and the events live in
# `contexts/procurement/events.yaml` as EVT-PRO-001..003, the three stages of the procure-to-pay
# cycle. m2's exit criterion was edited from eight to nine, which the decision named as its cost.
# What the ledger still owes them: EVT-PRO-002 and EVT-PRO-003 are in `unwritten` (erp-spec#14),
# and the accrued-expense account they need is not in the chart. `shift_recorded` and
# `asset_acquired` credit 2000 Accounts Payable today and should credit that accrual once it exists.

events:
  - id: EVT-LED-001
    name: JournalEntryPosted
    description: >-
      A balanced set of debits and credits was durably recorded, carrying one accounting date, one
      source document and one posting rule.
    producer: ledger
    consumers: [banking]
    terminal: false
    carries: [journal_entry_id, accounting_date, posting_timestamp, source_document_ref]

  - id: EVT-LED-002
    name: PeriodClosed
    description: >-
      An accounting period was frozen. No further posting may take an accounting date inside it.
      The close record carries the hash of the period's Parquet artifact.
    producer: ledger
    consumers: [fixed-assets, billing, tax]
    terminal: false
    carries: [period, closed_at, parquet_sha256]
