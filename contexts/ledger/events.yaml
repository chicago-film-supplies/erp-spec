# Domain events for LED.
# Every event needs a producer and at least one consumer, or `terminal: true`.
#
# ⚠️ PURCHASE ORDERS HAVE NO CONTEXT. OQ-008 made POs first-class in v2 with two use cases —
# the document labour scheduling generates and costs flow from, and inventory acquisition (retail
# stock, and fixed assets for rental or internal ops). None of the eight contexts owns procurement:
# ledger records the consequence, fixed-assets receives the asset, availability receives the stock,
# but nothing owns the inbound document. Placing PO events in any of them would be arbitrary, so
# they are deliberately absent pending OQ-020. Note a ninth context would change m2's exit criterion,
# which names eight.

events:
  - id: EVT-LED-001
    name: JournalEntryPosted
    description: >-
      A balanced set of debits and credits was durably recorded, carrying one accounting date, one
      source document and one posting rule.
    producer: ledger
    consumers: [banking]
    terminal: false
    carries: [journal_entry_id, accounting_date, posting_timestamp, source_document_ref]

  - id: EVT-LED-002
    name: PeriodClosed
    description: >-
      An accounting period was frozen. No further posting may take an accounting date inside it.
      The close record carries the hash of the period's Parquet artifact.
    producer: ledger
    consumers: [fixed-assets, billing, tax]
    terminal: false
    carries: [period, closed_at, parquet_sha256]
