# EXAMPLE ENTITY — one per context, to fix the shape. Not a schema. Not exhaustive.
entity: Posting
description: One side of a journal entry. Never exists alone; always part of a balanced entry.
fields:
  posting_id:        { type: uuid, required: true }
  journal_entry_id:  { type: uuid, required: true }
  account_ref:       { type: account_id, required: true }
  amount_minor:      { type: int64, required: true, note: "integer minor units. never a float, never a decimal string" }
  direction:         { type: enum, values: [debit, credit], required: true }
  accounting_date:   { type: date, required: true, note: "determines the period. set by the business event" }
  posting_timestamp: { type: timestamp, required: true, note: "when recorded. monotonic. never back-dated" }
  product_line:      { type: dimension_ref, required: true, note: "REQ-LED-001 — not nullable" }
  cost_type:         { type: dimension_ref, required: true, note: "REQ-LED-001 — not nullable" }
  source_document:   { type: document_ref, required: true }
  posting_rule:      { type: rule_id, required: true }
