# Domain events for FUL.
# Every event needs a producer and at least one consumer, or `terminal: true`.
#
# THE BOUNDARY (ADR-0015): the TigerBeetle pending/post/void pair covers the OPERATIONAL window
# only — units committed to a fulfillment in progress. Forward bookings stay interval math in AVL,
# because a booking six months out must not consume a point-in-time balance today.

events:
  - id: EVT-FUL-001
    name: LegCompleted
    description: >-
      One directed movement between CFS and a destination finished, with its actor, clock-in and
      clock-out recorded. First-class, not derived (ADR-0011) — a derived leg could carry none of
      those.
    producer: fulfillment
    consumers: [billing, availability, ledger]
    terminal: false
    carries: [leg_id, trip_ref, shift_id, actor_id, destination_ref, direction, clock_in, clock_out]

  - id: EVT-FUL-002
    name: ShiftRecorded
    description: >-
      One PERSON's span for one day closed, naming its causal job (OQ-005 — per person, not
      per crew, so leg->shift is many-to-many). Costed at that person's ACTUAL wage (ADR-0019);
      there is no standard rate. Byproduct work performed during the shift absorbs no incremental
      cost (OQ-006).
      ⚠️ **This read "one PERSON's PAID span" until 2026-08-16.** A shift is not necessarily paid:
      an owner may work one and take no wage for it, and `compensation` is what says which
      (OQ-047). The word was load-bearing in the wrong direction — it made an unpaid shift
      unrepresentable, which is how its cost ends up asserted as a liability nobody owes.
    producer: fulfillment
    consumers: [ledger]
    terminal: false
    carries: [
      shift_id,
      person_ref,
      causal_job_ref,
      wage_rate_minor,
      compensation,
      clock_in,
      clock_out,
      overtime_hours,
    ]
    note: >-
      ⚠️ **`compensation` is `paid | contributed`, and it decides whether this event POSTS AT ALL**
      (OQ-047, owner 2026-08-16). A `contributed` shift is one an owner worked and took no wage for:
      **no obligation was incurred, so the GAAP books say nothing** and `shift_recorded` writes no
      transfer. A `paid` shift posts exactly as before.
      **The event is recorded either way, and that is the point of putting the discriminator here
      rather than suppressing the event.** The shift, its hours and its `absorbed_allocations` are
      written for a contributed shift too, so the costing layer keeps everything it needs to impute
      a cost at report time — which is where the imputed view lives (ADR-0036's two layers:
      TigerBeetle holds the GL, Mongo holds the projection).
      ⚠️ **Without the discriminator the cost is not merely wrong, it is wrong in a way nothing
      catches.** `shift_recorded` credits **2010 Accrued Expenses: Received Not Invoiced**, so an
      unpaid owner shift would assert a liability that no bill can ever relieve, in the one account
      whose entire purpose is "received not invoiced". The entry balances, the control total
      matches, and 2010's balance silently stops meaning anything.
      **Surveyed before deciding** (CLAUDE.md → _Accounting decisions_): GAAP, Xero, SAP and Odoo
      keep an uncompensated labor cost out of the financial statements; NetSuite and Intacct post
      it but fence the offset; **all six agree that nothing credits a payable**
      (`inbox/2026-08-16-survey-an-unpaid-owner-shift-is-not-an-expense-and-every-reference-fences-imputed-labour-out-of-the-statements.md`).

  - id: EVT-FUL-003
    name: TripPlanned
    description: >-
      A set of destinations sharing a date and direction was grouped into one run. A trip MAY span
      orders (OQ-002), so it is a top-level aggregate that legs point at — it cannot live under an
      order, and that is what lets a shared run split its travel cost across the jobs that caused it.
    producer: fulfillment
    consumers: [ledger]
    terminal: false
    carries: [trip_id, destination_refs, order_refs, date, direction]

  - id: EVT-FUL-004
    name: UnitsCommitted
    description: >-
      Units were committed to a fulfillment in progress — the TigerBeetle PENDING transfer
      (ADR-0015). The transfer timeout is the compensation mechanism SPIKE-002 relies on: an
      orphaned commitment expires on its own.
    producer: fulfillment
    consumers: [availability, ledger]
    terminal: false
    carries: [fulfillment_ref, product_ref, quantity, pending_transfer_ref]
    blocked_by: [SPIKE-012]

  - id: EVT-FUL-005
    name: UnitsCheckedOut
    description: >-
      Custody transferred to the customer — the pending transfer POSTED. This is the point
      `debits_must_not_exceed_credits` makes overselling physical custody unrepresentable rather
      than merely checked.
    producer: fulfillment
    consumers: [availability, billing, ledger]
    terminal: false
    carries: [fulfillment_ref, product_ref, quantity, posted_transfer_ref, checked_out_at]

  - id: EVT-FUL-006
    name: UnitsReturned
    description: >-
      Units came back into CFS custody. Condition on return is carried because a damaged return
      opens an out-of-service record rather than restoring the unit to the pool.
    producer: fulfillment
    consumers: [availability, billing, ledger]
    terminal: false
    carries: [fulfillment_ref, product_ref, quantity, condition, returned_at]

  - id: EVT-FUL-007
    name: CommitmentVoided
    description: >-
      A commitment was released without a checkout — the pending transfer VOIDED, whether by
      cancellation or by timeout. Distinct from a return: nothing ever left.
    producer: fulfillment
    consumers: [availability, ledger]
    terminal: false
    carries: [fulfillment_ref, product_ref, quantity, voided_transfer_ref, reason]
