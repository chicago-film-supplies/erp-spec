# Glossary — one definition per domain term.
#
# Rules:
#   - Check `aliases` before introducing a new term. Prefer editing over near-duplicating.
#   - `definition: TODO` means nobody can state it confidently yet. Every TODO carries an OQ.
#   - `contexts` must resolve to real directories under contexts/.
#   - `source` is an inbox file, an ADR, or a verification query against the live CFS API.

terms:
  # ── Fulfillment geometry ────────────────────────────────────────────────────
  - term: leg
    definition: >-
      One directed movement of equipment between CFS and a destination — outbound (CFS delivers)
      or inbound (CFS collects). A leg is the unit that consumes crew time and vehicle capacity,
      and therefore the unit labor cost attaches to.
    aliases: [field leg, run]
    contexts: [fulfillment]
    source: inbox/2026-08-08-shift-id-on-every-leg.md
    open_questions: [OQ-001, OQ-007]
    notes: >-
      Granularity is the contested part, not the concept. The current system has no leg record at
      all — legs are inferred from an order's destination flags, which is why actor and shift are
      unrecoverable (HOT-007).

  - term: chargeable field leg
    definition: >-
      A leg the customer is billed for. The quantity on a `Delivery/Setup/Removal` line is the
      count of chargeable field legs — NOT a count of services rendered.
    aliases: [billable leg]
    contexts: [fulfillment, billing]
    source: "verified:2026-08-08:db_invoices_query invoice #2128"
    verified: true
    notes: >-
      Verified on prod invoice 2128: one destination with customer_collecting=false and
      customer_returning=false (CFS both delivers and collects) carries
      `Delivery/Setup/Removal` quantity=2. Two legs, one service line, quantity 2.

  - term: trip
    definition: >-
      A set of legs sharing a date and a direction, executed as one vehicle run by one crew. A
      trip is NOT a destination and NOT an invoice — destinations sharing a date and direction
      group into one trip.
    aliases: [run, vehicle run]
    contexts: [fulfillment]
    source: inbox/2026-08-08-shift-id-on-every-leg.md
    open_questions: [OQ-002]
    notes: >-
      The grouping key ("date and direction") is stated but not pinned — whether a trip may span
      destinations belonging to different orders is undecided, and it determines whether trip is
      an ordering concept or purely a fulfillment one.

  - term: destination
    definition: >-
      A place equipment goes, carrying its own delivery and collection addresses, its own charge
      and delivery/collection date ranges, and its own `customer_collecting` / `customer_returning`
      flags. An order may have several.
    aliases: [delivery destination, site]
    contexts: [ordering, fulfillment, billing]
    source: "verified:2026-08-08:db_invoices_query invoice #2128"
    verified: true
    notes: >-
      In the CURRENT system the collecting/returning flags live on the destination, not on a leg
      (HOT-002). Multi-destination orders are newly possible and will start appearing.

  - term: counter pickup
    definition: >-
      A fulfillment where the customer both collects and returns the equipment themselves — i.e.
      `customer_collecting` AND `customer_returning` are both true. No CFS field leg occurs.
    aliases: [counter, will-call, customer pickup]
    contexts: [fulfillment, ordering]
    source: inbox/2026-08-08-fulfillment-mode-enum.md
    verified: false

  - term: fulfillment mode
    definition: >-
      An enum on the order recording how equipment reaches and leaves the customer:
      `local_delivery` | `counter` | `shipped` | `trucked`.
    aliases: [delivery mode]
    contexts: [ordering, fulfillment]
    source: inbox/2026-08-08-fulfillment-mode-enum.md
    open_questions: [OQ-003]
    notes: >-
      Discriminator rules, stated and to be preserved: `counter` = both flags true. `shipped` =
      an explicit shipping line was billed, NEVER inferred from geography. `delivery` = the union
      of "flags indicate a field leg" OR "a delivery-category line was billed". `trucked` is the
      one with no stated discriminator — see HOT-001.

  - term: handling bucket
    definition: >-
      A per-product classification of how much physical handling one unit needs:
      `bag` | `two_person_lift` | `needs_cart_or_truck_space`. Drives crew sizing and vehicle
      capacity planning.
    aliases: [handling class]
    contexts: [ordering, fulfillment]
    source: inbox/2026-08-08-handling-bucket-per-product.md
    open_questions: [OQ-004]
    notes: >-
      The current system has `shipping.{weight,height,width,length}` on every product and all 549
      are zero — verified. The handling bucket exists because the dimensional data never got
      captured and probably never will.

  # ── Labor and costing ──────────────────────────────────────────────────────

  - term: shift
    definition: >-
      A contiguous span of paid time for one person on one day, bounded by clock-in and clock-out.
      Carries an 8-hour minimum guarantee, 1.5x after 8 hours, and a mandatory 10 hours off before
      the next shift.
    aliases: [crew day, person-day]
    contexts: [fulfillment, ledger]
    source: inbox/2026-08-08-labour-cost-step-function.md
    open_questions: [OQ-005]
    notes: >-
      Whether a shift is per-person or per-crew is undecided and material — `shift_id` is meant to
      go on every leg, and a crew-level shift makes that a many-to-one where a person-level shift
      makes it many-to-many.

  - term: causal job
    definition: >-
      The single job a shift exists to serve. Every shift has exactly one. The causal job bears
      the whole crew-day of cost.
    aliases: [primary job, causing job]
    contexts: [fulfillment, ledger]
    source: inbox/2026-08-08-byproduct-causal-job-rule.md
    verified: false

  - term: byproduct
    definition: >-
      Work performed during a shift that is not the causal job. A byproduct absorbs zero
      incremental labor cost — it rode along on a crew-day that was already being paid for.
    aliases: [piggyback, ride-along]
    contexts: [fulfillment, ledger]
    source: inbox/2026-08-08-byproduct-causal-job-rule.md
    open_questions: [OQ-006]
    notes: >-
      The rule is settled. What is not settled is whether long-haul should absorb a byproduct-loss
      premium on top of the person-day, mirroring what the customer is charged (HOT-004).

  - term: labor line
    definition: >-
      A REPORTING classification of labor cost — `delivery` | `counter` | `warehouse` |
      `trash_&_cleanup` | `shipping_&_handling` | `trucking` | `crew`. Answers "what kind of work was
      this", independent of what product line it served. **Derived at report time from the shift's
      own allocation row; never carried on a posting** (ADR-0036, OQ-042).
    aliases: [cost type, labor type, activity type, labor line]
    contexts: [ledger, fulfillment]
    source: ledger/dimensions.yaml
    verified: true
    notes: >-
      ⚠️ **Renamed from `cost_type` and grown 3 values → 7 on 2026-08-16** (ADR-0036). `cost_type` was
      too broad — it named a kind-of-cost taxonomy while carrying only kinds of labor — and
      `labor_line` pairs with `product_line` by design.
      ⚠️ **AMERICAN spelling, decided by the live books rather than by taste**: of 134 live accounts,
      `4120 Contract **Labor** Income` is the only one naming the concept and **no account contains
      "Labor"** (`api:2026-08-16:db_chart_of_accounts_query`). The repo's British prose is spec-side
      drift from the incumbent chart. The field was never called `labor_line` in any artifact, so
      the rename went `cost_type` → `labor_line` directly. ⚠️ **The surrounding prose in this repo is
      still British and is deliberately NOT swept** — 229 occurrences across ~30 files, six of them
      in ADRs whose bodies are frozen (ADR-0001, ADR-0011, ADR-0025, ADR-0029), so a spelling sweep
      could never be complete and a half-converted one reads as an unfinished job. **Identifiers and
      account names are American; prose is left alone.**
      This definition read "one of the two mandatory reporting dimensions ON A LABOR POSTING" until
      2026-08-16; no posting carries it. `counter` and `warehouse` bill nobody, which is why this is
      a separate axis rather than a re-use of `product line`.

  - term: product line
    definition: >-
      The REPORTING dimension describing what category of goods or service a line belongs to.
      **Derived at report time by joining a posting's line identity to the product master; never
      carried on a posting** (ADR-0036). Its value is `products.uid_tracking_category`.
    aliases: [tracking category, category]
    contexts: [ledger, billing, ordering]
    source: "verified:2026-08-08:db_tracking_categories_query"
    verified: true
    notes: >-
      In the current system this is the Xero tracking category, and 21 exist. **The target set is
      20** — ADR-0025 deletes `Other`, because a non-nullable dimension makes it the new null. The
      escape hatch for an uncategorisable line is the account 4800 Other Income, which requires no
      dimension, not a value that reads as a category and means "nobody chose".
      ✅ **`Transport` is RESTORED (OQ-034, 2026-08-16)**, so this list and `ledger/dimensions.yaml`
      both hold 20. It had been dropped 2026-08-09 on a measurement that read the invoice-line denorm
      instead of the product master; at the master it is 23 lines / $39,665.00. `ledger/dimensions.yaml`
      is the authority. ⚠️ **Nothing validates the two against each other**, and that is still true.
      ⚠️ **Under ADR-0018 restoring a value was a ledger restatement of 23 postings; under ADR-0036 it
      is a report re-run.** That is the clearest single argument for the change, and it is measured
      rather than asserted — this taxonomy moved twice in one month (`Other` retired, `Transport`
      dropped and restored).
      **15.00% of historical line revenue carries none** (re-measured 2026-08-10; read 28.7% until
      then, off the broken denorm — api-cloudrun#473).

  - term: standard cost
    definition: >-
      A predetermined per-unit labor cost applied to a job when it is performed, rather than the
      actual cost of the crew-day. ⚠️ **This definition said "CFS does not use standard labor rates
      and the target system does not implement this" until 2026-08-17, and the second half is
      wrong.** Measured against the EOR's exports (OQ-050, HOT-016): wages are itemised per person,
      **employer burden is priced per payroll RUN**, and apportioning a run's burden pro-rata by
      wages IS a standard rate applied to actual hours. So the target system implements **normal
      costing** — actual direct cost with an applied rate — and the term describes a real component
      of it rather than only the charter's earlier wording.
      ⚠️ CFS still has no standard WAGE, which is what made the old wording feel true: the standard
      rate sits one level down, in the burden factor.
    aliases: [applied cost]
    contexts: [ledger]
    source: inbox/2026-08-08-standard-cost-with-variance.md
    notes: >-
      Retired by ADR-0019 (HOT-010). The wage is $30/hr with a guaranteed 8 hours, 1.5x after 8 in
      a day and 1.5x on a 6th/7th consecutive day, carried per contact and overridable — so there
      is no standard to apply and no rate to set. OQ-008, which asked who sets the rates, is
      answered: nobody, because there are none.

  - term: variance
    definition: >-
      Actual labor cost incurred minus standard cost absorbed. **No such quantity exists in the
      target system** — a rate variance cannot exist where there is no standard rate (ADR-0019,
      HOT-010), and the `labor_variance` posting rule that would have computed it was removed
      because it could never fire. What survives is UTILISATION: the split between absorbed and
      unabsorbed labor, which measures how much paid time reached a job, not how far a rate
      deviated.
    aliases: [labor variance, absorption variance]
    contexts: [ledger]
    source: inbox/2026-08-08-standard-cost-with-variance.md
    verified: true

  - term: unabsorbed labor
    definition: >-
      The residual labor cost that no causal job absorbed — guaranteed-but-unworked hours and
      idle time — posted to `5801 Cost of Goods Sold: Wages (Unabsorbed)`, whose postings declare
      `causal_orders: null` by design. This account IS the idle-capacity KPI: it is not a plug or a
      rounding sink, and a causal order on it would let idle time be attributed to a job, which is
      the exact lie to avoid. ⚠️ The null is DECLARED rather than the key omitted (REQ-LED-001), so
      "hours attributable to no job" stays a countable population. This read "which is undimensioned
      by design" until 2026-08-16 (ADR-0036).
    aliases: [idle capacity, unabsorbed]
    contexts: [ledger]
    source: adr/ADR-0019-labor-costing-is-normal-costing.md
    verified: true

  # ── Accounting core ─────────────────────────────────────────────────────────

  - term: accounting date
    definition: >-
      The date a transaction belongs to for reporting and period purposes. Determines which period
      a posting falls in. Set by the business event, not by the clock.
    aliases: [effective date, transaction date, GL date]
    contexts: [ledger, billing, tax]
    source: adr/ADR-0010-accounting-date-vs-posting-timestamp.md
    verified: false
    notes: Never conflate with posting timestamp. They are always distinct fields.

  - term: posting timestamp
    definition: >-
      The wall-clock instant the posting was durably recorded. Monotonic, assigned by the ledger,
      never back-dated. Answers "when did we learn this", not "when did it happen".
    aliases: [recorded at, system time]
    contexts: [ledger]
    source: adr/ADR-0010-accounting-date-vs-posting-timestamp.md
    open_questions: [OQ-009]
    notes: >-
      TigerBeetle assigns its own timestamp at post time and that is a posting timestamp, not an
      accounting date. Reporting needs accounting date. This is HOT-005 and SPIKE-003.

  - term: journal entry
    definition: >-
      A balanced set of debits and credits sharing one accounting date, one source document, and
      one posting rule. The atomic unit of the ledger — never partially posted.
    aliases: [JE, entry]
    contexts: [ledger]
    source: ledger/posting-rules.yaml
    verified: false

  - term: source document
    definition: >-
      The business artifact a journal entry was derived from — an invoice, a shift record, a bank
      transaction, a depreciation run. Every posting names exactly one, and it is reachable from
      the posting.
    aliases: [source doc, originating document]
    contexts: [ledger]
    source: ledger/posting-rules.yaml
    verified: false

  - term: dimension
    definition: >-
      An axis a balance is sliced by **at report time**, derived by joining a posting's KEYS to the
      master data. Two exist: product line and labor line. **Neither is carried on a posting**
      (ADR-0036, superseding ADR-0018).
    aliases: [tracking dimension, analysis code, reporting dimension]
    contexts: [ledger]
    source: ledger/dimensions.yaml
    verified: true
    notes: >-
      ⚠️ **This read "carried on the posting itself rather than derived later… two are mandatory on
      every COGS and revenue posting" until 2026-08-16, and the definition inverted.** ADR-0018 took
      dimensions off ACCOUNT identity and put them on the transfer; ADR-0036 supersedes it and takes
      them off the transfer too, because a transfer is immutable and a classification is not. What a
      posting carries instead is KEYS — see that term.
      The current system's equivalent is the Xero tracking option, and **15.00% of line revenue
      carries none** (re-measured 2026-08-10; read 28.7% until then, off an invoice-line denorm that
      was null on 227 categorised lines — api-cloudrun#473). ⚠️ **"A dimension that can be null is a
      dimension that will be null" was the old lesson and it is superseded by a better one**: the
      28.7% was never operators declining to classify — $688.00 was — it was a DERIVED COPY that had
      never been populated. ADR-0036 removes the copy, so the failure mode is structural rather than
      disciplinary.

  - term: key
    definition: >-
      A fact about the EVENT a posting records, as opposed to a classification of it. Three:
      causal order(s), invoice link, and line identity. A posting carries keys and nothing else
      (ADR-0036).
    aliases: [posting key, causal order, line identity]
    contexts: [ledger, billing, fulfillment]
    source: adr/ADR-0036-the-ledger-carries-keys-not-classifications.md
    verified: true
    notes: >-
      **The criterion is ADR-0036's own: could this value be revised later without anyone having
      observed something new?** Yes ⇒ a classification, derive it. No ⇒ a fact, store it.
      `products.uid_tracking_category` moved twice in one month; who a shift was worked for cannot.
      **What is refused is ABSENCE, not null** (REQ-LED-001). Every posting declares its causal
      order — a value or an explicit null — and an empty list is refused alongside absence because it
      satisfies a naive presence check while stating nothing.
      ⚠️ **Line identity is `item.path`, never `item.uid`** — `uid` identifies the product and repeats
      within one document (18% of prod orders). And it is STORED as a hash or a minted surrogate:
      invoice paths run to depth 7 and 178 bytes, and 14,410 of 14,410 exceed a u128's 16. Collision
      is not the risk (~1e-11 on 64 bits); **opacity is**, and ADR-0036 takes that trade knowingly.

  - term: period close
    definition: >-
      The act of freezing an accounting period so no further postings may take its accounting
      date. Produces an immutable close record.
    aliases: [close, month-end close]
    contexts: [ledger]
    source: formal/period-close.qnt
    verified: false
    notes: >-
      Per ADR-0006 a closed period's Parquet file is the audit artifact and its hash goes into the
      close record.

  - term: book
    definition: >-
      A parallel set of valuations over the same assets under a different rule set. CFS runs two:
      `gaap` and `tax`. Every fixed asset carries a basis in each, and the difference between them
      is itself reportable.
    aliases: [basis, valuation basis]
    contexts: [fixed-assets, ledger, tax]
    source: adr/ADR-0007-replace-asset-accountant.md
    verified: false
    notes: >-
      "Book" and "basis" are used interchangeably in conversation. Here `book` is the set
      (gaap|tax) and `basis` is the carrying amount within a book. Do not introduce a third term.

  - term: trucking
    definition: >-
      An own long-haul run, crewed by CFS. Labor-bearing — it absorbs a person-day into COGS and
      generates a shift, unlike `shipping`, which is third-party freight and carries no wage
      labor.
    aliases: [long haul]
    contexts: [fulfillment, ordering]
    source: "OQ-010 (repo owner, 2026-08-09); api:2026-08-08:db_products_query tracking_category_name=Transport"
    verified: true
    open_questions: []
    notes: >-
      Resolved OQ-010 / HOT-001 on 2026-08-09. The supporting evidence: `Trucking` and `Shipping`
      are both products in the `Transport` product line, but `Trucking` books to COA 4100 — the
      same revenue account as Crew labor and Delivery services — while `Shipping` books to its
      own COA 4150. Per OQ-006 the person-day it absorbs is the ACTUAL cost; the premium the
      customer pays for a long haul is margin, not cost.

  # ── Organization structure (ADR-0032, ADR-0033) ─────────────────────────────
  - term: organization
    definition: >-
      The LEGAL ENTITY that owes CFS money — the party that could be sued for an unpaid invoice.
      The root of the organization tree, and the only level of it that carries liability. Credit
      exposure, trading history and the destination address book attach here.
    aliases: [legal entity, liable party, account]
    contexts: [billing, ordering]
    source: adr/ADR-0032-the-customer-tree-is-a-liability-tree.md
    open_questions: [OQ-038, OQ-039]
    notes: >-
      ⚠️ **`customer` is NOT the term.** Owner, 2026-08-10: "customer is organization, customer is
      too easily confused with contact for use." An earlier draft of ADR-0032 used `customer` for
      this level and warned it was not a synonym for `organization`; that is reversed — the level is
      unchanged and the word for it is `organization`.
      ⚠️ **The v1 collection has the same NAME and a wider meaning**, so the migration diff shows no
      rename while the semantics narrow. Today's flat record conflates all three levels into one row
      plus a name suffix — 31 of 286 are department clones and `Netflix Productions, LLC` is 10 of
      them with no parent (`api:2026-08-10:db_organizations_query`).
      Because the tree is a LIABILITY tree, a separately-incorporated production is its own
      organization rather than a child of the studio behind it. `Pops, Puffs, Pebbles Canada LTD` and
      `Pops, Puffs, Pebbles, LLC` are two organizations.
      **Credit LIMITS and HOLDS do not attach here or anywhere yet** — CFS operates none today, and
      the control is OQ-038. What the root gives is that exposure becomes READABLE.

  - term: project
    definition: >-
      A production. The middle level of the organization tree, and the cost object a job attaches
      to: it has a start and a wrap, it staffs up and disperses, and it is where the production type
      is carried. It carries NO liability — the organization above it does.
    aliases: [production, show, job]
    contexts: [billing, ordering, ledger]
    source: adr/ADR-0032-the-customer-tree-is-a-liability-tree.md
    open_questions: [OQ-035]
    notes: >-
      Named `project` rather than `production` because every commercial reference calls this level a
      project or job and gives it the same role — SAP WBS elements, NetSuite Projects (literally
      subcustomers), Sage Intacct's project dimension, Odoo analytic accounts
      (`inbox/2026-08-10-survey-a-department-is-a-settlement-point-and-a-production-is-a-project.md`).
      An organization with exactly one project is the general shape with N=1, not a special case —
      most of the corpus. **It must not force an operator to invent a record: the API mints the
      level, records that it derived it, and the UI suppresses it** (ADR-0032 §3).
      **Production start and wrap are recorded FACTS; ACTIVE/DORMANT is DERIVED** from open orders
      and open AR, per ADR-0014. There is no close operation, and open AR keeps a project alive
      regardless of its wrap date.

  - term: settlement point
    definition: >-
      A department on a project — the leaf of the organization tree and the thing a document is
      addressed to and settled by. It holds its own AR balance, statement, aging, unallocated credit
      and contact edges. It carries no liability; it partitions the receivable of the organization
      above it.
    aliases: [department, bill-to, payer]
    contexts: [billing]
    source: adr/ADR-0032-the-customer-tree-is-a-liability-tree.md
    notes: >-
      It is `(project × department)` and NOT `(organization × department)`, because departments staff
      up per project — the locations team on one production is different people from the locations
      team on another for the same studio at the same time (owner, 2026-08-10).
      `Saturn Return: Locations` and `Big Red: Locations` share a name and nothing else.
      **Contact MEMBERSHIP EDGES belong here; the person does not.** A contact is one global record
      with N memberships, each carrying a role — 26 of 165 contacts are attached to two or more
      organizations today (`api:2026-08-10:db_contacts_query`), so a per-node contact record would
      fragment them. A statement addresses the edge, never the person, which is what avoids the
      failure Xero users report of contact groups: reminders going to every address on the record
      rather than the one the invoice went to.
      **Unallocated credit sits here too** (ADR-0033), and may be applied across settlement points
      within one organization as a recorded event — never across organizations, which is the
      ASC 210-20-45-1 same-party boundary.
      SAP's `payer` partner function is the closest existing analogue: "the entity responsible for
      making the payment", determined per document and held separately from who bought.

  - term: contact
    definition: >-
      A person. ONE global record per human, carrying N membership edges into the organization tree —
      each edge naming a node and a role. The person is never duplicated per department, project or
      organization.
    aliases: [coordinator, crew contact, membership]
    contexts: [billing, ordering]
    source: adr/ADR-0032-the-customer-tree-is-a-liability-tree.md
    notes: >-
      Consistent with OQ-008 — "the same human is one record whether they are crew or a customer
      contact". Per-node contact records would have contradicted it.
      ⚠️ **v1 already works this way and an earlier draft of ADR-0032 said otherwise.** `contacts` is
      a top-level collection and each contact carries `organizations[]`, an explicit many-to-many
      (`api:2026-08-10:db_schema:contacts`); `organizations.contacts[]` is the reverse denorm, not the
      authority. Measured 2026-08-10 across all 165 contacts: **26 (15.8%) belong to 2+
      organizations**, 5 belong to none, and at least 8 humans have duplicate records.
      `Nick Rafferty` is on five nodes — two future Netflix settlement points, `Enemies Movie, LLC`,
      and two unrelated entities. A freelance locations manager working across productions and across
      customers is the industry norm, not an edge case.
